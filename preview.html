th=\"600\" height=\"44\" rx=\"4\"/><\/g>\n<text class=\"cl-tb\" x=\"340\" y=\"142\" text-anchor=\"middle\">Action 层 · 编辑期唯一变更通道<\/text>\n<text class=\"cl-s\" x=\"340\" y=\"158\" text-anchor=\"middle\">registry · 步骤事务 · revision · checkpoint · 回执 / 证据 · 撤销栈<\/text>\n\n<line class=\"cl-a\" x1=\"340\" y1=\"169\" x2=\"340\" y2=\"185\" marker-end=\"url(#cl-ar)\"/>\n\n<rect class=\"cl-b\" x=\"40\" y=\"188\" width=\"600\" height=\"36\" rx=\"4\"/>\n<text class=\"cl-t\" x=\"340\" y=\"205\" text-anchor=\"middle\">ECS 封装层（自写）<\/text>\n<text class=\"cl-s\" x=\"340\" y=\"218\" text-anchor=\"middle\">defineComponent · query · 组件 schema · 模块契约的执行点<\/text>\n\n<g class=\"cl-off\"><rect x=\"40\" y=\"228\" width=\"600\" height=\"28\" rx=\"4\"/><\/g>\n<text class=\"cl-s\" x=\"340\" y=\"246\" text-anchor=\"middle\">第三方 ECS 库（koota）· 可替换，代价约 800 行<\/text>\n\n<line class=\"cl-a\" x1=\"111\" y1=\"258\" x2=\"111\" y2=\"274\" marker-end=\"url(#cl-ar)\"/>\n<line class=\"cl-a\" x1=\"263\" y1=\"258\" x2=\"263\" y2=\"274\" marker-end=\"url(#cl-ar)\"/>\n<line class=\"cl-a\" x1=\"415\" y1=\"258\" x2=\"415\" y2=\"274\" marker-end=\"url(#cl-ar)\"/>\n<line class=\"cl-a\" x1=\"567\" y1=\"258\" x2=\"567\" y2=\"274\" marker-end=\"url(#cl-ar)\"/>\n\n<rect class=\"cl-b\" x=\"40\" y=\"277\" width=\"142\" height=\"52\" rx=\"4\"/>\n<text class=\"cl-t\" x=\"111\" y=\"296\" text-anchor=\"middle\">事件表运行时<\/text>\n<text class=\"cl-s\" x=\"111\" y=\"311\" text-anchor=\"middle\">逐行求值<\/text>\n<text class=\"cl-s\" x=\"111\" y=\"323\" text-anchor=\"middle\">行为单元<\/text>\n<rect class=\"cl-b\" x=\"192\" y=\"277\" width=\"142\" height=\"52\" rx=\"4\"/>\n<text class=\"cl-t\" x=\"263\" y=\"296\" text-anchor=\"middle\">系统（JS）<\/text>\n<text class=\"cl-s\" x=\"263\" y=\"311\" text-anchor=\"middle\">播放期<\/text>\n<text class=\"cl-s\" x=\"263\" y=\"323\" text-anchor=\"middle\">确定性沙箱<\/text>\n<rect class=\"cl-b\" x=\"344\" y=\"277\" width=\"142\" height=\"52\" rx=\"4\"/>\n<text class=\"cl-t\" x=\"415\" y=\"296\" text-anchor=\"middle\">物理与空间<\/text>\n<text class=\"cl-s\" x=\"415\" y=\"311\" text-anchor=\"middle\">Rapier · 关节<\/text>\n<text class=\"cl-s\" x=\"415\" y=\"323\" text-anchor=\"middle\">寻路 · 视野<\/text>\n<rect class=\"cl-b\" x=\"496\" y=\"277\" width=\"144\" height=\"52\" rx=\"4\"/>\n<text class=\"cl-t\" x=\"568\" y=\"296\" text-anchor=\"middle\">渲染桥<\/text>\n<text class=\"cl-s\" x=\"568\" y=\"311\" text-anchor=\"middle\">组件 + 皮肤<\/text>\n<text class=\"cl-s\" x=\"568\" y=\"323\" text-anchor=\"middle\">→ three.js<\/text>\n\n<line class=\"cl-a\" x1=\"111\" y1=\"360\" x2=\"111\" y2=\"332\" marker-end=\"url(#cl-ar)\"/>\n<rect class=\"cl-b\" x=\"40\" y=\"362\" width=\"600\" height=\"40\" rx=\"4\"/>\n<text class=\"cl-t\" x=\"56\" y=\"379\">领域模块<\/text>\n<text class=\"cl-s\" x=\"56\" y=\"393\">① RTS / MOBA　② 第三人称动作　= 组件 + 系统 + 条件动作 + kinds + 约束 + 面板 + 皮肤 + 模板<\/text>\n\n<line class=\"cl-sep\" x1=\"30\" y1=\"428\" x2=\"650\" y2=\"428\"/>\n\n<!-- ══════════ 2 · 数据模型 ══════════ -->\n<text class=\"cl-n\" x=\"30\" y=\"460\">2<\/text>\n<text class=\"cl-h\" x=\"48\" y=\"461\">数据模型 · 一个工程里有什么<\/text>\n<text class=\"cl-s\" x=\"48\" y=\"478\">全部是数据，全部走 Action 层，全部可被 AI 读写<\/text>\n\n<text class=\"cl-tb\" x=\"52\" y=\"503\">工程<\/text>\n<line class=\"cl-l\" x1=\"58\" y1=\"509\" x2=\"58\" y2=\"692\"/>\n<line class=\"cl-l\" x1=\"58\" y1=\"521\" x2=\"70\" y2=\"521\"/><text class=\"cl-t\" x=\"76\" y=\"525\">流程<\/text><text class=\"cl-s\" x=\"126\" y=\"525\">场景顺序与切换条件<\/text>\n<line class=\"cl-l\" x1=\"58\" y1=\"540\" x2=\"70\" y2=\"540\"/><text class=\"cl-t\" x=\"76\" y=\"544\">全局状态<\/text><text class=\"cl-s\" x=\"140\" y=\"544\">跨场景保留<\/text>\n<line class=\"cl-l\" x1=\"58\" y1=\"559\" x2=\"70\" y2=\"559\"/><text class=\"cl-t\" x=\"76\" y=\"563\">场景[]<\/text><text class=\"cl-s\" x=\"126\" y=\"563\">→ 块[] → 实体[]（kind + 组件）<\/text>\n<line class=\"cl-l\" x1=\"58\" y1=\"578\" x2=\"70\" y2=\"578\"/><text class=\"cl-t\" x=\"76\" y=\"582\">事件表<\/text><text class=\"cl-s\" x=\"126\" y=\"582\">规则行[] · 行为单元 · 配方<\/text>\n<line class=\"cl-l\" x1=\"58\" y1=\"597\" x2=\"70\" y2=\"597\"/><text class=\"cl-t\" x=\"76\" y=\"601\">数据表[]<\/text><text class=\"cl-s\" x=\"140\" y=\"601\">作者编辑，静态，行 id 只增不改<\/text>\n<line class=\"cl-l\" x1=\"58\" y1=\"616\" x2=\"70\" y2=\"616\"/><text class=\"cl-t\" x=\"76\" y=\"620\">运行期集合[]<\/text><text class=\"cl-s\" x=\"167\" y=\"620\">背包 · 队列 · 卡组<\/text>\n<line class=\"cl-l\" x1=\"58\" y1=\"635\" x2=\"70\" y2=\"635\"/><text class=\"cl-t\" x=\"76\" y=\"639\">kind 注册[]<\/text><text class=\"cl-s\" x=\"158\" y=\"639\">碰撞体 · 占地 · 位移曲线<\/text>\n<line class=\"cl-l\" x1=\"58\" y1=\"654\" x2=\"70\" y2=\"654\"/><text class=\"cl-t\" x=\"76\" y=\"658\">当前皮肤包<\/text><text class=\"cl-s\" x=\"158\" y=\"658\">kind → 视觉<\/text>\n<line class=\"cl-l\" x1=\"58\" y1=\"673\" x2=\"70\" y2=\"673\"/><text class=\"cl-t\" x=\"76\" y=\"677\">输入绑定表<\/text><text class=\"cl-s\" x=\"158\" y=\"677\">意图 → 设备<\/text>\n<line class=\"cl-l\" x1=\"58\" y1=\"692\" x2=\"70\" y2=\"692\"/><text class=\"cl-t\" x=\"76\" y=\"696\">内容包依赖[]<\/text><text class=\"cl-s\" x=\"167\" y=\"696\">包 id + 版本<\/text>\n\n<g class=\"cl-b\"><rect x=\"392\" y=\"490\" width=\"248\" height=\"88\" rx=\"4\"/><\/g>\n<text class=\"cl-tb\" x=\"406\" y=\"509\">三种「状态固化」<\/text>\n<text class=\"cl-s\" x=\"406\" y=\"527\">工程存档　　编辑期状态，权威 = Action 层<\/text>\n<text class=\"cl-s\" x=\"406\" y=\"544\">导出工程文件　自包含，可发给别人继续改<\/text>\n<text class=\"cl-s\" x=\"406\" y=\"561\">运行时存档　游戏声明存什么，含等待队列<\/text>\n<g class=\"cl-blue\"><rect x=\"392\" y=\"588\" width=\"248\" height=\"108\" rx=\"4\"/><\/g>\n<text class=\"cl-tb\" x=\"406\" y=\"607\">可替换的东西都是一张映射表<\/text>\n<text class=\"cl-s\" x=\"406\" y=\"626\">kind → 视觉　　　　　皮肤包<\/text>\n<text class=\"cl-s\" x=\"406\" y=\"643\">动画语义状态 → clip　皮肤包<\/text>\n<text class=\"cl-s\" x=\"406\" y=\"660\">输入意图 → 设备　　　绑定表<\/text>\n<text class=\"cl-s\" x=\"406\" y=\"677\">包 id + 版本 → 内容　内容包<\/text>\n<text class=\"cl-s\" x=\"406\" y=\"691\">Action 标签 → 能力面　registry 视图（留口）<\/text>\n\n<line class=\"cl-sep\" x1=\"30\" y1=\"722\" x2=\"650\" y2=\"722\"/>\n\n<!-- ══════════ 3 · 一帧发生什么 ══════════ -->\n<text class=\"cl-n\" x=\"30\" y=\"754\">3<\/text>\n<text class=\"cl-h\" x=\"48\" y=\"755\">一帧发生什么 · 玩法与呈现分离<\/text>\n<text class=\"cl-s\" x=\"48\" y=\"772\">确定性断言的范围限定在玩法状态，不含渲染与视听<\/text>\n\n<g class=\"cl-blue\"><rect x=\"40\" y=\"786\" width=\"600\" height=\"84\" rx=\"4\"/><\/g>\n<text class=\"cl-tb\" x=\"56\" y=\"805\">固定步长 tick · 玩法 · 确定性范围<\/text>\n<rect class=\"cl-b\" x=\"52\" y=\"814\" width=\"112\" height=\"44\" rx=\"3\"/>\n<text class=\"cl-s\" x=\"108\" y=\"831\" text-anchor=\"middle\">1 采样输入意图<\/text><text class=\"cl-s\" x=\"108\" y=\"846\" text-anchor=\"middle\">冻结本 tick 快照<\/text>\n<rect class=\"cl-b\" x=\"173\" y=\"814\" width=\"112\" height=\"44\" rx=\"3\"/>\n<text class=\"cl-s\" x=\"229\" y=\"831\" text-anchor=\"middle\">2 物理步进<\/text><text class=\"cl-s\" x=\"229\" y=\"846\" text-anchor=\"middle\">Rapier<\/text>\n<rect class=\"cl-b\" x=\"294\" y=\"814\" width=\"112\" height=\"44\" rx=\"3\"/>\n<text class=\"cl-s\" x=\"350\" y=\"831\" text-anchor=\"middle\">3 排空触发队列<\/text><text class=\"cl-s\" x=\"350\" y=\"846\" text-anchor=\"middle\">FIFO · 深度 ≤ 16<\/text>\n<rect class=\"cl-b\" x=\"415\" y=\"814\" width=\"112\" height=\"44\" rx=\"3\"/>\n<text class=\"cl-s\" x=\"471\" y=\"831\" text-anchor=\"middle\">4 全表求值<\/text><text class=\"cl-s\" x=\"471\" y=\"846\" text-anchor=\"middle\">自上而下<\/text>\n<rect class=\"cl-b\" x=\"536\" y=\"814\" width=\"92\" height=\"44\" rx=\"3\"/>\n<text class=\"cl-s\" x=\"582\" y=\"831\" text-anchor=\"middle\">5 结算<\/text><text class=\"cl-s\" x=\"582\" y=\"846\" text-anchor=\"middle\">等待队列<\/text>\n\n<line class=\"cl-a\" x1=\"340\" y1=\"872\" x2=\"340\" y2=\"888\" marker-end=\"url(#cl-ar)\"/>\n<text class=\"cl-s\" x=\"352\" y=\"884\">单向<\/text>\n\n<g class=\"cl-b\"><rect x=\"40\" y=\"890\" width=\"600\" height=\"66\" rx=\"4\"/><\/g>\n<text class=\"cl-tb\" x=\"56\" y=\"909\">渲染帧 · 呈现 · 只读消费<\/text>\n<text class=\"cl-s\" x=\"56\" y=\"927\">渲染桥增量同步 → 动画状态机求值 → 粒子 / 音频 / 后处理<\/text>\n<text class=\"cl-s\" x=\"56\" y=\"944\">块的加载与卸载（呈现层事件，不是玩法事件，不影响模拟结果）<\/text>\n\n<text class=\"cl-s\" x=\"40\" y=\"976\">保住确定性的四条：实体迭代按稳定 id 升序 · 随机数只来自注入的带种子 rng · JS 条件动作跑沙箱 · 触发在 tick 边界对齐<\/text>\n\n<line class=\"cl-sep\" x1=\"30\" y1=\"1000\" x2=\"650\" y2=\"1000\"/>\n\n<!-- ══════════ 4 · 用户流程 ══════════ -->\n<text class=\"cl-n\" x=\"30\" y=\"1032\">4<\/text>\n<text class=\"cl-h\" x=\"48\" y=\"1033\">用户流程 · 八步与主循环<\/text>\n<text class=\"cl-s\" x=\"48\" y=\"1050\">本轮终点是导出；分享 · 账号 · remix 回流在开放阶段<\/text>\n\n<g class=\"cl-teal\"><rect x=\"40\" y=\"1064\" width=\"142\" height=\"42\" rx=\"4\"/><\/g>\n<text class=\"cl-t\" x=\"111\" y=\"1082\" text-anchor=\"middle\">1 打开<\/text><text class=\"cl-s\" x=\"111\" y=\"1097\" text-anchor=\"middle\">模板库，不是空场景<\/text>\n<g class=\"cl-teal\"><rect x=\"192\" y=\"1064\" width=\"142\" height=\"42\" rx=\"4\"/><\/g>\n<text class=\"cl-t\" x=\"263\" y=\"1082\" text-anchor=\"middle\">2 先玩一局<\/text><text class=\"cl-s\" x=\"263\" y=\"1097\" text-anchor=\"middle\">建立目标感<\/text>\n<g class=\"cl-blue\"><rect x=\"344\" y=\"1064\" width=\"142\" height=\"42\" rx=\"4\"/><\/g>\n<text class=\"cl-t\" x=\"415\" y=\"1082\" text-anchor=\"middle\">3 改一个数<\/text><text class=\"cl-s\" x=\"415\" y=\"1097\" text-anchor=\"middle\">第一次正反馈<\/text>\n<g class=\"cl-blue\"><rect x=\"496\" y=\"1064\" width=\"144\" height=\"42\" rx=\"4\"/><\/g>\n<text class=\"cl-t\" x=\"568\" y=\"1082\" text-anchor=\"middle\">4 改玩法<\/text><text class=\"cl-s\" x=\"568\" y=\"1097\" text-anchor=\"middle\">事件表 · 配方<\/text>\n<line class=\"cl-a\" x1=\"184\" y1=\"1085\" x2=\"190\" y2=\"1085\" marker-end=\"url(#cl-ar)\"/>\n<line class=\"cl-a\" x1=\"336\" y1=\"1085\" x2=\"342\" y2=\"1085\" marker-end=\"url(#cl-ar)\"/>\n<line class=\"cl-a\" x1=\"488\" y1=\"1085\" x2=\"494\" y2=\"1085\" marker-end=\"url(#cl-ar)\"/>\n\n<g class=\"cl-blue\"><rect x=\"40\" y=\"1130\" width=\"142\" height=\"42\" rx=\"4\"/><\/g>\n<text class=\"cl-t\" x=\"111\" y=\"1148\" text-anchor=\"middle\">5 让 AI 帮忙<\/text><text class=\"cl-s\" x=\"111\" y=\"1163\" text-anchor=\"middle\">计划 · 批准 · 逐步执行<\/text>\n<g class=\"cl-blue\"><rect x=\"192\" y=\"1130\" width=\"142\" height=\"42\" rx=\"4\"/><\/g>\n<text class=\"cl-t\" x=\"263\" y=\"1148\" text-anchor=\"middle\">6 换风格 / 视听<\/text><text class=\"cl-s\" x=\"263\" y=\"1163\" text-anchor=\"middle\">玩法定了才谈表达<\/text>\n<g class=\"cl-blue\"><rect x=\"344\" y=\"1130\" width=\"142\" height=\"42\" rx=\"4\"/><\/g>\n<text class=\"cl-t\" x=\"415\" y=\"1148\" text-anchor=\"middle\">7 检查与打磨<\/text><text class=\"cl-s\" x=\"415\" y=\"1163\" text-anchor=\"middle\">hard 判定 · 证据 · 修复<\/text>\n<g class=\"cl-teal\"><rect x=\"496\" y=\"1130\" width=\"144\" height=\"42\" rx=\"4\"/><\/g>\n<text class=\"cl-t\" x=\"568\" y=\"1148\" text-anchor=\"middle\">8 导出<\/text><text class=\"cl-s\" x=\"568\" y=\"1163\" text-anchor=\"middle\">自包含工程文件<\/text>\n<line class=\"cl-a\" x1=\"184\" y1=\"1151\" x2=\"190\" y2=\"1151\" marker-end=\"url(#cl-ar)\"/>\n<line class=\"cl-a\" x1=\"336\" y1=\"1151\" x2=\"342\" y2=\"1151\" marker-end=\"url(#cl-ar)\"/>\n<line class=\"cl-a\" x1=\"488\" y1=\"1151\" x2=\"494\" y2=\"1151\" marker-end=\"url(#cl-ar)\"/>\n<path class=\"cl-a\" d=\"M568 1108 L568 1118 L111 1118 L111 1128\" marker-end=\"url(#cl-ar)\"/>\n\n<path class=\"cl-d\" d=\"M415 1174 L415 1188 L340 1188\" marker-end=\"url(#cl-ar)\"/>\n<path class=\"cl-d\" d=\"M340 1188 L20 1188 L20 1085 L36 1085\" marker-end=\"url(#cl-ar)\"/>\n<text class=\"cl-s\" x=\"40\" y=\"1206\">主循环 · 3–7 步反复，不满意就撤销。从「改」到「看到结果」超过几秒，心流就断——循环的长度是产品质量的核心指标<\/text>\n\n<text class=\"cl-s\" x=\"40\" y=\"1224\">内置教程贯穿全程：任何一步都能唤出，不挡在路上　·　全流程零账号，唯一按需触发项是 API key<\/text>\n\n<line class=\"cl-sep\" x1=\"30\" y1=\"1238\" x2=\"650\" y2=\"1238\"/>\n\n<!-- ══════════ 5 · 编辑器界面 ══════════ -->\n<text class=\"cl-n\" x=\"30\" y=\"1270\">5<\/text>\n<text class=\"cl-h\" x=\"48\" y=\"1271\">编辑器界面 · 一套能力面<\/text>\n<text class=\"cl-s\" x=\"48\" y=\"1288\">没有模式切换，没有术语翻译。每块面板改一样东西，全部经 Action 层<\/text>\n function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function slug(s){return s.replace(/[`*_~\[\]()#§·、，。：:.,\/]/g,"").trim().toLowerCase().replace(/\s+/g,"-")}
function inl(s,did){
var codes=[];
s=s.replace(/`([^`]+)`/g,function(m,c){codes.push(c);return ""+(codes.length-1)+""});
s=esc(s);

if(u.charAt(0)==="#")u="#"+did+"-"+u.slice(1).replace(/^-+/,"");
else if(u.indexOf("diagrams/architecture.svg")>=0)u="#fig-arch";
else if(u.indexOf("diagrams/user-flow.svg")>=0)u="#fig-flow";
else if(!/^https?:/.test(u))return t;
return '<a href="'+u+'">'+t+"</a>"});
s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
s=s.replace(/~~([^~]+)~~/g,"<del>$1</del>");
s=s.replace(/(\d+)/g,function(m,i){return "<code>"+esc(codes[+i])+"</code>"});
return s}
function cells(line){

function md(src,did){
var L=src.replace(/\r/g,"").split("\n"),o=[],i=0,heads=[];
function bs(l){return /^(#{1,4}\s|>|\||```|---+\s*$|[-*]\s|\d+\.\s)/.test(l)}
while(i<L.length){
var l=L[i];
if(/^```/.test(l)){var b=[];i++;while(i<L.length&&!/^```/.test(L[i])){b.push(L[i]);i++}i++;
o.push("<pre><code>"+esc(b.join("\n"))+"</code></pre>");continue}
var h=l.match(/^(#{1,4})\s+(.*)$/);
if(h){var lv=h[1].length,tx=h[2],id=did+"-"+slug(tx);
heads.push({lv:lv,tx:tx.replace(/[*`~]/g,""),id:id});
o.push("<h"+lv+' id="'+id+'">'+inl(tx,did)+"</h"+lv+">");i++;continue}
if(/^---+\s*$/.test(l)){o.push("<hr>");i++;continue}
if(/^>/.test(l)){var q=[];while(i<L.length&&/^>/.test(L[i])){q.push(L[i].replace(/^>\s?/,""));i++}
o.push("<blockquote>"+q.map(function(x){return inl(x,did)}).join("<br>")+"</blockquote>");continue}
if(/^\|/.test(l)){var rows=[];
while(i<L.length&&(/^\|/.test(L[i])||(rows.length&&L[i].trim()&&!bs(L[i])))){
if(/^\|/.test(L[i]))rows.push(cells(L[i]));
else{var r=rows[rows.length-1];r[r.length-1]+=" "+L[i].trim()}i++}
var sep=rows.length>1&&rows[1].every(function(c){return /^:?-+:?$/.test(c)});
var hd=sep?rows[0]:null,bd=sep?rows.slice(2):rows,t='<div class="tw"><table>';
if(hd)t+="<thead><tr>"+hd.map(function(c){return "<th>"+inl(c,did)+"</th>"}).join("")+"</tr></thead>";
t+="<tbody>"+bd.map(function(r){return "<tr>"+r.map(function(c){return "<td>"+inl(c,did)+"</td>"}).join("")+"</tr>"}).join("")+"</tbody></table></div>";
o.push(t);continue}
var m=l.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
if(m){var ord=/\d/.test(m[2]),it=[];
while(i<L.length){var mm=L[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
if(mm){it.push(mm[3]);i++}
else if(L[i].trim()&&!bs(L[i])&&it.length){it[it.length-1]+=" "+L[i].trim();i++}
else break}
var tg=ord?"ol":"ul";
o.push("<"+tg+">"+it.map(function(x){return "<li>"+inl(x,did)+"</li>"}).join("")+"</"+tg+">");continue}
if(!l.trim()){i++;continue}
var p=[];while(i<L.length&&L[i].trim()&&!bs(L[i])){p.push(L[i].trim());i++}
if(p.length)o.push("<p>"+inl(p.join(" "),did)+"</p>")}
return {html:o.join("\n"),heads:heads}}
