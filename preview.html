var DOCS=[{"id": "overview", "title": "总览 · README", "md": "# Clay\n\n> **一个 AI 与人共用同一条编辑通道的通用 3D 网页游戏引擎编辑器：\n> 游戏逻辑是数据，AI 和鼠标是同一个命令层的两个前端，产出的是同一种材料。**\n\n**状态：M1 进行中，M1-a / M1-b / M1-c / M1-d / M1-f / M1-h 已落地。**\n\n```bash\nnpm install && npm test        # headless 断言（56 项）\nnpm run dev                    # 第一版编辑器：大纲 / 详情 / gizmo / 多选\n```\n\n[ADR-002](docs/design/adr-002-eventsheet-eval.md)（事件表求值语义，全项目唯一不可逆项）\n已转**已验证**——三个手工样例经[两轮推演](docs/design/adr-002-walkthrough.md)走通，暴露并补上 6 处语义缺口。\n\n> **v17 重定了方向**（当前 **v21**，见 goals.md 开头）：目标用户从「不写代码的普通人」改为**有经验的游戏研发人员**，\n> 门槛由**内置 AI + 内置教程**承担而非削能力（决 35）；双模式取消；分发链推后；\n> 模板集由**八款目标游戏**（红警 / 星际 / 魔兽 / Dota / 塞尔达 / 艾尔登 / 刺客信条 / 战争机器）\n> 倒推为 **RTS·MOBA** 与**第三人称动作**两个。详见 [goals.md](docs/design/goals.md) 开头的 v17 说明。\n\n> **v20 升级了 AI 控制循环**（决策 40）：复杂任务使用可编辑、需批准的 `PlanContract`，\n> 每步在 Action 候选事务中执行，经结构 / 确定性行为 / 体验三层验证后才提交 checkpoint；\n> 失败进入有预算、不可削弱 hard 测试的修复环，全程留下可重放证据。见\n> [ADR-003](docs/design/adr-003-verified-agent-loop.md)。\n\n> **v21 建立了可进化的决策治理**（决策 42）：非平凡任务先扫描十二面 `DecisionCoverage`，\n> 未知项进入有风险路由的登记表，必要时发 `DecisionChallenge`；现有方案和治理机制都能被更强证据取代，\n> 但 AI 不能静默修改产品意图、hard oracle、权限或历史。见\n> [ADR-004](docs/design/adr-004-evidence-governed-evolution.md)。\n\n---\n\n## 从哪读起\n\n| 想干什么 | 读哪里 |\n|---|---|\n| **只想看图** | [overview.svg](docs/diagrams/overview.svg) —— 六图合一：系统全景 · 数据模型 · 一帧发生什么 · 用户流程 · 编辑器界面 · 能力覆盖面 |\n| **一次读完全部** | 打开 [preview.html](preview.html) —— 全部文档 + 总览图合成一页，带目录与过滤 |\n| **想知道这编辑器现在有什么能力** | **[architecture-outline.md](docs/design/architecture-outline.md)** —— 决策后的状态快照，只写「是什么」不写「为什么」 |\n| **判断能不能做出某类游戏** | architecture-outline.md §二 —— 八款目标游戏的灰盒判定 + 三道闸 + 强/中/弱轴 |\n| **接下来做什么、按什么顺序** | **[roadmap.md](docs/design/roadmap.md)** —— 施工版计划：包 · 依赖 · 相对体量 · 验收 · 砍单顺序 · 决策截止点 |\n| 快速判断这项目在做什么 | [goals.md](docs/design/goals.md) §0 冷启动：一句话定义 + 12 条不变量 |\n| **判断一个提议该不该做** | goals.md §0 → §2 决策表 → §3 范围。这三节就是裁决依据 |\n| **让 AI 发现遗漏并改进旧方案** | **[ADR-004](docs/design/adr-004-evidence-governed-evolution.md)** —— 决策覆盖、不确定项、挑战、证据追踪与 champion/challenger |\n| 理解产品长什么样 | goals.md §1.3 用户心流 |\n\n---\n\n## 名字的由来\n\n**I3 不变量的原话是「AI 的产出与人手做的是同一种材料」——Clay 就是那个材料。**\n\n- **同一种材料**：AI 生成的规则和你手搭的规则，捏起来手感一样，你随时能接着改\n- **随手就能改**：黏土不用先做模具，戳一下就有反馈——「模板优先，空白页有罪」\n- **不怕做错**：捏坏了压回去重来——「错误必须便宜」，播放沙箱与全量撤销\n- **成品要出窑**：从一团泥到一款完整作品——决策 25 的水位、决策 23 的成品感下限\n\n刻意避开 Unreal / WorldEngine / Foundry 那种「宏大」路线。\n定位不是威力，是**同一种材料**——**AI 改的和你改的是同一坨泥**。\n\n> v17 之前这里写的是「可及性」（谁都能上手）。护城河换到 I1 + I3 之后，\n> 名字要说的不再是**谁能碰它**，而是**AI 和人碰的是不是同一样东西**。\n\n---\n\n## 目录\n\n```\nClay/\n├─ README.md              本文\n├─ AGENTS.md              AI 协作规范（单一真源）：接手指引 · 七步迭代流程 · 检查表\n├─ CLAUDE.md              指向 AGENTS.md 的 stub\n├─ preview.html           全部文档合成的单页预览（生成物，勿手改）\n├─ tools/\n│  ├─ check-docs.py       文档一致性校验\n│  ├─ build-preview.py    重新生成 preview.html\n│  └─ preview-template.html\n└─ docs/\n   ├─ design/             未来方案、取舍、决策记录（会过期）\n   │  ├─ goals.md              产品设计大纲 —— 最高裁决依据（决策过程）\n   │  ├─ architecture-outline.md  产品架构大纲 —— 决策后的状态（能力清单）\n   │  ├─ roadmap.md            开发计划 —— 施工版：包 · 依赖 · 体量 · 决策截止点\n   │  ├─ ai-native-engine.md   AI 基础设施规格（下级文档）\n   │  ├─ adr-001-ecs.md        ECS 库选型\n   │  ├─ adr-002-eventsheet-eval.md  事件表求值语义 —— 唯一不可逆的一项\n   │  ├─ adr-003-verified-agent-loop.md  AI 计划 · 事务 · 验证 · 证据 · 有界修复协议\n   │  ├─ adr-004-evidence-governed-evolution.md  决策发现 · 挑战 · 证据 · champion/challenger\n   │  ├─ adr-002-walkthrough.md          ADR-002 三个样例的推演结果（已采纳）\n   │  ├─ adr-003-walkthrough.md          ADR-003 三个样例的推演结果（已采纳）\n   │  ├─ spike-001-rapier-determinism.md Rapier 确定性实测（同机通过，跨平台未验）\n   │  └─ spike-002-ecs.md               ECS 选型验证（koota 锁定）\n   ├─ diagrams/           给人看的入口（内容以 goals.md 为准）\n   │  └─ overview.svg          六图合一：系统全景 · 数据模型 ·\n   │                          一帧发生什么 · 用户流程 · 编辑器界面 · 能力覆盖面\n   ├─ conventions/        写代码时要遵守的规则（很少变）\n   │  └─ ui.md                 UI 令牌与图标约定，防风格漂移\n   └─ architecture/       已实现模块的架构与理由（跟着代码改）\n      └─ roads.md              继承自 GameHub 存量\n```\n\n> **goals.md 与 architecture-outline.md 的分工**：前者是**决策过程**（决策表 + 版本沿革、\n> 每条为什么这么定、否掉了什么），是裁决依据；后者是**决策后的状态**（现在能做什么、\n> 做到哪儿为止、封顶在哪），是能力清单。**冲突时以 goals.md 为准。**\n\n**文档按生命周期分三类**，不按主题——三类过期的方式完全不同，混在一起会分不清哪份还算数：\n`design/` 会过期，实施后要么归档、要么把落地部分挪进 `architecture/`；\n`conventions/` 很少变，变了要在决策表或 ADR 里留痕；\n`architecture/` 跟着代码改，代码变了文档没变就是 bug。\n\n**当前绝大部分内容仍在 `design/`**，代码只有 M0-b 的工程地基（`src/` + `tests/`）。\n`architecture/` 与 `conventions/` 里现有的两份是从 GameHub 继承的存量参考。\n**M1 落地后，实现过的部分要从 `design/` 挪进 `architecture/`**——这是三类文档分工的执行点。\n\n---\n\n## 怎么改这些文档\n\n**五条编辑规则的出处是 [goals.md §0.5](docs/design/goals.md)。**\n**这里不复述**——规则写到第二个地方，两处就会各自漂移。\n\n**完整的迭代流程在 [AGENTS.md](AGENTS.md)**：三分钟接手指引、权威顺序、七步流程、\n三条最容易犯的错、交接检查表。**任何 AI 助手接手前先读那一份**（`CLAUDE.md` 是指向它的 stub）。\n\n改完跑这两条：\n\n```bash\npython tools/check-docs.py\n```\n```bash\npython tools/build-preview.py\n```\n\n`check-docs.py` 查断链、锚点、决策编号连续性、声明条数与实际是否一致，\n以及**已推翻的决策是否还在别处被当成现行的引用**——v17 那次漏改 `conventions/ui.md`\n就是这类问题。**报错就修，不要忽略。**\n\n---\n\n## 与 GameHub 的关系\n\n前身工程在 `E:\\GameHub`：约 3200 行道路与地形的领域实现、1845 行离线测试，\n以及一套可直接留用的编辑器外壳（停靠系统、i18n、项目门厅、存档信封、无边框窗口、图标系统）。\n\n**它被冻结为参考实现**（决策 10、goals.md §8）：\n\n- **不再加新功能**，严重 bug 仍修\n- [roads.md](docs/architecture/roads.md) 是迁移时的规格书\n- `js/state/roadTypes.js` 的**主题包机制是决策 20（皮肤包）的原型**——\n  「几何只认 widthUnits，主题永远不改变路宽、最小半径与路网拓扑」\n- 迁移若发生，用**新旧对拍**（旧实现作 oracle），不重写测试\n\n> 文档里形如 `../../js/core/History.js` 的链接指向 `E:\\GameHub` 的源码，在本仓库内会断链。\n> 这是有意的——它们引用的是那份冻结的参考实现。\n\n---\n\n## 下一步\n\n### M0 已完成\n\n| | 产出 |\n|---|---|\n| ✅ **求值语义定稿**（决策 31） | [ADR-002](docs/design/adr-002-eventsheet-eval.md) **r2 · 已验证**——[两轮推演](docs/design/adr-002-walkthrough.md)走通三个样例，补上 6 处语义缺口 |\n| ✅ **AI 控制协议推演**（决策 40） | [ADR-003](docs/design/adr-003-verified-agent-loop.md) **r2**——[两轮推演](docs/design/adr-003-walkthrough.md)补上 8 处缺口；M1-b 已为事务、revision 与修复权限底座提供机器执行证据 |\n| ✅ **工程地基**（M0-b） | vite + three + Rapier 从 npm 加载；`npm test` 6 项 headless 断言 |\n| ✅ **ECS 选型**（ADR-001） | [spike-002](docs/design/spike-002-ecs.md) 六条判据全过，**koota 锁定**；`U-001` 关闭 |\n| ⚠️ **物理确定性**（决策 29） | [spike-001](docs/design/spike-001-rapier-determinism.md)——同机与跨 V8 版本通过；**跨 CPU 架构未验**（需第二台机器，截止点闸门 A） |\n| ⬜ **决策治理回放**（决策 42） | [ADR-004](docs/design/adr-004-evidence-governed-evolution.md) G1–G3 未做。横切约束，**不阻塞 M1** |\n\n### M1-a / M1-b / M1-c / M1-d / M1-f / M1-h 已完成；下一步是 M1-i\n\n**M1-a ECS 封装层**已经提供稳定实体 id、按 id 升序的 `query()`、声明式组件 schema、\n连续版本迁移与结构化诊断；生产代码只在适配层导入 koota。9 项 M1-a 测试含 koota 原始错序与半写负例，\n`U-002` 已关闭。\n\n**M1-c** 已提供确定性版本信封、SHA-256 revision、组件 / 信封迁移链、按块存取、\n跨块实体引用恢复、精确运行时版本解析与命名 checkpoint。`U-039` 已关闭：升级 Rapier 时保留旧版本适配器，\n快照缺少精确运行时时在加载世界前失败，不得回退到最新版。\n\n**M1-b** 已提供 Action Registry、自省、JSON Schema 子集、前置条件、稳定语义 `affects`、确定性真实 diff、\npreview / commit / abort、幂等、命名 checkpoint、日志与撤销。11 项测试关闭 `U-041` / `U-042`：\n计划基线只在首步校验，后续步骤只接受本 run 推进的 revision；repair 只能使用本步骤批准的 Action 与影响域，\n越界稳定返回 `needs-review`。\n\n**M1-d** 已提供 TestSpec / oracle registry、按实际 `affects` 选择回归集、固定 seed RNG、checkpoint / 候选世界隔离运行、\n意图 / 设备两层输入适配、固定 tick、结构化证据与 M1-b validator。8 项测试证明 hard 失败阻止 commit、soft 失败不能覆盖 hard、\noracle 不得改世界后自称通过；`U-043` / `U-044` 仍保持活动，具体设备事件格式与 `covers` 准确性留到 M3-f 验证。\n\n**M1-f** 已提供可序列化的 ECS Transform 与父子层级、稳定网格空间索引、实体射线拾取，以及 ECS → Three.js 的增量只读投影。\n9 项测试覆盖层级与序列化、循环和无效父节点、索引更新的原子性、稳定命中顺序、投影增删改、动态 bounds 与渲染对象不得回写 ECS。\n浏览器自检已迁移到真实 ECS 投影，并能点击选中稳定实体 id；BVH 与射线候选加速仍按路线图后置。\n\n**M1-h** 已交付第一版真正可操作的编辑器：ECS 父子大纲、schema 自动详情、点选 / Ctrl 多选 / 拖框、\ntranslate / rotate / scale gizmo、轨道相机与响应式移动面板。编辑器选择只存稳定 id，不进世界快照；\n属性输入与 gizmo 松手统一提交 `editor.patch-components` Action，并共享现有 revision、checkpoint 与撤销栈。\n6 项 M1-h 测试覆盖 GUI / Action revision 对拍、批量回滚、选择隔离、世界替换重绑定、层级环拒绝与父子 gizmo 补丁。\n\n下一步做 **M1-i 最小 AI 单步指令**，验证模型与人能否复用同一条 Action 通道和事务回执；随后进入 M1-g 分块流式加载。\n\n完整的包拆分、依赖、砍单顺序见 [roadmap.md](docs/design/roadmap.md) M1。\n\n> **仍然有效的两条纪律**：不往设计文档里加新范围；`preview.html` 是生成物。\n>\n> 「不加新规范直到至少一份 ADR 转入已验证」这条**已达成**——\n> ADR-001 与 ADR-002 均为「已验证」。但它换成了一条更强的：\n> **M1 期间新增的任何协议字段，都要有一个跑得起来的测试**，\n> 而不是又一段纸面规范。ADR-002 的 D4、ADR-001 的排序职责都已经做到了这一点。\n\n> v16 是一次**收口**（提前不可逆决策、补执行漏洞）；\n> **v17 是一次转向**——它删掉的比加上的多，因为一整套「为普通人付的税」随画像一起走了。\n"}, {"id": "outline", "title": "产品架构大纲 · 决策后的状态", "md": "# 产品架构大纲 · 决策后的状态\n\n> **对应 goals.md v21。本文只写「是什么」，不写「为什么」。**\n>\n> 理由、取舍、被否掉的方案、决策沿革，**一律在 [goals.md](goals.md)**。\n> 本文每一节末尾有溯源指针，想追某一条为什么这么定，照指针回去查。\n>\n> **读这一份的场景**：判断「这个编辑器现在能做什么、做不到什么」。\n\n---\n\n## 一 · 它是什么\n\n> **一个 AI 与人共用同一条编辑通道的通用 3D 网页游戏引擎编辑器：\n> 游戏逻辑是数据，AI 和鼠标是同一个命令层的两个前端，产出的是同一种材料。**\n\n| | |\n|---|---|\n| **形态** | 网页优先的编辑器 + 播放器，同一个应用切播放模式；播放期与编辑器**分包** |\n| **面向** | 有经验的游戏研发人员。门槛由**内置 AI + 内置教程**承担，不靠削能力 |\n| **维度** | 只做 3D（2D 用正交相机应付） |\n| **逻辑层** | **事件表**（有序的「当……就……」规则行）+ 行为单元 + 数据表。没有节点图、没有画布 |\n| **实体模型** | ECS，对用户可见（术语不做翻译） |\n| **本轮终点** | 导出自包含工程文件。分享链接、账号、后端在**开放阶段**，不在本轮 |\n\n**三条不可让步**：\n\n| | |\n|---|---|\n| **I1** | 编辑期一切变更只经由 Action 层 |\n| **I3** | AI 的产出与人手做的是同一种材料 |\n| **I2** | 游戏逻辑是数据，可读、可逐行 diff、可被约束层校验（**I1 的前提**） |\n\n**v20**：I1 + I3 仍是设计原则，但市场差异由它们的可验证执行兑现：\n步骤事务、hard oracle、证据账本、恒定恢复成本与供应商无关，而不是只宣称「AI 在编辑器里做事」。\n\n> 溯源：goals.md §0.1、§0.2、§2\n\n---\n\n## 二 · 能力覆盖面（先看这张）\n\n**判定标准是灰盒 MVP**：核心玩法循环能不能跑通，几何体代替美术。**不是能不能做出那款成品。**\n\n| 簇 | 目标游戏 | 判定 | 说明 |\n|---|---|---|---|\n| **俯视指令** | 红色警戒 | ✅ | |\n| | 星际争霸 | ✅ 小规模 | 1000 实体预算是为它定的 |\n| | 魔兽争霸 | ✅ | 英雄技能走行为单元 + 技能目标选择 |\n| | Dota 2 | ✅ 单人对 AI | |\n| **第三人称动作** | 塞尔达 | ✅ 神庙式 + 小区域 | 元素传播矩阵受实体预算限制 |\n| | 艾尔登法环 | ✅ Boss 房 + 小区域 | |\n| | 刺客信条 | ⚠️ **降级** | 潜入 + 战斗 + 沿预设点攀爬。**没有丝滑跑酷** |\n| | **战争机器** | ✅ 单人 / 合作 | |\n\n### 契合度的一般规律\n\n**覆盖面由「节奏 + 相机 + 移动是不是玩法本身」决定：**\n\n| 轴 | 类型 | 判断 |\n|---|---|---|\n| **强项** | RTS、MOBA、塔防、战棋、roguelite、经营、ARPG、解谜 | 俯视 / 秒级 / 指令驱动。架构每一处选择都在帮忙 |\n| **中等** | 魂类 Boss 房、塞尔达神庙、平台跳跃、TPS、复古 FPS | 第三人称 / 房间尺度 / 帧级战斗 |\n| **弱项** | 跑酷动作、格斗、体育 | **移动或出招本身即产品**。动画栈封顶在档 2 |\n| **本轮不做** | 竞技 FPS、MMO（**封顶**，§十一）；体素生存（**留口**，§十） | — |\n\n### 三道闸\n\n任何玩法能不能做，先过这三道：\n\n| 闸 | 边界 | 挡掉什么 |\n|---|---|---|\n| **动画闸** | 档 2：状态机 + 混合 + root motion。**无 IK、无动作匹配、无上下半身分层** | 跑酷、格斗、体育 |\n| **规模闸** | 同屏完整模拟实体 **1000**，无 LOD / impostor，桌面 60fps | 千级弹幕、城市人群、体素世界 |\n| **网络闸** | 本轮无联机；方向已定为 **lockstep**，服务器权威路线封顶 | 竞技对抗、MMO |\n\n> 溯源：goals.md 附录 A.9\n\n---\n\n## 三 · 系统全景\n\n```\n┌────────────────────────────────────────────────────────────┐\n│  编辑器 UI（一套全集，无模式切换）                          │\n│  模板库 · 项目门厅 · 大纲 · 详情 · 事件表 · 数据表          │\n│  动画状态机 · 皮肤切换 · 资产库 · 播放控制 · 教程 · 导出    │\n└───────────────┬───────────────────────────┬────────────────┘\n                │                           │\n                │                    ┌──────┴───────┐\n                │                    │  AI 作者接口 │\n                │                    │  三个入口    │\n                │                    └──────┬───────┘\n                ▼                           ▼\n┌────────────────────────────────────────────────────────────┐\n│  Action 层 —— 编辑期唯一变更通道                            │\n│  registry（schema / 前置条件 / 影响域 / 可逆性 / describe） │\n│  撤销栈 · 变更日志 · listAvailableActions                   │\n└───────────────────────────┬────────────────────────────────┘\n                            ▼\n┌────────────────────────────────────────────────────────────┐\n│  ECS 封装层（自写）  defineComponent / query / schema       │\n├────────────────────────────────────────────────────────────┤\n│  第三方 ECS 库（koota，可替换，代价 ≈ 800 行）              │\n└──┬─────────────┬──────────────┬──────────────┬─────────────┘\n   ▼             ▼              ▼              ▼\n┌────────┐ ┌──────────┐ ┌────────────┐ ┌──────────────┐\n│事件表  │ │ 系统(JS) │ │ 物理       │ │ 渲染桥        │\n│运行时  │ │ 播放期   │ │ Rapier     │ │ 组件+皮肤    │\n│        │ │          │ │ 寻路/视野  │ │ → three.js   │\n└────────┘ └──────────┘ └────────────┘ └──────────────┘\n   ▲\n┌──┴──────────────────────────────────────┐\n│ 领域模块                                 │\n│ ① RTS / MOBA    ② 第三人称动作           │\n│ = 组件 + 系统 + 条件动作 + kinds         │\n│   + 约束 + 面板 + 皮肤 + 模板            │\n└──────────────────────────────────────────┘\n```\n\n**四条通道纪律**：\n\n| # | 规则 |\n|---|---|\n| 1 | 编辑期状态**只能**经 Action 层改（I1） |\n| 2 | 模块**不得**直接 import 第三方 ECS 库，一律走封装层 |\n| 3 | 模块之间只通过显式契约通信（I5） |\n| 4 | 视听层（动画 / 粒子 / 音频 / 后处理）是**只读消费者**，不得写玩法组件 |\n\n> 溯源：goals.md §4.1、§7.1、adr-001\n\n---\n\n## 四 · 内核能力清单\n\n**这是「能力如何」的正面回答。** 每项写清做到哪儿。\n\n### 4.1 世界与状态\n\n| 能力 | 做到哪儿 |\n|---|---|\n| 实体 / 组件表 / 原型查询 | 完整 |\n| 组件 schema 注册 | 字段范围、枚举、实体引用、单位、说明——支撑详情面板自动生成与 AI 可读 |\n| 系统注册与调度 | 固定步长 + 帧步长两条 |\n| 序列化 | 确定性、版本化信封 + 迁移链、可 diff、**按块存取** |\n| 快照与回滚 | 全世界快照；播放沙箱靠它 |\n| **分块与流式加载** | 场景内分块、实体随块加载卸载。**不做** LOD 层级、impostor、地形简化 |\n\n**分块的三条纪律**：加载顺序不得影响模拟结果；玩法需要的最小状态常驻（只有表现随块进出）；卸载重载后同输入同结果。\n\n### 4.2 变更（Action 层）\n\n| 能力 | 做到哪儿 |\n|---|---|\n| Action Registry | id / JSON Schema 参数 / 前置条件 / 影响域 / 可逆性 / describe |\n| 撤销栈 + 变更日志 | 内存栈 + 存档时落盘。**不做**事件溯源存储 |\n| `listAvailableActions(context)` | 情境级自省：此刻能做什么、影响谁、能不能撤销 |\n| params schema 约束 | 必须是可直接喂给模型做约束解码的 JSON Schema 子集 |\n| **步骤事务** | `baseRevision` / `idempotencyKey` / preview / commit / abort；候选分支通过 hard oracle 才提交 checkpoint |\n| **执行回执** | `ActionReceipt` / `StepReceipt` 返回真实 diff、实际 `affects`、验证与预算消耗 |\n\n### 4.3 逻辑\n\n| 能力 | 做到哪儿 |\n|---|---|\n| **事件表** | 条件 / 动作 / 分组 / 变量 / 等待 / 重复 / **多层子事件** / **参数位算术** |\n| 求值语义 | 全表自上而下 + 触发即时插入；实体集按种类收窄、子事件只继承不回写、顶层规则之间不传递。**触发规则从载荷起点**（A1）；**事件入队前稳定排序**（D4）（**已验证，待冻结**，见 [adr-002](adr-002-eventsheet-eval.md) r2 与[推演记录](adr-002-walkthrough.md)） |\n| **关联查询**<br>（r2） | `<A> 的 <关系> 中 <排序> 最优的 <B>`——**求值模型中唯一允许看到当前集合之外实体的构造**。关系与排序都是注册项；配对只在本条规则内存活；**不允许嵌套**（[ADR-002 §4.1](adr-002-eventsheet-eval.md#41-关联查询原语族r2-新增--b3) 的 R1–R4） |\n| **计时器**<br>（r2） | 带时间单位的变量由内核按 `dt` 递减，**属运行期状态、必须可序列化**。受限 JS 环境注入 `rng` / `tick` / `dt` |\n| **行为单元** | 带参数、有 schema 的可复用规则组。展开即普通规则行。**不允许递归与任意控制流** |\n| **配方** | 行为单元的预设 = 单元 + 默认参数 + 一句说明 |\n| 条件动作的实现 | JS 是正常路径，但**跑在确定性沙箱里**：禁 `Date` / `Math.random` / 网络 / 存储，由内核注入 `rng` 与 `tick`，注册时静态检查 |\n| **封顶** | 任意控制流、递归、完整表达式语言 |\n\n### 4.4 数据与流程\n\n| 能力 | 做到哪儿 |\n|---|---|\n| **场景与流程** | 多场景（各自可编辑可试玩）+ 流程数据（顺序与切换条件）+ 全局状态 / 场景内状态分界 |\n| 界面页 | 标题 / 暂停 / 背包 / 对话 / 结算，DOM overlay 实现，是流程里的节点 |\n| **数据表** | 具名表 + 有 schema 的列 + 按行 id 取值。行 id 只增不改。**不做**公式列、外部表格同步 |\n| **运行期动态集合** | 有序集合 + 键值表；加入 / 移除 / 取值 / 计数；元素限标量与实体引用；插入序稳定。**不做**排序、过滤、嵌套查询 |\n| **运行期存档** | `存进度(槽位)` / `读进度(槽位)`；游戏自己声明存什么；等待队列也在存档范围内。**不做**云存档、多槽管理界面 |\n\n### 4.5 空间与物理\n\n| 能力 | 做到哪儿 |\n|---|---|\n| Transform 层级 | 是组件，不是场景图 |\n| 空间索引 | 网格哈希 / BVH |\n| 拾取 | 射线拾取、框选（编辑期） |\n| 刚体与碰撞 | Rapier：刚体 + 碰撞 + 空间查询 |\n| **关节** | **固定 + 铰链**，配「连接 / 断开」两个事件表动作。**不做**马达、布娃娃、软体 |\n| **群体寻路** | 群体寻路 + 局部避让，确定性。查询接口与实现分离 |\n| **视野与战争迷雾** | 按阵营视野计算 + 迷雾状态 + 「X 是否可见」查询。**迷雾是玩法状态，参与断言** |\n\n### 4.6 玩法能力（播放期）\n\n| 能力 | 做到哪儿 |\n|---|---|\n| **选择与指令** | 点选、框选、编队、对选中集下指令（移动 / 攻击 / 跟随 / 停止） |\n| **放置与建造** | 位置合法性校验、消耗资源、放置预览、可撤销 |\n| **技能目标选择** | 点地 / 点单位 / 方向 / 范围指示器，是行为单元的参数形态 |\n| **输入意图** | 事件表只认意图（跳跃 / 确认 / 移动），设备绑定是一张可换的映射表 |\n\n### 4.7 呈现\n\n| 能力 | 做到哪儿 |\n|---|---|\n| **kind 注册表** | 声明碰撞体、占地尺寸、可用动画状态、**动画状态的位移曲线** |\n| **皮肤包** | `kind → 模型 / 材质 / 缩放 / 动画状态映射 / 图标`。一个工程一个当前皮肤，可覆盖到单实体。编辑器内可创建与编辑 |\n| **动画（档 2）** | glTF clip + 交叉淡化 + **状态机** + **混合** + **root motion** + **动画事件**（clip 时间点）。**封顶：IK、动作匹配、上下半身分层** |\n| 相机 | 四档（受限俯视 / 肩后跟随 / 第一人称 / 自由飞行）+ 平滑 + 震动 + 锁定目标 |\n| 音频 | 音效 / BGM / 音量 / 循环 / 停止，全是事件表动作。**不做**空间音频、混音 |\n| 特效 | 预制粒子（命中 / 爆炸 / 拾取 / 尘土 / 拖尾）。**不做**粒子编辑器 |\n| 材质与光照 | 参数面板 + 环境与光照预设。**不做**节点式材质编辑器、烘焙 |\n| 后处理 | 预设档位（关 / 柔和 / 强烈）。**不做**自定义链 |\n| 游戏内 UI | DOM overlay + 实体锚点 + 预制件（血条 / 计分 / 计时 / 提示 / 胜负）。**不做**控件系统 |\n\n**呈现与玩法的分界线**（换皮不得改变玩法）：\n\n| 归玩法（kind / 逻辑） | 归呈现（皮肤包） |\n|---|---|\n| 碰撞体、占地尺寸 | 模型、材质、缩放 |\n| **root motion 位移曲线** | clip 本身、混合权重、过渡时长 |\n| **动画状态机的当前状态与转移** | 状态映射到哪个 clip |\n| 迷雾的可见性状态 | 迷雾怎么画 |\n\n### 4.8 AI 基础设施\n\n| 能力 | 做到哪儿 |\n|---|---|\n| **三个入口** | `describe(scope, detail)` / `listAvailableActions(context)` / `apply(actions[])`。**不做**一个 Action 一个 tool |\n| `describe` | 语义 LOD，可寻址可下钻，**返回结构化数据不返回文案** |\n| **约束层** | 谓词 + 结构化失败反馈四元组（`at` / `observed` / `limit` / `alternatives`） |\n| **计划契约** | `PlanContract`：版本、`baseRevision`、作用域、步骤依赖、Action 白名单、预期影响、TestSpec 与预算；Markdown 只是视图 |\n| **研发任务契约** | `TaskContract`：目标、权限、受保护意图、事实、假设、scope、十二面 `DecisionCoverage`、证据与停止条件；非平凡任务先于计划建立 |\n| **未知与挑战** | §9 `U-NNN` 按不可逆性 × 不确定性 × 影响面路由；`DecisionChallenge` 说明隐含决策、选项、证据、最小可逆实验与仍可继续的工作 |\n| **控制状态机** | Draft → AwaitingApproval → Executing → Verifying → Repairing → Passed / NeedsReview / Failed / Cancelled；状态、权限、预算和中断由引擎控制 |\n| **三层验证** | V1 结构 + V2 确定性行为决定 hard 通过；V3 日志 / 截图 / 真实输入提供体验证据，不覆盖 hard 失败 |\n| **证据与修复** | `EvidenceLedger` 可重放；失败签名 + 原因假设 + 最小修复 + 回归范围；重复失败、越界、削弱测试、缺原语或超预算必停 |\n| **证据演化** | 目标 → 场景 → 决策覆盖 → ADR / `U-NNN` → 实现 → oracle → evidence package；方案与治理机制均按 champion/challenger 影子比较、可迁移、可回退 |\n| 供应商适配层 | OpenAI 兼容端点 + Anthropic / Gemini 原生 + 本地模型。**能力探测 + 自动降级** |\n| **不做** | 模型路由、RAG、微调、多模型投票、**引入通用 agent 框架作依赖**（不等于禁止自主循环） |\n\n**AI 介入形态**（按实现顺序）：单步指令 → 换皮 → 多步变更集 → 生成规则行 → 内联建议。\n\n**AI 参与度分三档**（决策 40，v20 修订）：\n\n| 档 | 能力 | 状态 |\n|---|---|---|\n| **1** | 上述五种形态 + 运行给定 TestSpec、报告证据 | **本轮做** |\n| **2** | **验证驱动自主循环**：批准计划 → Action 步骤事务 → 三层验证 → 提交 checkpoint 或有界修复；进度可见、可停、可部分接受、可重放证据 | **本轮做**（[ADR-003](adr-003-verified-agent-loop.md)） |\n| **3** | **AI 造零件**：用 JS 实现新的条件与动作。**不得自动注册**——必须过沙箱静态检查 + headless 断言，registry 标明来源 | **留口** |\n\n**封顶的是形态不是规模**：产出必须始终是 Action 序列。任务多大都行，\n不可寻址、不可手改的黑盒结果不行。\n\n**档 1–2 的能力天花板**：**AI 能组装，不能造零件**。超出现有条件动作库的需求，得由人先写零件。\n\n### 4.9 平台与工程\n\n| 能力 | 做到哪儿 |\n|---|---|\n| **宿主能力抽象** | 全屏、指针锁定、URL、存储、文件读写各一层薄接口 |\n| **播放期分包** | 播放期不依赖任何编辑器 UI。**这条不允许放宽** |\n| 数据安全 | 自动保存；导出自包含工程文件；overlay 一律 `textContent`；导入设上限并优雅失败 |\n| **试飞台** | headless runner（加载 → 执行 Action 序列 / 输入意图轨迹 → TestSpec → `EvidenceLedger`）+ 确定性；日志、截图引用与真实输入是 V3 证据 |\n| **教程系统** | 按能力组织、可交互、就在编辑器里。**每个概念一条，跟着能力一起交付** |\n\n> 溯源：goals.md §5.1、§3.4、§4.4、§4.7、ai-native-engine.md\n\n---\n\n## 五 · 数据模型\n\n**一个工程里有什么，怎么套起来：**\n\n```\n工程\n├─ 流程                    哪个场景先来、什么条件切下一个\n├─ 全局状态                跨场景保留\n├─ 场景[]\n│   └─ 块[]                加载卸载的单位\n│       └─ 实体[]          = kind + 组件数据\n├─ 事件表                  规则行[]（有序）\n│   ├─ 条件行[] 动作行[]\n│   ├─ 子事件（多层）\n│   └─ 行为单元定义[]      带参数 schema；配方 = 它 + 默认参数\n├─ 数据表[]                作者编辑，静态，行 id 只增不改\n├─ 运行期集合声明[]        有序集合 / 键值表\n├─ kind 注册[]             碰撞体 / 占地 / 动画状态 / 位移曲线\n├─ 当前皮肤包              kind → 视觉\n├─ 输入绑定表              意图 → 设备\n└─ 依赖的内容包[]          包 id + 版本\n```\n\n**三种「状态固化」**：\n\n| | 工程存档 | 导出工程文件 | 运行时存档 |\n|---|---|---|---|\n| 存什么 | 编辑期世界状态 + 流程 + 事件表 | 工程的自包含固化 | 游戏声明的持久化状态 |\n| 权威 | Action 层 | 导出那一刻的工程 | 事件表运行时 |\n| 带版本 | 是 | 是 | 是 |\n\n**内容包**——模板 / 皮肤 / 配方 / 数据表 / 素材集 / 模块**是同一种东西**：\n\n```\n内容包 = { 稳定 id, 语义化版本, 作者, 许可, 依赖(包 id + 版本), 内容哈希, 载荷 }\n```\n\n**五处「可替换的东西都是一张映射表」**：`kind → 视觉`、`动画语义状态 → clip`、`输入意图 → 设备`、`包 id + 版本 → 内容`、`Action 标签 → 能力面视图`。\n\n> 溯源：goals.md §4.5、§4.7、§3.5\n\n---\n\n## 六 · 运行期：一帧发生什么\n\n**玩法跑在固定步长的 tick 上；呈现跑在帧上。两者分离。**\n\n```\n── 固定步长 tick（玩法，确定性范围） ──────────────────\n  1. 采样输入意图，冻结本 tick 的输入快照\n  2. 物理步进（Rapier）\n  2.5 收集本 step 的触发事件，按 (类型, 主实体 id, 次实体 id) 稳定排序后入队\n  3. 排空触发队列（FIFO，深度上限 16，超限 warning 不崩）\n       载荷实体已销毁 → 跳过该事件（E4）\n  4. 全表自上而下求值常规规则\n  5. 结算等待队列与计时器\n──────────────────────────────────────────────────\n\n── 渲染帧（呈现，只读消费） ────────────────────────\n  渲染桥增量同步 → 动画状态机求值 → 粒子 / 音频 / 后处理\n  块的加载与卸载（呈现层事件，不是玩法事件）\n──────────────────────────────────────────────────\n```\n\n**确定性的范围**：所有「逐字节一致」的断言**限定在玩法状态**，不含渲染与视听状态。\n\n**保住它的四条**：实体迭代按稳定 id 升序；随机数只来自内核注入的带种子 rng；JS 条件动作跑在沙箱里；触发在 tick 边界对齐、不在物理子步内回调。\n\n**编辑期 vs 播放期**：\n\n| | 编辑期 | 播放期 |\n|---|---|---|\n| 权威 | Action 层 | 事件表运行时 / 系统 |\n| 直接写状态 | 否 | 是 |\n| 撤销栈 | 有 | 无 |\n| 约束校验 | 实时 | 不校验 |\n| AI 可介入 | 是 | 只可经试飞台驱动输入并读取观测，不得直接写玩法状态 |\n\n进入播放 = 打快照，退出 = 整体回滚。**播放期改动不污染工程。**\n\n> 溯源：adr-002、goals.md §4.5、§7.1\n\n---\n\n## 七 · 编辑器界面\n\n**一套能力面，没有模式切换，没有术语翻译。**\n\n| 面板 | 改什么 |\n|---|---|\n| 模板库 | 打开即见，选一个先直接试玩 |\n| 项目门厅 | 回访入口：我的作品 + 最近编辑 + 模板库 |\n| 大纲 | 实体树 + 用户文件夹 |\n| 详情 | 按 schema 自动生成控件，可写 |\n| **事件表编辑器** | 可拖拽列表——加规则行、挑条件动作、改参数、调顺序、分组；播放时高亮命中的行。**没有画布、连线、布线** |\n| **数据表编辑器** | 按列 schema 生成的表格视图 |\n| **动画状态机编辑器** | 状态 + 转移条件的列表视图；转移条件复用事件表的条件注册表 |\n| 皮肤切换 | 一个下拉换整套风格；缺插槽当场列出 |\n| 资产库 | 内置素材库 + glTF 导入 + 预制体，按插槽组织 |\n| 视口 | 变换 gizmo、多选框选、复制粘贴、成组、对齐吸附 |\n| 播放控制 | 播放 / 暂停 / 单步 / 停止 |\n| **AI 面板** | 单步指令、变更集预览、`PlanContract` 编辑与批准、运行进度、步骤 diff、证据、停止 / 恢复 / 部分接受 |\n| **教程** | 任何一步都能唤出，不挡在路上 |\n| 导出 | 一个按钮生成自包含工程文件 |\n\n**存量直接留用**：停靠系统、i18n、项目门厅、存档信封与迁移链、无边框窗口、图标系统。\n\n> 溯源：goals.md §5.3\n\n---\n\n## 八 · 领域模块与模板\n\n**模块 = 组件 + 系统 + 条件动作 + kinds + 皮肤包 + Action + 约束 + 面板 + 模板**，一个声明文件，启动时校验。\n\n| 模板 | 覆盖 | 模块内容 |\n|---|---|---|\n| **RTS / MOBA** | 红警、星际、魔兽、Dota、**塔防** | 单位群、波次与 AI、建筑与生产、资源、胜负、迷雾呈现 |\n| **第三人称动作** | 塞尔达、艾尔登、刺客信条、TPS | 角色控制器、战斗与判定、锁定、背包与装备、关卡流程 |\n\n**平台跳跃**是内部脚手架（最快拿到可玩闭环），不作交付模板。\n\n**模块禁止**：import 别的模块内部实现、读写不属于自己的组件表、绕过 Action 层、import 第三方 ECS 库、在事件表或玩法组件里引用具体美术资源、在条件动作实现里触碰时间与随机源。\n\n> 溯源：goals.md §5.6、§7.1\n\n---\n\n## 九 · 硬性指标\n\n| 指标 | 值 |\n|---|---|\n| 播放期首包（不含用户素材） | ≤ 8 MB gzip |\n| 桌面冷启动到可玩 | ≤ 5 秒 |\n| 目标帧率 | 桌面 60fps |\n| 同屏**完整模拟**实体 | **1000** 不掉帧 |\n| 单块加载耗时 | ≤ 1 帧预算 |\n| 场景总量 | 不设上限（按块加载） |\n\n**三条永远成立的约束**：\n\n| | |\n|---|---|\n| **确定性** | 逐帧严格确定性，硬要求，不允许降级 |\n| **标识符稳定（I11）** | `kind` / 条件动作 / 配方 / 皮肤插槽 / 数据表行 id / 内容包 id **一旦发布即冻结**；要改就新增 + 标 deprecated + 保留迁移 |\n| **求值语义冻结** | 事件表的求值语义定稿后按 I11 对待。**全项目唯一「定错了没有退路」的地方** |\n\n> 溯源：goals.md §3.6.1、§3.6.2、adr-002\n\n---\n\n## 十 · 本轮不做，但架构留口\n\n**留口 = 后加不用重写、不破 I11。**\n\n| 项 | 留口条件 |\n|---|---|\n| 分享链接 + remix + 账号 + 后端 | 内容包字段集已定；导出文件已自包含 |\n| 移动端播放（触屏 / 自适应） | 输入意图映射（I12）保证加设备不改作品 |\n| **联机（lockstep）** | 确定性 + Action 日志就是它的底座 |\n| 导出独立包 / 端游手游套壳 | 播放期分包 + 输入意图 + 宿主能力抽象三条已守 |\n| 面向新手的能力面裁剪视图 | Action registry 的视图机制（I8） |\n| **AI 造零件**（决 40 档 3） | 复用计划 / 事务 / 证据底座；另加沙箱静态检查 + headless 断言才允许注册，registry 标明来源 |\n| 多 agent 并发编辑与自动合并 | `affects` 继续服务权限、约束与影响域，但本轮不设计并发合并 |\n| 模拟细节分级、LOD、impostor | — |\n| 网格世界 / 可破坏建造 | — |\n| **体素 / 瓦片世界**（我的世界 / 泰拉瑞亚类） | 块边界与实体无关 · kind 不假设一 kind 一实体 · 空间查询不假设刚体（V1–V3） |\n| 载具物理 / 样条路网 | 道路存量（约 3200 行）可选迁移 |\n| 关节：马达 / 布娃娃 / 软体 | Rapier 自带 |\n| 动画：更多混合模式 | — |\n| 资产 / 插件 / 皮肤市场、社区层、货币化 | 统一为内容包 |\n| 空间音频与混音、粒子编辑器、后处理自定义链、更多材质预设 | — |\n| 协同编辑、云工程、Action 日志的事件溯源存储 | — |\n\n---\n\n## 十一 · 方向性封顶（要做就得先推翻决策）\n\n| 封顶 | 后果 |\n|---|---|\n| **动画档 3**：IK / 动作匹配 / 上下半身分层 | 跑酷、格斗、体育做不了；刺客信条只到潜入 + 战斗 |\n| **竞技 FPS 路线**：服务器权威 + 客户端预测 + 反作弊 | CS / Valorant 类做不了 |\n| 图灵完备的事件表：任意控制流、递归 | 需要任意算法的玩法要下沉成 JS 条件动作 |\n| 2D 一等公民（Sprite 管线） | 2D 只能用正交相机 + billboard 应付 |\n| 节点图作控制流 / 画布 / 连线 | — |\n| 引擎内 3D UI 控件系统 | 游戏内 UI 只有 DOM overlay |\n| 节点式材质编辑器、烘焙管线 | 材质只到参数 + 预设 |\n| 自研物理 / 自研文生 3D / 自研音频引擎 | 全部集成或接 provider |\n| 编排逻辑用代码（而非数据） | 破 I1 与 I3，AI 通道直接失效 |\n| **产出不可寻址、不可手改的黑盒结果** | AI 的任务规模不封顶，产出形态封顶——必须是 Action 序列 |\n| 能力面的数据分叉 | 任何裁剪视图必须是 registry 的视图 |\n| 用用户的 key 做用户没要求的事 | — |\n| 道路系统新功能 | 存量冻结 |\n\n**注**：体素 / 瓦片世界（我的世界、泰拉瑞亚、僵尸毁灭工程）**不在封顶列，在留口列**（§十）——\n八款目标游戏无人需要，但没有任何决策否定它。**本轮做不了，日后可加**，条件是守住 V1–V3 三条。\n\n> 溯源：goals.md §3.4\n\n---\n\n## 十二 · 当前进度与下一步\n\n**状态：M1 进行中。** M1-a / M1-b / M1-c / M1-d / M1-f / M1-h 已落地：生产代码只在适配层导入 koota，实体使用单调稳定 id，\n`query()` 按 id 升序；组件 schema 带版本与迁移；世界快照使用确定性分块信封、SHA-256 revision、\n精确运行时版本注册表和命名 checkpoint；Action 层提供结构化 registry、自省、稳定语义 `affects`、真实 diff、\npreview / commit / abort、幂等、revision 冲突、checkpoint、日志与撤销；试飞台提供 TestSpec / oracle registry、\n固定 seed、两层输入适配、隔离沙箱、hard / soft 判定、确定性证据与 Action validator；渲染桥提供可序列化 ECS Transform\n层级、稳定网格索引、实体射线拾取，以及 ECS → Three.js 的增量只读投影；编辑器提供 ECS 父子大纲、schema 自动详情、\n点选 / 多选 / 拖框、三模式 gizmo 与响应式工作台，属性和 gizmo 编辑统一进入 Action 事务与同一撤销栈。\n`npm test` 有 56 项 headless 断言；`U-002`、`U-039`、`U-041`、`U-042` 已关闭；`U-043` / `U-044` 仍活动。\n待做：M1-i、M1-g、ADR-004 三个治理回放、Rapier 跨 CPU 架构实测。\n\n| 阶段 | 内容 | 闸门 |\n|---|---|---|\n| **零** | 打包器 + **求值语义定稿** + AI 控制协议推演 + 决策治理回放 | O（只冻结求值语义）+ G0（治理准入） |\n| 一 | ECS 内核 + Action 层 + 试飞台 + 分块 + 最小 AI | A、B |\n| 二 | 事件表 + **RTS 模板** + 寻路视野 + 导出 | C（5 条） |\n| 三 | AI 作者接口 + `PlanContract` + Action 事务编排 + 三层验证 + 证据 / 有界修复 + 供应商适配 | D（6 条，D.4 含 5 个子判据） |\n| 三½ | **动画栈档 2** + 第三人称动作模板 | **F（总判据）** |\n| 四 | 开放：分享 + 账号 + 移动端 + 新手视图 | E、G |\n| 五 | 联机（lockstep） | — |\n\n**眼下五件事**：\n\n1. **M1-i 最小 AI 单步指令**——验证 Action 通道形状与重复请求幂等\n2. **M1-g 分块流式加载**——在 M1-f 空间索引与投影基础上实现加载 / 卸载 / 重进\n3. **M1-j 确定性沙箱 J1–J3**——封住条件动作中的不确定时间、随机与外部副作用\n4. **Rapier 跨 CPU 架构实测**——闸门 A 前完成，不通过就换物理库\n5. **ADR-004 治理回放**——横切约束，不阻塞上述可逆工作\n\n> 溯源：goals.md §6\n\n---\n\n## 溯源索引\n\n| 本文 | goals.md |\n|---|---|\n| 一 · 它是什么 | §0.1 §0.2 §2 |\n| 二 · 能力覆盖面 | 附录 A.9 |\n| 三 · 系统全景 | §4.1 §7.1 + adr-001 |\n| 四 · 内核能力 | §5.1 §3.4 §4.4 §4.7 §7.4 + ai-native-engine.md + adr-003/004 |\n| 五 · 数据模型 | §4.5 §4.7 §3.5 |\n| 六 · 运行期 | adr-002 + §4.5 §7.1 |\n| 七 · 编辑器界面 | §5.3 |\n| 八 · 模块与模板 | §5.6 §7.1 |\n| 九 · 硬性指标 | §3.6.1 §3.6.2 + adr-002 |\n| 十 · 留口 · 十一 · 封顶 | §3.4 |\n| 十二 · 进度 | §6 |\n\n**本文与 goals.md 冲突时，以 goals.md 为准**——它是裁决依据，本文是它的投影。\n"}, {"id": "roadmap", "title": "开发计划 · 从零到闸门 F", "md": "# 开发计划 · 从零到闸门 F\n\n> **对应 goals.md v21。本文是 §6 路线的施工版**——把阶段拆成可交付的包，标出依赖、体量、\n> 验收、砍单顺序，以及每个未决项的决策截止点。\n>\n> **不含工期**（goals.md §0.5 第 1 条）。体量用相对档位：\n> **S < M < L < XL**，**只表示相对大小，不折算成天数**（goals.md §0.5 第 1 条）。\n> 唯一允许出现的时间是**技术止损时间盒**（如「Rapier spike 最多 3 天」），它是实验的退出条件。\n>\n> **顺序的总原则**：先自用 → 再验证 → 再开放。\n\n---\n\n## 零 · 关键路径\n\n```\n ADR-004 决策治理 ┈┈┈┈┈┈┈┈┈┈┈┈┈► 所有 AI 指挥任务 / ADR / 实现（横切约束，非时序前置）\n\n ADR-002 求值语义 ───────────────► 事件表运行时 ──► RTS 模板 ─────────────┐\n （纸面；唯一不可逆）                 ▲               │                  │\n                                      │               ├─► TestSpec / 证据 │\n 打包器 ──► ECS 内核 ──► Action 事务 ─┘               │                  │\n            └─► Rapier spike          ▲               │                  │\n                （不过就换库）         │               ▼                  │\n ADR-003 控制协议 ────────────────────┘       PlanContract / orchestrator   │\n （纸面；事务字段落地前走通）                         │                    │\n                                                    ▼                    │\n                                      verifier / 有界 repair / ledger     │\n                                                    │                    ▼\n                                                    └────► 动画栈档 2 ──► 第三人称动作模板 ──► 闸门 F\n```\n\n**五条硬依赖，谁都绕不开：**\n\n| # | 依赖 | 后果 |\n|---|---|---|\n| 1 | **求值语义 → 一切** | Action 层、序列化、试飞台断言全部受它约束。定错了迁移链救不回来 |\n| 2 | **打包器 → ECS / Rapier / glTF** | 没有构建步骤，这三件事第一天就撞墙 |\n| 3 | **Rapier 确定性 → 决策 29 整条线** | 不过就换物理库。**必须在闸门 A 之前验，不是最后验** |\n| 4 | **控制协议 → Action 事务 / TestSpec / M3 编排** | `baseRevision`、步骤原子性、hard oracle 与证据字段若到 M3 才定，会反向重写 M1 / M2 |\n| 5 | **决策治理 → 所有 AI 指挥工作** | 没有 `TaskContract`、决策面、挑战和证据采用边界，AI 会把用户没发现的空白静默补成架构。**G0 前 AI 不得自行宣布不可逆结论生效**——但可以推演、可以提交候选，批准权在项目所有者。**这不构成对 M0-a 的时序前置** |\n\n**三份 ADR 都是纸面工作，不依赖打包器，因此可以并行推进。**\n**ADR-002 排第一**——它是全项目唯一「定错了没有退路」的一项，也是唯一能改变项目状态的动作。\nADR-004 的 G1/G2 与它**并行**，不排在它前面：G0 约束的是 **AI 越权宣布结论**，不是禁止推演；\n而 ADR-002 的冻结本来就要由项目所有者按闸门 O 批准（[ADR-004](adr-004-evidence-governed-evolution.md) §3 的 L1 层）。\nADR-003 只需在 M1 的 Action 事务格式落地前走通。\n\n---\n\n## M0 · 地基（体量 S+S+S+S）\n\n| 包 | 体量 | 内容 |\n|---|---|---|\n| **M0-a 求值语义定稿** | S | 走通 [adr-002](adr-002-eventsheet-eval.md) 的三个手工样例 → ADR 转「已验证」→ 下游对齐后转「已冻结」。**这是当前的头号阻塞项** |\n| **M0-b 构建工具链** | S | package.json + 打包器；three 的 CDN importmap 迁进构建 |\n| **M0-c AI 控制协议推演** | S | 走通 [adr-003](adr-003-verified-agent-loop.md) 的三个手工样例；冻结前先锁定 `PlanContract`、步骤事务、TestSpec、状态机、证据与停止边界 |\n| **M0-d 决策治理准入** | S | 走通 [adr-004](adr-004-evidence-governed-evolution.md) G1–G3；关键植入遗漏全发现、越权修改为 0；建立首版治理基准集、`U-NNN` 登记和 evidence package |\n\n**验收 · 闸门 O + 治理准入 G0**：ADR-002 三个样例逐条推演并按 I11 冻结；ADR-004 三个回放达到关键遗漏召回 100%、\n越权修改 0。ADR-003/004 的具体检查表不在此冻结，按各自状态条件继续验证。\n\n**M0 的第一件事是 M0-a**，它是实现的唯一不可逆阻塞项。M0-d 的 G1/G2 与它并行建立工作契约，\n**但不作为它的前置**——否则唯一不可逆的决策会为流程让路，而流程本身还没有任何验证过的收益。\n**风险**：三份 ADR 都可能暴露歧义；只能改纸面协议，不能为了过样例预埋实现特例。\n\n---\n\n## M1 · 内核地基（体量 XL）\n\n**目标**：引擎活了——能摆东西、能撤销、能存读档、不开界面能跑。**还不好玩，这是预期内的。**\n\n| 包 | 体量 | 依赖 | 内容 |\n|---|---|---|---|\n| M1-a **ECS 封装层** | M | M0-b | `defineComponent` / `query` / 组件 schema；koota 藏在后面。**`query()` 必须按稳定 id 升序排序**——[spike-002](spike-002-ecs.md) 实测 koota 的迭代顺序在实体 id 复用后会错位，这是 [ADR-001 §6](adr-001-ecs.md) 升级路径 ① 与 [ADR-002 D1](adr-002-eventsheet-eval.md) 的执行点，**不是优化** |\n| M1-b **Action Registry + 步骤事务** | L | M0-c M1-a M1-c | id / schema / 前置条件 / 影响域 / 可逆性；`baseRevision` / `idempotencyKey` / preview / commit / abort；撤销栈 + 变更日志 + `ActionReceipt` / `StepReceipt` |\n| M1-c **序列化、revision 与 checkpoint** | M | M1-a | 版本化信封 + 迁移链 + **按块存取**；快照、命名 checkpoint 与回滚 |\n| M1-d **试飞台 + TestSpec** | M | M1-b M1-c | headless runner：加载 → Action / 输入意图轨迹 → hard 断言 → 证据片段；固定 seed 可重放 |\n| M1-e **Rapier 确定性 spike** | S | M0-b | **独立且尽早**。不过就换库。**已部分完成**（[spike-001](spike-001-rapier-determinism.md)）：同机与跨 V8 版本通过；**跨 CPU 架构未验，需第二台机器**。另发现**跨 Rapier 版本行为不同**（`U-039`） |\n| M1-f **渲染桥 + Transform + 拾取 + 空间索引** | M | M1-a | three.js 增量同步 |\n| M1-g **分块与流式加载** | L | M1-c M1-f | S1–S3 三条纪律；**这是 M1 最大的一块** |\n| M1-h **编辑器改造** | L | M1-b M1-f | 大纲 / 详情 / gizmo / 多选，全部对 ECS 通用 |\n| M1-i **最小 AI：单步指令** | S | M1-b | **验证通道形状与事务回执，不是模型能力**；重复请求不得执行两次 |\n| M1-j **确定性沙箱 J1–J3** | S | M1-b | v17 起提前到 M1（原在阶段二）。**写 JS 条件动作的人变多了** |\n\n**验收 · 闸门 A**（四条，新增事务负例）+ **闸门 B**（纸面：城市迁移演练）\n\n**砍单顺序**：gizmo / 多选 → 空间索引的 BVH（先只做网格哈希）→ **绝不砍试飞台**\n\n**原本「先做 M1-e」**（唯一可能推翻已定决策的一项，越早发现越便宜）——\n**它已在 M0 期间提前做掉大半**，只剩需要第二台机器的跨架构那一步。\n**因此 M1 的第一件事改为 M1-a**，随后 M1-c → M1-b：把 [ADR-003](adr-003-verified-agent-loop.md) 的\n实现验证（事务回滚、计划版本失效、幂等、错误通过负例）**放在 M1-b 内完成，不推到 M3**——\n硬依赖 4 已经写明，那些字段若到 M3 才定会反向重写 M1/M2。\n\n**M1-i 别推后**：接一次最小 AI，验的是「Action 层的形状对不对」，晚发现贵一个数量级。\n\n---\n\n## M2 · 事件表与 RTS 模板（体量 XL+，全程最大的一段）\n\n**这一段有掉进无正反馈黑洞的真实风险**（风险 3——原来的解药「发链接给别人」已随分发链推后）。\n**所以它内部切成四个各自有产出的小段**，每段结束时手里有个能动的东西。\n\n### M2-1 · 第一个能玩的东西（体量 M）\n\n| 包 | 体量 | 内容 |\n|---|---|---|\n| 事件表数据模型 + 逐行求值 | M | 按 M0-a 冻结的语义实现 |\n| 列表编辑器 | M | 拖拽、加规则行、挑条件动作、改参数、分组 |\n| 第一批条件动作（最小集） | S | 碰到 / 输入意图 / 定时；移动 / 生成 / 销毁 / 改属性 |\n| 物理接入 + 平台跳跃脚手架 | M | **不作交付模板**，是最快的可玩闭环 |\n\n> **产出：一个能跳、能踩到平台、能通关的东西。** 这是整个项目第一次「玩到自己做的东西」。\n\n### M2-2 · 逻辑是数据的证明（体量 L）\n\n| 包 | 体量 | 内容 |\n|---|---|---|\n| **§4.7 五个概念的数据模型定死** | M | 场景流程 · 行为单元 schema · 可持久化声明 · 数据表 · 动态集合 |\n| 五个概念的最小实现 | M | 两场景切换 · 一个带参行为单元 · 存读进度 · 一张数据表被引用 · 一个背包能增删并存档 |\n| 行为单元 + 配方库 | M | 展开即普通规则行 |\n| 约束层机制 | M | 谓词注册 + 结构化失败反馈 + 面板显示 |\n| **验证素材与证据底座** | M | TestSpec registry；输入意图轨迹、状态断言、日志与截图引用；V3 使用真实输入时不得用直接传送替代被测链路 |\n\n> **数据模型定死是这一段的核心交付**，实现可以薄。定错了撞 I11。\n\n### M2-3 · RTS 的骨架（体量 XL）\n\n| 包 | 体量 | 内容 |\n|---|---|---|\n| **群体寻路 + 局部避让** | L | 确定性；查询接口与实现分离 |\n| **视野与战争迷雾** | M | 迷雾是玩法状态，参与断言 |\n| 播放期选择与指令 | M | 点选 / 框选 / 编队 / 下指令 |\n| 播放期放置与建造 | M | 合法性校验 + 消耗资源 + 预览 |\n| 技能目标选择 | M | 点地 / 点单位 / 方向 / 范围指示器 |\n\n### M2-4 · 成品化（体量 L）\n\n| 包 | 体量 | 内容 |\n|---|---|---|\n| 皮肤包机制 + 编辑面板 + 两套皮肤 | M | |\n| 视听下限一套 | L | 音频 · 预制粒子 · 材质与光照预设 · 后处理档位 |\n| 游戏内 UI overlay + 预制件 | M | |\n| 导出自包含工程文件 | S | 本轮的终点 |\n| 教程系统机制 + 已交付能力的条目 | M | 决策 35 的载体 |\n| **RTS 模板本身** | XL | **这是内容生产，不是引擎开发——见下** |\n\n**验收 · 闸门 C**（五条）\n\n**砍单顺序**：视野迷雾的精细化（先做最粗的圆形视野）→ 内置素材库规模 → 后处理与部分预制粒子 → **绝不砍导出，也绝不砍寻路与确定性**\n\n**M2 的最大陷阱**：M2-4 的「RTS 模板」是关卡设计 + 数值平衡 + 美术，**和写引擎是两种工作**。\n它很可能比 M2-1 到 M2-3 加起来还耗时间（风险 11）。**砍范围时优先砍内容的量，不砍引擎能力。**\n\n---\n\n## M3 · AI 作者接口与验证控制循环（体量 XL）\n\n| 包 | 体量 | 依赖 | 内容 |\n|---|---|---|---|\n| M3-a **供应商适配层** | M | — | OpenAI 兼容 + 原生协议 + 本地模型；能力探测与降级。**本段第一件事** |\n| M3-b **describe + 约束接入** | M | M1-a M2-2 | 组件与事件表实现语义 LOD；约束成为 verifier 与 repair 的结构化信号 |\n| M3-c **`PlanContract` + 计划编辑器** | M | M0-c M1-b M1-c M3-b | 版本、`baseRevision`、scope、步骤依赖、Action 白名单、TestSpec 与预算；批准绑定版本，Markdown 仅为视图 |\n| M3-d **五种介入形态** | L | M3-a M3-b | 单步 → 换皮 → 多步变更集 → 生成规则行 → 内联建议 |\n| M3-e **orchestrator 状态机** | L | M1-b M1-c M1-d M3-c | 审批、权限、逐步事务、暂停 / 恢复 / 取消 / 部分接受；状态与预算在引擎侧 |\n| M3-f **三层 verifier** | L | M1-d M2-2 M3-e | V1 结构 + V2 确定性行为 + V3 体验证据；执行与验证上下文隔离；hard 判定不可被模型覆盖 |\n| M3-g **有界 repair policy** | M | M3-f | 失败签名、原因假设、最小修复、回归范围；重复失败、越界、削弱测试、缺原语或超预算必停 |\n| M3-h **`EvidenceLedger` + 运行界面** | M | M3-e M3-f | 步骤 diff、输入、seed、断言、日志、截图、provider、时间 / 费用；进度、停止、恢复、部分接受 |\n| M3-i **设置界面** | S | M3-a | 预设 + 自定义端点 + 测试连接 + 用量 / 费用可见 |\n\n**验收 · 闸门 D**（六条；D.4 含计划审批、事务恢复、独立验证、有界修复、证据重放五个子判据；\n仍含 **D.5 教程可用性** 与 **D.6 换一家模型仍可用**）\n\n**M3-a 先做**。provider 能力决定计划与 Action 的降级路径；但状态机、事务、权限和 hard 判定不能随 provider 改变。\n\n---\n\n## M3.5 · 动画栈与第三人称动作模板（体量 XL，闸门 F 的载体）\n\n| 包 | 体量 | 内容 |\n|---|---|---|\n| M3.5-a **动画状态机 + 混合** | L | 状态是玩法数据，转移复用事件表条件注册表 |\n| M3.5-b **root motion** | L | **先落地 §4.4 的两条冲突解法**：位移曲线烘焙成玩法量、归 kind |\n| M3.5-c 界面页四个 | M | 标题 / 暂停 / 背包 / 对话 / 结算 |\n| M3.5-d 五个概念补齐到可用 | M | |\n| M3.5-e **第三人称动作模板** | XL | 关卡串 + 战斗判定 + 技能道具 + 背包 + 存进度 + 锁定 |\n\n**验收 · 闸门 F**（全项目最硬的一条）\n\n**砍单顺序**：界面页数量（先做标题 + 结算）→ 关卡数量（先做 1 关跑通全流程）→ **绝不砍动画栈档 2**——它是这一段的全部意义\n\n**M3.5-b 必须在 M3.5-a 之后、M3.5-e 之前**。root motion 的两条冲突解法没落地就开始做模板，\n等于把泄漏写进内容里，返工要改已经做好的动作。\n\n---\n\n## M4 / M5 · 开放与联机\n\n**M4 开放**（闸门 E + G）：分享 + 账号 + 移动端 + 新手裁剪视图 + 第三个模板（验通用性）。\n**M5 联机**（决策 29 的兑现）：lockstep 指令同步 + 断线重连 + 观战。\n\n**这两段都不阻塞闸门 F，也不被前面任何一段依赖。**\n\n---\n\n## 一 · 决策截止点\n\n**每个未决项都有一个「再不定就要返工」的时刻。** 按里程碑排：\n\n| 里程碑 | 必须定的 |\n|---|---|\n| **M0 之前** | 决策治理 G1/G2（ADR-004，所有 AI 指挥任务前）· 事件表求值语义（ADR-002）· AI 控制协议三个样例（ADR-003；最迟在 M1-b 字段冻结前完成） |\n| **M1 内** | ECS 库选型（spike）· 组件 schema 定义方式 · `baseRevision` / 幂等 / 步骤原子性 / checkpoint 物理格式 · 块的大小与加载策略 · **Rapier 跨平台确定性** |\n| **M2-2 之前** | 场景切换的状态语义 · 可持久化声明粒度 · 数据表引用语法与作用域 · 动态集合持久化粒度 · 内容包最小字段集 · TestSpec / 输入轨迹 / 证据字段 |\n| **M2-3 内** | 寻路实现选型 · 视野迷雾粒度 · 输入意图第一批清单 · 条件动作由谁实现 |\n| **M2-4 内** | 数值表达力够不够（**真写一遍伤害公式**）· 1000 实体可达性实测 · 视听资源来源 · 依赖与素材许可 · 配方与教程条目清单 · 视觉插槽粒度 |\n| **M3 内** | 能力探测与降级 · planner / executor / verifier 权限矩阵 · 时间 / Action / 修复 / 费用预算 · hard / soft oracle 边界 · 错误通过率负例集 · AI 输出安全边界 · 本地最小度量 |\n| **M3.5 之前** | 动画状态机的数据形态 · root motion 烘焙时机 · 界面页实现形态 |\n| **M4 之前** | 后端最小形态 · 快照体积上限 · OAuth 选型 |\n\n---\n\n## 二 · 两类工作要分开排\n\n| | 引擎开发 | 内容生产 |\n|---|---|---|\n| 是什么 | 内核、编辑器、AI 层 | 模板关卡、皮肤、配方、教程条目、素材库 |\n| 特点 | 后补要重构 | **后补只是排期** |\n| 出现在 | M1、M2-1~3、M3、M3.5-a/b | M2-4、M3.5-e，以及每个能力的教程条目 |\n| 砍的时候 | **最后砍** | **先砍量**（一套皮肤而不是两套、3 个配方而不是 8 个） |\n\n**风险 11 的执行点就在这张表**：M2-4 和 M3.5-e 加起来可能比全部引擎工作还大。\n**它们的进度要单独跟踪，不要和引擎进度混在一个数字里。**\n\n---\n\n## 三 · 每个里程碑的「第一件事」\n\n| 里程碑 | 先做这个 | 为什么 |\n|---|---|---|\n| M0 | **求值语义（M0-a）；治理 G1/G2 并行** | 唯一不可逆的一项排第一。治理并行防 AI 静默补义，但不前置——它已经推迟 M0-a 四个版本了 |\n| M1 | **Rapier 确定性 spike** | 唯一可能推翻已定决策的一项 |\n| M2 | 平台跳跃脚手架 | 最快拿到「玩到自己做的东西」，对抗风险 3 |\n| M3 | 供应商适配层 | 它决定其余部分能不能在弱模型上跑通 |\n| M3.5 | **§4.4 的两条 root motion 冲突解法** | 不先落地就会把泄漏写进内容 |\n\n---\n\n## 四 · 什么时候该停下来重估\n\n| 信号 | 动作 |\n|---|---|\n| Rapier 确定性 spike 不过 | 换物理库。**不放宽决策 29** |\n| ECS 库 spike 的确定性测试不过 | 换库或自研（预算上限 3 周，adr-001 §6） |\n| 1000 实体在 M2-4 实测不达标 | 先优化；仍不达标才考虑模拟细节分级（现为留口） |\n| RTS 模板的逻辑写不出来、必须硬编码 JS | **加受限原语，不退回节点图**（§7.2） |\n| 闸门 D.5 教程可用性连续两轮不过 | 走退役条件 **P-2**：重估决策 12 的取消 |\n| 闸门 F 通过后开放阶段迟迟无法开工 | 走退役条件 **P-1**：承认它是个人引擎，资源转回引擎能力 |\n| 新证据反驳当前方案，或出现未登记的高风险假设 | 发 `DecisionChallenge`；只暂停相关不可逆提交，用 challenger 影子验证，不静默改 champion |\n\n**闸门不过怎么办：砍范围，不放宽判据。** 一旦允许「先放过，下阶段补」，闸门就退化成装饰。\n\n---\n\n## 相关文档\n\n- [goals.md](goals.md) — **上级文档**，方向与闸门以它为准\n- [architecture-outline.md](architecture-outline.md) — 决策后的能力清单\n- [adr-002-eventsheet-eval.md](adr-002-eventsheet-eval.md) — M0-a 的交付物\n- [adr-003-verified-agent-loop.md](adr-003-verified-agent-loop.md) — M0-c 的协议推演与 M1/M3 的控制语义\n- [adr-004-evidence-governed-evolution.md](adr-004-evidence-governed-evolution.md) — M0-d 的治理回放与所有后续 AI 任务的决策发现、证据采用边界\n- [adr-001-ecs.md](adr-001-ecs.md) — M1-a 的选型依据\n"}, {"id": "goals", "title": "产品设计大纲 · goals", "md": "# 产品设计大纲\n\n> **v6** · 2026-08-08 · 状态：方向已定，实施未开始\n> v6 确立：**模型接入是一等功能**（决策 21）——供应商无关、用户可填自己的模型、\n> 能力不足自动降级；引擎不得依赖任何单一供应商的独有能力（**不变量 I10**）。\n> **v7** · 2026-08-08 · **用户心流成为正文**（§1.3）：首次心流八步 + 主循环 + 回访 + remix 回流；\n> **首次路径零配置**（决策 22）。\n> **v8** · 2026-08-08 · **成品感下限**（决策 23）：原「明确不做」清单拆成\n> **§3.4 能力天花板（做，但封顶）** 与 **§3.5 范围外（真不做）**——\n> 音频、动画过渡、特效、材质与光照、后处理、移动端可玩、皮肤包编辑**全部改判为要做**。\n> **v9** · 2026-08-08 · 补齐四处空白（**§3.6 工程底线**）：性能预算、发布快照的向前兼容\n> （**不变量 I11**）、本地数据的脆弱性、用户内容的安全面。\n> **v10** · 2026-08-08 · **保住移植退路**（决策 24 + **不变量 I12**）：输入意图映射、\n> 宿主能力抽象、播放期分包；并把**事件表求值语义**列为定下即冻结的接口。\n> **v11** · 2026-08-08 · **目标水位抬到「完整作品」**（决策 25）：总判据换成一款可上架的完整游戏；\n> 新增三个架构概念（**场景与流程 / 可复用行为单元 / 运行期状态存取**，§4.7）；\n> 防膨胀手段改为**架构留口 + 分批实现**（决策 26），不再靠砍能力。\n> **v12** · 2026-08-08 · **灰盒 MVP 压测**（附录 A.9）：Dota / 星际 / 红警 / 艾尔登 / 塞尔达\n> 的核心玩法循环判定为**可做**，据此补进内核三项——**播放期选择与指令、播放期放置与建造、\n> 动画事件**；战争迷雾进 RTS 模块；数值表达力列入未决项。\n> **v13** · 2026-08-08 · **内容生态是长期目标**（决策 27）：§3.5 拆成\n> **本轮不做但架构留口**与**真封顶**；市场 / 社区 / 账号 / 云工程从「不做」移入前者；\n> 模板 · 皮肤 · 配方 · 素材 · 模块**统一为「内容包」**。\n> **v14** · 2026-08-08 · **发布即注册**（决 28）；**确定性升为硬要求**（决 29）；**分块与流式加载现在就设计**（决 30）；完整作品模板定为小型 roguelite；新增阶段五 · 联机。\n> **v15** · 2026-08-08 · 结构精简：能力表三合一、配方并入行为单元、场景与块定边界、映射表模式点破、依据归位。**决策与判据一条未改。**；修掉两处遗留硬错误（约束层阶段归属、视听只读与断言范围）。\n> **v16** · 2026-08-08 · **收口不可逆项与三处缺口**：**事件表求值语义前置到阶段零定稿**\n> （决 31 → [adr-002](adr-002-eventsheet-eval.md)）——它是全项目唯一「定错了没有退路」的一项，\n> 却一直排在最后；**数据表升为第四个架构概念**（决 32，§4.7）；**最小关节进本轮**（决 33）；\n> **内核例外计数闸门**（决 34）；补上**确定性沙箱**（决 29 的执行漏洞，§7.1）与**决策 4 的依据**（[A.11](#a11-决策-4只做-3d-的依据补于-v16)）；\n> A.9 增补**玩法契合度**——动画栈封顶使「移动本身即玩法」的一类落在弱轴，**这是取舍，不是缺陷，但要写出来**。\n>\n> ---\n>\n> ## **v17** · 2026-08-08 · **重定方向：从「普通人的引擎」改为「AI 原生的开发者引擎」**\n>\n> 这一版是**推翻式修订**，起因是把八款目标游戏摆上桌后，原来的前提站不住了。\n>\n> **推翻**：决 2、19（用户画像 → **有经验的游戏研发人员**，且**画像不再作为设计约束**，决 35）；\n> 决 12（**双模式取消**，只留全集）。\n> **修订**：决 14 / 23 / 28（**分发链整体推后**，移动端出局，性能预算改桌面）；\n> 决 15（**模板集换成 RTS/MOBA + 第三人称动作两个**，由八款目标游戏倒推）；\n> 决 25（水位不变，**验收人改为项目所有者**）；决 29（理由从「遥远的阶段五」改为「**八款里五款是联机游戏**」，\n> 它现在是被证成的，不是预付的）；决 30（同屏完整模拟实体 **500 → 1000**）。\n> **新增**：决 35（门槛由 **AI + 内置教程**承担）、决 36（**动画栈档 2**：状态机 + 混合 + root motion）、\n> 决 37（**运行期动态集合**，§4.7 第五个概念）、决 38（群体寻路与视野**提回内核**）、\n> 决 39（**范围纪律改判据源**：从「两个模板」改为「两款目标游戏且分属不同簇」）。\n>\n> **护城河换了位置**：原文押 I2 + I3（普通人读得懂），现在押 **I1 + I3**——\n> **AI 与人共用同一条编辑通道、产出同一种材料**。「普通人」从前提降级为**目标**。\n>\n> ---\n>\n> ## **v18** · 2026-08-08 · **AI 自主组装（决 40）**\n>\n> **改的是一处措辞错误，加的是一条分档留口。**\n>\n> 原文把「聊天框一句话生成整个游戏」列为方向性封顶，理由是「不可控、与 I3 冲突」。\n> **那把「规模」当成了封顶对象，而该封顶的是「形态」**——\n> 只要产出仍是 Action 序列、仍落成能看见能手改的规则行与物体，**任务多大都不违反 I3**。\n> 这与 v8 犯过的错误同源（附录 A.8：该管的是「做到哪儿为止」，不是「做不做」）。\n>\n> **决 40** 把 AI 的参与度分三档：档 1 多步变更集 + 自己试玩（本轮做）、\n> 档 2 **受监督的自主循环**（留口）、档 3 **AI 造零件**（留口），并写下四条留口条件 A1–A4。\n> 同时澄清 §5.5「不做 agent 框架」指的是**不引入通用框架作依赖**，不是禁止自主循环。\n>\n> ---\n>\n> ## **v19** · 2026-08-08 · **文档治理**（决 41 + 三项机制）\n>\n> **一次治理迭代，不改产品方向。** 起因是一轮审计发现：同一类产品事实被同时写进\n> 裁决文档、ADR、能力投影、路线图与 README，而校验器只查链接与编号，**不查事实是否一致**。\n>\n> **修掉一处决策冲突**：[adr-001](adr-001-ecs.md) §6 原本允许「接受仅编辑期确定性」，\n> 与**决策 29「不允许降级」正面冲突**——工程师会从两份文档读出两套失败处理策略。\n> 已改为四步升级路径，**末端是「停止实施、显式重审决策 29」，而不是静默降级**。\n>\n> **决 41**：第八款目标游戏由泛化的「第三人称射击」改为具名的**《战争机器》**。\n> 原文一边称「七款」一边列 8 项、还把 TPS 算进「五款联机」，**决策 39 的判据源不可判定**。\n>\n> **三项机制**：**§0.7 ADR 状态机**（五档 + 「上游已变，待重审」，下游不得超前于 ADR 状态）、\n> **§3.7 硬事实登记表**（校验器的解析目标，仍在 goals.md 内，不新增真源）、\n> **§0.5 第 1 条精确化**（区分交付承诺与技术止损时间盒）。\n>\n> ---\n>\n> ## **v20** · 2026-08-08 · **验证驱动的 AI 控制循环（修订决 40）**\n>\n> Roblox Planning Mode 已把可编辑计划、批准门、构建、试玩、checkpoint 与自动修复做成编辑器内基线；\n> 同时它公开承认试玩代理会错误通过、可观测性有限、没有实时反射。**“能循环”已经不够，\n> “谁有权判定成功、失败后怎样停止”才是 Clay 要解决的问题。**\n>\n> **修订决 40**：档 2 从「留口」改为**本轮做**，并升级为\n> **计划契约 → Action 事务 → 三层验证 → 证据提交 → 有界修复**。\n> 计划、运行状态、预算、权限、checkpoint 与 hard oracle 都由引擎控制；模型只提出计划、Action 与诊断，\n> 不得自行提交失败事务、修改 hard 测试或宣布通过。完整协议见\n> [ADR-003](adr-003-verified-agent-loop.md)。档 3「AI 造零件」仍留口，边界不变。\n>\n> ---\n>\n> ## **v21** · 2026-08-08 · **证据治理的决策发现与演化（决 42）**\n>\n> 这一版解决的不是“AI 会不会按计划执行”，而是更早的一步：**用户和 AI 都没有意识到某个关键决策时，\n> 项目怎样主动暴露它；当前最优解和发现机制本身又怎样在新证据下进化。**\n>\n> **决 42**：每个非平凡任务先建立 `TaskContract`，扫描十二面 `DecisionCoverage` 与负空间，\n> 将事实 / 假设 / 偏好 / 未知分开；高风险未知进入 §9 并触发 `DecisionChallenge`，只暂停相关不可逆提交。\n> 当前方案与治理机制都作为有版本的 champion，challenger 必须在同一 hard criteria、历史漏判集和新反例上证明\n> 不退化，带迁移与回退证据后才能取代。AI 可挑战任何结论，但不能静默改不变量、hard oracle、权限或历史。\n> 完整协议见 [ADR-004](adr-004-evidence-governed-evolution.md)。\n>\n> 本文是后续所有技术决策的裁决依据——任何与本文冲突的提议，要么改提议，要么先改本文。\n> 论证与证据集中在[附录 A](#附录-a--关键决策的依据)，正文只写结论。\n\n---\n\n## 零 · 冷启动\n\n只读这一节就能判断一个提议该不该进来。\n\n### 0.1 一句话定义\n\n> **一个 AI 与人共用同一条编辑通道的通用 3D 网页游戏引擎编辑器：\n> 游戏逻辑是数据，AI 和鼠标是同一个命令层的两个前端，产出的是同一种材料。**\n\n> **v17 换掉了原来那句**（「一个普通人也能上手的……界面对人友好，底层保持技术性，\n> AI 是把两者连起来的那座桥」）。原句把 AI 定位成**桥**——连接普通人与技术底层的中间物；\n> 而 AI 现在是**主结构**，不是桥。门槛由 AI 与教程承担（决策 35），\n> 但那是这条定义的**推论**，不是它本身。\n\n### 0.2 十二条不变量\n\n违反其中任何一条的提议，直接驳回；真要破，必须先改本节并写明理由。\n**v17 改了三条（I2 / I4 / I8），理由在表下。**\n\n| # | 不变量 | 破了会怎样 |\n|---|---|---|\n| **I1** | 编辑期的一切变更**只能**经由 Action 层 | 撤销、回放、AI 校验全部失效 |\n| **I2** | 游戏逻辑是**数据**（事件表），不是代码，且**可读、可逐行 diff、可被约束层校验** | AI 产出变成黑盒；逐行 diff、局部重试、可审计全部失效 |\n| **I3** | AI 的产出与人手做的是**同一种材料**，用户能接手继续改 | 同上。**与 I1 并列为护城河** |\n| **I4** | 门槛由 **AI 与内置教程**承担，**不靠削能力、不靠做浅底层**（决策 35） | 要么用户跨不过去，要么引擎能力被永久封顶 |\n| **I5** | 模块之间只通过**显式契约**通信（组件 / Action / 条件动作） | 模块不可替换，「通用内核」名存实亡 |\n| **I6** | 内核只放**至少两款目标游戏需要、且分属不同簇**的东西（决策 39） | 内核膨胀，最可能的死法 |\n| **I7** | 任何时候都能**不开界面**跑完整场景并断言结果 | 迭代成本失控 |\n| **I8** | 能力面是 registry 的**视图**，不是数据分叉：任何裁剪过的界面都共享**同一份数据、同一套 Action、同一个撤销栈** | 一旦分叉就是两个编辑器，维护翻倍 |\n| **I9** | 事件表与玩法组件**不得引用具体美术资源**，只引用语义名 | 玩法与美术焊死，「一种玩法多种风格」不成立 |\n| **I10** | 引擎**不得依赖任何单一供应商的独有能力**；能力不足的模型必须能降级运行 | 「接入各种模型」变成空话，用户被锁死在一家 |\n| **I11** | **已发布的链接必须永远能打开**：快照自带版本、引擎保留迁移链、标识符只增不改 | 一次重命名就把所有人已发布的作品变成砖 |\n| **I12** | 事件表**不得引用具体输入设备与宿主 API**，只引用**输入意图**（跳跃 / 确认 / 移动） | 平台与设备被写进作品；移植时要用户回去改自己的规则 |\n\n**v17 为什么改这三条**：\n\n| 原文 | 改成 | 理由 |\n|---|---|---|\n| I2「**普通人读得懂**」 | 「**可读、可逐行 diff、可被约束层校验**」 | 「普通人读得懂」曾是护城河的一半，现在护城河是 I1 + I3。**但「逻辑是数据」这件事一条没松**——它现在的理由更硬：逻辑一旦变成代码，AI 的产出就无法走 Action 层、无法逐行 diff、无法局部重试，**I1 直接失效**。见 [A.12](#a12-决策-35为什么门槛可以交给-ai-与教程) |\n| I4「界面对普通人友好，底层不因此变浅」 | 「门槛由 **AI 与内置教程**承担」 | 原文把「友好」寄托在界面简化上，代价是双模式与术语层两套机制。**决策 35 换了承担者**：门槛交给 AI 与教程，界面回到一套全集 |\n| I8「简易模式与专业模式共享同一份数据」 | 「能力面是 registry 的**视图**，不是数据分叉」 | 双模式已由决策 12 取消。**但这条不变量要留着**——它管的是「任何裁剪界面都不许分叉数据」，日后真要做面向新手的裁剪视图，这条仍然生效 |\n\n### 0.3 术语\n\n**v17 起没有术语层了**（决策 12 取消双模式）。界面直接用工程术语：实体、组件、Action、约束、事件表、规则行、配方、皮肤包、kind、模板、播放模式。\n目标用户是有经验的游戏研发人员（决策 19′），这些词是他们的母语，**翻译一遍反而增加理解成本**。\n\ni18n 仍然保留，但它现在只做**语言翻译**，不再兼任「内部词 → 界面词」的映射层。\n这是决策 12 取消后**顺带省下的一整套机制**。\n\n### 0.4 已定 / 未定 / 不做\n\n- **已定**：[§2 决策表](#二--决策表)的 42 项 + 上面 12 条不变量。可以被新证据挑战，但不得静默改写。\n- **未定**：[§9 未决项](#九--未决项)。每项都有 ID、风险路由、决策截止点与证据要求。\n- **不做**：[§3.4](#34-能力与边界)的「封顶」列。提之前先看那张表。\n\n### 0.5 编辑规则\n\n1. **不写发布日期、总工期、人力承诺。** 允许写**相对体量**（S/M/L/XL，不折算成天数）与**技术止损时间盒**（「spike 最多 3 天」——它是实验的退出条件，不是交付承诺，且必须标明是止损）。**v19 精确化**：原文是「不写工期、预算、人力」，与 ADR 需要时间盒的现实冲突\n2. **决策表只增不改。** 推翻旧决策要写明推翻了什么、为什么，不要静默改写。\n3. **判据必须可判定。** 「达到 Unity 水准」这类说法一律换掉。\n4. **单点技术选型另开 ADR**（`design/adr-NNN-*.md`），本文只引用结论。\n5. **每次结构性改动更新版本号**并在开头说明这一版确立了什么。\n6. **非平凡任务先交决策覆盖与证据契约。** 按 [ADR-004](adr-004-evidence-governed-evolution.md) 区分事实、假设与未知；\n   决策面空白不得靠 AI 自行补义，高风险项先挑战或实验，低风险项带回退推进。\n\n### 0.6 版本沿革\n\n| 版本 | 确立了什么 |\n|---|---|\n| v1 | 从「城建游戏」转向「通用引擎」；ECS + Action 层 + 播放沙箱；模块化契约与试飞台 |\n| v2 | 面向普通人；逻辑层由 JS 换成可视化节点图；AI 升为**产品本身**；入口改为**模板** |\n| v3 | 简易 / 专业**双模式**；最小 AI 提前到阶段一末；脚本化试玩提前到阶段二 |\n| v4 | 据竞品调研：逻辑层改为**事件表**（决 13）；**分享 + remix 进入本轮**（决 14）；通用性改由**三个小模板**证明、平台跳跃排第一（决 15）；受限 3D（决 16）；素材库与导入并重（决 17）；**表达力不砍、门槛靠配方降**（决 18）；用户画像（决 19）；物理上提进内核、寻路砍出去 |\n| v5 | **呈现与玩法分离**：皮肤包成为内核一等公民（决 20）+ **不变量 I9**；契约新增 `kinds` / `skins`；闸门 C 新增「换皮不变」判据；roadTypes 主题机制认定为原型并将归并 |\n| v6 | **模型接入是一等功能**（决 21）+ **不变量 I10**：供应商无关适配层、能力契约与降级矩阵、用量与隐私透明、本地模型支持；闸门 D 新增「换一家模型仍可用」判据 |\n| v7 | **用户心流写进正文**（§1.3）：首次八步 + 主循环 + 回访 + remix 回流 + 步骤与闸门的映射；**首次路径零配置**（决 22）——AI 模型设置改为按需触发，不在首次路径上 |\n| v8 | **成品感下限**（决 23）。「明确不做」拆成**能力天花板**（§3.4，做但封顶）与**范围外**（§3.5，真不做）；音频 / 动画过渡 / 特效 / 材质与光照 / 后处理 / 移动端可玩 / 皮肤包编辑**由「不做」改判为「做，有封顶」**；事件表放开多层子事件与参数位算术；闸门 C 新增「手机上能玩且有声音」 |\n| v9 | 补齐四处工程空白（**§3.6 工程底线**）：性能预算（首包 3MB / 冷启动 5s / 30fps / 500 实体）、**发布快照的向前兼容（I11）**、本地数据脆弱性（自动保存 + 导出工程文件）、用户内容安全面（overlay 禁 `innerHTML`）；新增风险 11–12 与**项目级退役条件** |\n| **v10** | **保住移植退路**（决 24 + **I12**）：播放期分包、**输入意图映射**（事件表写「跳跃」不写「空格」，设备绑定是一张可换的表）、宿主能力抽象；明确「换实现作品留得下，换求值语义留不下」，**事件表求值语义定下即按 I11 冻结** |\n| **v11** | **目标水位抬到「完整作品」**（决 25）：总判据换成一款可上架的完整游戏（3 关 / 存档 / 技能 / 30 分钟）；新增**场景与流程 · 可复用行为单元 · 运行期状态存取**三个架构概念（§4.7）；**运行时存档由「不做」改判为做**；真函数结案为**要做**；防膨胀手段改为**架构留口 + 分批实现**（决 26）；模板集加**完整作品模板**；新增**闸门 F** |\n| **v12** | **灰盒 MVP 压测**（附录 A.9）：区分「成品判定」与「核心玩法循环判定」，后者下 Dota / 星际 / 红警 / 艾尔登 / 塞尔达**五款可做**、CS 只有单人；据此补进内核**播放期选择与指令 · 播放期放置与建造 · 动画事件**，战争迷雾进 RTS 模块，数值表达力入未决项 |\n| v13 | **内容生态是长期目标**（决 27）：§3.5 拆成**本轮不做但架构留口**与**真封顶**；市场 / 社区 / 账号 / 云工程移入前者；模板 · 皮肤 · 配方 · 素材 · 模块**统一为「内容包」** |\n| **v14** | 据四问定案：**发布即需注册**（决 28，修订决 14 / 22——创作七步仍无账号）；**确定性升为硬要求**（决 29，联机是闸门 F 之后的下一个大方向，先做 lockstep）；**现在就设计分块与流式加载**（决 30，S1–S3 三条纪律）；完整作品模板定为**小型 roguelite**；新增**阶段五 · 联机**与风险 13–16 |\n| **v15** | **一次结构精简**（不改任何决策）：三张能力表合成**一张按主题分组 + 状态列**；**配方并入行为单元**（配方 = 行为单元的预设）；补写**场景与块的关系**；点破「可替换的东西都是一张映射表」；三种状态固化并成一表；依据归入附录（新增 A.10）；修顺序、清 stale、删重复申明；**并修掉两处一直挂着没改的硬错误**——约束层的机制归到阶段二（闸门 C.6 依赖它）、补上「视听层只读 + 断言范围限定在玩法状态」 |\n| **v16** | **收口不可逆项与三处缺口**：求值语义**前置到阶段零**（决 31 + **ADR-002**）——它是唯一不可逆的一项，却一直排在最后；**数据表**成为 §4.7 第四个概念（决 32）；**最小关节**（固定 / 铰链）进本轮（决 33）；**内核例外计数闸门 ≤ 3**（决 34）；补**确定性沙箱**（决 29 的执行漏洞，§7.1 禁止项 + 风险 17）与**决策 4 的依据**（A.11）；A.9 增补**玩法契合度**与三款补测 |\n| **v17** | **重定方向**（推翻式修订，起因：八款目标游戏摆上桌后原前提站不住）。用户画像 → **有经验的游戏研发人员**且**不作为设计约束**（决 35，推翻决 2、19）；**取消双模式与术语层**（推翻决 12）；**分发链整体推后**（修订决 14/23/28），移动端出局，性能预算改桌面；**模板集换成 RTS/MOBA + 第三人称动作**（修订决 15）；**动画栈开到档 2**（决 36）；**运行期动态集合**（决 37）；**群体寻路与视野提回内核**（决 38）；**范围纪律改判据源**（决 39）；护城河从 I2+I3 换成 **I1+I3**；改 I2 / I4 / I8 三条不变量 |\n| **v18** | **AI 自主组装**（决 40）：封顶对象从**规模**改为**形态**——「一句话生成整个游戏」不再封顶，「产出不可寻址不可手改的黑盒结果」才是；AI 参与度分三档（多步变更集 / 受监督的自主循环 / AI 造零件），后两档留口 + 条件 A1–A4；澄清「不做 agent 框架」的所指；新增风险 20 |\n| **v19** | **文档治理**（不改产品方向）：修 [adr-001](adr-001-ecs.md) 与**决策 29 的正面冲突**（确定性不允许静默降级，改为四步升级路径）；**决 41** 第八款目标游戏具名为《战争机器》，修掉「七款 vs 8 项」使决策 39 判据源恢复可判定；新增 **§0.7 ADR 状态机**、**§3.7 硬事实登记表**；**§0.5 第 1 条精确化**（交付承诺 vs 技术止损时间盒）；清理 v17/v18 残留投影（沿革顺序、术语层、专业模式、README 版本号）;校验器加四类检查 |\n| **v20** | **验证驱动的 AI 控制循环**（修订决 40）：档 2 从留口改为本轮做；新增 `PlanContract`、Action 步骤事务、三层验证、执行/验证上下文隔离、`EvidenceLedger` 与有界修复；协议由 [ADR-003](adr-003-verified-agent-loop.md) 承载，闸门 D.4 改为可判定的五项证据要求 |\n| **v21** | **证据治理的决策发现与演化**（决 42）：新增 `TaskContract`、十二面 `DecisionCoverage`、结构化不确定项、`DecisionChallenge`、证据追踪与 champion/challenger；方案和治理机制都可被更强证据取代，但 L0 意图、hard oracle、权限和历史不得由 AI 静默修改；协议由 [ADR-004](adr-004-evidence-governed-evolution.md) 承载 |\n\n### 0.7 ADR 状态机（v19）\n\n**每份 ADR 的状态必须是下面五档之一，且每次转换都要有一个可核验条件。**\n\n```\n草案 → 倾向已定 → 已验证 → 已冻结 → 已取代\n                ↘  上游已变，待重审  ↙\n```\n\n| 状态 | 含义 | 转入这一档的条件 |\n|---|---|---|\n| **草案** | 还在收集事实 | — |\n| **倾向已定** | 方案选好了，验证未做 | 候选已淘汰到唯一，理由写明 |\n| **已验证** | spike / 样例推演跑通 | **ADR 自己写明的那个判据通过** |\n| **已冻结** | 按 **I11** 对待，此后只许改实现不许改语义 | 已验证 + 下游全部对齐 |\n| **已取代** | 被新 ADR 顶替 | 新 ADR 编号写在本 ADR 头部 |\n| **上游已变，待重审** | goals.md 改动使本 ADR 的前提或结论失效 | 推翻决策时由 §7.1 第 5 步的全仓扫描发现 |\n\n**第六档是 v19 补的**。ADR-001 曾长期处在这个状态却无处标记：它整体仍有效，\n但退役条件被决策 29 作废、上游引用全部指向旧坐标系，而「已定」和「已取代」两档都不对。\n\n**下游不得超前于 ADR 的状态。** ADR 写「倾向已定」时，\n`architecture-outline.md` 不许写「已冻结」——这一条由 `check-docs.py` 校验。\n\n\n---\n\n## 一 · 产品定义\n\n### 1.1 用户是谁\n\n> **有经验的游戏研发人员。**（决策 19′，v17 推翻原「不写代码的普通人」）\n\n懂关卡设计、数值、状态机、碰撞、帧；用过至少一个商业引擎；**看得懂也写得出代码**。\n他们要的不是「更简单的引擎」，是**一条 AI 能真正接手的编辑通道**。\n\n#### 但画像不是设计约束（决策 35）\n\n> **不要用画像去反推该做什么、不该做什么。**\n\n这是 v17 最重要的一句话，因为**原文档正是这么做的**：因为用户是普通人，所以要双模式、要术语层、\n要削表达力、要限制概念数量——**四条约束全部由画像推导而来，而画像是全文最容易变的一条假设**。\n\n新的分工是：\n\n| 承担者 | 承担什么 |\n|---|---|\n| **内置 AI**（决策 8、21） | 「我不知道怎么做」——一句话变成可预览、可撤销、可手改的 Action |\n| **内置教程**（决策 35，v17 新增） | 「我不知道有这个东西」——按能力组织的可交互教程，就在编辑器里，不是外链文档 |\n| **模板 + 配方**（决策 9、18） | 「我不想从零开始」 |\n| **约束层**（§5.1） | 「我做错了但不知道错在哪」 |\n\n**四条合起来替代了原来的「把界面做浅」。** 于是：\n\n- 能力面回到**一套全集**，没有简易/专业之分（决策 12 取消）\n- 表达力的封顶**只由技术理由决定**（可校验、可 diff、确定性），不再由「读得懂」决定\n- 概念数量**不设上限**，但**每加一个概念，必须同时给出它的教程条目或配方**（§1.4）\n\n**门槛没有消失，只是换了承担者。** 论证见 [A.12](#a12-决策-35为什么门槛可以交给-ai-与教程)。\n\n### 1.2 用户拿到的是什么\n\n```\n模板   = 世界状态 + 事件表 + 资产引用 + 皮肤包 + 依赖的模块声明\n```\n\n三条推论：\n\n1. **模板是普通工程，不是特殊格式。** 用户改完可另存为自己的作品，也可把作品变成模板。\n2. **模板由模块提供**（契约的 `templates` 字段）。\n3. **模板必须能被 AI 读懂**——它是 AI 理解「这个游戏在做什么」的入口。\n\n在模板之上，用户手里有四种可改的东西，**全部是同一种材料**：\n\n| 改什么 | 形态 |\n|---|---|\n| 摆什么 | 物体与属性 |\n| 玩法规则 | **事件表**，可从**配方**改起，也可直接写规则行（决策 13、18） |\n| 复用与数值 | **行为单元 + 数据表**（§4.7） |\n| 让 AI 改 | 一句话 → 若干条 Action，可预览可撤销 |\n| 长什么样 | **换皮肤包**（决策 20） |\n\n（v17 删掉了原来的「门槛」列——决策 35 之后，门槛由 AI 与教程承担，不再是每项能力自带的属性。）\n\n### 1.3 用户心流（产品的真正判据）\n\n> **一图版**：[overview.svg](../diagrams/overview.svg) 第 4 图 · 用户流程\n\n**心流有两条**（首次与回访），**中间有一个循环**，**结尾有一条回流**。\n不在这张图上的功能，往后排——这比「至少两个模板都需要吗」更贴近产品判断。\n\n#### A · 首次心流：从打开到第一次被人玩\n\n| # | 步骤 | 用户看到什么 | 为什么在这个位置 |\n|---|---|---|---|\n| 1 | **打开** | **模板库**，几个能直接玩的东西。不是空场景，不是输入框，**不是设置页** | 决策 9。**空白页对谁都是浪费时间**——理由不再依赖画像 |\n| 2 | **选一个，先玩** | 点进去直接**试玩**一局 | 先建立「我要做的是这种东西」的目标感。没玩过就开始改，等于闭着眼睛改 |\n| 3 | **改一个数** | 改敌人血量 / 跳跃高度 → 再试玩 → **看到差别** | **第一次正反馈**，必须发生在前十分钟 |\n| 4 | **改玩法** | 打开事件表，从**配方**入手：改一半、加一条规则行 | 决策 13、18。配方让这一步是「改」，不是「学」 |\n| 5 | **让 AI 帮忙** | 「加一种会飞的敌人」→ 看 AI 给出的计划与验收条件 → 批准 → 逐步执行；小改动仍可直接预览变更集 → **自己再手改一行** | 决策 8、40。**I3 在这一刻被用户亲身验证**；v20 起复杂任务先过计划批准门，简单任务不被强迫走长流程 |\n| 6 | **换风格 / 调视听** | 换整套皮肤；调材质与光照预设、后处理档位、配上音效 | 决策 20、23。**玩法定了之后才谈表达**——美术是对已定玩法的表达，不是它的前提 |\n| 7 | **检查与打磨** | 看每步 diff、约束、headless 断言、输入轨迹与截图证据；失败时审阅修复假设，随时停止或回到任一通过的 checkpoint | 「游戏整合」不是听 AI 宣布完成，而是确认 hard oracle 真通过；证据和恢复点让错误成本可控（决策 40 的 v20 修订） |\n| 8 | **导出** | 一个按钮 → **自包含工程文件**，自己收着或发给别人 | **v17 修订**：分享链接与账号整体推后（决 14 / 28）。本轮的终点是导出，不是发布 |\n\n> **v17 对这张表的修订**：\n> 第 1 步的理由从「普通人怕的不是复杂，是不知道从哪下手」改为「**空白页对谁都是浪费时间**」——\n> 决策 9 的结论不变，理由不再依赖画像。\n> 第 7 步删掉「在手机上试一次」（移动端本轮出局）。\n> 第 8 步从「发布 + 注册」改为「导出工程文件」。\n> **新增一条贯穿始终的旁路**：任何一步都能唤出**内置教程**（决策 35），\n> 它不挡在路上，但永远在手边——这是「模板优先，空白页有罪」与「教程」的正确关系，\n> 原文档否掉的是**「空场景 + 教程」作为入口**，不是教程本身。\n\n**关于第 6 步的位置**：换皮仍然是**成本最低、成就感最高**的一步，但它排在玩法之后——\n**先知道这游戏是什么，再决定它长什么样**，这也是真实制作的顺序。\n\n两条推论：\n\n- **第 3 步的分量因此更重**：第一次正反馈只能靠「改一个数 → 看到差别」，\n  不能指望换皮来兜底。这一步的手感要打磨到位\n- 换皮落在**导出前一步**，天然成为「让它成为我的作品」的收尾动作\n\n#### B · 主循环（第 3–7 步真正的形状）\n\n制作不是线性的。上面 3–7 步实际是一个循环，**每一圈都要短**：\n\n```\n        ┌───────────────────────────────┐\n        ↓                               │\n   改点东西  →  试玩  →  看到差别 / 看到问题\n   （物体 / 规则 / 让 AI 改 / 风格）      │\n        ↑                               │\n        └───────── 不满意就撤销 ─────────┘\n```\n\n三条支撑它的机制，全部已在计划里：**播放沙箱**（退出即回滚，试玩不污染工程）、\n**任何操作都能撤销**（含 AI 的）、**约束层当场说人话**（不用等到试玩才发现错）。\n\n**循环的长度是产品质量的核心指标**：从「改」到「看到结果」超过几秒，心流就断了。\n\n#### C · 回访心流：第二次打开\n\n```\n打开 → 项目门厅（我的作品 + 最近编辑 + 模板库）→ 直接回到主循环\n```\n\n回访用户**不该再看一遍模板库的推销**，也不该重新选类型。已有的项目门厅正是这一步。\n\n#### D · 回流：remix 让终点变成起点（**v17 推后**）\n\n```\n你发布 → 朋友打开链接玩 → 点「改成我的」 → 他从第 3 步开始\n```\n\n决策 14 的循环是「做 → 分享 → 被玩 → 被 remix → 再做」，\n**它仍然是长期目标，但整条链推到开放阶段**（§6 阶段四）。\n本轮的等价物是**导出工程文件**：自包含、能发给别人、别人打开就能改。\n**remix 的语义因此现在就成立，只是走文件而不是走链接。**\n\n#### E · 关于「设置 AI 模型」在哪一步\n\n> **不在创作路径上。**（决策 22，v14 收窄，v17 再次收窄）\n>\n> v17 起**全流程都不问账号**——发布与注册整体推后。\n> 剩下的唯一按需触发项是 **API key**。\n\n把配置 API 放在第 3 步，等于要求一个还没玩到任何东西的人**先完成一次技术配置**——\n这是整条路径上最强的流失点，而且与决策 9「打开即有能玩的东西」直接冲突。\n\n正确的位置是**按需触发**，三个入口：\n\n| 触发时机 | 用户看到 |\n|---|---|\n| 内置额度用完 / 想用更强的模型 | 「换成你自己的模型？」——就在 AI 面板里，不用去翻设置 |\n| 想让数据不出本机 | 隐私说明旁边一个「用本地模型」 |\n| 主动去设置页 | 随时可以，但**不主动挡路** |\n\n配置本身要好用（预设 + 自定义端点 + 测试连接 + 用量可见），细节见 [§5.5](#55-模型接入决策-21)。\n\n#### F · 每一步对应的决策与闸门\n\n写这张表是为了保证心流与决策**互相咬合**，任何一步都能追溯到判据：\n\n| 步骤 | 决策 | 闸门判据 |\n|---|---|---|\n| 1–2 打开 / 选模板试玩 | 9、15′ | C.1 C.2 |\n| 3 改一个数 | 35（教程可达） | D.5 |\n| 4 改玩法 | 13、18、25 | **D.5 教程可用性**、F |\n| 5 让 AI 帮忙 | 8、21 | D.1 D.2 **D.6 换模型仍可用** |\n| 6 换风格 / 调视听 | 20、17、23 | **C.5 换皮不变** |\n| 7 检查与打磨 | I7、约束层、25 | C.3 D.4、**F 完整作品** |\n| 8 导出 | 24（P1 分包）、§3.6.3 | C.4 导出的工程文件能在另一台机器打开并继续改 |\n\n**心流走通一遍 ≠ 闸门 F 通过**：心流验的是「路顺不顺」，\n**闸门 F 验的是「能不能靠这条路做出一款完整作品」**（§3.1）。\n\n### 1.4 四条设计原则\n\n| 原则 | 内容 |\n|---|---|\n| **每个概念自带入口**（v17 换掉「概念预算」） | 概念数量**不设上限**——目标用户理解 ECS、状态机、确定性。但**每加一个概念，必须同时交付它的教程条目或配方**，否则那个概念等于不存在。这条比数量上限更可判定，也不依赖画像 |\n| **模板优先，空白页有罪** | 先给一个能玩的东西，再让人改它。**空白页对谁都是浪费时间**——理由不再依赖画像 |\n| **AI 是主入口，不是侧边栏** | AI 是修改东西的默认方式之一；但产出必须落成能看见、能手改的规则行与物体，**绝不是黑盒** |\n| **错误必须便宜** | 任何操作都能撤销（含 AI 的）；不合法的操作当场拦住并给出结构化原因；播放出错不白屏，能回到编辑状态 |\n\n### 1.5 一套能力面（决策 12 于 v17 取消）\n\n> **原来这里是「简易 / 专业双模式」。v17 取消了它。**\n\n取消的理由不是它设计得不好，是**它的前提没了**：双模式、术语层、参数裁剪、受限默认值，\n全部是从「用户是不写代码的普通人」推导出来的。画像一改（决策 19′），四样东西同时失去依据，\n而它们的维护成本是实打实的——**风险 8「两种模式退化成两个编辑器」也随之消失**。\n\n**现在只有一套能力面：全集。** 但**机制留着**：\n\n| 保留的 | 形态 | 为什么留 |\n|---|---|---|\n| **能力面是 registry 的视图**（I8） | Action registry 支持按标签过滤，**本轮不实现任何过滤视图** | 日后真要做面向新手的裁剪界面，这是入口；且它本来就是 registry 的自然能力，留着不花钱 |\n| 相机档位 | 四档全给，**默认不再是受限俯视** | 决策 16 的「受限」是为零基础用户设的默认值；对目标用户，默认给回自由 |\n\n> **新纪律（替代原来的单向白名单）：新功能直接进全集。\n> 要论证的不再是「该不该暴露」，而是「它的教程条目与配方在哪」**（§1.4）。\n\n### 1.6 通用性服务谁\n\n| | 谁 | 怎么用 |\n|---|---|---|\n| **生产通用性** | 你 / 模块作者 | 写模块、写条件动作、做模板与皮肤 |\n| **消费通用性** | 用引擎做游戏的人 | 选模板、改参数、写规则行、定义行为单元、换皮肤、让 AI 改 |\n\n**v17 的变化**：原文说「普通人不直接消费通用，他消费的是模板 + 配方」。\n现在两层的**边界模糊了**——有经验的研发人员会在两层之间来回走：今天用配方，明天拆开改，\n后天自己写一个条件动作。**这正是决策 18「同一份材料」想要的结果**，只是原来假设用户永远停在消费侧。\n\n---\n\n## 二 · 决策表\n\n**只增不改。** 依据见[附录 A](#附录-a--关键决策的依据)。\n\n| # | 决策 | 选择 | 被否掉的是什么 |\n|---|---|---|---|\n| 1 | 交付物 | 通用 3D 游戏引擎编辑器，网页优先 | 只做一款城市建造游戏 |\n| 2 | **目标用户** | **普通人**——不写代码也能创作。友好体现在界面，不是把底层做浅 | 只服务程序员；把能力阉割成玩具 |\n| ↳ | | **v17 推翻**：目标用户改为**有经验的游戏研发人员**（决策 19′）。「不把底层做浅」这半句**保留且加强**；「友好体现在界面」被**决策 35** 取代——门槛由 AI 与教程承担 | |\n| 3 | 通用性形状 | 通用内核 + 领域模块 | Godot 式通用节点树；先做完城市再重构 |\n| 4 | 维度 | 只做 3D | 2D 一等公民；双模式 |\n| 5 | 实体模型 | ECS。**对用户不可见** | 节点树；ECS/树混合 |\n| 6 | **逻辑层** | ~~可视化节点图为主~~，**JS 用于实现条件与动作（高级门）** | 让普通用户写 JS；纯声明式规则 |\n| ↳ | | **节点图部分已被决策 13 推翻**；「逻辑是数据、JS 下沉为实现层」保持有效 | |\n| 7 | 分发形态 | 同一个应用，切播放模式 | 导出独立包；云端托管 |\n| 8 | **AI 定位** | **AI 就是产品本身。** 内置 AI + 允许接入用户自己的 API | 只作内部工具；只做辅助功能 |\n| 9 | **入口体验** | **从模板改**。打开即有能玩的东西 | 空场景 + 教程；空白页 + 输入框 |\n| 10 | 存量资产 | 冻结路 / 地形，先做内核 | 继续加道路功能；直接放弃重写 |\n| 11 | 交付验证 | 两个截然不同类型的游戏 | 单一 demo；纯视觉展示 |\n| ↳ | | **已被决策 15 修订为「3–4 个小模板」** | |\n| **12** | **界面形态** | **同一编辑器两种模式**：简易 / 专业。同一份数据与 Action，只有暴露面不同 | 两个独立编辑器；靠开关堆选项 |\n| ↳ | | **v17 取消**：只留**一套全集**（§1.5）。双模式、术语层、参数裁剪、受限默认值**全部是从旧画像推导来的**，画像一改就同时失去依据。**机制以 I8 的形式保留**（registry 视图），本轮不实现任何过滤视图 | |\n| **13** | **逻辑层形态** | **事件表**（有序的「当……就……」规则行 + 分组）。修订决策 6 | 节点图作控制流；画布、连线、布局算法 |\n| **14** | **分享** | **链接即玩 + 一键 remix**，阶段二交付，自建极简后端 | 导出独立包；社区 / 商店；纯前端塞 URL |\n| ↳ | | **v14 修订**：原文写「不做账号」，已被**决策 28** 推翻——发布需要注册，后端因此要承担用户数据 | |\n| ↳ | | **v17 推后**：链接分享、后端、账号**整体推到开放阶段**（§6 阶段四）。本轮的等价物是**导出自包含工程文件**——remix 的语义现在就成立，只是走文件不走链接。**风险 13、14 因此从表里移除** | |\n| **15** | **通用性验证** | **3–4 个差异明显的小模板**；城市迁移降为**可选** | 用两个深模板证明；把城市迁移作为闸门 |\n| ↳ | | **v11 修订**：小模板倒推不出完整游戏的能力，**必须再加一个「完整作品模板」**（带多关卡、存档、技能系统） | |\n| ↳ | | **v17 重立**：模板集换成**两个**——**RTS / MOBA** 与**第三人称动作**，由八款目标游戏塌缩而来（§5.6）。塔防并入 RTS（是它的子集）；平台跳跃降为**内部脚手架**，不作交付模板；完整作品模板并入第三人称动作模板。差异轴（相机 / 控制 / 节奏 / 联机）比原来四个小模板拉得更满 | |\n| **16** | **空间自由度** | **受限 3D**：默认地面平面 + 固定相机档位；自由飞行**一键可切** | 照抄 Blender/Unity 的飞行相机作默认 |\n| **17** | **素材来源** | **内置素材库 + glTF 导入并重**；文生 3D 作为可插拔 provider | 自研生成模型；只给素材库不给导入 |\n| **18** | **学习路径** | **配方优先**：表达力不砍，门槛靠「成套现成规则，改它就能学会」降低 | 削表达力换易懂；空白事件表 + 教程 |\n| **19** | **用户画像** | **有美术 / 设计底子、但不写代码的人**（决策 2 的细化） | 面向儿童；面向程序员；不锁定人群 |\n| **19′** | **用户画像（v17 推翻重立）** | **有经验的游戏研发人员**：懂关卡、数值、状态机、碰撞、帧，用过商业引擎，看得懂也写得出代码。**且画像不作为设计约束**（决策 35） | 继续用画像反推「该做浅什么」——那是原文档四条约束（双模式 / 术语层 / 削表达力 / 概念上限）的共同来源，而画像是全文最易变的假设 |\n| **20** | **呈现与玩法** | **分离。皮肤包是一等公民**：实体持有语义种类，视觉由皮肤包解析 | 实体直接持有模型材质；主题只做成模块私有实现 |\n| **21** | **模型接入** | **供应商无关 + BYOK 是一等功能**：填 base URL / key / 模型名即可用，含本地模型；能力不足自动降级 | 绑死一家供应商；把 BYOK 做成埋在设置深处的高级选项 |\n| **22** | **首次路径零配置** | **打开到第一次发布，全程不需要任何配置**。设置 AI 模型等一律**按需触发**，不挡路 | 开场向导；先配 API 再进编辑器；先注册账号 |\n| ↳ | | **v14 修订**：范围收窄为**创作路径零配置**（打开 → 试玩 → 改 → 换皮 → AI，全程无账号）。**发布是分界点**，那一刻要注册（决策 28） | |\n| ↳ | | **v17 复原并扩大**：账号整体推后，**全流程零账号**。剩下唯一的按需触发项是 API key | |\n| **23** | **成品感下限** | **不写代码也能做出「看起来、听起来像成品」的东西**。音频 / 动画过渡 / 特效 / 材质光照 / 移动端可玩**都要做，但各有封顶**（§3.4） | 把这些一律划进「不做」；也不做 3A 视觉 |\n| ↳ | | **v17 修订**：**移动端可玩出局**（本轮不做触屏与自适应，留口）；其余各项**保留**——它们的理由从「作品要发出去」换成「**四款动作游戏对视听的要求本来就在那**」，动画部分反而由决策 36 加强了。原判据「手机上打开就能玩」从闸门 C 移除 | |\n| **24** | **移植退路** | **本轮不做导出**，但架构必须保住「日后套壳成端游 / 手游」这条路：播放期分包、输入意图、宿主能力抽象（§3.6.5） | 现在就做导出与打包；也不做「把平台写进作品」的省事方案 |\n| **25** | **目标水位** | **能做出完整作品**：有头有尾、能存进度、有技能系统、能上架。**判据见 §3.1** | 只做「验证一轮」的小品；也不对标 AAA / Unreal（与决策 2 冲突） |\n| ↳ | | **v17 修订**：水位与判据**一字未改**，只改**验收人**——从「一个没碰过引擎的普通人」改为**项目所有者**。理由是「先自用 → 再验证 → 再开放」的顺序（§6）。「不对标 AAA」的理由从「与决策
