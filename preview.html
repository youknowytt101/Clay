var DOCS=[{"id": "overview", "title": "总览 · README", "md": "# Clay\n\n> **一个 AI 与人共用同一条编辑通道的通用 3D 网页游戏引擎编辑器：\n> 游戏逻辑是数据，AI 和鼠标是同一个命令层的两个前端，产出的是同一种材料。**\n\n**状态：设计阶段，尚无代码。** 本仓库当前只有文档与一张总览图。\n\n> **v17 重定了方向**：目标用户从「不写代码的普通人」改为**有经验的游戏研发人员**，\n> 门槛由**内置 AI + 内置教程**承担而非削能力（决 35）；双模式取消；分发链推后；\n> 模板集由**七款目标游戏**（红警 / 星际 / 魔兽 / Dota / 塞尔达 / 艾尔登 / 刺客信条 / TPS）\n> 倒推为 **RTS·MOBA** 与**第三人称动作**两个。详见 [goals.md](docs/design/goals.md) 开头的 v17 说明。\n\n---\n\n## 从哪读起\n\n| 想干什么 | 读哪里 |\n|---|---|\n| **只想看图** | [overview.svg](docs/diagrams/overview.svg) —— 六图合一：系统全景 · 数据模型 · 一帧发生什么 · 用户流程 · 编辑器界面 · 能力覆盖面 |\n| **一次读完全部** | 打开 [preview.html](preview.html) —— 全部文档 + 总览图合成一页，带目录与过滤 |\n| **想知道这编辑器现在有什么能力** | **[architecture-outline.md](docs/design/architecture-outline.md)** —— 决策后的状态快照，只写「是什么」不写「为什么」 |\n| **判断能不能做出某类游戏** | architecture-outline.md §二 —— 七款目标游戏的灰盒判定 + 三道闸 + 强/中/弱轴 |\n| **接下来做什么、按什么顺序** | **[roadmap.md](docs/design/roadmap.md)** —— 施工版计划：包 · 依赖 · 相对体量 · 验收 · 砍单顺序 · 决策截止点 |\n| 快速判断这项目在做什么 | [goals.md](docs/design/goals.md) §0 冷启动：一句话定义 + 12 条不变量 |\n| **判断一个提议该不该做** | goals.md §0 → §2 决策表 → §3 范围。这三节就是裁决依据 |\n| 理解产品长什么样 | goals.md §1.3 用户心流 |\n\n---\n\n## 名字的由来\n\n**I3 不变量的原话是「AI 的产出与人手做的是同一种材料」——Clay 就是那个材料。**\n\n- **同一种材料**：AI 生成的规则和你手搭的规则，捏起来手感一样，你随时能接着改\n- **随手就能改**：黏土不用先做模具，戳一下就有反馈——「模板优先，空白页有罪」\n- **不怕做错**：捏坏了压回去重来——「错误必须便宜」，播放沙箱与全量撤销\n- **成品要出窑**：从一团泥到一款完整作品——决策 25 的水位、决策 23 的成品感下限\n\n刻意避开 Unreal / WorldEngine / Foundry 那种「宏大」路线。\n定位不是威力，是**同一种材料**——**AI 改的和你改的是同一坨泥**。\n\n> v17 之前这里写的是「可及性」（谁都能上手）。护城河换到 I1 + I3 之后，\n> 名字要说的不再是**谁能碰它**，而是**AI 和人碰的是不是同一样东西**。\n\n---\n\n## 目录\n\n```\nClay/\n├─ README.md              本文\n├─ CLAUDE.md              给 AI 的工作说明：权威顺序 · 编辑规则 · 易漏点\n├─ preview.html           全部文档合成的单页预览（生成物，勿手改）\n├─ tools/\n│  ├─ check-docs.py       文档一致性校验\n│  ├─ build-preview.py    重新生成 preview.html\n│  └─ preview-template.html\n└─ docs/\n   ├─ design/             未来方案、取舍、决策记录（会过期）\n   │  ├─ goals.md              产品设计大纲 —— 最高裁决依据（决策过程）\n   │  ├─ architecture-outline.md  产品架构大纲 —— 决策后的状态（能力清单）\n   │  ├─ roadmap.md            开发计划 —— 施工版：包 · 依赖 · 体量 · 决策截止点\n   │  ├─ ai-native-engine.md   AI 基础设施规格（下级文档）\n   │  ├─ adr-001-ecs.md        ECS 库选型\n   │  └─ adr-002-eventsheet-eval.md  事件表求值语义 —— 唯一不可逆的一项\n   ├─ diagrams/           给人看的入口（内容以 goals.md 为准）\n   │  └─ overview.svg          六图合一，对应 v17：系统全景 · 数据模型 ·\n   │                          一帧发生什么 · 用户流程 · 编辑器界面 · 能力覆盖面\n   ├─ conventions/        写代码时要遵守的规则（很少变）\n   │  └─ ui.md                 UI 令牌与图标约定，防风格漂移\n   └─ architecture/       已实现模块的架构与理由（跟着代码改）\n      └─ roads.md              继承自 GameHub 存量\n```\n\n> **goals.md 与 architecture-outline.md 的分工**：前者是**决策过程**（39 条决策、17 版沿革、\n> 每条为什么这么定、否掉了什么），是裁决依据；后者是**决策后的状态**（现在能做什么、\n> 做到哪儿为止、封顶在哪），是能力清单。**冲突时以 goals.md 为准。**\n\n**文档按生命周期分三类**，不按主题——三类过期的方式完全不同，混在一起会分不清哪份还算数：\n`design/` 会过期，实施后要么归档、要么把落地部分挪进 `architecture/`；\n`conventions/` 很少变，变了要在决策表或 ADR 里留痕；\n`architecture/` 跟着代码改，代码变了文档没变就是 bug。\n\n**当前几乎全部内容在 `design/`**，因为还没有代码。\n`architecture/` 与 `conventions/` 里现有的两份是从 GameHub 继承的存量参考。\n\n---\n\n## 写文档的规则（goals.md §0.5，对本目录全部文档有效）\n\n1. **不写工期、预算、人力。** 只写引擎与编辑器该是什么样子\n2. **决策表只增不改。** 推翻旧决策要写明推翻了什么、为什么，不要静默改写\n3. **判据必须可判定。** 不可测的说法一律换掉\n4. **单点技术选型另开 ADR**（`design/adr-NNN-*.md`），大纲只引用结论\n5. **每次结构性改动更新版本号**并在开头说明这一版确立了什么\n\n改完文档后，跑这两条：\n\n```bash\npython tools/check-docs.py\n```\n```bash\npython tools/build-preview.py\n```\n\n`check-docs.py` 查断链、锚点、决策编号连续性、声明条数与实际是否一致，\n以及**已推翻的决策是否还在别处被当成现行的引用**——v17 那次漏改 `conventions/ui.md`\n就是这类问题。**报错就修，不要忽略。**\n\n给 AI 的工作说明在 [CLAUDE.md](CLAUDE.md)：权威顺序、编辑规则、最容易漏的地方。\n\n---\n\n## 与 GameHub 的关系\n\n前身工程在 `E:\\GameHub`：约 3200 行道路与地形的领域实现、1845 行离线测试，\n以及一套可直接留用的编辑器外壳（停靠系统、i18n、项目门厅、存档信封、无边框窗口、图标系统）。\n\n**它被冻结为参考实现**（决策 10、goals.md §8）：\n\n- **不再加新功能**，严重 bug 仍修\n- [roads.md](docs/architecture/roads.md) 是迁移时的规格书\n- `js/state/roadTypes.js` 的**主题包机制是决策 20（皮肤包）的原型**——\n  「几何只认 widthUnits，主题永远不改变路宽、最小半径与路网拓扑」\n- 迁移若发生，用**新旧对拍**（旧实现作 oracle），不重写测试\n\n> 文档里形如 `../../js/core/History.js` 的链接指向 `E:\\GameHub` 的源码，在本仓库内会断链。\n> 这是有意的——它们引用的是那份冻结的参考实现。\n\n---\n\n## 下一步\n\n1. **事件表求值语义定稿**（纸面，[adr-002](docs/design/adr-002-eventsheet-eval.md)，决策 31）——\n   走通三个手工样例即冻结。**全项目唯一「定错了没有退路」的一项**，\n   而阶段一的 Action 层、序列化、试飞台断言全部受它约束。**不依赖打包器，可以现在就做**\n2. **阶段零**：package.json + 打包器。它挡着 ECS / Rapier / glTF 三件事\n3. **物理确定性 spike**：Rapier 跨平台逐帧一致。**不通过就换物理库**（决策 29 不放宽）——\n   它是阶段一的第一件事，不是最后一件\n\n> **v17 拿掉了原来排第一的「事件表可读性测试」**：它验的是「普通人读不读得懂」，\n> 而那条假设已随决策 19′ 一起退场。**取代它的是闸门 D.5「教程可用性」**，\n> 排在阶段三，不再阻塞写代码。\n\n在这三件事完成之前，**不再往设计文档里加新范围**。\n现在的决策密度已经超前于实现进度，再写只会增加未经验证的规范。\n\n> v16 是一次**收口**（提前不可逆决策、补执行漏洞）；\n> **v17 是一次转向**——它删掉的比加上的多，因为一整套「为普通人付的税」随画像一起走了。\n"}, {"id": "outline", "title": "产品架构大纲 · 决策后的状态", "md": "# 产品架构大纲 · 决策后的状态\n\n> **对应 goals.md v17。本文只写「是什么」，不写「为什么」。**\n>\n> 理由、取舍、被否掉的方案、决策沿革，**一律在 [goals.md](goals.md)**。\n> 本文每一节末尾有溯源指针，想追某一条为什么这么定，照指针回去查。\n>\n> **读这一份的场景**：判断「这个编辑器现在能做什么、做不到什么」。\n\n---\n\n## 一 · 它是什么\n\n> **一个 AI 与人共用同一条编辑通道的通用 3D 网页游戏引擎编辑器：\n> 游戏逻辑是数据，AI 和鼠标是同一个命令层的两个前端，产出的是同一种材料。**\n\n| | |\n|---|---|\n| **形态** | 网页优先的编辑器 + 播放器，同一个应用切播放模式；播放期与编辑器**分包** |\n| **面向** | 有经验的游戏研发人员。门槛由**内置 AI + 内置教程**承担，不靠削能力 |\n| **维度** | 只做 3D（2D 用正交相机应付） |\n| **逻辑层** | **事件表**（有序的「当……就……」规则行）+ 行为单元 + 数据表。没有节点图、没有画布 |\n| **实体模型** | ECS，对用户可见（术语不做翻译） |\n| **本轮终点** | 导出自包含工程文件。分享链接、账号、后端在**开放阶段**，不在本轮 |\n\n**三条不可让步**：\n\n| | |\n|---|---|\n| **I1** | 编辑期一切变更只经由 Action 层 |\n| **I3** | AI 的产出与人手做的是同一种材料 |\n| **I2** | 游戏逻辑是数据，可读、可逐行 diff、可被约束层校验（**I1 的前提**） |\n\n> 溯源：goals.md §0.1、§0.2、§2\n\n---\n\n## 二 · 能力覆盖面（先看这张）\n\n**判定标准是灰盒 MVP**：核心玩法循环能不能跑通，几何体代替美术。**不是能不能做出那款成品。**\n\n| 簇 | 目标游戏 | 判定 | 说明 |\n|---|---|---|---|\n| **俯视指令** | 红色警戒 | ✅ | |\n| | 星际争霸 | ✅ 小规模 | 1000 实体预算是为它定的 |\n| | 魔兽争霸 | ✅ | 英雄技能走行为单元 + 技能目标选择 |\n| | Dota 2 | ✅ 单人对 AI | |\n| **第三人称动作** | 塞尔达 | ✅ 神庙式 + 小区域 | 元素传播矩阵受实体预算限制 |\n| | 艾尔登法环 | ✅ Boss 房 + 小区域 | |\n| | 刺客信条 | ⚠️ **降级** | 潜入 + 战斗 + 沿预设点攀爬。**没有丝滑跑酷** |\n| | 第三人称射击 | ✅ 单人 / 合作 | |\n\n### 契合度的一般规律\n\n**覆盖面由「节奏 + 相机 + 移动是不是玩法本身」决定：**\n\n| 轴 | 类型 | 判断 |\n|---|---|---|\n| **强项** | RTS、MOBA、塔防、战棋、roguelite、经营、ARPG、解谜 | 俯视 / 秒级 / 指令驱动。架构每一处选择都在帮忙 |\n| **中等** | 魂类 Boss 房、塞尔达神庙、平台跳跃、TPS、复古 FPS | 第三人称 / 房间尺度 / 帧级战斗 |\n| **弱项** | 跑酷动作、格斗、体育 | **移动或出招本身即产品**。动画栈封顶在档 2 |\n| **本轮不做** | 竞技 FPS、MMO（**封顶**，§十一）；体素生存（**留口**，§十） | — |\n\n### 三道闸\n\n任何玩法能不能做，先过这三道：\n\n| 闸 | 边界 | 挡掉什么 |\n|---|---|---|\n| **动画闸** | 档 2：状态机 + 混合 + root motion。**无 IK、无动作匹配、无上下半身分层** | 跑酷、格斗、体育 |\n| **规模闸** | 同屏完整模拟实体 **1000**，无 LOD / impostor，桌面 60fps | 千级弹幕、城市人群、体素世界 |\n| **网络闸** | 本轮无联机；方向已定为 **lockstep**，服务器权威路线封顶 | 竞技对抗、MMO |\n\n> 溯源：goals.md 附录 A.9\n\n---\n\n## 三 · 系统全景\n\n```\n┌────────────────────────────────────────────────────────────┐\n│  编辑器 UI（一套全集，无模式切换）                          │\n│  模板库 · 项目门厅 · 大纲 · 详情 · 事件表 · 数据表          │\n│  动画状态机 · 皮肤切换 · 资产库 · 播放控制 · 教程 · 导出    │\n└───────────────┬───────────────────────────┬────────────────┘\n                │                           │\n                │                    ┌──────┴───────┐\n                │                    │  AI 作者接口 │\n                │                    │  三个入口    │\n                │                    └──────┬───────┘\n                ▼                           ▼\n┌────────────────────────────────────────────────────────────┐\n│  Action 层 —— 编辑期唯一变更通道                            │\n│  registry（schema / 前置条件 / 影响域 / 可逆性 / describe） │\n│  撤销栈 · 变更日志 · listAvailableActions                   │\n└───────────────────────────┬────────────────────────────────┘\n                            ▼\n┌────────────────────────────────────────────────────────────┐\n│  ECS 封装层（自写）  defineComponent / query / schema       │\n├────────────────────────────────────────────────────────────┤\n│  第三方 ECS 库（koota，可替换，代价 ≈ 800 行）              │\n└──┬─────────────┬──────────────┬──────────────┬─────────────┘\n   ▼             ▼              ▼              ▼\n┌────────┐ ┌──────────┐ ┌────────────┐ ┌──────────────┐\n│事件表  │ │ 系统(JS) │ │ 物理       │ │ 渲染桥        │\n│运行时  │ │ 播放期   │ │ Rapier     │ │ 组件+皮肤    │\n│        │ │          │ │ 寻路/视野  │ │ → three.js   │\n└────────┘ └──────────┘ └────────────┘ └──────────────┘\n   ▲\n┌──┴──────────────────────────────────────┐\n│ 领域模块                                 │\n│ ① RTS / MOBA    ② 第三人称动作           │\n│ = 组件 + 系统 + 条件动作 + kinds         │\n│   + 约束 + 面板 + 皮肤 + 模板            │\n└──────────────────────────────────────────┘\n```\n\n**四条通道纪律**：\n\n| # | 规则 |\n|---|---|\n| 1 | 编辑期状态**只能**经 Action 层改（I1） |\n| 2 | 模块**不得**直接 import 第三方 ECS 库，一律走封装层 |\n| 3 | 模块之间只通过显式契约通信（I5） |\n| 4 | 视听层（动画 / 粒子 / 音频 / 后处理）是**只读消费者**，不得写玩法组件 |\n\n> 溯源：goals.md §4.1、§7.1、adr-001\n\n---\n\n## 四 · 内核能力清单\n\n**这是「能力如何」的正面回答。** 每项写清做到哪儿。\n\n### 4.1 世界与状态\n\n| 能力 | 做到哪儿 |\n|---|---|\n| 实体 / 组件表 / 原型查询 | 完整 |\n| 组件 schema 注册 | 字段范围、枚举、实体引用、单位、说明——支撑详情面板自动生成与 AI 可读 |\n| 系统注册与调度 | 固定步长 + 帧步长两条 |\n| 序列化 | 确定性、版本化信封 + 迁移链、可 diff、**按块存取** |\n| 快照与回滚 | 全世界快照；播放沙箱靠它 |\n| **分块与流式加载** | 场景内分块、实体随块加载卸载。**不做** LOD 层级、impostor、地形简化 |\n\n**分块的三条纪律**：加载顺序不得影响模拟结果；玩法需要的最小状态常驻（只有表现随块进出）；卸载重载后同输入同结果。\n\n### 4.2 变更（Action 层）\n\n| 能力 | 做到哪儿 |\n|---|---|\n| Action Registry | id / JSON Schema 参数 / 前置条件 / 影响域 / 可逆性 / describe |\n| 撤销栈 + 变更日志 | 内存栈 + 存档时落盘。**不做**事件溯源存储 |\n| `listAvailableActions(context)` | 情境级自省：此刻能做什么、影响谁、能不能撤销 |\n| params schema 约束 | 必须是可直接喂给模型做约束解码的 JSON Schema 子集 |\n\n### 4.3 逻辑\n\n| 能力 | 做到哪儿 |\n|---|---|\n| **事件表** | 条件 / 动作 / 分组 / 变量 / 等待 / 重复 / **多层子事件** / **参数位算术** |\n| 求值语义 | 全表自上而下 + 触发即时插入；实体集按种类收窄、子事件只继承不回写、顶层规则之间不传递（**冻结，见 adr-002**） |\n| **行为单元** | 带参数、有 schema 的可复用规则组。展开即普通规则行。**不允许递归与任意控制流** |\n| **配方** | 行为单元的预设 = 单元 + 默认参数 + 一句说明 |\n| 条件动作的实现 | JS 是正常路径，但**跑在确定性沙箱里**：禁 `Date` / `Math.random` / 网络 / 存储，由内核注入 `rng` 与 `tick`，注册时静态检查 |\n| **封顶** | 任意控制流、递归、完整表达式语言 |\n\n### 4.4 数据与流程\n\n| 能力 | 做到哪儿 |\n|---|---|\n| **场景与流程** | 多场景（各自可编辑可试玩）+ 流程数据（顺序与切换条件）+ 全局状态 / 场景内状态分界 |\n| 界面页 | 标题 / 暂停 / 背包 / 对话 / 结算，DOM overlay 实现，是流程里的节点 |\n| **数据表** | 具名表 + 有 schema 的列 + 按行 id 取值。行 id 只增不改。**不做**公式列、外部表格同步 |\n| **运行期动态集合** | 有序集合 + 键值表；加入 / 移除 / 取值 / 计数；元素限标量与实体引用；插入序稳定。**不做**排序、过滤、嵌套查询 |\n| **运行期存档** | `存进度(槽位)` / `读进度(槽位)`；游戏自己声明存什么；等待队列也在存档范围内。**不做**云存档、多槽管理界面 |\n\n### 4.5 空间与物理\n\n| 能力 | 做到哪儿 |\n|---|---|\n| Transform 层级 | 是组件，不是场景图 |\n| 空间索引 | 网格哈希 / BVH |\n| 拾取 | 射线拾取、框选（编辑期） |\n| 刚体与碰撞 | Rapier：刚体 + 碰撞 + 空间查询 |\n| **关节** | **固定 + 铰链**，配「连接 / 断开」两个事件表动作。**不做**马达、布娃娃、软体 |\n| **群体寻路** | 群体寻路 + 局部避让，确定性。查询接口与实现分离 |\n| **视野与战争迷雾** | 按阵营视野计算 + 迷雾状态 + 「X 是否可见」查询。**迷雾是玩法状态，参与断言** |\n\n### 4.6 玩法能力（播放期）\n\n| 能力 | 做到哪儿 |\n|---|---|\n| **选择与指令** | 点选、框选、编队、对选中集下指令（移动 / 攻击 / 跟随 / 停止） |\n| **放置与建造** | 位置合法性校验、消耗资源、放置预览、可撤销 |\n| **技能目标选择** | 点地 / 点单位 / 方向 / 范围指示器，是行为单元的参数形态 |\n| **输入意图** | 事件表只认意图（跳跃 / 确认 / 移动），设备绑定是一张可换的映射表 |\n\n### 4.7 呈现\n\n| 能力 | 做到哪儿 |\n|---|---|\n| **kind 注册表** | 声明碰撞体、占地尺寸、可用动画状态、**动画状态的位移曲线** |\n| **皮肤包** | `kind → 模型 / 材质 / 缩放 / 动画状态映射 / 图标`。一个工程一个当前皮肤，可覆盖到单实体。编辑器内可创建与编辑 |\n| **动画（档 2）** | glTF clip + 交叉淡化 + **状态机** + **混合** + **root motion** + **动画事件**（clip 时间点）。**封顶：IK、动作匹配、上下半身分层** |\n| 相机 | 四档（受限俯视 / 肩后跟随 / 第一人称 / 自由飞行）+ 平滑 + 震动 + 锁定目标 |\n| 音频 | 音效 / BGM / 音量 / 循环 / 停止，全是事件表动作。**不做**空间音频、混音 |\n| 特效 | 预制粒子（命中 / 爆炸 / 拾取 / 尘土 / 拖尾）。**不做**粒子编辑器 |\n| 材质与光照 | 参数面板 + 环境与光照预设。**不做**节点式材质编辑器、烘焙 |\n| 后处理 | 预设档位（关 / 柔和 / 强烈）。**不做**自定义链 |\n| 游戏内 UI | DOM overlay + 实体锚点 + 预制件（血条 / 计分 / 计时 / 提示 / 胜负）。**不做**控件系统 |\n\n**呈现与玩法的分界线**（换皮不得改变玩法）：\n\n| 归玩法（kind / 逻辑） | 归呈现（皮肤包） |\n|---|---|\n| 碰撞体、占地尺寸 | 模型、材质、缩放 |\n| **root motion 位移曲线** | clip 本身、混合权重、过渡时长 |\n| **动画状态机的当前状态与转移** | 状态映射到哪个 clip |\n| 迷雾的可见性状态 | 迷雾怎么画 |\n\n### 4.8 AI 基础设施\n\n| 能力 | 做到哪儿 |\n|---|---|\n| **三个入口** | `describe(scope, detail)` / `listAvailableActions(context)` / `apply(actions[])`。**不做**一个 Action 一个 tool |\n| `describe` | 语义 LOD，可寻址可下钻，**返回结构化数据不返回文案** |\n| **约束层** | 谓词 + 结构化失败反馈四元组（`at` / `observed` / `limit` / `alternatives`） |\n| 供应商适配层 | OpenAI 兼容端点 + Anthropic / Gemini 原生 + 本地模型。**能力探测 + 自动降级** |\n| **不做** | 模型路由、RAG、微调、多模型投票、**引入通用 agent 框架作依赖**（不等于禁止自主循环） |\n\n**AI 介入形态**（按实现顺序）：单步指令 → 换皮 → 多步变更集 → 生成规则行 → 内联建议。\n\n**AI 参与度分三档**（决策 40）：\n\n| 档 | 能力 | 状态 |\n|---|---|---|\n| **1** | 上述五种形态 + **AI 在 headless 里自己试玩并报告** | **本轮做** |\n| **2** | **受监督的自主循环**：跑一步 → 读约束反馈 → 决定下一步；进度可见、随时叫停、可回滚到 checkpoint、可只接受前半段 | **留口** |\n| **3** | **AI 造零件**：用 JS 实现新的条件与动作。**不得自动注册**——必须过沙箱静态检查 + headless 断言，registry 标明来源 | **留口** |\n\n**封顶的是形态不是规模**：产出必须始终是 Action 序列。任务多大都行，\n不可寻址、不可手改的黑盒结果不行。\n\n**档 1–2 的能力天花板**：**AI 能组装，不能造零件**。超出现有条件动作库的需求，得由人先写零件。\n\n### 4.9 平台与工程\n\n| 能力 | 做到哪儿 |\n|---|---|\n| **宿主能力抽象** | 全屏、指针锁定、URL、存储、文件读写各一层薄接口 |\n| **播放期分包** | 播放期不依赖任何编辑器 UI。**这条不允许放宽** |\n| 数据安全 | 自动保存；导出自包含工程文件；overlay 一律 `textContent`；导入设上限并优雅失败 |\n| **试飞台** | headless runner（加载 → 执行 Action 序列 → 断言 → 报告）+ 确定性 |\n| **教程系统** | 按能力组织、可交互、就在编辑器里。**每个概念一条，跟着能力一起交付** |\n\n> 溯源：goals.md §5.1、§3.4、§4.4、§4.7、ai-native-engine.md\n\n---\n\n## 五 · 数据模型\n\n**一个工程里有什么，怎么套起来：**\n\n```\n工程\n├─ 流程                    哪个场景先来、什么条件切下一个\n├─ 全局状态                跨场景保留\n├─ 场景[]\n│   └─ 块[]                加载卸载的单位\n│       └─ 实体[]          = kind + 组件数据\n├─ 事件表                  规则行[]（有序）\n│   ├─ 条件行[] 动作行[]\n│   ├─ 子事件（多层）\n│   └─ 行为单元定义[]      带参数 schema；配方 = 它 + 默认参数\n├─ 数据表[]                作者编辑，静态，行 id 只增不改\n├─ 运行期集合声明[]        有序集合 / 键值表\n├─ kind 注册[]             碰撞体 / 占地 / 动画状态 / 位移曲线\n├─ 当前皮肤包              kind → 视觉\n├─ 输入绑定表              意图 → 设备\n└─ 依赖的内容包[]          包 id + 版本\n```\n\n**三种「状态固化」**：\n\n| | 工程存档 | 导出工程文件 | 运行时存档 |\n|---|---|---|---|\n| 存什么 | 编辑期世界状态 + 流程 + 事件表 | 工程的自包含固化 | 游戏声明的持久化状态 |\n| 权威 | Action 层 | 导出那一刻的工程 | 事件表运行时 |\n| 带版本 | 是 | 是 | 是 |\n\n**内容包**——模板 / 皮肤 / 配方 / 数据表 / 素材集 / 模块**是同一种东西**：\n\n```\n内容包 = { 稳定 id, 语义化版本, 作者, 许可, 依赖(包 id + 版本), 内容哈希, 载荷 }\n```\n\n**五处「可替换的东西都是一张映射表」**：`kind → 视觉`、`动画语义状态 → clip`、`输入意图 → 设备`、`包 id + 版本 → 内容`、`Action 标签 → 能力面视图`。\n\n> 溯源：goals.md §4.5、§4.7、§3.5\n\n---\n\n## 六 · 运行期：一帧发生什么\n\n**玩法跑在固定步长的 tick 上；呈现跑在帧上。两者分离。**\n\n```\n── 固定步长 tick（玩法，确定性范围） ──────────────────\n  1. 采样输入意图，冻结本 tick 的输入快照\n  2. 物理步进（Rapier）\n  3. 排空触发队列（FIFO，深度上限 16，超限 warning 不崩）\n  4. 全表自上而下求值常规规则\n  5. 结算等待队列\n──────────────────────────────────────────────────\n\n── 渲染帧（呈现，只读消费） ────────────────────────\n  渲染桥增量同步 → 动画状态机求值 → 粒子 / 音频 / 后处理\n  块的加载与卸载（呈现层事件，不是玩法事件）\n──────────────────────────────────────────────────\n```\n\n**确定性的范围**：所有「逐字节一致」的断言**限定在玩法状态**，不含渲染与视听状态。\n\n**保住它的四条**：实体迭代按稳定 id 升序；随机数只来自内核注入的带种子 rng；JS 条件动作跑在沙箱里；触发在 tick 边界对齐、不在物理子步内回调。\n\n**编辑期 vs 播放期**：\n\n| | 编辑期 | 播放期 |\n|---|---|---|\n| 权威 | Action 层 | 事件表运行时 / 系统 |\n| 直接写状态 | 否 | 是 |\n| 撤销栈 | 有 | 无 |\n| 约束校验 | 实时 | 不校验 |\n| AI 可介入 | 是 | 否 |\n\n进入播放 = 打快照，退出 = 整体回滚。**播放期改动不污染工程。**\n\n> 溯源：adr-002、goals.md §4.5、§7.1\n\n---\n\n## 七 · 编辑器界面\n\n**一套能力面，没有模式切换，没有术语翻译。**\n\n| 面板 | 改什么 |\n|---|---|\n| 模板库 | 打开即见，选一个先直接试玩 |\n| 项目门厅 | 回访入口：我的作品 + 最近编辑 + 模板库 |\n| 大纲 | 实体树 + 用户文件夹 |\n| 详情 | 按 schema 自动生成控件，可写 |\n| **事件表编辑器** | 可拖拽列表——加规则行、挑条件动作、改参数、调顺序、分组；播放时高亮命中的行。**没有画布、连线、布线** |\n| **数据表编辑器** | 按列 schema 生成的表格视图 |\n| **动画状态机编辑器** | 状态 + 转移条件的列表视图；转移条件复用事件表的条件注册表 |\n| 皮肤切换 | 一个下拉换整套风格；缺插槽当场列出 |\n| 资产库 | 内置素材库 + glTF 导入 + 预制体，按插槽组织 |\n| 视口 | 变换 gizmo、多选框选、复制粘贴、成组、对齐吸附 |\n| 播放控制 | 播放 / 暂停 / 单步 / 停止 |\n| **AI 面板** | 单步指令、变更集预览、内联建议 |\n| **教程** | 任何一步都能唤出，不挡在路上 |\n| 导出 | 一个按钮生成自包含工程文件 |\n\n**存量直接留用**：停靠系统、i18n、项目门厅、存档信封与迁移链、无边框窗口、图标系统。\n\n> 溯源：goals.md §5.3\n\n---\n\n## 八 · 领域模块与模板\n\n**模块 = 组件 + 系统 + 条件动作 + kinds + 皮肤包 + Action + 约束 + 面板 + 模板**，一个声明文件，启动时校验。\n\n| 模板 | 覆盖 | 模块内容 |\n|---|---|---|\n| **RTS / MOBA** | 红警、星际、魔兽、Dota、**塔防** | 单位群、波次与 AI、建筑与生产、资源、胜负、迷雾呈现 |\n| **第三人称动作** | 塞尔达、艾尔登、刺客信条、TPS | 角色控制器、战斗与判定、锁定、背包与装备、关卡流程 |\n\n**平台跳跃**是内部脚手架（最快拿到可玩闭环），不作交付模板。\n\n**模块禁止**：import 别的模块内部实现、读写不属于自己的组件表、绕过 Action 层、import 第三方 ECS 库、在事件表或玩法组件里引用具体美术资源、在条件动作实现里触碰时间与随机源。\n\n> 溯源：goals.md §5.6、§7.1\n\n---\n\n## 九 · 硬性指标\n\n| 指标 | 值 |\n|---|---|\n| 播放期首包（不含用户素材） | ≤ 8 MB gzip |\n| 桌面冷启动到可玩 | ≤ 5 秒 |\n| 目标帧率 | 桌面 60fps |\n| 同屏**完整模拟**实体 | **1000** 不掉帧 |\n| 单块加载耗时 | ≤ 1 帧预算 |\n| 场景总量 | 不设上限（按块加载） |\n\n**三条永远成立的约束**：\n\n| | |\n|---|---|\n| **确定性** | 逐帧严格确定性，硬要求，不允许降级 |\n| **标识符稳定（I11）** | `kind` / 条件动作 / 配方 / 皮肤插槽 / 数据表行 id / 内容包 id **一旦发布即冻结**；要改就新增 + 标 deprecated + 保留迁移 |\n| **求值语义冻结** | 事件表的求值语义定稿后按 I11 对待。**全项目唯一「定错了没有退路」的地方** |\n\n> 溯源：goals.md §3.6.1、§3.6.2、adr-002\n\n---\n\n## 十 · 本轮不做，但架构留口\n\n**留口 = 后加不用重写、不破 I11。**\n\n| 项 | 留口条件 |\n|---|---|\n| 分享链接 + remix + 账号 + 后端 | 内容包字段集已定；导出文件已自包含 |\n| 移动端播放（触屏 / 自适应） | 输入意图映射（I12）保证加设备不改作品 |\n| **联机（lockstep）** | 确定性 + Action 日志就是它的底座 |\n| 导出独立包 / 端游手游套壳 | 播放期分包 + 输入意图 + 宿主能力抽象三条已守 |\n| 面向新手的能力面裁剪视图 | Action registry 的视图机制（I8） |\n| **AI 受监督的自主循环**（决 40 档 2） | **A1** Action 日志支持 checkpoint 与命名分段 · **A2** `apply()` 返回带「本步改了什么」 · **A3** 三入口保持无状态可多轮调用 · **A4** 预算与中断信号在引擎侧 |\n| **AI 造零件**（决 40 档 3） | 同上，另加：沙箱静态检查 + headless 断言才允许注册，registry 标明来源 |\n| 模拟细节分级、LOD、impostor | — |\n| 网格世界 / 可破坏建造 | — |\n| **体素 / 瓦片世界**（我的世界 / 泰拉瑞亚类） | 块边界与实体无关 · kind 不假设一 kind 一实体 · 空间查询不假设刚体（V1–V3） |\n| 载具物理 / 样条路网 | 道路存量（约 3200 行）可选迁移 |\n| 关节：马达 / 布娃娃 / 软体 | Rapier 自带 |\n| 动画：更多混合模式 | — |\n| 资产 / 插件 / 皮肤市场、社区层、货币化 | 统一为内容包 |\n| 空间音频与混音、粒子编辑器、后处理自定义链、更多材质预设 | — |\n| 协同编辑、云工程、Action 日志的事件溯源存储 | — |\n\n---\n\n## 十一 · 方向性封顶（要做就得先推翻决策）\n\n| 封顶 | 后果 |\n|---|---|\n| **动画档 3**：IK / 动作匹配 / 上下半身分层 | 跑酷、格斗、体育做不了；刺客信条只到潜入 + 战斗 |\n| **竞技 FPS 路线**：服务器权威 + 客户端预测 + 反作弊 | CS / Valorant 类做不了 |\n| 图灵完备的事件表：任意控制流、递归 | 需要任意算法的玩法要下沉成 JS 条件动作 |\n| 2D 一等公民（Sprite 管线） | 2D 只能用正交相机 + billboard 应付 |\n| 节点图作控制流 / 画布 / 连线 | — |\n| 引擎内 3D UI 控件系统 | 游戏内 UI 只有 DOM overlay |\n| 节点式材质编辑器、烘焙管线 | 材质只到参数 + 预设 |\n| 自研物理 / 自研文生 3D / 自研音频引擎 | 全部集成或接 provider |\n| 编排逻辑用代码（而非数据） | 破 I1 与 I3，AI 通道直接失效 |\n| **产出不可寻址、不可手改的黑盒结果** | AI 的任务规模不封顶，产出形态封顶——必须是 Action 序列 |\n| 能力面的数据分叉 | 任何裁剪视图必须是 registry 的视图 |\n| 用用户的 key 做用户没要求的事 | — |\n| 道路系统新功能 | 存量冻结 |\n\n**注**：体素 / 瓦片世界（我的世界、泰拉瑞亚、僵尸毁灭工程）**不在封顶列，在留口列**（§十）——\n七款目标游戏无人需要，但没有任何决策否定它。**本轮做不了，日后可加**，条件是守住 V1–V3 三条。\n\n> 溯源：goals.md §3.4\n\n---\n\n## 十二 · 当前进度与下一步\n\n**状态：设计阶段，尚无代码。**\n\n| 阶段 | 内容 | 闸门 |\n|---|---|---|\n| **零** | 打包器 + **求值语义定稿** | O（纸面） |\n| 一 | ECS 内核 + Action 层 + 试飞台 + 分块 + 最小 AI | A、B |\n| 二 | 事件表 + **RTS 模板** + 寻路视野 + 导出 | C（5 条） |\n| 三 | AI 作者接口 + 约束层接 AI + 供应商适配 | D（6 条） |\n| 三½ | **动画栈档 2** + 第三人称动作模板 | **F（总判据）** |\n| 四 | 开放：分享 + 账号 + 移动端 + 新手视图 | E、G |\n| 五 | 联机（lockstep） | — |\n\n**眼下三件事**：\n\n1. **事件表求值语义定稿**（纸面，[adr-002](adr-002-eventsheet-eval.md)）——唯一不可逆的一项，不依赖打包器\n2. **阶段零**：package.json + 打包器\n3. **Rapier 跨平台确定性 spike**——不通过就换物理库\n\n> 溯源：goals.md §6\n\n---\n\n## 溯源索引\n\n| 本文 | goals.md |\n|---|---|\n| 一 · 它是什么 | §0.1 §0.2 §2 |\n| 二 · 能力覆盖面 | 附录 A.9 |\n| 三 · 系统全景 | §4.1 §7.1 + adr-001 |\n| 四 · 内核能力 | §5.1 §3.4 §4.4 §4.7 + ai-native-engine.md |\n| 五 · 数据模型 | §4.5 §4.7 §3.5 |\n| 六 · 运行期 | adr-002 + §4.5 §7.1 |\n| 七 · 编辑器界面 | §5.3 |\n| 八 · 模块与模板 | §5.6 §7.1 |\n| 九 · 硬性指标 | §3.6.1 §3.6.2 + adr-002 |\n| 十 · 留口 · 十一 · 封顶 | §3.4 |\n| 十二 · 进度 | §6 |\n\n**本文与 goals.md 冲突时，以 goals.md 为准**——它是裁决依据，本文是它的投影。\n"}, {"id": "roadmap", "title": "开发计划 · 从零到闸门 F", "md": "# 开发计划 · 从零到闸门 F\n\n> **对应 goals.md v18。本文是 §6 路线的施工版**——把阶段拆成可交付的包，标出依赖、体量、\n> 验收、砍单顺序，以及每个未决项的决策截止点。\n>\n> **不含工期**（goals.md §0.5 第 1 条）。体量用相对档位：\n> **S** 一两天量级 · **M** 一周量级 · **L** 数周量级 · **XL** 一个月以上量级。\n> 这些是**相对大小**，不是承诺。\n>\n> **顺序的总原则**：先自用 → 再验证 → 再开放。\n\n---\n\n## 零 · 关键路径\n\n```\n ADR-002 求值语义 ──────────────────┐\n （纸面，不依赖任何工具链）         │\n                                    ▼\n 打包器 ──► ECS 内核 ──► Action 层 ──► 事件表运行时 ──► RTS 模板\n            └─► Rapier spike           │                 │\n                （不过就换库）          ├─► 寻路 · 视野    │\n                                        ├─► 选择指令建造  │\n                                        └─► 皮肤包 · 视听 ┘\n                                                          │\n                          AI 作者接口 ◄────────────────────┤\n                          （describe · 约束层 · 适配层）    │\n                                                          ▼\n                                              动画栈档 2 ──► 第三人称动作模板\n                                                                   │\n                                                                   ▼\n                                                              闸门 F\n```\n\n**三条硬依赖，谁都绕不开：**\n\n| # | 依赖 | 后果 |\n|---|---|---|\n| 1 | **求值语义 → 一切** | Action 层、序列化、试飞台断言全部受它约束。定错了迁移链救不回来 |\n| 2 | **打包器 → ECS / Rapier / glTF** | 没有构建步骤，这三件事第一天就撞墙 |\n| 3 | **Rapier 确定性 → 决策 29 整条线** | 不过就换物理库。**必须在闸门 A 之前验，不是最后验** |\n\n**唯一可以完全并行的**：ADR-002 是纸面工作，不依赖打包器，**现在就能做**。\n\n---\n\n## M0 · 地基（体量 S+S）\n\n| 包 | 体量 | 内容 |\n|---|---|---|\n| **M0-a 求值语义定稿** | S | 走通 [adr-002](adr-002-eventsheet-eval.md) 的三个手工样例 → 冻结 |\n| **M0-b 构建工具链** | S | package.json + 打包器；three 的 CDN importmap 迁进构建 |\n\n**验收 · 闸门 O**：三个手工样例逐条推演，结果与「读这段规则会预期什么」一致。**过了即按 I11 冻结。**\n\n**第一件事**：M0-a。它是全项目唯一不可逆的一项，且不花钱。\n**风险**：无。这一段没有技术风险，只有「想不想动手」的风险。\n\n---\n\n## M1 · 内核地基（体量 XL）\n\n**目标**：引擎活了——能摆东西、能撤销、能存读档、不开界面能跑。**还不好玩，这是预期内的。**\n\n| 包 | 体量 | 依赖 | 内容 |\n|---|---|---|---|\n| M1-a **ECS 封装层** | M | M0-b | `defineComponent` / `query` / 组件 schema；koota 藏在后面 |\n| M1-b **Action Registry** | M | M1-a | id / schema / 前置条件 / 影响域 / 可逆性 / describe；撤销栈 + 变更日志 |\n| M1-c **序列化与快照** | M | M1-a | 版本化信封 + 迁移链 + **按块存取**；快照与回滚 |\n| M1-d **试飞台** | M | M1-b M1-c | headless runner：加载 → 执行 Action 序列 → 断言 → 报告 |\n| M1-e **Rapier 确定性 spike** | S | M0-b | **独立且尽早**。不过就换库 |\n| M1-f **渲染桥 + Transform + 拾取 + 空间索引** | M | M1-a | three.js 增量同步 |\n| M1-g **分块与流式加载** | L | M1-c M1-f | S1–S3 三条纪律；**这是 M1 最大的一块** |\n| M1-h **编辑器改造** | L | M1-b M1-f | 大纲 / 详情 / gizmo / 多选，全部对 ECS 通用 |\n| M1-i **最小 AI：单步指令** | S | M1-b | **验证通道形状，不是模型能力** |\n| M1-j **确定性沙箱 J1–J3** | S | M1-b | v17 起提前到 M1（原在阶段二）。**写 JS 条件动作的人变多了** |\n\n**验收 · 闸门 A**（三条）+ **闸门 B**（纸面：城市迁移演练）\n\n**砍单顺序**：gizmo / 多选 → 空间索引的 BVH（先只做网格哈希）→ **绝不砍试飞台**\n\n**先做 M1-e**。它是唯一可能推翻已定决策的一项，越早发现越便宜。\n**M1-i 别推后**：接一次最小 AI，验的是「Action 层的形状对不对」，晚发现贵一个数量级。\n\n---\n\n## M2 · 事件表与 RTS 模板（体量 XL+，全程最大的一段）\n\n**这一段有掉进无正反馈黑洞的真实风险**（风险 3——原来的解药「发链接给别人」已随分发链推后）。\n**所以它内部切成四个各自有产出的小段**，每段结束时手里有个能动的东西。\n\n### M2-1 · 第一个能玩的东西（体量 M）\n\n| 包 | 体量 | 内容 |\n|---|---|---|\n| 事件表数据模型 + 逐行求值 | M | 按 M0-a 冻结的语义实现 |\n| 列表编辑器 | M | 拖拽、加规则行、挑条件动作、改参数、分组 |\n| 第一批条件动作（最小集） | S | 碰到 / 输入意图 / 定时；移动 / 生成 / 销毁 / 改属性 |\n| 物理接入 + 平台跳跃脚手架 | M | **不作交付模板**，是最快的可玩闭环 |\n\n> **产出：一个能跳、能踩到平台、能通关的东西。** 这是整个项目第一次「玩到自己做的东西」。\n\n### M2-2 · 逻辑是数据的证明（体量 L）\n\n| 包 | 体量 | 内容 |\n|---|---|---|\n| **§4.7 五个概念的数据模型定死** | M | 场景流程 · 行为单元 schema · 可持久化声明 · 数据表 · 动态集合 |\n| 五个概念的最小实现 | M | 两场景切换 · 一个带参行为单元 · 存读进度 · 一张数据表被引用 · 一个背包能增删并存档 |\n| 行为单元 + 配方库 | M | 展开即普通规则行 |\n| 约束层机制 | M | 谓词注册 + 结构化失败反馈 + 面板显示 |\n| **A1 / A2 留口** | S | Action 日志的 checkpoint 字段；`apply()` 返回带「本步改了什么」 |\n\n> **数据模型定死是这一段的核心交付**，实现可以薄。定错了撞 I11。\n\n### M2-3 · RTS 的骨架（体量 XL）\n\n| 包 | 体量 | 内容 |\n|---|---|---|\n| **群体寻路 + 局部避让** | L | 确定性；查询接口与实现分离 |\n| **视野与战争迷雾** | M | 迷雾是玩法状态，参与断言 |\n| 播放期选择与指令 | M | 点选 / 框选 / 编队 / 下指令 |\n| 播放期放置与建造 | M | 合法性校验 + 消耗资源 + 预览 |\n| 技能目标选择 | M | 点地 / 点单位 / 方向 / 范围指示器 |\n\n### M2-4 · 成品化（体量 L）\n\n| 包 | 体量 | 内容 |\n|---|---|---|\n| 皮肤包机制 + 编辑面板 + 两套皮肤 | M | |\n| 视听下限一套 | L | 音频 · 预制粒子 · 材质与光照预设 · 后处理档位 |\n| 游戏内 UI overlay + 预制件 | M | |\n| 导出自包含工程文件 | S | 本轮的终点 |\n| 教程系统机制 + 已交付能力的条目 | M | 决策 35 的载体 |\n| **RTS 模板本身** | XL | **这是内容生产，不是引擎开发——见下** |\n\n**验收 · 闸门 C**（五条）\n\n**砍单顺序**：视野迷雾的精细化（先做最粗的圆形视野）→ 内置素材库规模 → 后处理与部分预制粒子 → **绝不砍导出，也绝不砍寻路与确定性**\n\n**M2 的最大陷阱**：M2-4 的「RTS 模板」是关卡设计 + 数值平衡 + 美术，**和写引擎是两种工作**。\n它很可能比 M2-1 到 M2-3 加起来还耗时间（风险 11）。**砍范围时优先砍内容的量，不砍引擎能力。**\n\n---\n\n## M3 · AI 作者接口（体量 L）\n\n| 包 | 体量 | 依赖 | 内容 |\n|---|---|---|---|\n| M3-a **describe 层** | M | M1-a | 组件与事件表都要实现；语义 LOD，返回结构化数据 |\n| M3-b **约束层接到 AI** | S | M2-2 | 机制已建，这里加「作为验证器与重试信号」那一半 |\n| M3-c **五种介入形态** | L | M3-a M3-b | 单步 → 换皮 → 多步变更集 → 生成规则行 → 内联建议 |\n| M3-d **供应商适配层** | M | — | OpenAI 兼容 + 原生协议 + 本地模型；能力探测与降级 |\n| M3-e **设置界面** | S | M3-d | 预设 + 自定义端点 + 测试连接 + 用量可见 |\n| M3-f **AI 自己试玩** | S | M1-d M3-c | 驱动与断言 M1/M2 已具备 |\n\n**验收 · 闸门 D**（六条，含 **D.5 教程可用性** 与 **D.6 换一家模型仍可用**）\n\n**M3-d 别放最后**。它决定了 M3-c 能不能在弱模型上跑通；等 M3-c 写完再接适配层，会发现一半假设不成立。\n\n---\n\n## M3.5 · 动画栈与第三人称动作模板（体量 XL，闸门 F 的载体）\n\n| 包 | 体量 | 内容 |\n|---|---|---|\n| M3.5-a **动画状态机 + 混合** | L | 状态是玩法数据，转移复用事件表条件注册表 |\n| M3.5-b **root motion** | L | **先落地 §4.4 的两条冲突解法**：位移曲线烘焙成玩法量、归 kind |\n| M3.5-c 界面页四个 | M | 标题 / 暂停 / 背包 / 对话 / 结算 |\n| M3.5-d 五个概念补齐到可用 | M | |\n| M3.5-e **第三人称动作模板** | XL | 关卡串 + 战斗判定 + 技能道具 + 背包 + 存进度 + 锁定 |\n\n**验收 · 闸门 F**（全项目最硬的一条）\n\n**砍单顺序**：界面页数量（先做标题 + 结算）→ 关卡数量（先做 1 关跑通全流程）→ **绝不砍动画栈档 2**——它是这一段的全部意义\n\n**M3.5-b 必须在 M3.5-a 之后、M3.5-e 之前**。root motion 的两条冲突解法没落地就开始做模板，\n等于把泄漏写进内容里，返工要改已经做好的动作。\n\n---\n\n## M4 / M5 · 开放与联机\n\n**M4 开放**（闸门 E + G）：分享 + 账号 + 移动端 + 新手裁剪视图 + 第三个模板（验通用性）。\n**M5 联机**（决策 29 的兑现）：lockstep 指令同步 + 断线重连 + 观战。\n\n**这两段都不阻塞闸门 F，也不被前面任何一段依赖。**\n\n---\n\n## 一 · 决策截止点\n\n**每个未决项都有一个「再不定就要返工」的时刻。** 按里程碑排：\n\n| 里程碑 | 必须定的 |\n|---|---|\n| **M0 之前** | 事件表求值语义（已前置，ADR-002） |\n| **M1 内** | ECS 库选型（spike）· 组件 schema 定义方式 · 块的大小与加载策略 · **Rapier 跨平台确定性** |\n| **M2-2 之前** | 场景切换的状态语义 · 可持久化声明粒度 · 数据表引用语法与作用域 · 动态集合持久化粒度 · 内容包最小字段集 |\n| **M2-3 内** | 寻路实现选型 · 视野迷雾粒度 · 输入意图第一批清单 · 条件动作由谁实现 |\n| **M2-4 内** | 数值表达力够不够（**真写一遍伤害公式**）· 1000 实体可达性实测 · 视听资源来源 · 依赖与素材许可 · 配方与教程条目清单 · 视觉插槽粒度 |\n| **M3 内** | 能力探测怎么做 · 降级重试预算 · 内置 AI 成本谁承担 · AI 输出的安全边界 · 最小度量 |\n| **M3.5 之前** | 动画状态机的数据形态 · root motion 烘焙时机 · 界面页实现形态 |\n| **M4 之前** | 后端最小形态 · 快照体积上限 · OAuth 选型 |\n\n---\n\n## 二 · 两类工作要分开排\n\n| | 引擎开发 | 内容生产 |\n|---|---|---|\n| 是什么 | 内核、编辑器、AI 层 | 模板关卡、皮肤、配方、教程条目、素材库 |\n| 特点 | 后补要重构 | **后补只是排期** |\n| 出现在 | M1、M2-1~3、M3、M3.5-a/b | M2-4、M3.5-e，以及每个能力的教程条目 |\n| 砍的时候 | **最后砍** | **先砍量**（一套皮肤而不是两套、3 个配方而不是 8 个） |\n\n**风险 11 的执行点就在这张表**：M2-4 和 M3.5-e 加起来可能比全部引擎工作还大。\n**它们的进度要单独跟踪，不要和引擎进度混在一个数字里。**\n\n---\n\n## 三 · 每个里程碑的「第一件事」\n\n| 里程碑 | 先做这个 | 为什么 |\n|---|---|---|\n| M0 | 求值语义定稿 | 唯一不可逆，且零成本 |\n| M1 | **Rapier 确定性 spike** | 唯一可能推翻已定决策的一项 |\n| M2 | 平台跳跃脚手架 | 最快拿到「玩到自己做的东西」，对抗风险 3 |\n| M3 | 供应商适配层 | 它决定其余部分能不能在弱模型上跑通 |\n| M3.5 | **§4.4 的两条 root motion 冲突解法** | 不先落地就会把泄漏写进内容 |\n\n---\n\n## 四 · 什么时候该停下来重估\n\n| 信号 | 动作 |\n|---|---|\n| Rapier 确定性 spike 不过 | 换物理库。**不放宽决策 29** |\n| ECS 库 spike 的确定性测试不过 | 换库或自研（预算上限 3 周，adr-001 §6） |\n| 1000 实体在 M2-4 实测不达标 | 先优化；仍不达标才考虑模拟细节分级（现为留口） |\n| RTS 模板的逻辑写不出来、必须硬编码 JS | **加受限原语，不退回节点图**（§7.2） |\n| 闸门 D.5 教程可用性连续两轮不过 | 走退役条件 **P-2**：重估决策 12 的取消 |\n| 闸门 F 通过后开放阶段迟迟无法开工 | 走退役条件 **P-1**：承认它是个人引擎，资源转回引擎能力 |\n\n**闸门不过怎么办：砍范围，不放宽判据。** 一旦允许「先放过，下阶段补」，闸门就退化成装饰。\n\n---\n\n## 相关文档\n\n- [goals.md](goals.md) — **上级文档**，方向与闸门以它为准\n- [architecture-outline.md](architecture-outline.md) — 决策后的能力清单\n- [adr-002-eventsheet-eval.md](adr-002-eventsheet-eval.md) — M0-a 的交付物\n- [adr-001-ecs.md](adr-001-ecs.md) — M1-a 的选型依据\n"}, {"id": "goals", "title": "产品设计大纲 · goals", "md": "# 产品设计大纲\n\n> **v6** · 2026-08-08 · 状态：方向已定，实施未开始\n> v6 确立：**模型接入是一等功能**（决策 21）——供应商无关、用户可填自己的模型、\n> 能力不足自动降级；引擎不得依赖任何单一供应商的独有能力（**不变量 I10**）。\n> **v7** · 2026-08-08 · **用户心流成为正文**（§1.3）：首次心流八步 + 主循环 + 回访 + remix 回流；\n> **首次路径零配置**（决策 22）。\n> **v8** · 2026-08-08 · **成品感下限**（决策 23）：原「明确不做」清单拆成\n> **§3.4 能力天花板（做，但封顶）** 与 **§3.5 范围外（真不做）**——\n> 音频、动画过渡、特效、材质与光照、后处理、移动端可玩、皮肤包编辑**全部改判为要做**。\n> **v9** · 2026-08-08 · 补齐四处空白（**§3.6 工程底线**）：性能预算、发布快照的向前兼容\n> （**不变量 I11**）、本地数据的脆弱性、用户内容的安全面。\n> **v10** · 2026-08-08 · **保住移植退路**（决策 24 + **不变量 I12**）：输入意图映射、\n> 宿主能力抽象、播放期分包；并把**事件表求值语义**列为定下即冻结的接口。\n> **v11** · 2026-08-08 · **目标水位抬到「完整作品」**（决策 25）：总判据换成一款可上架的完整游戏；\n> 新增三个架构概念（**场景与流程 / 可复用行为单元 / 运行期状态存取**，§4.7）；\n> 防膨胀手段改为**架构留口 + 分批实现**（决策 26），不再靠砍能力。\n> **v12** · 2026-08-08 · **灰盒 MVP 压测**（附录 A.9）：Dota / 星际 / 红警 / 艾尔登 / 塞尔达\n> 的核心玩法循环判定为**可做**，据此补进内核三项——**播放期选择与指令、播放期放置与建造、\n> 动画事件**；战争迷雾进 RTS 模块；数值表达力列入未决项。\n> **v13** · 2026-08-08 · **内容生态是长期目标**（决策 27）：§3.5 拆成\n> **本轮不做但架构留口**与**真封顶**；市场 / 社区 / 账号 / 云工程从「不做」移入前者；\n> 模板 · 皮肤 · 配方 · 素材 · 模块**统一为「内容包」**。\n> **v14** · 2026-08-08 · **发布即注册**（决 28）；**确定性升为硬要求**（决 29）；**分块与流式加载现在就设计**（决 30）；完整作品模板定为小型 roguelite；新增阶段五 · 联机。\n> **v15** · 2026-08-08 · 结构精简：能力表三合一、配方并入行为单元、场景与块定边界、映射表模式点破、依据归位。**决策与判据一条未改。**；修掉两处遗留硬错误（约束层阶段归属、视听只读与断言范围）。\n> **v16** · 2026-08-08 · **收口不可逆项与三处缺口**：**事件表求值语义前置到阶段零定稿**\n> （决 31 → [adr-002](adr-002-eventsheet-eval.md)）——它是全项目唯一「定错了没有退路」的一项，\n> 却一直排在最后；**数据表升为第四个架构概念**（决 32，§4.7）；**最小关节进本轮**（决 33）；\n> **内核例外计数闸门**（决 34）；补上**确定性沙箱**（决 29 的执行漏洞，§7.1）与**决策 4 的依据**（[A.11](#a11-决策-4只做-3d-的依据补于-v16)）；\n> A.9 增补**玩法契合度**——动画栈封顶使「移动本身即玩法」的一类落在弱轴，**这是取舍，不是缺陷，但要写出来**。\n>\n> ---\n>\n> ## **v17** · 2026-08-08 · **重定方向：从「普通人的引擎」改为「AI 原生的开发者引擎」**\n>\n> 这一版是**推翻式修订**，起因是把七款目标游戏摆上桌后，原来的前提站不住了。\n>\n> **推翻**：决 2、19（用户画像 → **有经验的游戏研发人员**，且**画像不再作为设计约束**，决 35）；\n> 决 12（**双模式取消**，只留全集）。\n> **修订**：决 14 / 23 / 28（**分发链整体推后**，移动端出局，性能预算改桌面）；\n> 决 15（**模板集换成 RTS/MOBA + 第三人称动作两个**，由七款目标游戏倒推）；\n> 决 25（水位不变，**验收人改为项目所有者**）；决 29（理由从「遥远的阶段五」改为「**七款里五款是联机游戏**」，\n> 它现在是被证成的，不是预付的）；决 30（同屏完整模拟实体 **500 → 1000**）。\n> **新增**：决 35（门槛由 **AI + 内置教程**承担）、决 36（**动画栈档 2**：状态机 + 混合 + root motion）、\n> 决 37（**运行期动态集合**，§4.7 第五个概念）、决 38（群体寻路与视野**提回内核**）、\n> 决 39（**范围纪律改判据源**：从「两个模板」改为「两款目标游戏且分属不同簇」）。\n>\n> **护城河换了位置**：原文押 I2 + I3（普通人读得懂），现在押 **I1 + I3**——\n> **AI 与人共用同一条编辑通道、产出同一种材料**。「普通人」从前提降级为**目标**。\n>\n> ---\n>\n> ## **v18** · 2026-08-08 · **AI 自主组装（决 40）**\n>\n> **改的是一处措辞错误，加的是一条分档留口。**\n>\n> 原文把「聊天框一句话生成整个游戏」列为方向性封顶，理由是「不可控、与 I3 冲突」。\n> **那把「规模」当成了封顶对象，而该封顶的是「形态」**——\n> 只要产出仍是 Action 序列、仍落成能看见能手改的规则行与物体，**任务多大都不违反 I3**。\n> 这与 v8 犯过的错误同源（附录 A.8：该管的是「做到哪儿为止」，不是「做不做」）。\n>\n> **决 40** 把 AI 的参与度分三档：档 1 多步变更集 + 自己试玩（本轮做）、\n> 档 2 **受监督的自主循环**（留口）、档 3 **AI 造零件**（留口），并写下四条留口条件 A1–A4。\n> 同时澄清 §5.5「不做 agent 框架」指的是**不引入通用框架作依赖**，不是禁止自主循环。\n>\n> 本文是后续所有技术决策的裁决依据——任何与本文冲突的提议，要么改提议，要么先改本文。\n> 论证与证据集中在[附录 A](#附录-a--关键决策的依据)，正文只写结论。\n\n---\n\n## 零 · 冷启动\n\n只读这一节就能判断一个提议该不该进来。\n\n### 0.1 一句话定义\n\n> **一个 AI 与人共用同一条编辑通道的通用 3D 网页游戏引擎编辑器：\n> 游戏逻辑是数据，AI 和鼠标是同一个命令层的两个前端，产出的是同一种材料。**\n\n> **v17 换掉了原来那句**（「一个普通人也能上手的……界面对人友好，底层保持技术性，\n> AI 是把两者连起来的那座桥」）。原句把 AI 定位成**桥**——连接普通人与技术底层的中间物；\n> 而 AI 现在是**主结构**，不是桥。门槛由 AI 与教程承担（决策 35），\n> 但那是这条定义的**推论**，不是它本身。\n\n### 0.2 十二条不变量\n\n违反其中任何一条的提议，直接驳回；真要破，必须先改本节并写明理由。\n**v17 改了三条（I2 / I4 / I8），理由在表下。**\n\n| # | 不变量 | 破了会怎样 |\n|---|---|---|\n| **I1** | 编辑期的一切变更**只能**经由 Action 层 | 撤销、回放、AI 校验全部失效 |\n| **I2** | 游戏逻辑是**数据**（事件表），不是代码，且**可读、可逐行 diff、可被约束层校验** | AI 产出变成黑盒；逐行 diff、局部重试、可审计全部失效 |\n| **I3** | AI 的产出与人手做的是**同一种材料**，用户能接手继续改 | 同上。**与 I1 并列为护城河** |\n| **I4** | 门槛由 **AI 与内置教程**承担，**不靠削能力、不靠做浅底层**（决策 35） | 要么用户跨不过去，要么引擎能力被永久封顶 |\n| **I5** | 模块之间只通过**显式契约**通信（组件 / Action / 条件动作） | 模块不可替换，「通用内核」名存实亡 |\n| **I6** | 内核只放**至少两款目标游戏需要、且分属不同簇**的东西（决策 39） | 内核膨胀，最可能的死法 |\n| **I7** | 任何时候都能**不开界面**跑完整场景并断言结果 | 迭代成本失控 |\n| **I8** | 能力面是 registry 的**视图**，不是数据分叉：任何裁剪过的界面都共享**同一份数据、同一套 Action、同一个撤销栈** | 一旦分叉就是两个编辑器，维护翻倍 |\n| **I9** | 事件表与玩法组件**不得引用具体美术资源**，只引用语义名 | 玩法与美术焊死，「一种玩法多种风格」不成立 |\n| **I10** | 引擎**不得依赖任何单一供应商的独有能力**；能力不足的模型必须能降级运行 | 「接入各种模型」变成空话，用户被锁死在一家 |\n| **I11** | **已发布的链接必须永远能打开**：快照自带版本、引擎保留迁移链、标识符只增不改 | 一次重命名就把所有人已发布的作品变成砖 |\n| **I12** | 事件表**不得引用具体输入设备与宿主 API**，只引用**输入意图**（跳跃 / 确认 / 移动） | 平台与设备被写进作品；移植时要用户回去改自己的规则 |\n\n**v17 为什么改这三条**：\n\n| 原文 | 改成 | 理由 |\n|---|---|---|\n| I2「**普通人读得懂**」 | 「**可读、可逐行 diff、可被约束层校验**」 | 「普通人读得懂」曾是护城河的一半，现在护城河是 I1 + I3。**但「逻辑是数据」这件事一条没松**——它现在的理由更硬：逻辑一旦变成代码，AI 的产出就无法走 Action 层、无法逐行 diff、无法局部重试，**I1 直接失效**。见 [A.12](#a12-决策-35为什么门槛可以交给-ai-与教程) |\n| I4「界面对普通人友好，底层不因此变浅」 | 「门槛由 **AI 与内置教程**承担」 | 原文把「友好」寄托在界面简化上，代价是双模式与术语层两套机制。**决策 35 换了承担者**：门槛交给 AI 与教程，界面回到一套全集 |\n| I8「简易模式与专业模式共享同一份数据」 | 「能力面是 registry 的**视图**，不是数据分叉」 | 双模式已由决策 12 取消。**但这条不变量要留着**——它管的是「任何裁剪界面都不许分叉数据」，日后真要做面向新手的裁剪视图，这条仍然生效 |\n\n### 0.3 术语\n\n**v17 起没有术语层了**（决策 12 取消双模式）。界面直接用工程术语：实体、组件、Action、约束、事件表、规则行、配方、皮肤包、kind、模板、播放模式。\n目标用户是有经验的游戏研发人员（决策 19′），这些词是他们的母语，**翻译一遍反而增加理解成本**。\n\ni18n 仍然保留，但它现在只做**语言翻译**，不再兼任「内部词 → 界面词」的映射层。\n这是决策 12 取消后**顺带省下的一整套机制**。\n\n### 0.4 已定 / 未定 / 不做\n\n- **已定**：[§2 决策表](#二--决策表)的 40 项 + 上面 12 条不变量。不再重新讨论，除非有新事实推翻前提。\n- **未定**：[§9 未决项](#九--未决项)。欢迎提方案。\n- **不做**：[§3.4](#34-能力与边界)的「封顶」列。提之前先看那张表。\n\n### 0.5 编辑规则\n\n1. **不写工期、预算、人力。**\n2. **决策表只增不改。** 推翻旧决策要写明推翻了什么、为什么，不要静默改写。\n3. **判据必须可判定。** 「达到 Unity 水准」这类说法一律换掉。\n4. **单点技术选型另开 ADR**（`design/adr-NNN-*.md`），本文只引用结论。\n5. **每次结构性改动更新版本号**并在开头说明这一版确立了什么。\n\n### 0.6 版本沿革\n\n| 版本 | 确立了什么 |\n|---|---|\n| v1 | 从「城建游戏」转向「通用引擎」；ECS + Action 层 + 播放沙箱；模块化契约与试飞台 |\n| v2 | 面向普通人；逻辑层由 JS 换成可视化节点图；AI 升为**产品本身**；入口改为**模板** |\n| v3 | 简易 / 专业**双模式**；最小 AI 提前到阶段一末；脚本化试玩提前到阶段二 |\n| v4 | 据竞品调研：逻辑层改为**事件表**（决 13）；**分享 + remix 进入本轮**（决 14）；通用性改由**三个小模板**证明、平台跳跃排第一（决 15）；受限 3D（决 16）；素材库与导入并重（决 17）；**表达力不砍、门槛靠配方降**（决 18）；用户画像（决 19）；物理上提进内核、寻路砍出去 |\n| v5 | **呈现与玩法分离**：皮肤包成为内核一等公民（决 20）+ **不变量 I9**；契约新增 `kinds` / `skins`；闸门 C 新增「换皮不变」判据；roadTypes 主题机制认定为原型并将归并 |\n| v6 | **模型接入是一等功能**（决 21）+ **不变量 I10**：供应商无关适配层、能力契约与降级矩阵、用量与隐私透明、本地模型支持；闸门 D 新增「换一家模型仍可用」判据 |\n| v7 | **用户心流写进正文**（§1.3）：首次八步 + 主循环 + 回访 + remix 回流 + 步骤与闸门的映射；**首次路径零配置**（决 22）——AI 模型设置改为按需触发，不在首次路径上 |\n| v8 | **成品感下限**（决 23）。「明确不做」拆成**能力天花板**（§3.4，做但封顶）与**范围外**（§3.5，真不做）；音频 / 动画过渡 / 特效 / 材质与光照 / 后处理 / 移动端可玩 / 皮肤包编辑**由「不做」改判为「做，有封顶」**；事件表放开多层子事件与参数位算术；闸门 C 新增「手机上能玩且有声音」 |\n| v9 | 补齐四处工程空白（**§3.6 工程底线**）：性能预算（首包 3MB / 冷启动 5s / 30fps / 500 实体）、**发布快照的向前兼容（I11）**、本地数据脆弱性（自动保存 + 导出工程文件）、用户内容安全面（overlay 禁 `innerHTML`）；新增风险 11–12 与**项目级退役条件** |\n| **v10** | **保住移植退路**（决 24 + **I12**）：播放期分包、**输入意图映射**（事件表写「跳跃」不写「空格」，设备绑定是一张可换的表）、宿主能力抽象；明确「换实现作品留得下，换求值语义留不下」，**事件表求值语义定下即按 I11 冻结** |\n| **v11** | **目标水位抬到「完整作品」**（决 25）：总判据换成一款可上架的完整游戏（3 关 / 存档 / 技能 / 30 分钟）；新增**场景与流程 · 可复用行为单元 · 运行期状态存取**三个架构概念（§4.7）；**运行时存档由「不做」改判为做**；真函数结案为**要做**；防膨胀手段改为**架构留口 + 分批实现**（决 26）；模板集加**完整作品模板**；新增**闸门 F** |\n| **v12** | **灰盒 MVP 压测**（附录 A.9）：区分「成品判定」与「核心玩法循环判定」，后者下 Dota / 星际 / 红警 / 艾尔登 / 塞尔达**五款可做**、CS 只有单人；据此补进内核**播放期选择与指令 · 播放期放置与建造 · 动画事件**，战争迷雾进 RTS 模块，数值表达力入未决项 |\n| v13 | **内容生态是长期目标**（决 27）：§3.5 拆成**本轮不做但架构留口**与**真封顶**；市场 / 社区 / 账号 / 云工程移入前者；模板 · 皮肤 · 配方 · 素材 · 模块**统一为「内容包」** |\n| **v14** | 据四问定案：**发布即需注册**（决 28，修订决 14 / 22——创作七步仍无账号）；**确定性升为硬要求**（决 29，联机是闸门 F 之后的下一个大方向，先做 lockstep）；**现在就设计分块与流式加载**（决 30，S1–S3 三条纪律）；完整作品模板定为**小型 roguelite**；新增**阶段五 · 联机**与风险 13–16 |\n| **v15** | **一次结构精简**（不改任何决策）：三张能力表合成**一张按主题分组 + 状态列**；**配方并入行为单元**（配方 = 行为单元的预设）；补写**场景与块的关系**；点破「可替换的东西都是一张映射表」；三种状态固化并成一表；依据归入附录（新增 A.10）；修顺序、清 stale、删重复申明；**并修掉两处一直挂着没改的硬错误**——约束层的机制归到阶段二（闸门 C.6 依赖它）、补上「视听层只读 + 断言范围限定在玩法状态」 |\n| **v18** | **AI 自主组装**（决 40）：封顶对象从**规模**改为**形态**——「一句话生成整个游戏」不再封顶，「产出不可寻址不可手改的黑盒结果」才是；AI 参与度分三档（多步变更集 / 受监督的自主循环 / AI 造零件），后两档留口 + 条件 A1–A4；澄清「不做 agent 框架」的所指；新增风险 20 |\n| **v17** | **重定方向**（推翻式修订，起因：七款目标游戏摆上桌后原前提站不住）。用户画像 → **有经验的游戏研发人员**且**不作为设计约束**（决 35，推翻决 2、19）；**取消双模式与术语层**（推翻决 12）；**分发链整体推后**（修订决 14/23/28），移动端出局，性能预算改桌面；**模板集换成 RTS/MOBA + 第三人称动作**（修订决 15）；**动画栈开到档 2**（决 36）；**运行期动态集合**（决 37）；**群体寻路与视野提回内核**（决 38）；**范围纪律改判据源**（决 39）；护城河从 I2+I3 换成 **I1+I3**；改 I2 / I4 / I8 三条不变量 |\n| **v16** | **收口不可逆项与三处缺口**：求值语义**前置到阶段零**（决 31 + **ADR-002**）——它是唯一不可逆的一项，却一直排在最后；**数据表**成为 §4.7 第四个概念（决 32）；**最小关节**（固定 / 铰链）进本轮（决 33）；**内核例外计数闸门 ≤ 3**（决 34）；补**确定性沙箱**（决 29 的执行漏洞，§7.1 禁止项 + 风险 17）与**决策 4 的依据**（A.11）；A.9 增补**玩法契合度**与三款补测 |\n\n---\n\n## 一 · 产品定义\n\n### 1.1 用户是谁\n\n> **有经验的游戏研发人员。**（决策 19′，v17 推翻原「不写代码的普通人」）\n\n懂关卡设计、数值、状态机、碰撞、帧；用过至少一个商业引擎；**看得懂也写得出代码**。\n他们要的不是「更简单的引擎」，是**一条 AI 能真正接手的编辑通道**。\n\n#### 但画像不是设计约束（决策 35）\n\n> **不要用画像去反推该做什么、不该做什么。**\n\n这是 v17 最重要的一句话，因为**原文档正是这么做的**：因为用户是普通人，所以要双模式、要术语层、\n要削表达力、要限制概念数量——**四条约束全部由画像推导而来，而画像是全文最容易变的一条假设**。\n\n新的分工是：\n\n| 承担者 | 承担什么 |\n|---|---|\n| **内置 AI**（决策 8、21） | 「我不知道怎么做」——一句话变成可预览、可撤销、可手改的 Action |\n| **内置教程**（决策 35，v17 新增） | 「我不知道有这个东西」——按能力组织的可交互教程，就在编辑器里，不是外链文档 |\n| **模板 + 配方**（决策 9、18） | 「我不想从零开始」 |\n| **约束层**（§5.1） | 「我做错了但不知道错在哪」 |\n\n**四条合起来替代了原来的「把界面做浅」。** 于是：\n\n- 能力面回到**一套全集**，没有简易/专业之分（决策 12 取消）\n- 表达力的封顶**只由技术理由决定**（可校验、可 diff、确定性），不再由「读得懂」决定\n- 概念数量**不设上限**，但**每加一个概念，必须同时给出它的教程条目或配方**（§1.4）\n\n**门槛没有消失，只是换了承担者。** 论证见 [A.12](#a12-决策-35为什么门槛可以交给-ai-与教程)。\n\n### 1.2 用户拿到的是什么\n\n```\n模板   = 世界状态 + 事件表 + 资产引用 + 皮肤包 + 依赖的模块声明\n```\n\n三条推论：\n\n1. **模板是普通工程，不是特殊格式。** 用户改完可另存为自己的作品，也可把作品变成模板。\n2. **模板由模块提供**（契约的 `templates` 字段）。\n3. **模板必须能被 AI 读懂**——它是 AI 理解「这个游戏在做什么」的入口。\n\n在模板之上，用户手里有四种可改的东西，**全部是同一种材料**：\n\n| 改什么 | 形态 |\n|---|---|\n| 摆什么 | 物体与属性 |\n| 玩法规则 | **事件表**，可从**配方**改起，也可直接写规则行（决策 13、18） |\n| 复用与数值 | **行为单元 + 数据表**（§4.7） |\n| 让 AI 改 | 一句话 → 若干条 Action，可预览可撤销 |\n| 长什么样 | **换皮肤包**（决策 20） |\n\n（v17 删掉了原来的「门槛」列——决策 35 之后，门槛由 AI 与教程承担，不再是每项能力自带的属性。）\n\n### 1.3 用户心流（产品的真正判据）\n\n> **一图版**：[overview.svg](../diagrams/overview.svg) 第 4 图 · 用户流程\n\n**心流有两条**（首次与回访），**中间有一个循环**，**结尾有一条回流**。\n不在这张图上的功能，往后排——这比「至少两个模板都需要吗」更贴近产品判断。\n\n#### A · 首次心流：从打开到第一次被人玩\n\n| # | 步骤 | 用户看到什么 | 为什么在这个位置 |\n|---|---|---|---|\n| 1 | **打开** | **模板库**，几个能直接玩的东西。不是空场景，不是输入框，**不是设置页** | 决策 9。**空白页对谁都是浪费时间**——理由不再依赖画像 |\n| 2 | **选一个，先玩** | 点进去直接**试玩**一局 | 先建立「我要做的是这种东西」的目标感。没玩过就开始改，等于闭着眼睛改 |\n| 3 | **改一个数** | 改敌人血量 / 跳跃高度 → 再试玩 → **看到差别** | **第一次正反馈**，必须发生在前十分钟 |\n| 4 | **改玩法** | 打开事件表，从**配方**入手：改一半、加一条规则行 | 决策 13、18。配方让这一步是「改」，不是「学」 |\n| 5 | **让 AI 帮忙** | 「加一种会飞的敌人」→ 生成 3 行规则 → 预览 → 接受 → **自己再手改一行** | 决策 8。**I3 在这一刻被用户亲身验证**。内置 AI 开箱即用，此处**不需要任何配置** |\n| 6 | **换风格 / 调视听** | 换整套皮肤；调材质与光照预设、后处理档位、配上音效 | 决策 20、23。**玩法定了之后才谈表达**——美术是对已定玩法的表达，不是它的前提 |\n| 7 | **检查与打磨** | 试玩通过、约束面板无红点、（可选）让 AI 自己试玩并报告 | 「游戏整合」的正名。**它不是把零件拼起来，是确认这东西真的能玩通、拿得出手** |\n| 8 | **导出** | 一个按钮 → **自包含工程文件**，自己收着或发给别人 | **v17 修订**：分享链接与账号整体推后（决 14 / 28）。本轮的终点是导出，不是发布 |\n\n> **v17 对这张表的修订**：\n> 第 1 步的理由从「普通人怕的不是复杂，是不知道从哪下手」改为「**空白页对谁都是浪费时间**」——\n> 决策 9 的结论不变，理由不再依赖画像。\n> 第 7 步删掉「在手机上试一次」（移动端本轮出局）。\n> 第 8 步从「发布 + 注册」改为「导出工程文件」。\n> **新增一条贯穿始终的旁路**：任何一步都能唤出**内置教程**（决策 35），\n> 它不挡在路上，但永远在手边——这是「模板优先，空白页有罪」与「教程」的正确关系，\n> 原文档否掉的是**「空场景 + 教程」作为入口**，不是教程本身。\n\n**关于第 6 步的位置**：换皮仍然是**成本最低、成就感最高**的一步，但它排在玩法之后——\n**先知道这游戏是什么，再决定它长什么样**，这也是真实制作的顺序。\n\n两条推论：\n\n- **第 3 步的分量因此更重**：第一次正反馈只能靠「改一个数 → 看到差别」，\n  不能指望换皮来兜底。这一步的手感要打磨到位\n- 换皮落在**导出前一步**，天然成为「让它成为我的作品」的收尾动作\n\n#### B · 主循环（第 3–7 步真正的形状）\n\n制作不是线性的。上面 3–7 步实际是一个循环，**每一圈都要短**：\n\n```\n        ┌───────────────────────────────┐\n        ↓                               │\n   改点东西  →  试玩  →  看到差别 / 看到问题\n   （物体 / 规则 / 让 AI 改 / 风格）      │\n        ↑                               │\n        └───────── 不满意就撤销 ─────────┘\n```\n\n三条支撑它的机制，全部已在计划里：**播放沙箱**（退出即回滚，试玩不污染工程）、\n**任何操作都能撤销**（含 AI 的）、**约束层当场说人话**（不用等到试玩才发现错）。\n\n**循环的长度是产品质量的核心指标**：从「改」到「看到结果」超过几秒，心流就断了。\n\n#### C · 回访心流：第二次打开\n\n```\n打开 → 项目门厅（我的作品 + 最近编辑 + 模板库）→ 直接回到主循环\n```\n\n回访用户**不该再看一遍模板库的推销**，也不该重新选类型。已有的项目门厅正是这一步。\n\n#### D · 回流：remix 让终点变成起点（**v17 推后**）\n\n```\n你发布 → 朋友打开链接玩 → 点「改成我的」 → 他从第 3 步开始\n```\n\n决策 14 的循环是「做 → 分享 → 被玩 → 被 remix → 再做」，\n**它仍然是长期目标，但整条链推到开放阶段**（§6 阶段四）。\n本轮的等价物是**导出工程文件**：自包含、能发给别人、别人打开就能改。\n**remix 的语义因此现在就成立，只是走文件而不是走链接。**\n\n#### E · 关于「设置 AI 模型」在哪一步\n\n> **不在创作路径上。**（决策 22，v14 收窄，v17 再次收窄）\n>\n> v17 起**全流程都不问账号**——发布与注册整体推后。\n> 剩下的唯一按需触发项是 **API key**。\n\n把配置 API 放在第 3 步，等于要求一个还没玩到任何东西的人**先完成一次技术配置**——\n这是整条路径上最强的流失点，而且与决策 9「打开即有能玩的东西」直接冲突。\n\n正确的位置是**按需触发**，三个入口：\n\n| 触发时机 | 用户看到 |\n|---|---|\n| 内置额度用完 / 想用更强的模型 | 「换成你自己的模型？」——就在 AI 面板里，不用去翻设置 |\n| 想让数据不出本机 | 隐私说明旁边一个「用本地模型」 |\n| 主动去设置页 | 随时可以，但**不主动挡路** |\n\n配置本身要好用（预设 + 自定义端点 + 测试连接 + 用量可见），细节见 [§5.5](#55-模型接入决策-21)。\n\n#### F · 每一步对应的决策与闸门\n\n写这张表是为了保证心流与决策**互相咬合**，任何一步都能追溯到判据：\n\n| 步骤 | 决策 | 闸门判据 |\n|---|---|---|\n| 1–2 打开 / 选模板试玩 | 9、15′ | C.1 C.2 |\n| 3 改一个数 | 35（教程可达） | D.5 |\n| 4 改玩法 | 13、18、25 | **D.5 教程可用性**、F |\n| 5 让 AI 帮忙 | 8、21 | D.1 D.2 **D.6 换模型仍可用** |\n| 6 换风格 / 调视听 | 20、17、23 | **C.5 换皮不变** |\n| 7 检查与打磨 | I7、约束层、25 | C.3 D.4、**F 完整作品** |\n| 8 导出 | 24（P1 分包）、§3.6.3 | C.4 导出的工程文件能在另一台机器打开并继续改 |\n\n**心流走通一遍 ≠ 闸门 F 通过**：心流验的是「路顺不顺」，\n**闸门 F 验的是「能不能靠这条路做出一款完整作品」**（§3.1）。\n\n### 1.4 四条设计原则\n\n| 原则 | 内容 |\n|---|---|\n| **每个概念自带入口**（v17 换掉「概念预算」） | 概念数量**不设上限**——目标用户理解 ECS、状态机、确定性。但**每加一个概念，必须同时交付它的教程条目或配方**，否则那个概念等于不存在。这条比数量上限更可判定，也不依赖画像 |\n| **模板优先，空白页有罪** | 先给一个能玩的东西，再让人改它。**空白页对谁都是浪费时间**——理由不再依赖画像 |\n| **AI 是主入口，不是侧边栏** | AI 是修改东西的默认方式之一；但产出必须落成能看见、能手改的规则行与物体，**绝不是黑盒** |\n| **错误必须便宜** | 任何操作都能撤销（含 AI 的）；不合法的操作当场拦住并给出结构化原因；播放出错不白屏，能回到编辑状态 |\n\n### 1.5 一套能力面（决策 12 于 v17 取消）\n\n> **原来这里是「简易 / 专业双模式」。v17 取消了它。**\n\n取消的理由不是它设计得不好，是**它的前提没了**：双模式、术语层、参数裁剪、受限默认值，\n全部是从「用户是不写代码的普通人」推导出来的。画像一改（决策 19′），四样东西同时失去依据，\n而它们的维护成本是实打实的——**风险 8「两种模式退化成两个编辑器」也随之消失**。\n\n**现在只有一套能力面：全集。** 但**机制留着**：\n\n| 保留的 | 形态 | 为什么留 |\n|---|---|---|\n| **能力面是 registry 的视图**（I8） | Action registry 支持按标签过滤，**本轮不实现任何过滤视图** | 日后真要做面向新手的裁剪界面，这是入口；且它本来就是 registry 的自然能力，留着不花钱 |\n| 相机档位 | 四档全给，**默认不再是受限俯视** | 决策 16 的「受限」是为零基础用户设的默认值；对目标用户，默认给回自由 |\n\n> **新纪律（替代原来的单向白名单）：新功能直接进全集。\n> 要论证的不再是「该不该暴露」，而是「它的教程条目与配方在哪」**（§1.4）。\n\n### 1.6 通用性服务谁\n\n| | 谁 | 怎么用 |\n|---|---|---|\n| **生产通用性** | 你 / 模块作者 | 写模块、写条件动作、做模板与皮肤 |\n| **消费通用性** | 用引擎做游戏的人 | 选模板、改参数、写规则行、定义行为单元、换皮肤、让 AI 改 |\n\n**v17 的变化**：原文说「普通人不直接消费通用，他消费的是模板 + 配方」。\n现在两层的**边界模糊了**——有经验的研发人员会在两层之间来回走：今天用配方，明天拆开改，\n后天自己写一个条件动作。**这正是决策 18「同一份材料」想要的结果**，只是原来假设用户永远停在消费侧。\n\n---\n\n## 二 · 决策表\n\n**只增不改。** 依据见[附录 A](#附录-a--关键决策的依据)。\n\n| # | 决策 | 选择 | 被否掉的是什么 |\n|---|---|---|---|\n| 1 | 交付物 | 通用 3D 游戏引擎编辑器，网页优先 | 只做一款城市建造游戏 |\n| 2 | **目标用户** | **普通人**——不写代码也能创作。友好体现在界面，不是把底层做浅 | 只服务程序员；把能力阉割成玩具 |\n| ↳ | | **v17 推翻**：目标用户改为**有经验的游戏研发人员**（决策 19′）。「不把底层做浅」这半句**保留且加强**；「友好体现在界面」被**决策 35** 取代——门槛由 AI 与教程承担 | |\n| 3 | 通用性形状 | 通用内核 + 领域模块 | Godot 式通用节点树；先做完城市再重构 |\n| 4 | 维度 | 只做 3D | 2D 一等公民；双模式 |\n| 5 | 实体模型 | ECS。**对用户不可见** | 节点树；ECS/树混合 |\n| 6 | **逻辑层** | ~~可视化节点图为主~~，**JS 用于实现条件与动作（高级门）** | 让普通用户写 JS；纯声明式规则 |\n| ↳ | | **节点图部分已被决策 13 推翻**；「逻辑是数据、JS 下沉为实现层」保持有效 | |\n| 7 | 分发形态 | 同一个应用，切播放模式 | 导出独立包；云端托管 |\n| 8 | **AI 定位** | **AI 就是产品本身。** 内置 AI + 允许接入用户自己的 API | 只作内部工具；只做辅助功能 |\n| 9 | **入口体验** | **从模板改**。打开即有能玩的东西 | 空场景 + 教程；空白页 + 输入框 |\n| 10 | 存量资产 | 冻结路 / 地形，先做内核 | 继续加道路功能；直接放弃重写 |\n| 11 | 交付验证 | 两个截然不同类型的游戏 | 单一 demo；纯视觉展示 |\n| ↳ | | **已被决策 15 修订为「3–4 个小模板」** | |\n| **12** | **界面形态** | **同一编辑器两种模式**：简易 / 专业。同一份数据与 Action，只有暴露面不同 | 两个独立编辑器；靠开关堆选项 |\n| ↳ | | **v17 取消**：只留**一套全集**（§1.5）。双模式、术语层、参数裁剪、受限默认值**全部是从旧画像推导来的**，画像一改就同时失去依据。**机制以 I8 的形式保留**（registry 视图），本轮不实现任何过滤视图 | |\n| **13** | **逻辑层形态** | **事件表**（有序的「当……就……」规则行 + 分组）。修订决策 6 | 节点图作控制流；画布、连线、布局算法 |\n| **14** | **分享** | **链接即玩 + 一键 remix**，阶段二交付，自建极简后端 | 导出独立包；社区 / 商店；纯前端塞 URL |\n| ↳ | | **v14 修订**：原文写「不做账号」，已被**决策 28** 推翻——发布需要注册，后端因此要承担用户数据 | |\n| ↳ | | **v17 推后**：链接分享、后端、账号**整体推到开放阶段**（§6 阶段四）。本轮的等价物是**导出自包含工程文件**——remix 的语义现在就成立，只是走文件不走链接。**风险 13、14 因此从表里移除** | |\n| **15** | **通用性验证** | **3–4 个差异明显的小模板**；城市迁移降为**可选** | 用两个深模板证明；把城市迁移作为闸门 |\n| ↳ | | **v11 修订**：小模板倒推不出完整游戏的能力，**必须再加一个「完整作品模板」**（带多关卡、存档、技能系统） | |\n| ↳ | | **v17 重立**：模板集换成**两个**——**RTS / MOBA** 与**第三人称动作**，由七款目标游戏塌缩而来（§5.6）。塔防并入 RTS（是它的子集）；平台跳跃降为**内部脚手架**，不作交付模板；完整作品模板并入第三人称动作模板。差异轴（相机 / 控制 / 节奏 / 联机）比原来四个小模板拉得更满 | |\n| **16** | **空间自由度** | **受限 3D**：默认地面平面 + 固定相机档位；自由飞行**一键可切** | 照抄 Blender/Unity 的飞行相机作默认 |\n| **17** | **素材来源** | **内置素材库 + glTF 导入并重**；文生 3D 作为可插拔 provider | 自研生成模型；只给素材库不给导入 |\n| **18** | **学习路径** | **配方优先**：表达力不砍，门槛靠「成套现成规则，改它就能学会」降低 | 削表达力换易懂；空白事件表 + 教程 |\n| **19** | **用户画像** | **有美术 / 设计底子、但不写代码的人**（决策 2 的细化） | 面向儿童；面向程序员；不锁定人群 |\n| **19′** | **用户画像（v17 推翻重立）** | **有经验的游戏研发人员**：懂关卡、数值、状态机、碰撞、帧，用过商业引擎，看得懂也写得出代码。**且画像不作为设计约束**（决策 35） | 继续用画像反推「该做浅什么」——那是原文档四条约束（双模式 / 术语层 / 削表达力 / 概念上限）的共同来源，而画像是全文最易变的假设 |\n| **20** | **呈现与玩法** | **分离。皮肤包是一等公民**：实体持有语义种类，视觉由皮肤包解析 | 实体直接持有模型材质；主题只做成模块私有实现 |\n| **21** | **模型接入** | **供应商无关 + BYOK 是一等功能**：填 base URL / key / 模型名即可用，含本地模型；能力不足自动降级 | 绑死一家供应商；把 BYOK 做成埋在设置深处的高级选项 |\n| **22** | **首次路径零配置** | **打开到第一次发布，全程不需要任何配置**。设置 AI 模型等一律**按需触发**，不挡路 | 开场向导；先配 API 再进编辑器；先注册账号 |\n| ↳ | | **v14 修订**：范围收窄为**创作路径零配置**（打开 → 试玩 → 改 → 换皮 → AI，全程无账号）。**发布是分界点**，那一刻要注册（决策 28） | |\n| ↳ | | **v17 复原并扩大**：账号整体推后，**全流程零账号**。剩下唯一的按需触发项是 API key | |\n| **23** | **成品感下限** | **不写代码也能做出「看起来、听起来像成品」的东西**。音频 / 动画过渡 / 特效 / 材质光照 / 移动端可玩**都要做，但各有封顶**（§3.4） | 把这些一律划进「不做」；也不做 3A 视觉 |\n| ↳ | | **v17 修订**：**移动端可玩出局**（本轮不做触屏与自适应，留口）；其余各项**保留**——它们的理由从「作品要发出去」换成「**四款动作游戏对视听的要求本来就在那**」，动画部分反而由决策 36 加强了。原判据「手机上打开就能玩」从闸门 C 移除 | |\n| **24** | **移植退路** | **本轮不做导出**，但架构必须保住「日后套壳成端游 / 手游」这条路：播放期分包、输入意图、宿主能力抽象（§3.6.5） | 现在就做导出与打包；也不做「把平台写进作品」的省事方案 |\n| **25** | **目标水位** | **能做出完整作品**：有头有尾、能存进度、有技能系统、能上架。**判据见 §3.1** | 只做「验证一轮」的小品；也不对标 AAA / Unreal（与决策 2 冲突） |\n| ↳ | | **v17 修订**：水位与判据**一字未改**，只改**验收人**——从「一个没碰过引擎的普通人」改为**项目所有者**。理由是「先自用 → 再验证 → 再开放」的顺序（§6）。「不对标 AAA」的理由从「与决策 2 冲突」改为「**那是 300 人 × 5 年，不是编辑器功能问题**」（A.9 原话） | |\n| **26** | **防膨胀的手段** | **架构留口 + 分批实现**：数据模型现在就预留，功能可以后补 | 靠**砍能力**防膨胀——那会让上限被永久钉死 |\n 2、18 的推导方式）；也不做「因为专业所以不管上手」的反向偷懒 |\n| **36** | **动画栈档位** | **做到档 2：状态机 + 混合 + root motion**。七款里四款是第三人称动作（塞尔达 / 艾尔登 / 刺客信条 / TPS） | 停在 crossfade（档 1 做不出艾尔登的位移与硬直）；也**不做档 3**（IK / 动作匹配 / 上下半身分层）——那对另外四款 RTS/MOBA 零贡献，且是无底洞 |\n| **37** | **运行期动态集合** | **可增删的有序集合与键值表进内核**（§4.7 第五个概念）：背包、容器、生产队列、卡组、队伍。**可声明持久化** | 用全局变量堆出背包——Dota 物品栏、艾尔登背包、RTS 生产队列三处同时需要，且格式一旦进存档就撞 I11 |\n| **38** | **寻路与视野提回内核** | **群体寻路 + 局部避让**、**视野与战争迷雾**从模块**提回内核** | 维持「寻路进塔防模块、迷雾进 RTS 模块」——那是旧模板集下的判定，新判据源下五款以上要它们 |\n| **39** | **范围纪律的判据源** | 判据从「**至少两个模板**都需要」改为「**至少两款目标游戏需要，且分属不同簇**」（俯视指令簇 / 第三人称动作簇） | 继续用模板数量做判据——本轮只有两个模板，「两个都要」等于「全都要」，**纪律会静默失效** |\n| **40** | **AI 自主组装** | **分三档**（§5.4）：档 1 多步变更集 + 自己试玩（**本轮做**）；档 2 **受监督的自主循环**（留口）；档 3 **AI 造零件**（留口）。**封顶对象是形态不是规模**——产出必须始终是 Action 序列 | 把「一句话生成整个游戏」当成方向性封顶——那封的是**规模**。真正该封的是**黑盒形态**：产出不可寻址、不可手改、改一处要重来 |\n\n---\n\n## 三 · 范围\n\n### 3.1 目标水位与成功判据（决策 25）\n\n> **一个通用内核 + 若干领域模块 + 事件表逻辑层 + AI 作者接口 + 分享 remix 闭环，\n> 合起来让一个人不写代码就能做出一款完整作品，并且做完有人玩。**\n\n**目标水位 = 完整作品，不是 AAA。**\n\n| | 要达到 | 明确不对标 |\n|---|---|---|\n| 参照 | **内容规模**上是《星露谷》《空洞骑士》这一档：一个人能做完、有头有尾、能上架 | 塞尔达 / CS / Dota 的**成品**——那是 300 人 × 5 年，或竞技网络与运营，不是编辑器功能问题 |\n\n> **v17 提醒**：上面三款参照全是 2D，它们参照的是**内容规模**，不是技术形态。\n> 「一个人能做完」这个水位是从 2D 案例借来的，**3D 的实际成本还没被参照过**——\n> 这一点写在这里备查，见 [A.11](#a11-决策-4只做-3d-的依据补于-v16) 记下的代价。\n>\n> **注意区分**：本节说的「不对标塞尔达」指的是**成品**。\n> 而 [A.9](#a9-主流玩法压力测试) 判定塞尔达的**核心玩法循环**可做——那是两种不同的判定，\n> 且七款目标游戏用的是后者。\n\n#### 唯一的总判据\n\n> **一个人用这个编辑器，做出一款能发到 itch.io 上的完整作品：**\n> 标题画面 → **至少 3 个关卡** → **能存进度** → **有技能或道具系统** → 有胜负结算 →\n> 有音画 → **30 分钟以上内容**。\n>\n> **v17 三处修订**：删掉「不写一行代码」（目标用户会写代码，且专业模式本来就允许用 JS 实现条件动作——\n> 真正要守的是**逻辑必须是数据**，那由闸门 F 的「没有一行专门为它写的硬编码 JS」管着，见 §6）；\n> 删掉「手机能玩」（移动端出局）；**验收人 = 项目所有者**（决策 25 的 v17 修订）。\n\n这条替代了原来的「能改出一个和模板明显不同的关卡」——那是**验证判据**，不是产品判据。\n\n#### 分项判据\n\n| 判据 | 要达到 | 明确**不**追求 |\n|---|---|---|\n| 世界会自己运转 | 单位、波次、经济、技能、状态能跑通 | 大世界模拟 |\n| **游戏有长度** | **多关卡 + 存进度 + 流程**（§4.7） | 云存档、多存档槽管理 |\n| **玩法有深度** | **技能 / 道具 / buff 靠可复用行为单元表达**（§4.7） | 图灵完备脚本 |\n| AI 真的好用 | 一句话生成 / 修改关卡与逻辑，可预览可撤销 | 一句话生成整个游戏 |\n| **上手成本可控**（v17 换掉「普通人能上手」） | **每个概念都有教程条目或配方**；一个懂引擎但没用过本编辑器的人，能靠内置教程 + AI 走通主循环 | 零基础可用；也不追求「不看任何东西就会」 |\n| 玩法与美术可分开迭代 | 换一套皮肤，一行规则不改，断言结果一致 | 皮肤市场、节点式材质编辑器 |\n| 作品拿得出手 | 有声音、**动画有状态机与 root motion**、有特效 | 3A 视觉、影视级效果、IK 与动作匹配 |\n| ~~做完有人玩~~ | **v17 推后**：本轮的等价物是「导出的工程文件能在另一台机器打开并继续改」 | 社区、账号、排行、货币化 |\n\n### 3.2 范围纪律（判据源于 v17 更换 —— 决策 39）\n\n> **任何功能进内核之前必须回答：至少两款目标游戏需要，且分属不同簇吗？\n> 只有一款、或都在同一簇 → 进模块。都不需要 → 不做。**\n\n**为什么换判据源**：原判据是「至少两个模板都需要」。而 v17 之后**只剩两个模板**，\n「两个都要」就等于「全都要」——**纪律会静默失效**，且失效时没有任何信号。\n\n新的判据源是**七款目标游戏 + 两个簇**：\n\n| 簇 | 游戏 |\n|---|---|\n| **俯视指令簇** | 红警、星际争霸、魔兽争霸、Dota 2 |\n| **第三人称动作簇** | 塞尔达、艾尔登法环、刺客信条、第三人称射击 |\n\n**「分属不同簇」这半句是关键**：四款 RTS 共同需要的东西（比如生产队列的具体形态）\n只证明了 RTS 需要它，不证明它该进内核。**跨簇才算通用。**\n\n内核每多一个领域概念，模块的可替换性就低一分。**膨胀的内核不是「做得多」，是做错了。**\n\n这条纪律是**双向**的：v4 把物理请回内核、把寻路砍进塔防模块；\n**v17 又按新判据把寻路与视野请回了内核**（决策 38）——判定随事实改判，两次都是。见 [§5.2](#52-内核归属论证)。\n\n### 3.3 成品感下限（决策 23）\n\n> **引擎必须保证：用户不写一行代码，也能做出「看起来、听起来像成品」的东西。**\n\n理由不是审美洁癖，是两条已定决策的直接推论：\n\n**v17 换了理由，结论不变**（分发链推后后，原来两条依据都失效了）：\n\n- **七款目标游戏里四款是第三人称动作**。动画过渡、判定盒特效、打击音效**不是修饰，是玩法反馈的一部分**——艾尔登的硬直、塞尔达的元素反应，缺了视听就无从判断游戏在发生什么\n- **决策 25 的水位没变**：一款能上架的完整作品，视听下限是它的一部分\n\n原来的两条依据（作品要发给别人玩、用户有美术底子）随决策 14 推后与画像更换一并失效，**但它们支撑的结论被新依据接住了**。\n\n因此原来那张扁平的「不做」清单被拆成两张：**范围可以砍，质量下限不能砍。**\n\n### 3.4 能力与边界\n\n每一项只有三种状态，**读表时先看第三列**：\n\n| 状态 | 含义 |\n|---|---|\n| **本轮做** | 现在实现，括号内是封顶 |\n| **留口** | 本轮不做，但架构不堵死——后加不用重写、不破 I11 |\n| **封顶** | 引擎永远不提供。要做就得先推翻对应决策 |\n\n> **决策 26：防膨胀靠「架构留口 + 分批实现」，不靠砍能力。**\n> 砍能力是把上限永久钉死，推后实现只是排期。**v11 之前这两件事被混为一谈。**\n\n#### 视听与呈现\n\n| 能力 | 本轮做到 | 状态 |\n|---|---|---|\n| 音频 | 音效 / 背景音乐、音量、循环、停止，都是事件表动作 | 本轮做。空间音频与混音 **留口**；自研音频引擎 **封顶** |\n| 动画 | glTF clip + 交叉淡化 + **状态机 + 混合 + root motion**（决策 36 档 2）+ 事件表与皮肤包驱动状态切换 + **动画事件**（clip 时间点） | 本轮做。**IK / 动作匹配 / 上下半身分层（档 3）封顶**——对四款 RTS/MOBA 零贡献，且是无底洞 |\n| 材质与光照 | 参数面板 + 环境与光照预设 | 本轮做。更多预设 **留口**；节点式材质编辑器、烘焙管线 **封顶** |\n| 后处理 | 预设档位（关 / 柔和 / 强烈） | 本轮做。自定义链 **留口** |\n| 特效 | 预制粒子（命中 / 爆炸 / 拾取 / 尘土 / 拖尾），事件表可触发 | 本轮做。粒子编辑器 **留口** |\n| 皮肤包 | 编辑器内创建与编辑：映射表 UI、另存为自己的皮肤 | 本轮做。皮肤市场 **留口**（属生态层） |\n| 相机 | 四档（受限俯视 / 跟随 / 第一人称 / 自由飞行）+ **肩后跟随**（第三人称动作簇要）+ 平滑 + 震动 + **锁定目标** | 本轮做。**v17：默认档不再是受限俯视**（决策 16 的「受限默认」是为零基础用户设的）。轨道与过场编辑器 **留口** |\n| 游戏内 UI | DOM overlay + 实体锚点 + HUD 预制件 + 界面页（标题 / 暂停 / 背包 / 对话 / 结算） | 本轮做。更多控件 **留口**；引擎内 3D UI 控件系统 **封顶** |\n\n#### 逻辑 · 内容 · 生态\n\n| 能力 | 本轮做到 | 状态 |\n|---|---|---|\n| 事件表 | 条件 / 动作 / 分组 / 变量 / 等待 / 重复 + 多层子事件 + 参数位算术 | 本轮做。更强表达式 **留口**；**任意控制流与递归 封顶** |\n| 行为单元 | 带参数、有 schema 的可复用规则组；**配方 = 它的预设**（§4.3） | 本轮做（决策 25） |\n| **数据表** | 具名表 + 有 schema 的列 + 按行 id 取值；事件表与行为单元可引用（§4.7） | 本轮做数据模型 + 最小实现（决策 32）。公式列、外部表格同步 **留口** |\n| **运行期动态集合** | 可增删的有序集合 + 键值表；增删查改四个动作；可声明持久化（§4.7、决策 37） | 本轮做。排序 / 过滤 / 嵌套查询 **留口** |\n| 内容包 | 模板 / 皮肤 / 配方 / 素材 / 模块统一为内容包（§3.5） | 本轮做数据模型 |\n| 资产 / 插件 / 皮肤 / 配方市场 | — | **留口**（决策 27）。留口条件 = 内容包 |\n| 社区层：评论 / 评分 / 排行 / 关注 / 推荐流 | — | **留口**。快照已有内容哈希与作者字段 |\n| 货币化 / 交易 / 分成 | — | **留口**。账号本轮就做，交易层日后叠加 |\n| AI 模型接入 | 供应商适配层 + 能力降级 + 设置界面（决策 21） | 本轮做。模型路由 / RAG / 微调 **留口** |\n\n#### 世界 · 运行 · 平台\n\n| 能力 | 本轮做到 | 状态 |\n|---|---|---|\n| 场景与流程 | 多场景 + 关卡切换 + 流程数据（§4.7） | 本轮做 |\n| 运行期状态 | 存进度 / 读进度，事件表动作（§4.7） | 本轮做。云存档、多存档槽管理界面 **留口** |\n| 物理 | 刚体 + 碰撞 + 空间查询 + **固定与铰链关节**（决策 33） | 本轮做。**其余关节 / 马达 / 布娃娃 / 软体 留口** |\n| 世界规模 | 同屏**完整模拟**实体 ≤ **1000**（v17 上调）；**场景总量不设上限**，按块加载卸载（决策 30） | 本轮做。**模拟细节分级** / LOD / impostor / 地形简化 **留口** |\n| **寻路** | **群体寻路 + 局部避让**（决策 38，v17 从塔防模块提回） | 本轮做。分层寻路、动态障碍重规划 **留口** |\n| **视野与战争迷雾** | 视野计算 + 迷雾状态 + 按阵营查询（决策 38，v17 从 RTS 模块提回） | 本轮做。视野遮挡的精细化（高度差、掩体）**留口** |\n| 确定性 | 逐帧严格确定性，**硬要求**（决策 29） | 本轮做，不允许降级 |\n| 联机 | — | **留口，但方向已定**：**lockstep 指令同步**，服务七款里的五款。**服务器权威 / 客户端预测 封顶**（竞技 FPS 那条岔路已明确避开，[A.9](#a9-主流玩法压力测试)） |\n| 移动端 | — | **v17 出局，留口**。触屏输入、自适应画布、竖屏适配全部推后；输入意图映射（I12）保证日后加设备不用改作品 |\n| **网格世界 / 可破坏建造** | — | **留口**。RTS 的建筑是实体不是网格，摧毁 = 销毁实体，本轮够用 |\n| **体素 / 瓦片世界**（v17 补） | — | **留口**。七款目标游戏无人需要，但它是**唯一一类既没被封顶、也没被留口覆盖的主流玩法**（我的世界 / 泰拉瑞亚 / 僵尸毁灭工程），不写下来就会变成隐性缺口。**留口条件见下** |\n| **载具物理 / 样条路网** | — | **留口**。七款里无人需要；道路存量回到「可选迁移」 |\n| 导出独立包 / 端游手游打包 | — | **留口**。条件 = 决策 24 的 P1–P3（§3.6.5） |\n| 云工程（服务端存编辑中的工程） | — | **留口**。工程存档本来就自包含 |\n| 协同编辑 / 多 agent 合并 | — | **留口**。Action 的 `affects` 影响域已保留，但不为合并做设计 |\n| Action 日志的事件溯源存储 | 内存栈 + 存档时落盘 | **留口**。语义模型不变，换存储实现即可 |\n\n#### 体素 / 瓦片世界的留口条件（v17 补）\n\n**留口不是「以后大概能加」，是「加的时候不用重写、不破 I11」。** 这一项要守住三条：\n\n| # | 条件 | 为什么 |\n|---|---|---|\n| **V1** | **块（决策 30）的边界与实体无关**——块是空间分区，不是「一组实体」。日后体素数据按块存取，与实体按块存取走同一套序列化 | 若块被实现成「实体集合」，体素数据无处安放，要重做分块与流式两套机制 |\n| **V2** | **kind 注册表不假设「一个 kind 一个实体」**——允许一个 kind 描述一类**格子内容**（材质、通行性、耐久） | 体素世界里「石头」不是实体，是几百万个格子的一种取值。kind 若与实体一对一绑死，皮肤包机制无法覆盖体素 |\n| **V3** | **空间查询接口不假设查询对象是刚体**——射线与范围查询留一层抽象，体素地形是它的另一种实现 | 否则事件表里所有「碰到 / 在范围内」的条件都要为体素再写一遍 |\n\n**满足这三条即可**。本轮**不做**：体素存储、贪心网格化、光照传播、地形生成、破坏与放置的编辑工具。\n\n**为什么留口而不封顶**：封顶的含义是「要做就得先推翻决策」，\n而这一项没有任何决策否定过它——它只是**没被任何一款目标游戏需要**。\n排期问题不该写成方向问题（决策 26）。\n\n#### 方向性封顶\n\n这些不是排期问题。要做就得先推翻对应决策。\n\n| 封顶 | 依据 |\n|---|---|\n| 2D 一等公民（Sprite 管线） | 决策 4。2D 用正交相机应付，图标用 billboard |\n| 让写 JS 成为编排逻辑的主路径 | 决策 6。**v17 澄清**：目标用户会写代码，JS 实现条件与动作是**正常路径**不是高级门；但**编排必须是数据**——那是 I1 与 I3 的前提，不是能力问题 |\n| 图灵完备的事件表：任意控制流、递归 | 决策 18 + I2。**v17 换理由**：原理由是「保住普通人读得懂」，现在是**保住可校验、可逐行 diff、可局部重试**——AI 通道的三个前提 |\n| **动画档 3**：IK / 动作匹配 / 上下半身分层 | 决策 36。对四款 RTS/MOBA 零贡献，且是无底洞。**代价写明：刺客信条只到「潜入 + 战斗 + 沿预设点攀爬」，没有丝滑跑酷** |\n| **竞技 FPS 路线**：服务器权威 + 客户端预测 + 延迟补偿 + 反作弊 | A.9。与 lockstep 亲和性相反，会让网络模型裂成两套，成本大一个数量级 |\n| 用削表达力换易懂 | 决策 18。**v17 加强**：门槛由 AI 与教程承担（决策 35），表达力的封顶**只由技术理由决定** |\n| 节点图作控制流 / 画布 / 连线 / 布线算法 | 决策 13。节点图只用于数据流 |\n| 自研物理 / 自研文生 3D / 自研音频引擎 | 集成 Rapier；文生 3D 接 provider；音频用浏览器原生能力 |\n| 风格过强的成套素材（儿童卡通风等） | **v17 换理由**：原理由是画像。现在是**决策 20** —— 内置素材要能被任意皮肤包覆盖，风格太强的素材会让「换皮」失去意义 |\n| **产出不可寻址、不可手改的黑盒结果** | I3。**v18 改写**：原文写的是「聊天框一句话生成整个游戏」——**那把规模当成了封顶对象，而该封顶的是形态**。任务多大都可以（决策 40），只要产出仍是 Action 序列、仍落成能看见能手改的规则行与物体 |\n| 用用户的 key 做用户没要求的事 | 决策 21 |\n| **界面能力面的数据分叉** | I8（决策 12 取消后仍生效）。日后要做裁剪视图，它必须是 registry 的一个视图，不能是第二套数据或第二套 UI 代码 |\n| 开场向导 / **创作路径上的注册墙** | 决策 22 + 28。**v17：全流程零账号** |\n| describe 输出自然语言 | 引擎输出结构化数据，组织语言是模型的事 |\n| 道路系统新功能 | 决策 10。冻结见 [§8](#八--存量资产处置) |\n\n**能力项都过了范围纪律**：至少两个模板都要（见 [§5.2](#52-内核归属论证)）。只有一个模板要的，进模块。\n\n### 3.5 内容包（决策 27）\n\n模板、皮肤、配方、素材、模块**最终都要能被别人拿去用**。本轮不做交易与上架，\n但**从现在起它们必须是同一种东西**：\n\n```\n内容包 = { 稳定 id, 语义化版本, 作者, 许可, 依赖(包 id + 版本), 内容哈希, 载荷 }\n```\n\n- 模板 / 皮肤包 / 配方 / 素材集 / 领域模块，**都是内容包的一种形态**，不是五套机制\n- 作品记录**它依赖了哪些包与版本**；remix 时按此解析\n- 包的 id 与版本遵守 **I11**：只增不改，否则市场上线后所有引用同时失效\n- 本轮**不做**：上架、支付、审核、分成\n\n**账号的边界**（决策 22 + 28）：**创作路径永远不需要账号**——打开、试玩、改、换皮、用 AI，\n七步全程不问；**账号只出现在第 8 步「发布」**。理由是作品归属：匿名发布的作品，\n日后做市场时认领不回来。\n\n\n### 3.6 工程底线\n\n四条与功能无关、但**漏了就要返工**的约束。它们不是「做不做」的选择题，是**边界条件**。\n\n#### 3.6.1 性能预算\n\n**v17 起这几个数字服务的是闸门 C.3（1000 单位不掉帧）与闸门 F**，不再是「手机上打开就能玩」。\n没有数字，判据不可判定。**超了就砍功能，不放宽数字。**\n\n| 指标 | 上限 |\n|---|---|\n| 播放期首包（不含用户素材） | **≤ 8 MB** gzip（v17 放宽：移动端出局，4G 冷启动不再是约束） |\n| 桌面冷启动到可玩 | **≤ 5 秒** |\n| 目标帧率 | 桌面 **60fps**（v17：手机 30fps 一档移除） |\n| 同屏**完整模拟**实体 | **1000** 不掉帧（场景总量不设上限，按块加载——决策 30） |\n| 单块加载耗时 | **≤ 1 帧预算**，不得造成可见卡顿 |\n\n**v17 的改动与它的代价**：移动端出局后这几个数字全部松了，\n但 **P1「播放期与编辑器分包」不能跟着松**——它现在的理由从「3MB 首包」换成\n**决策 24 的移植退路**（§3.6.5）。**这是全表唯一一处不允许放宽的**：\n首包大小可以谈，分包不能谈，否则日后套壳要把整个编辑器打进去。\n\n**这条会倒推架构**：3 MB 的播放期首包，意味着**播放期与编辑器必须分包**——\n渲染桥 + 事件表运行时不得依赖任何编辑器 UI（这一条 §3.5 的分享专条已经要求过，\n这里给了它一个可测量的理由）。\n\n#### 3.6.2 发布即产生外部契约（不变量 I11）\n\n**一旦有人发布了链接，引擎的数据格式就有了外部使用者。**\n\n- **标识符只增不改**：`kind` / 条件动作 / 配方 / 皮肤插槽 / 内容包的 id **发布后即冻结**；\n  要改就新增一个，旧的标 deprecated 并保留迁移\n- **可判定的判据**：半年前发布的链接，今天必须还能打开；迁移链每加一版，回归测试补一条\n\n代价很具体：第一次重构条件动作命名，**所有已发布作品同时变砖**。\n三种存档各自的版本与权威见 [§4.5](#45-两级状态--播放沙箱)。\n\n#### 3.6.3 本地数据是脆弱的\n\n决策 14 说「工程的权威副本始终在用户本地」。网页端的「本地」是 IndexedDB——\n**用户清一次浏览器缓存，作品全部消失，而他只会怪你。**\n\n| 必须有 | 说明 |\n|---|---|\n| **自动保存** | 不做 Ctrl+S 文化。**IndexedDB 没有「文件在磁盘上」这个心智模型**，忘存的代价是全丢，和用户是谁无关 |\n| **导出工程文件** | 一个自包含的工程文件，用户能自己收着、能发给别人 |\n| **明确告知** | 第一次保存时说清作品存在哪、清缓存会怎样 |\n\n桌面外壳没有这个问题，网页版有——**而网页是主形态**。\n\n#### 3.6.4 用户内容的安全面\n\nremix 意味着**在自己的域下执行别人的数据**。事件表不图灵完备降低了逻辑风险，但没解决这三条：\n\n| 面 | 对策 |\n|---|---|\n| **游戏内 UI 是 DOM overlay，而用户会往里写文案** | 一律 `textContent`，**禁止 `innerHTML`**。这是最现实的一处 XSS |\n| 导入与快照解析（glTF、贴图、快照本身） | 体积与资源数上限；解析失败要**优雅失败**，不能崩掉整个编辑器 |\n| 快照体积炸弹 | 上限见 §9，超限直接拒绝发布 |\n\n**这一条必须在做分享之前落地**，不是分享做完再补。\n\n#### 3.6.5 移植退路（决策 24）\n\n**本轮不做导出**（§3.5 未变）。但「日后能不能低成本变成端游 / 手游」取决于现在的三个约束，\n**漏了就要改用户已经做好的作品**——那是最贵的一种返工。\n\n先说清楚这条路的实际成本，免得日后高估或低估：\n\n| 目标 | 技术成本 | 真正的成本 |\n|---|---|---|\n| **PC 端游** | 几乎为零：播放期 + 快照塞进 Tauri / Electron 壳 | 代码签名与公证、安装包体积、自动更新 |\n| **手游 · 加到主屏（PWA）** | 零 | 上不了商店，无内购 |\n| **手游 · 套壳上架** | 低，几天量级 | **性能与合规**：中低端安卓 WebView 上的 3D + WASM；iOS 的 WebGPU 进度与音频手势限制；商店对 UGC 的额外审核 |\n| 原生重写 | 高 | 只在前三条都不够时才考虑 |\n\n**保住它的三条约束：**\n\n| # | 约束 | 漏了会怎样 |\n|---|---|---|\n| **P1** | **播放期与编辑器分包**（§3.6.1 已因性能预算成为硬要求） | 套壳时要把整个编辑器打进去 |\n| **P2** | **输入意图映射**（I12）：事件表写「当**跳跃**被按下」，不写「当**空格**被按下」。设备绑定是一张**可换的映射表**——和皮肤包同一个模式（决策 20） | 移植到手柄 / 触屏时，**用户要回去改自己的规则** |\n| **P3** | **宿主能力抽象**：全屏、指针锁定、URL、存储、文件读写各留一层薄接口，浏览器是其中一种实现 | 运行时和浏览器焊死，套壳时到处改 |\n\n**「回炉重造」能到什么程度**——取决于改的是实现还是语义：\n\n- 改**实现**（换 ECS 库 / 换渲染器 / 换物理 / 换宿主平台）→ 作品留得下来。\n  因为作品是**数据**（事件表 + 组件表 + 皮肤映射 + 输入绑定），换的是解释器\n- 改**事件表的求值语义**（求值模型、规则行之间实体集的传递规则）→ **迁移链救不了**：\n  作品还能打开，但跑出来的行为变了\n\n> **所以真正需要冻结的不是渲染层，是事件表的求值语义。**\n> 它现在还在 §9 未决项里；**阶段二一旦定下，即按 I11 的标准冻结**，与标识符稳定性同级。\n> 这是全项目唯一一处「定错了没有退路」的地方。\n\n---\n\n## 四 · 架构\n\n> **一图版**：[overview.svg](../diagrams/overview.svg) 第 1 图 · 系统全景（另见第 2 图数据模型、第 3 图一帧发生什么）\n\n> **贯穿全篇的一个模式：可替换的东西都是一张映射表。**\n> `kind -> 视觉`（皮肤包）、`动画语义状态 -> clip`、`输入意图 -> 设备`、`包 id + 版本 -> 内容`——\n> 四处用的是同一招：**把易变的东西挪出玩法层，用一张能整体替换的表隔开**。\n> 后面各处只引用这个模式，不再重复解释。\n\n### 4.1 分层\n\n```\n                   ┌──────────────────────────────────┐\n   模板库  ───────►│  编辑器 UI（简易 / 专业双模式）   │◄────── AI 作者接口\n                   └────────────────┬─────────────────┘\n                                    ▼\n                   ┌──────────────────────────────────┐\n                   │  Action 层（唯一编辑期变更入口）  │\n                   └────────────────┬─────────────────┘\n                                    ▼\n                   ┌──────────────────────────────────┐\n                   │  ECS 封装层（自写）               │\n                   │  defineComponent / query / schema │\n                   └────────────────┬─────────────────┘\n                                    ▼\n                   ┌──────────────────────────────────┐\n                   │  第三方 ECS 库（koota，可替换）   │\n                   └──────┬───────────┬───────────┬───┘\n                          ▼           ▼           ▼\n                ┌──────────────┐ ┌─────────┐ ┌────────────────┐\n                │ 事件表运行时 │ │ 系统(JS)│ │ 渲染桥          │\n                │ 播放期逐行   │ │ 播放期  │ │ 组件+皮肤→three │\n                └──────────────┘ └─────────┘ └────────────────┘\n                          ▲\n                ┌─────────┴──────────┐\n                │ 领域模块            │  RTS/MOBA · 第三人称动作\n                │ = 组件 + 系统 +     │  各自注册组件、Action、\n                │   条件动作 + kinds  │  条件动作、约束、面板、\n                │   + 约束 + 皮肤 +   │  皮肤包、模板\n                │   模板              │\n                └─────────────────────┘\n```\n\n**封装层是硬约束**（见 [adr-001-ecs.md](adr-001-ecs.md) §4.1）：模块与系统代码**一律不得直接 import 第三方 ECS 库**。它承担三件事——组件 schema（库不提供）、模块契约的执行点、把库选型从地基决策降级为可替换模块。\n\n### 4.2 Action 层：唯一变更通道\n\n编辑期世界状态只能通过 Action 改变。鼠标、AI、事件表编辑、读档全部收敛到同一入口。\n\n```\n场景 = 初始状态 + Action 序列\n```\n\n这是**语义模型**（用于 diff、回放、审计），不是存储实现。\n\n**现状**：[History](../../js/core/History.js) + 17 个 Command 已是这根支柱的九成，差的是「唯一入口」的强制。\n\n### 4.3 逻辑是数据：事件表 + 配方\n\n```\n当  敌人 进入 塔的范围\n    塔 冷却完毕\n就  塔 朝 敌人 开火\n    等待 0.5 秒\n```\n\n一条规则 = 若干**条件行** + 若干**动作行**，可分组、**可嵌套子事件**。没有画布、连线、坐标。\n\n**表达力档位**（决策 18，v8 放宽）：条件 / 动作 / 分组 / 全局与对象变量 / 等待 / 重复 N 次\n/ **多层子事件** / 参数位的**简单算术与比较**（伤害公式这类东西没有它写不出来）。\n\n#### 配方 = 行为单元的预设（v15 合并）\n\nv11 加了「行为单元」之后，配方与它的约束几乎重复（R1 与 B1 说的是同一件事）。\n**现在只有一种机制**：\n\n> **配方 = 一个行为单元 + 一组默认参数 + 一句人话说明。**\n\n于是学习路径是连续的，四步走的是同一样东西：\n\n```\n用配方  ->  改它的参数  ->  展开看里面的规则行  ->  自己定义一个行为单元\n```\n\n三条硬性质（原 R1-R4 与 B1-B3 合并后的结果，见 §4.7）：\n\n| # | 性质 | 为什么 |\n|---|---|---|\n| **R1** | 展开后是**普通规则行**，不是黑盒 | 破了就违反 I3 与 M3 |\n| **R2** | **可以只改一半**，改完还是好的 | 「一边学一边改」的字面要求；展开成内联规则后天然成立 |\n| **R3** | 带一句人话说明 | 学习发生在阅读那一刻，不在文档里 |\n\n**AI 也走同一条路**：优先挑配方、填参数，只有配方都不合适才逐行拼（原 R4）。\n\n**JS 没有消失，它下沉了**：用 JS **实现新的条件与动作**是正常路径（v17：目标用户会写代码，这不再是「高级门」）。\n但**条件动作的实现是代码，它们的编排是数据——两者不混**。\n\n> **这条边界是 I1 与 I3 的前提，不是能力问题。** 编排一旦变成代码，\n> AI 就无法走 Action 层、无法逐行 diff、无法局部重试、无法被单独撤销。\n> **判断一段 JS 该不该存在的判据**：它能不能被另一个模板复用（闸门 F 用的也是这一条）。\n> 实现受**确定性沙箱**约束（§7.1 J1–J3）。\n\n### 4.4 呈现与玩法分离：皮肤包（决策 20）\n\n> **玩法量属于逻辑，呈现量属于皮肤包，皮肤包不得改变玩法量。**\n\n```\n实体   = { kind: \"enemy.walker\", 位置, 玩法组件… }\n皮肤包 = kind → { 模型, 材质, 缩放, 动画状态映射, 图标 }\n```\n\n| 机制 | 内容 |\n|---|---|\n| 间接层 | 实体持有语义种类，不持有模型。渲染桥在皮肤包上解析。**换风格 = 换一张表** |\n| 玩法量归逻辑 | **碰撞体与占地由 kind 定义**；模型按插槽适配到该尺寸，视觉可溢出但**不参与碰撞** |\n| 语义名（I9） | 写 `播放「跑」` 不写 clip 名；写 `生成 敌人.走路兵` 不写模型路径。缺失回退到「站立」+ warning，不崩 |\n| 契约 + 约束 | 契约声明 `kinds` / `skins`；约束「皮肤包完整性」检查当前皮肤是否覆盖用到的每个 kind 与动画状态 |\n\n#### root motion 撞上了这一节的两条规则（v17 新增）\n\n决策 36 把 root motion 放进本轮，而它**同时撞上两条已有的硬规则**。两条都有解，但必须写死：\n\n| 冲突 | 解法 |\n|---|---|\n| **① root motion 违反「视听层只读」**——它的字面意思就是动画驱动位移，即渲染层写玩法状态 | **导入时把 root 曲线烘焙成位移曲线，作为玩法数据。** 运行期玩法层读烘焙结果（确定性、可序列化、可断言），渲染层仍然只读。不这么做，闸门 A 的逐字节断言会随机失败 |\n| **② 位移曲线若归皮肤包，换皮就改变玩法**——不同皮肤的攻击动画前冲距离不同，闸门 C.5 当场破功（违反 I9） | **位移曲线归 kind，不归皮肤包。** 这完全套用本节已有的模式：「碰撞体与占地由 kind 定义，模型按插槽适配到该尺寸」——现在多一句：**kind 声明每个动画状态的位移曲线，皮肤包提供的 clip 必须适配到这条曲线，而不是反过来** |\n\n**一句话**：**root motion 的位移是玩法量，动画只是它的表现。** 和碰撞体是同一个道理。\n\n**运行期的对应规则：视听层是只读消费者。**\n\n> **动画、粒子、音频、后处理不得写入任何玩法组件——单向数据流。**\n> 且所有「逐字节一致」的断言，**范围限定在玩法状态**，不含渲染与视听状态。\n>\n> **动画状态机（决策 36）也受这条管**：状态机的**当前状态是玩法数据**（事件表能读能写），\n> 而 clip 选择、混合权重、过渡时长是**呈现**，归皮肤包。换皮不得改变状态机的状态转移。\n\nI9 管的是编辑期（事件表不引用美术资源），这条管的是播放期。\n少了它，闸门 A / C.3 / C.5 的断言会随机失败，而且极难排查——\n你会以为是皮肤包设计错了，其实是断言范围没定义清楚。\n\n**判据（闸门 C.5）**：换一套皮肤包，一行规则不用改，headless 同输入下**玩法状态**逐字节一致。\n不一致 = 有美术量泄漏进玩法，**且能精确指出泄漏在哪**。\n\n### 4.5 两级状态 + 播放沙箱\n\n| | 编辑期 | 播放期 |\n|---|---|---|\n| 谁是权威 | **Action 层** | 事件表运行时 / 系统 |\n| 允许直接写状态 | 否 | 是 |\n| 撤销栈 / 变更日志 | 有 | 无 |\n| 约束校验 | 实时 | 不校验 |\n| AI 可介入 | **是** | 否 |\n\n进入播放 = 打快照；退出播放 = 整体回滚。**播放期的改动不污染工程。**\n\n因为玩法是数据而不是任意 JS，播放期也能做成确定性的（固定步长 + 可注入种子 + 可脚本化输入序列），于是拿到**脚本化试玩 + 断言**，进而 **AI 自己试玩**：生成 → 自测 → 修正 → 再交付。\n**v14 起，逐帧严格确定性是硬要求，不再允许降级为统计式**（决策 29）。\n依据见**决策 29 的 v17 修订行**（§2）：七款目标游戏里五款是联机游戏，且全部走 lockstep。\n\n> **v18 记录**：此处原本链接到「附录 A.10 · 决策 28 / 29 / 30 的依据」，\n> 而**那一节从未写出来**（v15 沿革声称新增了它，实际没有）。\n> 不补写——决策 29 的依据已在 v17 被换掉，A.10 即使补出来也是过期论证。\n\n#### 三种「状态固化」\n\n引擎里有三处把状态写下来，**它们是同一个模式的三种作用域**：\n\n| | 工程存档 | 发布快照 | 运行时存档（存进度） |\n|---|---|---|---|\n| 存什么 | 编辑期世界状态 + 流程 + 事件表 | 工程的只读固化 | 游戏自己声明的持久化状态 |\n| 谁定义格式 | 引擎（版本化信封 + 迁移链） | 同左 + 内容哈希 + 作者 id | **游戏自己声明存什么** |\n| 权威 | Action 层 | 发布那一刻的工程 | 事件表运行时 |\n| 带版本 | 是 | 是（**I11**：永远能打开） | 是 |\n| 上传 | 否（本地，可导出） | 是 | 否 |\n\n**v11 改判**：运行时存档原来写「不做」。那条在技术上成立、在产品上说不通——\n不提供存进度，用户只能做几分钟的小品，与决策 25 冲突。\n\n### 4.6 为什么 ECS（用户不可见的选择）\n\n不是性能理由，是**可寻址性**：\n\n- 世界状态 = 扁平数据表 → AI 能查询\n- 结构扁平同构 → schema 好写（schema 不是 ECS 白送的，由封装层实现）\n- 无层级嵌套 → diff 干净、序列化稳定、约束谓词好写\n- 系统是纯函数式表变换 → 确定性容易保证，headless 试算容易\n\n节点树在这四条上全部更差。**性能是附赠的，不是理由。**\n\n---\n\n### 4.7 完整作品需要的五个概念（决策 25、32、37）\n\n塔防和平台跳跃这两个模板**恰好都不需要**下面几样东西——所以 v11 之前的架构漏掉了它们。\n**用一局几分钟的模板去倒推架构，倒推不出完整游戏需要的东西。**\n\n它们的共同点：**现在不设计，以后加就要改数据模型或废掉已发布的作品（撞 I11）。**\n所以**数据模型现在就定，实现可以分批**（决策 26）。\n\n#### 1 · 场景与流程\n\n```\n工程 = 若干场景 + 一张流程（哪个场景先来、什么条件切到下一个）\n     + 全局状态（金钱、解锁、当前关卡…）\n```\n\n- **场景**是可独立编辑、独立试玩的单位；一个工程不再只有一个场景\n- **流程**本身是数据（不是代码），因此也走 Action 层、也能被 AI 读写\n- **界面页**（标题 / 暂停 / 背包 / 对话 / 结算）是流程里的节点，用 DOM overlay 实现\n- 切换场景时，**全局状态保留、场景内状态重置**——这条语义要写死，否则存档语义会跟着漂\n\n**场景与块的关系**（决策 30 引入「块」，这里定死两者边界）：\n\n> **场景是流程与存档的单位；块是场景内部的分区。**\n> 一个场景 = 若干块；切场景 = 卸载全部块，再加载新场景的块。\n\n这条不写死，阶段一会同时撞上「按块序列化」和「场景切换」两套语义。定死之后：\n存档按场景组织、加载按块组织，互不干涉。\n\n#### 2 · 可复用的带参行为单元\n\n> **只要游戏里有「技能 / 道具 / buff / 敌人行为」这类概念，重复就是必然的。**\n\n本轮做**带参数的可复用规则组**；**配方就是它的预设**（§4.3），不是第二套机制：\n\n```\n定义：技能「火球」(伤害, 冷却, 特效)\n使用：施放 火球(30, 2秒, 爆炸)\n```\n\n三条约束，用来守住 I2 和 I3：\n\n| # | 约束 |\n|---|---|\n| **B1** | 定义体**就是普通规则行**，能展开看、能改——不是黑盒 |\n| **B2** | **不允许递归、不允许任意控制流**（§3.4 真封顶），保住可校验与可被 AI 读懂 |\n| **B3** | 参数是**有 schema 的**，因此 AI 能填、约束层能校验、详情面板能自动生成控件 |\n\n敌人 AI 用同一套东西表达（「巡逻」「追击」「远程攻击」都是行为单元），**不另起一套行为树**。\n\n#### 3 · 运行期状态存取（存进度）\n\n§3.5 原来写着「运行时存档不做，格式由游戏自己定义」。**那条在技术上成立，在产品上说不通**——\n任何超过十分钟的游戏都要存进度，不提供就等于用户只能做几分钟的小品。\n\n本轮提供的是**两个事件表动作 + 一条规则**：\n\n```\n存进度(槽位)    读进度(槽位)\n```\n\n- 存什么由游戏自己声明：勾选要持久化的全局变量与实体状态\n- **实体 id 必须稳定**，否则读档会错位——与 I11 的标识符稳定性同源\n- 封顶：不做云存档、不做多存档槽的管理界面（§3.4）\n\n#### 4 · 数据表（决策 32，v16 新增）\n\n> **行为单元解决了「结构」的重复，没解决「数值」的重复。**\n\n§9 一直挂着「数值表达力够不够」，但那问的是**表达式**（伤害公式写不写得出来）。\n真正缺的是**结构**：单位属性表、升级曲线、装备词条、掉落权重——\n**几十上百行数值该放在哪、怎么编辑、怎么被规则引用。**\n\n现在的答案只能是「堆全局变量」，而那在三个地方立刻破功：编辑（没有表格视图）、\nAI（`describe` 出来是一堆无关联的变量名）、约束层（校验不了「每个兵种都要有攻速」）。\n\n```\n数据表「兵种」\n  行 id     血量   攻击   攻速   造价\n  步兵      100     8     1.0     50\n  坦克      600    40     0.6    300\n\n事件表里：生成 单位(兵种.坦克)   →   血量取自 兵种[坦克].血量\n```\n\n三条约束：\n\n| # | 约束 | 为什么 |\n|---|---|---|\n| **T1** | 表是**内容包的一种形态**（决策 27），带 id 与版本 | 模板与模块要能各带自己的表；remix 时按依赖解析 |\n| **T2** | 列**有 schema**，与组件 schema 同一套机制 | 详情面板自动生成、AI 能填、约束层能校验 |\n| **T3** | 行 id **只增不改**（I11） | 事件表按行 id 引用；改一次 id，所有引用它的已发布作品变砖 |\n\n**为什么现在就要定**：表的引用形式一旦进了快照，事后再改就撞 I11。\n**实现可以分批**（决策 26）——本轮只做「具名表 + 定长列 + 按行 id 取值」，\n公式列与外部表格同步留口。\n\n#### 5 · 运行期动态集合（决策 37，v17 新增）\n\n> **数据表是作者写的，静态；这一样是游戏跑起来之后自己增删的。**\n\n数据表（概念 4）解决了「数值放在哪」，但它是**内容**——行 id 只增不改、随内容包分发。\n而游戏运行时需要**可增删的集合**，现在无处安放：\n\n| 集合 | 出现在 |\n|---|---|\n| 背包 / 容器 | 塞尔达、艾尔登、TPS |\n| 物品栏与信使栏 | **Dota 2** |\n| 生产队列、编队、选中组 | 红警、星际、魔兽 |\n| 任务列表、已解锁清单 | 全部 |\n\n**三款以上、且跨两个簇都需要**（决策 39 的判据），所以进内核。\n\n现在手里的三样都不够：数据表是静态内容；全局变量是标量；事件表的选中集**每条规则用完即弃**（[adr-002](adr-002-eventsheet-eval.md) P3）。\n\n本轮做两种形态 + 四个动作：\n\n```\n有序集合：背包 = [剑, 药水, 药水]      加入 / 移除 / 取第 N 个 / 计数\n键值表：  已解锁 = {神庙A: true, ...}   设置 / 删除 / 取值 / 是否存在\n```\n\n三条约束：\n\n| # | 约束 | 为什么 |\n|---|---|---|\n| **C1** | 元素是**标量或实体引用**，不允许任意嵌套结构 | 保住可序列化、可 diff、可被约束层校验（同 B2 的理由） |\n| **C2** | **可声明持久化**，与概念 3 的存进度共用同一套声明机制 | 背包不能存 = 存档没意义 |\n| **C3** | 集合的**迭代顺序是稳定的**（插入序） | 确定性（决策 29、[adr-002](adr-002-eventsheet-eval.md) D1）；顺序不稳定则 lockstep 立刻不同步 |\n\n**封顶**：不做排序、过滤、嵌套查询——那会把它变成一门查询语言，撞 §3.4 的「任意控制流」封顶。\n\n**为什么现在就要定**：它要进存档（概念 3），格式一旦落盘就撞 I11——**和数据表是同一个理由**。\n\n---\n\n## 五 · 功能大纲\n\n> **能力清单的读者友好版**：[architecture-outline.md](architecture-outline.md) §四 —— 按九个子系统分组，每项写清做到哪儿\n\n### 5.1 内核\n\n**世界** — 实体 / 组件表 / 原型查询 / 组件 schema 注册；系统注册与调度（固定步长 + 帧步长）；序列化（确定性、版本化、可 diff）；快照与回滚。\n\n**变更** — Action Registry（id / JSON Schema 参数 / 前置条件 / 影响域 / 可逆性 / describe）；撤销栈 + 变更日志；`listAvailableActions(context)` 情境级自省。\n\n**事件表** — 数据模型 `规则[] = { 条件行[], 动作行[], 分组, 启用 }`，有序，全部是普通组件数据；条件 / 动作注册表（带 schema、**人话模板串**、**常规 / 触发标记**）；播放期按 [adr-002](adr-002-eventsheet-eval.md) 的语义求值（**全表自上而下 + 触发即时插入**，实体集按种类逐条收窄、子事件只继承不回写、顶层规则之间不传递）；全部编辑动作 Action 化；**多层子事件 + 参数位简单算术**（§3.4）；**配方库 + 用户可把自己的规则组存成配方**；第一批条件动作（碰到 / 进入范围 / 被点击 / **输入意图被按下**（I12）/ 定时 / 开局 / 数值比较 / 概率；移动 / 跳跃 / 朝向 / 生成 / 销毁 / 改属性 / **播动画** / **播音效** / **放特效** / 计分 / 等待 / UI 提示）。\n\n**呈现** — kind 注册表（声明碰撞体、占地尺寸、可用动画状态）；皮肤包（一个工程一个当前皮肤，可覆盖到单个实体）；模型按插槽适配；动画状态缺失回退 + warning；约束「皮肤包完整性」。\n\n**空间与物理** — Transform 层级（是组件，不是场景图）；空间索引（网格哈希 / BVH）；射线拾取、框选；**Rapier 刚体 + 碰撞 + 空间查询 + 固定与铰链关节**（决策 33；不做其余关节、马达、布娃娃、软体）。事件表要有「连接 / 断开」两个动作——**举起放下、磁力吸附、可组装机关全靠它**。\n\n**分块与流式加载**（决策 30）— 场景内按**块**组织；实体随块**加载与卸载**；序列化**按块存取**（工程存档与快照都是）。\n三条纪律，缺一条流式就会和确定性打架：\n\n| # | 纪律 |\n|---|---|\n| **S1** | **加载顺序不得影响模拟结果**——块的加载是呈现层的事件，不是玩法事件 |\n| **S2** | 玩法需要的**最小状态常驻**（例如远处敌人的存活与计时），只有**表现**随块进出 |\n| **S3** | 卸载与重载后，**同一段输入必须得到同一结果**（闸门 A 的断言范围覆盖它） |\n\n**本轮做**：分块 + 按需加载卸载 + 按块序列化。**留口后加**：LOD 层级、impostor、地形分块 mesh 简化。\n\n**播放期的选择与指令**（附录 A.9）— 游戏内点选、框选、编队、对选中集下达指令（移动 / 攻击 / 跟随 / 停止），全部是条件与动作。\n**这与编辑期的框选是两套东西**：那套服务编辑，这套是玩法能力。MOBA、RTS、战棋、任何「指挥一群单位」的玩法都要。\n\n**播放期的放置与建造** — 玩家在游戏里放下一个东西：位置合法性校验、消耗资源、放置预览、可撤销。\n**红警 / 星际 / 魔兽的建造与塔防的放塔是同一件事**（v17：判据源换成目标游戏后，它从「塔防要」变成「三款 RTS + 塔防都要」）。\n\n**动画事件** — 在 clip 的时间点上打标记，触发事件表（开 / 关攻击判定盒、可取消后摇、脚步、特效点）。\n没有它，动作与魂类的战斗手感无从谈起。标记随**皮肤包**走（语义状态 → clip → 时间标记），不进玩法层（I9）。\n\n**场景与流程**（§4.7）— 多场景（各自可编辑可试玩）；流程数据（场景顺序与切换条件）；全局状态与场景内状态的分界；界面页（标题 / 暂停 / 背包 / 对话 / 结算）。\n\n**行为单元**（§4.7）— 带参数、有 schema 的可复用规则组；定义体即普通规则行；不允许递归与任意控制流；技能 / 道具 / buff / 敌人 AI 全部用它表达。\n\n**运行期状态**（§4.7）— `存进度(槽位)` / `读进度(槽位)` 两个事件表动作；游戏自己声明要持久化什么；实体 id 稳定性由内核保证。**等待队列（含实体集快照与剩余时间）属于运行期状态，必须可序列化**（[adr-002](adr-002-eventsheet-eval.md) W2）——技能冷却与波次间隔全是等待，漏了它读档就丢。\n\n**数据表**（§4.7、决策 32）— 具名表 + 有 schema 的列 + 按行 id 取值；表是内容包的一种形态；行 id 只增不改（I11）；事件表与行为单元可引用；详情面板按列 schema 自动生成表格视图。\n\n**运行期动态集合**（§4.7、决策 37）— 有序集合与键值表；加入 / 移除 / 取值 / 计数四类动作；元素限标量与实体引用；插入序稳定（确定性）；可声明持久化，与存进度共用同一套声明。\n\n**寻路**（决策 38）— 群体寻路 + 局部避让；查询接口与实现分离（退役条件：500 单位下掉帧且优化无果 → 换流场，**接口不变**）。**必须是确定性的**——寻路结果进玩法状态，走 [adr-002](adr-002-eventsheet-eval.md) D1 的稳定迭代顺序。\n\n**视野与战争迷雾**（决策 38）— 按阵营的视野计算与迷雾状态；事件表可查询「X 是否可见」。**迷雾是玩法状态不是渲染效果**——它决定 AI 能不能看到你，因此进玩法层、参与断言。\n\n**动画**（决策 36 档 2）— 状态机（状态是玩法数据，转移由事件表驱动）+ 混合 + **root motion**（位移曲线烘焙成玩法量、归 kind，见 §4.4）+ 交叉淡化 + 动画事件。**不做 IK / 动作匹配 / 上下半身分层**。\n\n**技能目标选择** — 点地 / 点单位 / 方向 / 范围指示器，是行为单元的参数形态（B3 的 schema 扩展）。Dota 的技能、艾尔登的锁定、RTS 的指令共用同一套。\n\n**输入**（I12、决策 24）— **输入意图**注册表（跳跃 / 移动 / 确认 / 取消…，由内核与模块注册）+ **设备绑定表**（键鼠 / 触屏 / 手柄，一张可换的映射表，和皮肤包同一个模式）。事件表只认意图，不认设备。\n\n**宿主能力抽象**（决策 24 P3）— 全屏、指针锁定、URL、存储、文件读写各一层薄接口；浏览器是其中一种实现，套壳时换实现即可。\n\n**渲染桥** — 组件 + 当前皮肤包 → three.js 增量同步；**相机档位**（受限俯视 / **肩后跟随** / 第一人称 / 自由飞行，v17 起默认不再是受限俯视）+ 跟随平滑 + 震动 + 锁定目标；帧循环、可见性剔除。（触屏与自适应画布随移动端一并推后。）\n\n**视听**（决策 23，封顶见 §3.4）—\n动画：glTF clip + **交叉淡化过渡**，状态由事件表与皮肤包驱动；\n材质与光照：参数面板 + 若干套环境与光照预设；\n后处理：几个预设档位；\n特效：一组预制粒子（命中 / 爆炸 / 拾取 / 尘土 / 拖尾），事件表可触发；\n音频：音效与背景音乐的播放 / 音量 / 循环 / 停止，全部是事件表动作。\n\n**游戏内 UI** — DOM overlay：跟随实体的屏幕锚点 + 生命周期 + **一组预制件**（血条 / 计分 / 计时 / 提示 / 胜负画面）。不做控件系统。\n\n**素材** — 内置风格中性、可互相搭配的素材库（随编辑器分发）；glTF 导入同等优先；文生 3D 作为可插拔 provider。\n\n**分享与账号** — 发布（工程 → 只读快照 → **注册 / 登录** → 上传 → 换回链接，决策 28）；玩（打开链接只加载播放期，**不需要账号**）；remix（拉回本地新建工程，**不需要账号**）。\n后端只存**已发布快照 + 最小账号信息**，不存正在编辑的工程。快照带内容哈希、引擎版本号与**作者 id**（I11）。\n账号形态：**优先 OAuth，不自建密码体系**；作品可归属、可删除；一个举报入口 + 管理员下架能力。\n**不做**：个人主页、关注、私信、自动审核。\n\n**数据安全底线**（§3.6.3 / 3.6.4）— 自动保存；导出自包含工程文件；overlay 一律 `textContent`；导入与快照解析设上限并优雅失败。\n\n**试飞台** — headless runner（加载 → 执行 Action 序列 → 断言 → 报告）；确定性（清除 `new Date()` / 随机数对世界状态的渗透）。\n\n**AI 基础设施** — `describe(scope, detail)` 语义 LOD（组件与事件表都要实现）；约束层（谓词 + 结构化失败反馈 + 修复建议）。详见 [ai-native-engine.md](ai-native-engine.md)。\n\n### 5.2 内核归属论证\n\n范围纪律的实际应用（决策 39 的判据源）。**每加一个内核成员或换一次目标游戏清单，都要重跑这张表。**\n\n**判据**：至少两款需要，**且分属不同簇**。同簇内四款都要，只证明那个簇要，不证明该进内核。\n\n| 项 | 红警 | 星际 | 魔兽 | Dota | 塞尔达 | 艾尔登 | 刺客 | TPS | 判定 |\n|---|---|---|---|---|---|---|---|---|---|\n| 物理（刚体 / 碰撞 / 查询） | 要 | 要 | 要 | 要 | 要 | 要 | 要 | 要 | **进内核**（v4） |\n| **群体寻路 + 局部避让** | 要 | 要 | 要 | 要 | 要 | 要 | 要 | 要 | **进内核**（决 38，v17 从模块提回） |\n| **视野 / 战争迷雾** | 要 | 要 | 要 | 要 | 不要 | 不要 | 要（警戒） | 要（警戒） | **进内核**（决 38，v17 从模块提回）。原判「只有一类玩法要」已被推翻 |\n| 播放期选择与指令 | 要 | 要 | 要 | 要 | 不要 | 不要 | 不要 | 不要 | ⚠️ **同簇独占**——但保留在内核，见下方说明 |\n| 播放期放置与建造 | 要 | 要 | 要 | 不要 | 要（临时平台） | 不要 | 不要 | 不要 | **进内核**（跨簇） |\n| **技能目标选择** | 要 | 要 | 要 | **核心** | 要 | 要 | 不要 | 要 | **进内核**（跨簇） |\n| **数据表**（决 32） | 要 | 要 | 要 | 要 | 要 | 要 | 要 | 要 | **进内核**（v16） |\n| **运行期动态集合**（决 37） | 要（生产队列） | 要 | 要 | **要（物品栏）** | 要（背包） | 要（背包） | 要 | 要 | **进内核**（v17，跨簇） |\n| 动画事件（clip 时间点） | 要（出手帧） | 要 | 要 | 要 | 要 | **核心** | 要 | 要 | **进内核**（跨簇，v17 起可倒推） |\n| **动画状态机 + 混合 + root motion** | 不要 | 不要 | 部分 | 部分 | 要 | **核心** | **核心** | **核心** | **进内核**（决 36 档 2）。⚠️ 主要由动作簇驱动，见下 |\n| 固定与铰链关节（决 33） | 不要 | 不要 | 不要 | 不要 | **核心** | 不要 | 部分（机关） | 不要 | ⚠️ **近乎单款独占**，见下 |\n| 皮肤包机制 + 编辑 | 要 | 要 | 要 | 要 | 要 | 要 | 要 | 要 | **进内核**（决 20） |\n| 音频 / 粒子 / 材质光照 / 后处理 | 要 | 要 | 要 | 要 | 要 | 要 | 要 | 要 | **进内核**（v8） |\n| 游戏内 UI overlay | 要 | 要 | 要 | 要 | 要 | 要 | 要 | 要 | **进内核** |\n| 大世界分块流式 | 不要 | 不要 | 不要 | 不要 | 要 | 要 | 要 | 部分 | ⚠️ **同簇独占**，但决 30 已定，保留 |\n| 网格世界 / 可破坏建造 | 不要 | 不要 | 不要 | 不要 | 不要 | 不要 | 不要 | 不要 | **留口**（v17 撤回） |\n| 载具物理 / 样条路网 | 不要 | 不要 | 不要 | 不要 | 不要 | 不要 | 不要 | 不要 | **留口**（v17 撤回） |\n| 模拟细节分级 | 不要 | 不要 | 不要 | 不要 | 不要 | 不要 | 不要 | 不要 | **留口**（1000 实体够 RTS） |\n\n#### 三项没过新判据、但保留在内核的（v17 必须写明）\n\n新判据比旧判据严，**有三项没干净地过关**。不藏着，写出来并给出理由与复查点：\n\n| 项 | 问题 | 处置 |\n|---|---|---|\n| **播放期选择与指令** | 四款 RTS/MOBA 要，动作簇一款不要——**同簇独占** | **保留**。理由是它与「技能目标选择」共用同一套目标拾取机制，而后者跨簇。**复查点**：若实现时发现两者可以拆开，选择与指令应下沉为 RTS 模块 |\n| **动画状态机 + root motion** | 主要由动作簇四款驱动，RTS 簇只有魔兽/Dota 部分需要 | **保留**。魔兽的英雄、Dota 的技能动作确实需要状态切换与硬直，**跨簇成立但强度不对称**。决策 36 明确只做档 2，档 3 封顶，就是这条不对称的应答 |\n| **固定与铰链关节** | 只有塞尔达是核心，刺客信条的机关是次要 | **保留，但这是最弱的一项**。它是 v16 用「例外 #3」塞进来的，v17 换判据后它勉强跨簇。**复查点**：若第三人称动作模板做完发现只有塞尔达式解谜用得上，它应下沉为模块 |\n\n**决策 34 的例外栏因此清空**：换判据源之后，原来三条例外全部变成可倒推的（或如上明确标注）。\n**额度回到 3/3 可用**——但上面三条「不干净」的项**已经用掉了信任余额**，下一次要往内核加东西，先看它们能不能出局。\n\n**改判史**：v4 把物理请回内核、把寻路砍出去；**v17 又按新判据把寻路与视野请了回来**。\n两次都是同一条纪律在随事实改判——**这说明纪律是活的，也说明判据源选错会系统性地漏能力**（A.9 的第二条教训）。\n\n### 5.3 编辑器\n\n> **一图版**：[overview.svg](../diagrams/overview.svg) 第 5 图 · 编辑器界面\n\n- **模板库**：打开即见，**选一个先直接试玩**，再进编辑（§1.3 第 1–2 步）\n- **项目门厅**：回访时的入口——我的作品 + 最近编辑 + 模板库（§1.3 C）\n- **事件表编辑器**：一个可拖拽的列表控件——加规则行、挑条件动作、改参数、调顺序、分组；播放时高亮命中的行。**没有画布、连线、布线、缩放平移**\n- **皮肤切换**：一个下拉换整套风格；缺插槽当场列出，点一下去补\n- 大纲：实体树 + 用户文件夹（现有 [ui/outliner.js](../../js/ui/outliner.js) 改造复用）\n- 详情：按 schema 自动生成控件，**可写**\n- 变换 gizmo；多选、框选、复制粘贴、成组、对齐吸附\n- 资产库：内置素材库 + glTF 导入 + 预制体，**按插槽组织**\n- 播放控制：播放 / 暂停 / 单步 / 停止\n- **数据表编辑器**：按列 schema 生成的表格视图（决策 32）\n- **动画状态机编辑器**：状态 + 转移条件的列表视图（决策 36）。**转移条件复用事件表的条件注册表**，不另起一套\n- **教程系统**（决策 35）：按能力组织、可交互、**就在编辑器里**；每个概念一条，跟着能力一起交付（§1.4）\n- **导出**：一个按钮生成自包含工程文件（v17 替代原「分享链接」）\n- 停靠系统、i18n、项目门厅、存档（现有实现基本可直接留用）\n- ~~术语层与模式开关~~ —— **v17 删除**（决策 12 取消）。省下的三样东西：registry 白名单过滤、详情面板字段可见性、术语映射表\n\n### 5.4 AI 作者接口\n\n| 顺序 | 能力 | 说明 |\n|---|---|---|\n| 1 | **单步指令** | 一句话 → 一条 Action，预览后确认 |\n| 2 | **换皮 / 配皮肤** | 只改皮肤包映射，不碰任何规则（I9）。作用域最小、错了一眼看得出 |\n| 3 | **多步变更集** | N 条 Action → 半透明预览 + 清单 → 整体接受 / 逐条剔除 → 合成一条撤销 |\n| 4 | **生成规则行** | 产出 Action 序列（挑配方 + 填参优先），可见、可手改、可逐行 diff |\n| 5 | **内联建议** | 选中物体 → 1–2 条可点击的建议 |\n\n#### AI 参与度的三档（决策 40，v18）\n\n> **五根支柱本来就是 agent 的闭环**：`describe` 感知 · `listAvailableActions` 知道能做什么 ·\n> `apply` 行动 · 约束层知道对不对 · headless 自测验证成果。\n> §4.5 已经写着「**生成 → 自测 → 修正 → 再交付**」——那句话描述的就是自主循环。\n> 缺的从来不是基础设施，是**把这个形态写出来并给它边界**。\n\n| 档 | 能力 | 状态 |\n|---|---|---|\n| **档 1** | 上表五种形态 + **AI 在 headless 里自己试玩并报告**（闸门 D.4） | **本轮做**（阶段三） |\n| **档 2** | **受监督的自主循环**：agent 连续跑 N 步，每步过约束层；**进度可见 · 随时叫停 · 可回滚到任一 checkpoint · 可只接受前半段** | **留口** |\n| **档 3** | **AI 造零件**：AI 用 JS 实现新的条件与动作，扩展编辑器自身的能力面 | **留口** |\n\n**档 1 与档 2 的差别不是规模，是控制结构**：档 1 是一次性 batch（吐 N 条 → 一次 review），\n档 2 是循环（做一步 → 读反馈 → 决定下一步）。**「整体接受 / 逐条剔除」这个交互在 50 步以上会崩掉**，\n这才是档 2 需要单独设计的真正原因。\n\n**四条留口条件**（成本接近零，符合决策 26）：\n\n| # | 条件 | 不留会怎样 |\n|---|---|---|\n| **A1** | Action 日志支持 **checkpoint 与命名分段** | 长任务无法部分接受、无法回滚到中间点。**语义模型（§4.2）已支持，本轮只需在数据模型留字段** |\n| **A2** | `apply()` 的返回除约束校验结果外，还带**本步实际改了什么** | agent 无法据此决定下一步，只能盲跑 |\n| **A3** | 三个入口保持**无状态、可多轮调用** | 现在就是这样。**别改坏**——一旦入口带上会话状态，档 2 要重做通道 |\n| **A4** | 步数 / 时间 / 预算上限与中断信号在**引擎侧** | 模型跑飞了没人拦得住 |\n\n**档 3 的一条硬约束现在就写死**：\n\n> **AI 写的 JS 条件动作不得自动注册。**\n> 必须过 §7.1 的确定性沙箱静态检查（J1–J3）+ 一次 headless 断言，且在 registry 里**标明来源**。\n> 理由是 **I11**：一个条件动作的 id 一旦被作品引用就冻结了——**AI 随手造一个，就等于永久多了一份迁移负担**。\n\n**这是能力天花板的真实位置**：档 1、档 2 下 **AI 能组装，不能造零件**；\n超出现有条件动作库的需求，得由人先写零件。\n\n**必须一等对待的非功能项**：延迟（慢到十几秒就没价值）、失败兜底（AI 不可用时编辑器完全可用）、可解释（说清改了什么、为什么）、离线（没有 AI 也能用模板与配方做事）。\n\n> **v17 加重**：决策 35 把门槛交给了 AI 与教程，**AI 的可用性因此从「产品卖点」变成「承重结构」**。\n> 上面四条非功能项现在与功能同级——尤其「失败兜底」：AI 挂掉时，教程与配方必须能独立扛住门槛。\n\n### 5.5 模型接入（决策 21）\n\n> **用户能填自己的模型，而且填起来不难。**\n> 内置 AI 开箱即用；但从第一天就假设「用户会换成自己的」。\n\n#### 供应商适配层\n\n一个 provider 只需实现三件事：**发一次请求、拿回文本或 JSON、报告自己的能力**。\n\n| 形态 | 说明 |\n|---|---|\n| **OpenAI 兼容端点**（base URL + key + 模型名） | **这一条覆盖绝大多数场景**：各家云服务、聚合网关、自建代理，都是它 |\n| Anthropic / Gemini 原生协议 | 各写一个适配器，因为请求格式不同 |\n| **本地模型**（Ollama / LM Studio 等） | 也是 OpenAI 兼容端点，零成本、数据不出机器 |\n\n**新增一家 = 加一个适配器**，其余全部不动（I5 的一次应用）。\n\n#### 能力契约与降级（I10 的执行点）\n\n引擎声明**它需要什么**，provider 声明**它有什么**，缺的部分自动降级：\n\n| 能力 | 有的时候 | 没有的时候（降级） |\n|---|---|---|\n| 结构化输出 / 约束解码 | 直接按 Action 的 JSON Schema 出参，语法错误为零 | prompt 里贴 schema + 输出后校验 + 失败重试（最多 N 次） |\n| 工具调用 | 三个入口做成 tool（`describe` / `listAvailableActions` / `apply`） | 退化为单轮 JSON 协议：一次给上下文，一次要结果 |\n| 长上下文 | 一次给更多 describe 结果 | **渐进披露本来就按需取**，影响很小（见[附录 A.7](#a7-决策-21为什么接各种模型是可行的)） |\n| 流式输出 | 边生成边显示预览 | 转圈等待，功能不减 |\n\n**底线**：只要模型能「读一段文字、按要求吐一段 JSON」，编辑器的 AI 功能就应该可用——**只是慢一点、重试多一点**。\n\n#### 设置界面\n\n**v17：目标用户配得来 base URL 和 key**，所以这一节的门槛论证不再必要。\n但下面几条**全部保留**——它们对专业用户同样成立，只是理由从「不写代码的人也要能配好」\n换成「**配置成本应该低到不值得抱怨**」：\n\n- **预设列表** + 一个「自定义端点」——不必知道什么是 base URL 也能开始\n- 填完有一个**「测试连接」**按钮：报告能否连通、探测到哪些能力、大概多快\n- **每类任务可以选不同模型**（够用的两档就好：快 / 强）。换皮、单步指令用快的；生成规则行用强的\n- **用量与花费可见**：BYOK 是用户自己付钱，看不到花费就不敢用\n- **隐私说明写在设置页上**，不藏进文档：说清哪些内容会被发出去（`describe` 的结果、当前选中的东西、事件表片段），以及**本地模型可以让这一切不出机器**\n\n#### 密钥与安全\n\n- 桌面外壳：密钥存在本地\n- 网页版：**走内置代理**，不在浏览器里明文存 key\n- 引擎**不用用户的 key 做用户没要求的事**（不做后台预热、不做遥测调用）\n\n#### 边界（防膨胀）\n\n不做模型路由 / 自动选模、不做 RAG 与向量库、不做微调、不做多模型投票、**不引入通用 agent 框架作依赖**。\n**适配层就是「一个函数 + 一张能力表」**，本轮不许长成子系统。\n\n> **v18 澄清**：最后一条说的是**不把 LangChain 一类通用框架变成依赖**，\n> **不是禁止自主循环**。决策 40 的档 2 跑在引擎自己的三个入口上，与本节边界不冲突——\n> 恰恰相反，**渐进披露与三入口就是为了让循环的上下文成本不随 Action 数量增长**（[A.7](#a7-决策-21为什么接各种模型是可行的)）。\n\n### 5.6 领域模块与模板集\n\n模块 = 「组件 + 系统 + 条件动作 + kinds + 皮肤包 + Action + 约束 + 面板 + 模板」的注册包。\n\n**v17 重立**（修订决策 15）。七款目标游戏塌缩成**两个模板**：\n\n| 模板 | 覆盖 | 主要检验 | 模块内容 |\n|---|---|---|---|\n| **RTS / MOBA**（先做） | 红警、星际、魔兽、Dota 2、**塔防（是它的子集）** | 群体寻路、视野迷雾、选择与指令、播放期建造、资源经济、技能目标选择、数值表、生产队列 | 单位群、波次与 AI、建筑与生产、资源、胜负、迷雾呈现 |\n| **第三人称动作** | 塞尔达、艾尔登、刺客信条、TPS | **动画状态机 + root motion**、动画事件与判定盒、关节与物理解谜、背包、大世界流式、锁定目标、**关卡串 + 存进度 + 技能道具** | 角色控制器、战斗与判定、锁定、背包与装备、关卡流程 |\n\n**它同时是决策 25 的验收载体**——§4.7 的五个概念全部由第三人称动作模板倒推，闸门 F 也由它判定\n（原「完整作品模板 · 小型 roguelite」并入此处，不再单列）。\n\n**降级与出局**：\n\n| 原模板 | 处置 |\n|---|---|\n| 塔防 | **并入 RTS 模板**——寻路、单位群、波次、经济、胜负全是 RTS 的子集，单独立项是重复投资 |\n| 平台跳跃 | **降为内部脚手架**，不作交付模板。它仍是最快拿到「可玩闭环」的路径，**工程上先做它**，但它不承担通用性证明 |\n| 完整作品 roguelite | 并入第三人称动作模板 |\n| 收集竞速 | **出局**（七款里无人需要） |\n| 城市建造 | 保持可选，**优先级再降**（载具与样条已撤回为留口） |\n\n**差异轴**（两个模板，但轴拉得比原来四个更满）：\n\n| 轴 | RTS / MOBA | 第三人称动作 |\n|---|---|---|\n| 相机 | 受限俯视 | 肩后跟随 + 锁定 |\n| 控制 | **指挥一群** | **操控一个** |\n| 节奏 | 秒级 | **帧级** |\n| 空间 | 平面 + 路径 | 垂直几何 + 大世界流式 |\n| 结束条件 | 摧毁 / 占领 | 关卡 / Boss |\n| 联机 | **lockstep 是核心** | 单人为主 |\n| 动画栈 | 几乎不用 | **档 2 全用** |\n\n**RTS 排第一**（修订原「平台跳跃排第一」）：它离现有架构最近、与联机方向一致、**一个模板覆盖四款目标游戏**，\n且塔防白送。**条件动作库的广度从它倒推**，因为它逻辑最复杂。\n\n**第三人称动作排第二**：它要新建整个动画栈（决策 36），是本轮最大的单项工程，\n但也是闸门 F 的载体——**不能推到最后，否则闸门 F 会挤在末尾**。\n\n---\n\n## 六 · 路线与闸门\n\n> 阶段之间是硬依赖。**不含工期承诺。**\n>\n> **v17 的总顺序：先自用 → 再验证 → 再开放。**\n> 第一个里程碑不是「别人能用」，是**你能用它做出你想做的游戏**。\n> 分享、账号、后端、面向新手的一切**整体推到阶段四「开放」**。\n>\n> **数据模型先行**：§4.7 五个概念的数据模型**阶段二就定死**，实现分批。\n> 先定数据模型是为了不撞 I11——这五样一旦发布后再改，已有作品会全废。\n>\n> **比它更先的只有一样**：事件表的**求值语义**，阶段零定稿（决策 31、[adr-002](adr-002-eventsheet-eval.md)）。\n> 数据模型改错还有迁移链，求值语义改错**迁移链救不了**（§3.6.5）。\n\n### 阶段零 · 工程地基 + 求值语义定稿\n\n引入 package.json + 打包器；现有 three CDN importmap 迁进构建。\n它挡着 ECS / Rapier / glTF 三件事，不先做，阶段一第一天就会撞上。\n\n**并行做完一件纸面工作：事件表求值语义定稿**（决策 31、[adr-002](adr-002-eventsheet-eval.md)）。\n它不写代码、不依赖打包器，但**阶段一的 Action 层、序列化、试飞台断言全部受它约束**。\n\n- **闸门 O（纸面）**：ADR-002 的三个手工样例（塔防选目标 / 跳跃缓冲 / RTS 指令）逐条推演，\n  结果与「读这段规则会预期什么」一致。**过了就按 I11 冻结**，此后只许改实现不许改语义\n\n### 阶段一 · 内核地基\n\nECS 内核 + 封装层 + **按块序列化** + 快照；Action Registry + 撤销 + 日志；**试飞台（headless runner + 确定性）**；渲染桥 + Transform + 拾取 + 空间索引 + **分块与流式加载**（决策 30）；编辑器改造（大纲 / 详情 / gizmo / 多选，全部对 ECS 通用）；**阶段末接最小 AI（单步指令）**——验证通道形状，不是模型能力。\n\n- **闸门 A**（三条）：\n  1. 手写一段 Action 序列（JSON），headless 执行后与 GUI 手动操作得到的状态**逐字节一致**；存读档、撤销、重放全部通过\n  2. **块卸载再重载后，同一段输入得到同一结果**（决策 30 的 S3）\n  3. **Rapier 的确定性 spike 通过**——同一输入在两台不同机器上逐帧一致。\n     **不通过就换物理库，不放宽决策 29**\n- **闸门 B（纸面）**：城市迁移演练——不写代码，逐项验证路 / 地形的数据结构与命令能否用内核概念表达。**过不了就改内核**\n\n### 阶段二 · 事件表 + RTS 模板\n\n事件表数据模型 + 列表编辑器 + 按 [adr-002](adr-002-eventsheet-eval.md) 求值；第一批条件动作库（**广度由 RTS 倒推**）；配方库；\n**§4.7 五个概念的数据模型定死**（场景与流程结构、行为单元 schema、可持久化状态声明、数据表的表与列 schema、**动态集合的两种形态**），\n**实现只做最小**：两个场景能切换、一个带参行为单元能定义与调用、存读进度能跑通、一张数据表能被规则引用、**一个背包能增删并存档**；\n播放模式 = 快照沙箱；物理 + 关节 + glTF 导入 + 内置素材库；皮肤包机制 + 编辑面板 + 两套皮肤；\n**群体寻路 + 视野迷雾**（决策 38）；**播放期选择与指令 + 建造**；**技能目标选择**；\n**视听下限一套**（音频、预制粒子、材质与光照预设、后处理档位——决策 23）；游戏内 UI overlay 与预制件；\n**约束层的机制**（谓词注册 + 结构化失败反馈 + 面板显示）——闸门 C.5 的皮肤包完整性、§1.3 主循环的当场提示都依赖它，**不能等到阶段三**；\n**平台跳跃脚手架**（最快拿到可玩闭环，不作交付模板），随后 **RTS 模板**；\n**导出自包含工程文件**；**脚本化试玩 + 断言**；**教程系统的机制 + 已交付能力的教程条目**（决策 35）。\n\n- **闸门 C**（五条，v17 从七条改来）：\n  1. **RTS 模板可玩通一局**（采集 → 造兵 → 交战 → 分胜负），**全部逻辑由事件表与行为单元表达，没有一行专为它写的硬编码 JS**\n  2. 平台跳跃脚手架同样成立，且两者复用同一内核与同一套条件动作库的公共部分\n  3. 同一局能在 headless 里由脚本驱动跑完并断言结果，**含 1000 单位规模下不掉帧**\n  4. **导出的工程文件能在另一台机器上打开并继续改**（v17 替代原「发链接给陌生人」）\n  5. **换皮不变**：换一套皮肤包，**一行规则不改**，headless 同输入下**玩法状态**逐字节一致\n- **原第 5 条「配方可用性」与第 7 条「成品感 / 手机可玩」的处置**：\n  前者改为**教程可用性**，并入阶段三的闸门 D；后者随移动端一并推后，\n  **但决策 23 的视听下限本身不砍**（§3.4 各项照做，只是不再有「手机上打开」这个判据）\n\n### 阶段三 · AI 作者接口\n\ndescribe 层；**约束层接到 AI 上**（机制阶段二已建，这里加的是「作为验证器与重试信号」那一半）；单步 → 换皮 → 多步 → 生成规则行 →（内联建议）；**供应商适配层 + 能力探测与降级 + 设置界面**（决策 21）。\n\n- **闸门 D**（六条）：\n  1. 一句话生成一个可玩的关卡**及其逻辑**，可预览、可撤销\n  2. **生成的规则行能被手动继续修改**（I3 的验收点）\n  3. 端到端延迟有明确上限，超时有兜底\n  4. AI 能在 headless 里**自己试玩**并报告结果（驱动与断言阶段二已具备）\n  5. **教程可用性**（v17 换掉原「简易模式下全程可完成」）：一个懂引擎、但没用过本编辑器的人，\n     **只靠内置教程与 AI**，能走通主循环并改出一个与模板明显不同的关卡。**这是决策 35 的验收点**\n  6. **换一家模型仍可用**：把默认模型换成另一家（含一个**无结构化输出、无工具调用**的模型\n     与一个**本地模型**），上述四条仍然通过，只允许更慢、重试更多（I10 与决策 21 的验收点）\n\n### 阶段三 ½ · 第三人称动作模板（决策 25 的验收载体）\n\n**动画栈档 2**（决策 36：状态机 + 混合 + root motion，含 §4.4 的两条冲突解法）；\n§4.7 五个概念补齐到可用；**第三人称动作模板**（关卡串 + 战斗与判定盒 + 技能道具 + 背包 + 存进度 + 锁定）；\n菜单 / 背包 / 对话 / 结算四个界面页；配套配方与教程条目。\n\n- **闸门 F**（决策 25 的总判据，全项目最硬的一条）：\n  **做出一款能发到 itch.io 的完整作品**——标题画面、**至少 3 个关卡**、\n  **能存进度**、**有技能或道具系统**、有胜负结算、有音画、**30 分钟以上内容**。\n  且全部逻辑由事件表与行为单元表达，**没有一行专门为它写的硬编码 JS**\n  （用 JS 实现**通用的**条件与动作不算——那是决策 6 的正常路径；\n  **算不算的判据是：这段 JS 能不能被另一个模板复用**）。\n  **验收人 = 项目所有者**（决策 25 的 v17 修订）。\n\n### 阶段四 · 开放（v17 重立，原「第三个模板」出局）\n\n**这一阶段是「先自用 → 再验证 → 再开放」的第三步**，前面每一阶段都不依赖它：\n\n分享（极简后端 + 只读链接 + remix，决 14）；账号（OAuth，决 28）；\n移动端播放（触屏 + 自适应，决 23 的推后部分）；面向新手的 registry 裁剪视图（I8 的留口兑现）；\n城市模块迁移**仍然可选**。\n\n- **闸门 E**（两条，v17 修订）：\n  1. **两个模板跑在同一个内核上**，每个模块契约校验通过——无一
