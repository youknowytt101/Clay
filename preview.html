处直接 import 内核以外的东西，无一处绕过 Action 层写编辑期状态\n  2. 加入**第三个模板**（任选一个七款之外的玩法）时，内核**没有新增领域概念**（[§5.2](#52-内核归属论证) 表格不新增行）。\n     **这条是通用性的真正判据**——只有两个模板时，「两个都要」等于「全都要」（决策 39）\n- **闸门 G**（开放的判据）：把链接发给一个不认识这个项目的人，他能玩，并能一键 remix\n\n### 阶段五 · 联机（决策 29 的兑现）\n\n**先做 lockstep**（服务七款里的五款）：指令同步 + 确定性模拟 + 断线重连 + 观战。\n本轮不做，但**确定性纪律从阶段一起就按硬指标守**，否则这一阶段无法开工。\n**服务器权威 / 客户端预测路线已封顶**（§3.4），不做 FPS 竞技那条岔路（[A.9](#a9-主流玩法压力测试)）。\n\n### 闸门不过怎么办\n\n**砍范围，不放宽判据。** 一旦允许「先放过，下阶段补」，闸门就退化成装饰。\n\n| 阶段 | 预定砍单顺序（不要临场决定） |\n|---|---|\n| 阶段一 | 1. gizmo / 多选 → 2. 空间索引的 BVH（先只做网格哈希） → **绝不砍试飞台** |\n| 阶段二 | 1. 视野迷雾的精细化（先做最粗的圆形视野） → 2. 内置素材库规模 → 3. 后处理与部分预制粒子 → **绝不砍导出，也绝不砍寻路与确定性** |\n| 阶段三 ½ | 1. 界面页的数量（先做标题 + 结算） → 2. 关卡数量（先做 1 关跑通全流程） → **绝不砍动画栈档 2**——它是这一阶段的全部意义 |\n\n---\n\n## 七 · 模块契约与迭代纪律\n\n> 目标：让**单个模块的改动代价低到可以频繁失败**。\n> 可迁移的只有两条：**接口冻结、内部自由演进**；**敢整块丢掉**。\n> 不可迁移的是「提前为所有模块设计插件接口」——接口该长什么样，要造完第一个才知道。\n\n**好消息**：ECS + Action + 事件表本身就是模块化底座，不需要另起炉灶。\n\n| 已选架构 | 天然给出的边界 |\n|---|---|\n| ECS | 模块 = 一组组件 + 一组系统，系统之间只通过组件通信 |\n| Action 层 | 模块的对外能力 = 它注册的 Action，可枚举、带影响域 |\n| 条件动作库 | 模块给用户的能力，同样可枚举、可 describe |\n| 皮肤包 | 模块的呈现层，可整套替换 |\n| 约束层 | 模块的正确性契约，可独立验证 |\n\n### 7.1 模块契约\n\n每个模块一个声明文件，启动时校验，越界即报错：\n\n```\ncomponents:   组件类型 + schema\nactions:      注册的 Action\nrules:        注册的条件与动作\nkinds:        语义种类 + 玩法量（碰撞体、占地、可用动画状态）\nskins:        提供的皮肤包 + 要求的视觉插槽清单\nconstraints:  声明的约束\nsystems:      挂载的系统 + 调度阶段\npanels:       注入的编辑器面板\ntemplates:    提供的模板\ndepends:      依赖的其他模块（DAG，禁止循环）\n```\n\n**禁止**：直接 import 另一个模块的内部实现、直接读写不属于自己的组件表、绕过 Action 层改编辑期状态、直接 import 第三方 ECS 库、**在事件表或玩法组件里引用具体美术资源**（I9）、**在条件与动作的实现里触碰时间与随机源**（见下）。\n\n#### 确定性沙箱（决策 29 的执行点，v16 补）\n\n决策 29 把逐帧确定性升为硬要求，但**一直缺一个执行点**：决策 6 允许专业模式用 JS 实现条件与动作，\n而 `Math.random()` 或 `Date.now()` 只要出现一次，lockstep 与 headless 断言**同时废掉**——\n且失败是随机的、极难排查。\n\n| # | 约束 |\n|---|---|\n| **J1** | 条件与动作的 JS 实现跑在**受限环境**：禁 `Date` / `Math.random` / `performance` / 网络 / 存储 / DOM |\n| **J2** | 内核注入 `rng`（带种子）与 `tick`；要随机、要时间，只能从这里拿 |\n| **J3** | 违反在**注册时**就报错，不等到运行期——静态扫一遍实现体即可 |\n\n同一条纪律也适用于内核自己：[GameClock](../../js/sim/GameClock.js) 的 `new Date()` 与\n[core/project.js](../../js/core/project.js) 的 `randomUUID()` 是存量里已知的两处渗透（ai-native-engine.md 支柱五）。\n\n### 7.2 三条纪律\n\n| 机制 | 内容 |\n|---|---|\n| **变化轴声明** | 每个模块回答「我预期未来在哪几个方向上变」。价值是反向的——它同时说明哪些地方**不打算变**，因此现在**不要**为它做抽象 |\n| **退役条件** | 每个模块写明「什么情况下该整个丢掉」。大多数项目死于舍不得丢 |\n| **三次法则** | 不要在第二个用例出现之前抽象。第一次写死，第二次复制，第三次才抽象 |\n\n**已写下的退役条件**：\n\n- 寻路：500 单位下掉帧且优化无果 → 换流场，**查询接口不变**\n- 物理：Rapier 体积或确定性不达标 → 换库，**空间查询接口不变**\n- 事件表：若模板逻辑写不出来必须硬编码 JS → **加受限原语，不退回节点图**\n- 城市模块：迁移工作量超预算 → 放弃（已降为可选）\n- ECS 库：spike 的确定性测试不过 → 换库或自研；**封装层保证换库代价限制在约 800 行内**\n\n**项目级的退役条件**（同一条纪律，也该对项目自己生效）——**v17 反转**：\n\n> 原文是「若普通人改不出关卡 → 转向面向有经验创作者」。\n> **v17 之后那已经是起点，不是退路**，所以这条要换一个方向写。\n\n新的两条：\n\n| # | 触发条件 | 执行什么 |\n|---|---|---|\n| **P-1** | 闸门 F 通过后，**开放阶段（阶段四）迟迟无法开工，或开工后无人使用** | **承认它是个人引擎**，停止在分享 / 账号 / 新手视图上继续投入，把资源转回引擎能力本身。这不是失败，是把「三者都想要」收敛成「先自用」那一项——它本来就是第一优先 |\n| **P-2** | 闸门 D.5（教程可用性）连续两轮不过 | 说明**决策 35「门槛交给 AI 与教程」不成立**。此时要回头重估决策 12 的取消——面向新手的裁剪视图（I8 的留口）可能得兑现，而不是继续加教程 |\n\n**风险 6′ 的对应**：「先自用」的代价是架构可能长成只服务一个人的形状。\nP-1 不是为了预防它，是为了**在它发生时不自欺**。\n\n提前写下来，到时候是执行判断，不是情感决策。\n\n### 7.3 迭代速度来自试飞台，不是模块划分\n\nheadless runner（不开界面跑完整场景）+ 确定性（失败可复现）+ 约束层（不用人看就知道对不对）。\n\n判据：**改完内核，几秒内就能知道所有模板有没有被搞坏。**\n\n---\n\n## 八 · 存量资产处置\n\n**冻结的含义**：路 / 地形不再加新功能；严重 bug 仍修；[roads.md](../architecture/roads.md) 保持有效，是迁移的规格书。\n\n**要上提为引擎机制的**：[state/roadTypes.js](../../js/state/roadTypes.js) 的**主题包**是决策 20 的原型——它已做到「几何只认 widthUnits，主题永远不改变路宽、最小半径与路网拓扑」。阶段二实现内核皮肤包时照它的形状做；阶段四若迁移，道路主题**直接归并**，不保留两套机制。\n\n**直接留用的**（本来就通用）：停靠系统、i18n（**v17 起只做语言翻译，不再兼任术语层**）、项目门厅、存档信封与迁移链、无边框窗口外壳、图标系统、大纲与详情的交互框架。\n\n**要留用但必须重新设计的**：\n\n| 现有实现 | 为什么 |\n|---|---|\n| [CameraRig](../../js/render/CameraRig.js) | **v17 改判**：原文说「飞行相机是零基础用户的第一个劝退点」——画像换了，这条理由没了。现在只需**扩档**：飞行档位保留且可作默认，另加受限俯视（RTS 簇）与**肩后跟随 + 锁定**（动作簇） |\n| 工具栏与快捷键体系 | **v17 改判**：原文说「现在是专业软件密度，要按概念预算重排」——目标用户就是专业用户，**密度不再是问题**。只需按新的能力面重组，不必稀释 |\n\n**迁移基准**：保留冻结的旧实现作为 oracle 做新旧对拍（同一组输入喂给新旧两边，比较输出几何）。旧代码不删，只在测试里加载。\n\n---\n\n## 九 · 未决项\n\n| 项 | 何时必须决 |\n|---|---|\n| ECS 库选型 | 已调研，待 spike — 见 [adr-001-ecs.md](adr-001-ecs.md)，倾向 koota |\n| 组件 schema 的定义方式 | 与上一项绑定，两家库都不够用，都要自写封装层 |\n| **数值表达力**：伤害公式、经验曲线、后坐力衰减、装备加成叠加。行为单元解决了**结构**、决策 32 的数据表解决了**数值放在哪**，都没解决**公式怎么写**——参数位算术够不够，仍要实测。**触发条件写死：在 RTS 模板里真写一遍伤害公式，不够再抬**（v17 提前：RTS 比动作模板更早撞上它） | **阶段二**，做 RTS 模板时 |\n| **数据表的引用语法与作用域**（决策 32）：表归工程还是归内容包、跨包引用怎么写、行 id 与 `kind` 是不是同一套命名空间 | 阶段二，定 §4.7 数据模型时 |\n| **动态集合的持久化粒度**（决策 37）：整个集合勾选，还是按元素；与概念 3 的可持久化状态声明如何共用一套 | 阶段二，定 §4.7 数据模型时 |\n| **动画状态机的数据形态**（决策 36）：状态与转移是组件数据、是事件表的一种分组、还是第三种东西。**转移条件确定复用事件表的条件注册表**，但宿主形态未定 | **阶段三 ½ 开始前** |\n| **root motion 位移曲线的烘焙时机**（§4.4）：导入 glTF 时烘焙，还是运行期首次播放时烘焙并缓存。**影响确定性与首包体积** | 阶段三 ½ |\n| **寻路的实现选型**（决策 38）：navmesh / 流场 / 网格 A*。**退役条件已写死：1000 单位下掉帧且优化无果 → 换流场，查询接口不变** | 阶段二 |\n| **视野迷雾的粒度**（决策 38）：格子 / 射线 / 混合；是否考虑高度与掩体遮挡 | 阶段二 |\n| **输入意图的第一批清单**：哪些意图进内核、哪些由模块注册；手柄要不要进本轮 | 阶段二，做条件动作库时 |\n| **条件动作由谁实现**：内核写死 / 模块注册 / 允许用户写 JS。**v17 收窄**：目标用户会写代码，「允许用户写 JS」已不是问题——真正要定的是**沙箱边界**（§7.1 J1–J3）与**注册方式** | 阶段二 |\n| **教程系统的形态**（决策 35）：编辑器内的分步引导 / 可玩的教学工程 / 两者结合；以及**它怎么跟着能力一起交付而不腐烂** | 阶段二，随第一批能力一起 |\n| **场景切换的状态语义**：全局状态保留、场景内状态重置——边界具体怎么划 | 阶段二，定 §4.7 数据模型时 |\n| **可持久化状态的声明粒度**：按变量、按组件、还是按实体勾选 | 阶段二，定 §4.7 数据模型时 |\n| **界面页的实现形态**：DOM overlay 的页栈，还是场景的一种 | 阶段三，做完整作品模板前 |\n| **视听资源的来源**：音效与粒子贴图随内置素材库分发，还是另开一个包 | 阶段二，做视听下限时 |\n| **依赖与素材许可清单**：three.js / Rapier / ECS 库 / 内置素材 / 字体各是什么许可 | 阶段二（原「做分享之前」，现在提前——**导出工程文件同样要许可清楚**） |\n| **快照体积与资源数上限**（§3.6.4） | **阶段四，做分享之前** |\n| **最小度量**：怎么知道真人卡在哪一步。**不做遥测上报**（决策 21），最便宜的版本是本地记录，实测时当场看 | 阶段三，闸门 D.5 之前 |\n| **配方与教程条目清单**：每个模板配哪些 | 阶段二，由模板倒推 |\n| **视觉插槽的粒度**：一个 kind 一个插槽，还是允许同 kind 多变体 | 阶段二，做第二套皮肤时自然会知道 |\n| **内容包的最小字段集**（决策 27）：id / 版本 / 作者 / 许可 / 依赖 / 哈希 各怎么定。**它决定导出的工程文件怎么记依赖**——所以不再能等到分享阶段 | **阶段二**（v17 提前） |\n| **后端最小形态**：存储、快照体积上限、清理策略、举报入口；OAuth 用哪一家、数据删除请求怎么处理（决策 28） | **阶段四**，做分享之前 |\n| **块的大小与加载策略**（决策 30）：块多大、按距离还是按视锥、预加载几圈、卸载延迟多久 | 阶段一，做空间索引时 |\n| **Rapier 跨平台确定性**：spike 必须验证；不通过就换库（决策 29 不放宽） | **阶段一，闸门 A 之前** |\n| **1000 实体的可达性**：决策 30 的新预算是纸上定的，**要在阶段二的 RTS 模板上实测**。不达标先优化，仍不达标再考虑模拟细节分级（现为留口） | 阶段二 |\n| **能力探测怎么做**：靠 provider 声明、靠一次探测请求，还是两者结合 | 阶段三，做适配层时 |\n| **降级重试的次数与超时上限**：弱模型上要给多少预算才算「还能用」 | 阶段三，与闸门 D.6 一起定 |\n| **内置 AI 的成本谁承担**：免费额度、限速，还是干脆只给 BYOK | 阶段三，上线前 |\n| **AI 输出的安全边界**：限定可达的副作用范围（网络、存储、死循环） | 阶段三 |\n| 路网这类「非 ECS 形状」的数据如何在 ECS 中安身 | **闸门 B** |\n\n**已决并移出**：构建与依赖管理（阶段零）；**事件表的求值模型与实体集传递语义**——v16 移出，前置到阶段零定稿，见 [adr-002](adr-002-eventsheet-eval.md)（决策 31）；\nBYOK 密钥存放（桌面外壳 + 网页代理）；事件表表达力边界（决策 18）；模型接入的抽象层形态（决策 21）；\n**事件表要不要真函数**——v11 结案：**要做**，形式是「带参数的可复用行为单元」（§4.7）。\n原来的触发条件「三处重复才做」被推翻，理由是**只要游戏里有技能 / 道具 / buff / 敌人 AI，重复就是必然的**，\n而那覆盖几乎所有完整作品。\n\n---\n\n## 十 · 风险\n\n> **现表 17 条。** v17 重做了这张表（删 5 · 降级 4 · 加重 2 · 新增 2），v18 追加风险 20。\n> **删掉的 5 条全是「为普通人和为分发链付的税」**（1b 概念预算 · 7 3D 门槛 · 8 双模式退化 ·\n> 13 注册墙 · 14 数据责任），随决策 2 / 12 / 19 / 14 / 23 / 28 的推翻与推后一起消失。\n> **真正要盯的是加粗那 8 条**，其余是记录在案、暂不投入的。\n\n| # | 风险 | 缓解 |\n|---|---|---|\n| **1** | **内核膨胀**（最可能的死法） | §3.2 范围纪律 + **决策 39 换了判据源**（两款目标游戏且分属不同簇）+ 决策 26（留口而非砍能力）。**v17 的新执行点**：§5.2 明确标出三项「没干净过关但保留」的成员，下次要加东西先看它们能不能出局 |\n| 2 | 模板太像，通用性没证明 | **v17 降级**：两个模板的差异轴（相机 / 控制 / 节奏 / 联机 / 动画栈）比原来四个小模板拉得更满。**但风险换了形态**——只剩两个模板时纪律会失效，这由决策 39 与闸门 E.2（加第三个模板不新增内核概念）接管 |\n| **3** | **基础设施不产生乐趣**（v17 加重） | **原解药是「阶段二能发链接给别人」，而分享已推到阶段四**。新解药只能是：**阶段二末就要有一局能玩通的 RTS**，且平台跳跃脚手架更早给出可玩闭环。**这是本轮最现实的死法**——一个人做三个阶段的基础设施，中途没有正反馈 |\n| **4** | **AI 的延迟与失败击穿产品定位**（v17 加重） | 四条非功能项与功能同等对待；闸门 D 含延迟上限。**加重的理由**：决策 35 把门槛交给了 AI，**AI 从卖点变成承重结构**。失败兜底因此必须做实——AI 挂掉时教程与配方要能独立扛住 |\n| 4b | 接的模型太弱，体验崩掉却怪编辑器 | **v17 降级**：目标用户会自己配模型、看得懂能力差异。仍保留能力探测与「当场说清能做什么」 |\n| **5** | **事件表表达力不够，做不出七款目标游戏** | **v17 重定向**：原问题是「太简单，普通人够用但做不出游戏」，现在是「**RTS + 完整作品够不够强**」。决策 18 的封顶理由已换（技术理由而非可读性），**任意控制流与递归的封顶可以在阶段二实测后重估**。退役条件不变：写不出来就**加受限原语，不退回节点图** |\n| **6′** | **只有你能用**（原风险 6 的反面，v17 新增） | 「先自用」的代价是架构长成只服务一个人的形状，**开放阶段可能永远到不了**。缓解：**I8 的 registry 视图机制现在就留着**（不实现）；**项目级退役条件 P-1** 用来在它发生时不自欺 |\n| 9 | **美术量泄漏进玩法**，换皮就崩 | I9 + 皮肤包完整性约束 + 闸门 C.5。**v17 新增两个泄漏面**：root motion 的位移曲线、动画状态机的转移——两者的解法都在 §4.4，**都是「玩法量归 kind，呈现量归皮肤包」的再一次应用** |\n| 10 | **竞品已在场上且跑在前面** | 见下。**v17 换了位置**：不再拼「普通人能用」，拼**AI 与人共用同一条编辑通道** |\n| 11 | **模板与皮肤是内容生产，不是引擎开发** | **v17 降级但没消失**：模板从四个减到两个，移动端与分享的内容工作量出局。**但闸门 F 仍要 30 分钟内容**，那仍是关卡设计 + 美术 + 调平衡的活。砍范围时**优先砍内容的量，不砍引擎能力** |\n| 12 | 性能预算超标 | **v17 降级**：移动端出局后数字全部放宽（8MB / 桌面 60fps）。**但 P1 播放期与编辑器分包不许跟着松**——它的理由已换成决策 24 的移植退路 |\n| **15** | **物理确定性守不住**（决策 29 的最大技术风险） | 阶段一 spike 就验；**不通过换物理库，不放宽决策 29**。**v17 加重了它的分量**——决策 29 现在服务七款里的五款，不再是为遥远的阶段五预付 |\n| 16 | 流式加载与确定性打架（决策 30） | S1–S3 三条纪律；闸门 A 增加「卸载重载后结果一致」的断言 |\n| **17** | **JS 条件动作击穿确定性**（v17 加重） | §7.1 确定性沙箱 J1–J3。**加重的理由**：目标用户会写代码，**写 JS 条件动作的人变多了**。这条从「补丁」升为**核心机制**，要在阶段一落地而不是阶段二 |\n| 18 | 对覆盖面的过度承诺 | **v17 降级**：A.9 的玩法契合度表 + 决策 36 明确写死「刺客信条只到潜入 + 战斗 + 沿预设点攀爬」+ §3.4 把动画档 3 与竞技 FPS 列入**方向性封顶** |\n| **19** | **动画栈档 2 是本轮最大的单项工程**（v17 新增） | 状态机 + 混合 + root motion，是原文档明确留口的东西，理由是「对单人项目是无底洞」。**现在打开了，但只到档 2，档 3 封顶**。§4.4 的两条冲突解法必须先落地，否则它会污染玩法层与皮肤包两处。**预定砍单**：阶段三 ½ 宁可砍关卡数量与界面页，不砍它 |\n| **20** | **自主循环跑飞**（v18 新增，决策 40 档 2 的代价） | agent 连续跑几十步，中途走偏而用户没察觉，或改坏了大片东西才被发现。缓解：**A4 的预算与中断信号在引擎侧**；每步过约束层，红点即停；**A1 的 checkpoint 让回滚成本恒定**。**这条是留口项的风险，本轮不承担**——但 A1–A4 现在不留，日后要重做通道 |\n\n**v17 删掉的五条**（连同它们的缓解措施一起消失）：\n1b 概念预算被吃掉（决策 35 换了承担者）、7 3D 是门槛（画像换了）、\n8 两种模式退化成两个编辑器（决策 12 取消）、13 注册墙转化（推后）、14 数据责任（推后）。\n\n**关于护城河（风险 10 的展开）**\n\n不是「又一个通用引擎」——那条路拼不过 Godot。**v17 之后的位置是：AI 与人共用同一条编辑通道的 3D 引擎。**\n\n- **与世界模型**（Genie 一类）的边界：它们交付**生成的体验**（一次性、不可寻址、改不了），本项目交付**可持续编辑的工程**\n- **与 Nilo / Astrocade 的边界**：两家都在同一处让位——**产出用户改不动**（前者生成代码，后者黑盒）\n- **与 Unity MCP / Godot AI 的边界**（v17 起这是最重要的一条）：它们是**外挂式**——\n  文件是权威，AI 改完编辑器要重载、撤销栈丢失、人无法单独撤销 AI 的某一步。\n  **本项目的 AI 通道是内生的**（[ai-native-engine.md](ai-native-engine.md) 问题定义）\n\n**差异化押在 I1 + I3**：AI 与人是同一个命令层的两个前端，产出同一种材料。\n\n> **v17 换了押注（原文是 I2 + I3）。** 换的原因不是 I2 变得不重要——\n> **恰恰相反：I2「逻辑是数据」现在是 I1 的前提**。逻辑一旦变成代码，\n> AI 的产出就无法走 Action 层、无法逐行 diff、无法局部重试、无法单独撤销。\n> 变的只是**理由**：从「普通人要读得懂」换成「**AI 通道要成立**」。\n>\n> 这也让决策 13（事件表而非节点图）站得更稳了——\n> 原来那条论证的一半依赖「用户实际读不读得懂」这个未经验证的假设（风险 5），\n> 现在它依赖的是「模型写有序行比写图可靠」与「逐行 diff」（[A.2](#a2-决策-13为什么是事件表不是节点图)），\n> **两条都不依赖画像。**\n\n---\n\n## 附录 A · 关键决策的依据\n\n只保留能防止反复讨论的证据，正文不再重复。\n\n### A.1 竞品格局（2026-08 调研）\n\n| 产品 | 优势 | 让出的位置 |\n|---|---|---|\n| **Nilo**（2026-04 开放 beta） | 定位几乎重合：浏览器原生、WebGPU + WASM 物理、文生 3D 接第三方、链接协作、导出借别人的分发 | **逻辑是 vibe coding 生成的代码**，普通人改不动 |\n| **Astrocade** | remix 是产品本身；8 个月 2000 万活跃、7.5 万游戏 | 产出黑盒，作品深度封顶 |\n| **Rosebud AI** | prompt → 可玩最成熟，导出代码给高级用户退路 | 编辑器更重，规模小两个数量级——**编辑能力本身不是增长引擎** |\n| **Roblox** | 模板 + 社交 + 分发齐全；Assistant 已能规划 + 自动试玩 | 封闭平台、Lua、Studio 是专业软件 |\n| **Construct / GDevelop** | **事件表**——非程序员做出成品的唯一被验证形态 | 只有 2D；无 AI；无分享循环 |\n| **Godot** | 开源、概念少、headless 快 | 概念全给程序员；**节点式可视化脚本 0.5% 使用率、已删除** |\n| **PlayCanvas** | 云端多人同场景编辑 | 要写 JS，面向程序员；无 AI |\n\n### A.2 决策 13：为什么是事件表，不是节点图\n\n| 证据 | 说明 |\n|---|---|\n| Godot 删掉了节点式可视化脚本 | 5000 人调研中**仅 0.5%** 以它为主力。官方复盘：「一开始的路子就不对」 |\n| Godot 的文档理由同样适用于 AI | 每个例子都要截图、维护不动——**AI 也得看图或看一堆坐标** |\n| 非程序员做出成品靠事件表 | Construct / GDevelop 的条件-动作行；社区共识是它比 Blueprint 好懂得多 |\n| Blueprint 的成功不可迁移 | 它证明「可视化能替代代码」，不证明「可视化能让普通人编程」——用户本质上是程序员 |\n\n**AI 侧的增益（决定性的一条）**：\n\n| | 节点图 | 事件表 |\n|---|---|---|\n| 形状 | 图（节点 + 连线 + **布局坐标**） | **有序的行** |\n| 模型生成 | 图结构 + 空间推理，模型公认短板 | 写列表，模型最擅长 |\n| diff | 图同构比较 | **逐行 diff** |\n| 出错定位 | 「某条连线错了」 | 「第 7 行的条件不成立」 |\n\n**成本收益**：不再需要画布、连线交互、自动布线、布局算法、缩放平移。\n\n### A.3 决策 14：为什么分享不能再推\n\n- **Astrocade** 8 个月 2000 万活跃、7.5 万游戏，核心机制就是分享与 remix\n- **Rosebud** 编辑能力更强，规模小两个数量级\n\n而对本项目它几乎免费：决策 7 已是「同一应用切播放模式」，分享 = 一个 URL + 只读播放。\n**且 remix 与决策 9 是同一件事**——模板就是别人的作品。做了分享，模板库会自己长。\n\n**v14 的补充（决策 28）**：发布这一步改为需要注册。\n它不再「几乎免费」了——后端要担用户数据的责任，发布转化也会掉一截（§10 风险 13）。\n换来的是**作品归属**：匿名发布的作品，日后做市场时认领不回来，而决策 27 说市场是长期目标。\n\n### A.4 决策 15：城市迁移为什么降级\n\n3200 行迁移 + 新旧对拍是巨大沉没成本；而它要证明的（内核能承载不同领域）用 3–4 个小模板证明更强也更便宜；顺带修掉「两个模板太像」。**闸门 B 的纸面演练保留**——它便宜，且是内核设计的真实压力测试。\n\n### A.5 决策 18：为什么不是「表达力做到哪一档」\n\n那个问法本身是错的。削表达力换易懂，结果一定是塔防写不出来、被迫硬编码 JS（违反闸门 C）。\n正确做法是**表达力保持中等，门槛靠配方降**——不够用的人往下拆配方，学不会的人直接用配方，**两拨人用的是同一份材料**。\n\n**v8 的补充**：同一个错误在别处又犯了一次——「嵌套只许一层、不许参数位算术」也是削表达力。\n没有多层子事件，规则会横向铺开成一大片；没有参数位算术，伤害公式这类东西根本写不出来。\n两者都已放开，封顶改设在**任意控制流、递归、完整表达式语言**（§3.4）。\n\n**v11 的再次补充**：同一个错误犯了第三次——「不做真函数」也是削表达力。\n四款 AAA 的压力测试里，Dota 精确地打在这一点上：**只要游戏里有技能，重复就是必然的**。\n现已改为做**带参数的可复用行为单元**（§4.7），封顶只留递归与任意控制流。\n\n### A.6 决策 20：原型来自自己的代码\n\n[state/roadTypes.js](../../js/state/roadTypes.js) 开头的三条注释就是完整雏形：几何只认 widthUnits；主题是场景级呈现，换主题是一次设置变更；主题声明规则而非宽度表。v5 只是把它从模块私有实现上提为引擎级机制。\n\n判据几乎不额外花钱——I7 的 headless runner 与确定性本来就在计划里，**v5 只是把它认领为「美术隔离」的强制执行点**。\n\n### A.7 决策 21：为什么「接各种模型」是可行的\n\n这件事在别的引擎里很难，在本项目里便宜，原因是**架构已经把对模型的要求压到了很低**：\n\n| 已有的设计 | 对模型要求的影响 |\n|---|---|\n| 只暴露三个入口（`describe` / `listAvailableActions` / `apply`） | 不需要「一次塞几百个工具」，弱模型也不会被工具目录淹没 |\n| **渐进披露**：按需返回 schema | 上下文需求小，**不需要长上下文模型** |\n| Action params 是**可直接喂给模型的 JSON Schema 子集** | 有约束解码就用，没有就贴 schema + 校验重试，行为一致 |\n| 产出是 **Action 序列**而不是整张图 / 整段代码 | 每步独立可校验，**弱模型的错误是局部的、可重试的**，不是整体失败 |\n| **约束层**给结构化失败反馈 | 重试是收敛的，不是乱撞——这正是弱模型最需要的 |\n| 优先**挑配方 + 填参** | 把「创作」降级为「选择 + 填空」，弱模型也能做对 |\n\n**结论**：`I10` 不是额外负担，它是前面几条设计的**自然推论**。\n真正要守的只有一条——**不要在任何地方偷偷依赖某一家的独有能力**。\n\n---\n\n### A.8 决策 23：为什么「不做」清单需要拆成两张\n\n原来那张扁平的清单把两件不同的事混在一起：\n\n| | 砍掉它影响什么 | 处理方式 |\n|---|---|---|\n| **引擎范围** | 影响引擎能长多大 | 可以砍，砍了不影响用户作品质量 |\n| **作品质量** | 影响用户能做出什么水平的东西 | **不能砍，只能封顶** |\n\n音频、动画过渡、特效、材质与光照、移动端可玩全部属于第二类，却被写进了第一类。\n后果是自相矛盾：**决策 14 要求作品发给别人玩，而一个没声音、手机打不开的链接根本发不出去。**\n\n正确的做法不是「做 / 不做」，是**「做到哪儿为止」**——每一项给一个明确的封顶。\n封顶才是防膨胀该管的地方；一刀砍掉不叫克制，叫把问题推给用户。\n\n### A.9 主流玩法压力测试\n\n**先分清两种判定，它们的结论完全不同：**\n\n| 判定标准 | 问的是什么 | 结论 |\n|---|---|---|\n| **成品判定** | 能不能做出那款游戏本身 | **都做不到**——但那是 300 人 × 5 年、竞技网络与运营的问题，不是编辑器功能问题 |\n| **灰盒 MVP 判定** | **核心玩法循环**能不能跑通，几何体代替美术 | **六个里五个可做**，缺四项通用能力 |\n\n第二个才是对编辑器功能的有效判据。\n\n#### 灰盒 MVP 逐款结论（v12）\n\n| 游戏 | 判定 | 卡在哪 |\n|---|---|---|\n| **Dota 2** | ✅ 可做（单人对 AI） | 选择与指令、视野迷雾 |\n| **星际 / 红警** | ✅ 可做（小规模） | 选择与指令、播放期建造、迷雾；500 实体上限偏紧 |\n| **艾尔登法环** | ✅ 可做（Boss 房） | 动画事件 |\n| **塞尔达** | ✅ 可做（神庙式解谜 + 小区域） | 元素交互矩阵只能小规模；大地图靠缩小绕开 |\n| **CS** | ⚠️ 只有单人打 bot | **竞技本体做不到**，见下 |\n\n#### v16 的三款复核\n\nv12 的判定过于乐观了两处，也漏测了一整类玩法。**复核结论写在这里，不改 v12 的原表**：\n\n| 游戏 | v12 | v16 复核 | 差在哪 |\n|---|---|---|---|\n| **红警 / RTS** | ✅ | ✅ **判定成立，是三者中最契合的一类** | 但有两个未归属的卡点，见下 |\n| **塞尔达** | ✅ | ⚠️ **原判偏乐观** | 磁力抓取、举起放下、组装机关全要**关节**，而关节原本整个划在留口——**没有关节，物理只是「会掉下去」，不是「物理即玩法」**。已由决策 33 补上最小集 |\n| **刺客信条**（v12 未测） | — | ❌ **只到潜入原型** | 见下 |\n\n**红警的两个卡点**（都不是能力缺失，是无归属）：\n\n1. **寻路被砍进塔防模块**（§5.2）。塔防要的是固定路径，RTS 要的是**几十个单位的群体寻路 + 局部避让**，\n   难度不是一个量级。MVP 用小地图 + 流场够，但**要单独排，现在无规格**\n2. **500 同屏实体**：50 单位/方 + 建筑 + 投射物 + 特效，勉强够。文档原文「偏紧」是准的\n\n**刺客信条为什么只到潜入原型**：能做的是一座小据点、几个带视野锥的守卫、蹲伏、暗杀触发、\n沿预设点爬墙——**做不到的是这款游戏真正的产品：移动手感本身**。\n\n| 需要什么 | 现状 |\n|---|---|\n| 跑酷 / 攀爬 / 边缘抓取 | 动画状态机、混合树、IK **全部留口**，本轮只有 clip + 交叉淡化 |\n| 根运动（root motion） | **全文未提及** |\n| 城市人群 | 500 实体上限 + LOD / impostor 留口 |\n| 城市尺度 NPC 寻路 | 寻路在模块，navmesh 无归属 |\n| 视野锥 / 警戒状态 | ✅ 射线查询 + 行为单元够用 |\n\n**这不是缺陷，是取舍**：动画状态机 + IK + root motion 对单人项目是个无底洞，\n而它对核心假设（I2 事件表可读、I3 同一种材料）零贡献。**但要写出来**——见下一节。\n\n#### v17 的七款定案（本节现在是判据源 —— 决策 39）\n\n**v17 起，A.9 不再是「压力测试」，它是范围纪律的判据源本身**（§3.2、§5.2）。\n七款按簇排列，**判定用的是灰盒 MVP 标准**（核心玩法循环，几何体代替美术）：\n\n| 簇 | 游戏 | 判定 | 关键依赖 |\n|---|---|---|---|\n| **俯视指令** | 红警 | ✅ | 群体寻路、视野迷雾、建造、数据表、lockstep |\n| | 星际争霸 | ✅ 小规模 | 同上 + **1000 实体预算**（决 30 上调的直接原因） |\n| | 魔兽争霸 | ✅ | 同上 + 英雄技能（技能目标选择 + 行为单元） |\n| | Dota 2 | ✅ 单人对 AI | 技能目标选择（**核心**）、**物品栏（动态集合）**、视野 |\n| **第三人称动作** | 塞尔达 | ✅ 神庙式 + 小区域 | **关节**（决 33）、动画状态机、背包、大世界流式 |\n| | 艾尔登法环 | ✅ Boss 房 + 小区域 | **动画事件 + root motion**（决 36 的主要驱动者）、锁定、背包 |\n| | 刺客信条 | ⚠️ **明确降级** | **潜入 + 战斗 + 沿预设点攀爬。没有丝滑跑酷**——那要动画档 3，已封顶（§3.4） |\n| | 第三人称射击 | ✅ 单人 / 合作 | 动画档 2、射线命中、掩体。**不做竞技 FPS**（网络模型会裂成两套） |\n\n**三条从这份清单读出来的结论**：\n\n1. **七款里五款是联机游戏，且全部走 lockstep** → 决策 29 从「预付」变成「被证成」，网络模型不分裂\n2. **没有一款需要网格世界、模拟分级、载具物理、样条路网** → v17 把这四项撤回为留口\n3. **刺客信条是唯一一款要降级的** → 它的核心是移动手感，而那是动画档 3。**降级写死在决策 36，不再每轮回来一次**\n\n#### 玩法契合度（v16 新增，风险 18 的应答）\n\n**MVP 覆盖面与玩法的「节奏 + 相机」强相关**，因为整套架构的每一处选择都在往同一个方向使劲：\n\n| 轴 | 玩法 | 为什么 |\n|---|---|---|\n| **强项** | RTS、MOBA、塔防、战棋、roguelite、经营 | 俯视 / 秒级 / 指令驱动。受限相机是默认（决 16）、确定性 + Action 日志天然是 lockstep 底座（A.9）、选择与指令在内核 |\n| **中等** | 魂类 Boss 房、塞尔达神庙、平台跳跃 | 第三人称 / 房间尺度 / 帧级战斗。动画事件托住攻击判定，关节托住物理解谜；缺的是状态机 |\n| **弱项** | 刺客信条类跑酷、character action | **移动本身即玩法**。整个动画栈封顶在 crossfade，这一类拿不下来 |\n\n**这张表的用处是防止隐性判据**：闸门 F 只要求「一款能上架的完整作品」，\n而「通用引擎」四个字会让人默认覆盖全部类型。**弱轴写出来，就不会在阶段三半路去补一个动画状态机。**\n\n**v11 补的三个概念恰好托住了最硬的部分**——技能系统、buff、背包菜单、篝火存档、回合流程，\n全部落在行为单元与流程上。**没有 v11 那轮，这五款一个都做不成。**\n\n#### 补进内核的四项（v12）\n\n| 能力 | 谁需要 | 归属 |\n|---|---|---|\n| 播放期**选择与指令** | Dota / 星际 / 红警 / 战棋 | 内核 |\n| 播放期**放置与建造** | **塔防（本来就要）** / RTS / 城建 | 内核 |\n| **动画事件**（clip 时间点） | 魂类 / 动作 / 任何有攻击判定的 | 内核 |\n| **战争迷雾 / 视野** | 只有 RTS 类 | **模块** |\n\n第四项**数值表达力**（伤害公式、成长曲线）列入未决项，触发条件是「实测写一遍公式」。\n\n#### CS 为什么连 MVP 也拿不下\n\n不是功能缺失，是三件结构上不做的事：**竞技网络**（服务器权威 + 客户端预测 + 延迟补偿，\n与本项目的 lockstep 亲和性正好相反）、**手感精度**（亚帧命中、稳定高帧率，而预算是手机 30fps）、\n**反作弊**。能做的只有「单人打 bot 的射击原型」，而 **CS 的体验核心是对枪**。\n\n同样的道理对星际的天梯成立——但**星际的单人战役、Dota 的单人对 AI 都是完整体验，\n只有 CS 的单人模式不构成一个游戏。**\n\n#### 这次压测暴露的三条通用教训\n\n| 发现 | 处理 |\n|---|---|\n| **拦住完整游戏的不是天花板，是三个架构缺口**（场景与流程、行为单元、运行期状态） | 全部补进 §4.7，数据模型阶段二定死 |\n| **模板集选错会漏能力**——塔防与平台跳跃恰好都不需要那三样，所以架构漏掉了它们 | 加「完整作品模板」，决策 15 修订 |\n| **确定性 + Action 日志 = lockstep 网络的天然底座** | 日后做联机**先做 RTS / MOBA 类**（指令同步），不要先做 FPS 类（服务器权威 + 客户端预测，代价大一个数量级）。回放是白送的 |\n\n**还有一条 v12 才发现的**：现在的模板集（塔防 + 平台跳跃 + 完整作品）**仍然倒推不出\n「选择与指令」和「动画事件」**——所以这两项是**按共性能力直接写进内核清单的，不是由模板倒推的**。\n这是三次法则的一次例外，理由写在这里备查：**当五个主流玩法里有三个以上需要同一样东西时，\n不必等模板出现。**\n\n### A.11 决策 4（只做 3D）的依据（补于 v16）\n\n**这一条一直没有依据条目，而它是全文成本最高的决策之一**——3D 把美术量、动画栈、\n相机设计、性能预算全部乘上一个系数，**且对核心假设（I2 事件表可读、I3 同一种材料）零贡献**。\n补写在这里，是为了让它和其他决策一样可被推翻。\n\n**支持它的三条**：\n\n| 依据 | 说明 |\n|---|---|\n| **差异化位置**（风险 10） | 2D 事件表引擎这一格**已经被 Construct / GDevelop 占满且做得很好**（A.1）。再做一个只能拼质量，拼不过十几年积累。「普通人能用的 **3D** AI 原生网页引擎」这一格才是空的 |\n| **用户画像**（决策 19） | 会 Blender、理解变换与材质的人，**手里的资产和肌肉记忆都是 3D 的**。给他们 2D 反而要重学 |\n| **决策 16 已应答了成本** | 「3D 是门槛」（风险 7）的答案是**受限 3D**：默认地面平面 + 固定相机档位。它把 3D 最劝退的部分（自由飞行相机）降级为一个档位 |\n\n**要诚实记下的代价**：\n\n- **视听下限（决策 23）在 3D 下贵得多**：一套 2D 的「像成品」只要美术风格统一；\n  3D 的还要光照、材质、后处理、动画过渡各一套——**§3.4 视听表里六项本轮做，全部是 3D 带来的**\n- **风险 11（内容生产量）大部分由这条决策产生**：素材库、皮肤包、模板关卡，3D 的工作量是 2D 的数倍\n- **A.9 的弱轴也源于此**：2D 里「移动手感」是几张 sprite，3D 里是一整套动画状态机\n\n**推翻它的条件**：若闸门 C 的真人实测显示，用户卡在**3D 空间操作**（摆放、对齐、相机）\n而不是卡在事件表，则决策 16 的受限 3D 已经不够，**此时该重估决策 4，而不是继续给 3D 加辅助工具**。\n\n> **v17 补充**：这一条的第二、三行依据（用户画像、决策 16 的受限 3D）**随画像一起失效了**。\n> 但结论**更稳**——目标用户本来就在 3D 里工作，七款目标游戏全是 3D。\n> **真正剩下的代价只有一条**：§3.1 的三款参照（星露谷 / 空洞骑士 / 吸血鬼幸存者）全是 2D，\n> **「一个人能做完」这个水位在 3D 下没有被参照过**。这条挂在这里，等闸门 F 给答案。\n\n---\n\n### A.12 决策 35：为什么门槛可以交给 AI 与教程\n\n原文档用画像反推了四条约束——**双模式、术语层、削表达力、概念数量上限**。\n它们的共同前提是「用户是不写代码的普通人」，而那是全文**最容易变、也确实变了**的一条假设。\n\n**v17 的做法不是把门槛取消，是换一个承担者。** 三条理由：\n\n| 依据 | 说明 |\n|---|---|\n| **架构已经把 AI 的门槛压得很低**（[A.7](#a7-决策-21为什么接各种模型是可行的)） | 三个入口、渐进披露、Action 序列而非整图、约束层给结构化反馈、优先挑配方填参——**这些设计本来就是为了让弱模型也能干活**。让 AI 承担「我不知道怎么做」，是这套架构的自然推论，不是新负担 |\n| **教程比裁剪界面便宜，而且不损失能力** | 裁剪界面要维护两套暴露面、两套默认值、一套术语映射，且**永久钉死了简易侧的上限**（M3）。教程是内容，**加了不影响能力，删了不影响架构** |\n| **教程能跟着能力一起交付** | §1.4 的新原则「每个概念自带入口」把它变成可判定的：**加一个概念就要交一条教程**。这比「概念总数有上限」更可执行，也不需要知道用户是谁 |\n\n**代价必须写明**：\n\n- **AI 从卖点变成承重结构**（风险 4 加重）。AI 挂了，门槛就没人承担——所以「失败兜底」这条非功能项从此与功能同级，教程与配方必须能独立扛住\n- **教程是内容生产**，会撞上风险 11。**但它比模板与皮肤便宜得多**，且不做的后果更贵\n- **这条决策有一个可判定的失败信号**：闸门 D.5「教程可用性」。连续两轮不过 → 走项目级退役条件 **P-2**，回头重估决策 12 的取消\n\n**一句话**：**画像会变，AI 与教程这两个承担者不会因为画像变而失效。**\n这正是「不要被画像限制」的可操作含义——**不是无视用户，是不把用户画像刻进架构。**\n\n---\n\n## 相关文档\n\n- [ai-native-engine.md](ai-native-engine.md) — AI 基础设施规格（五根支柱）。**下级文档**，方向与阶段以本文为准\n- [adr-001-ecs.md](adr-001-ecs.md) — ECS 库选型决策记录\n- [adr-002-eventsheet-eval.md](adr-002-eventsheet-eval.md) — **事件表求值语义**。全项目唯一不可逆的一项，阶段零定稿后按 I11 冻结\n- [architecture/roads.md](../architecture/roads.md) — 道路系统架构，迁移时的规格书\n"}, {"id": "ai", "title": "AI 基础设施规格", "md": "# AI 基础设施规格 · 五根支柱\n\n> **定位**：本文是 [goals.md](goals.md) §5.1「AI 基础设施」与 §5.3「AI 作者接口」的详细规格，\n> **不是独立纲领**。方向裁决一律以 goals.md 为准，阶段与闸门见 goals.md §6，本文不再另立路线。\n>\n> 早期版本曾以「垂直引擎护城河」立论，该论点已被 goals.md 推翻（通用引擎 + 领域模块）。\n> 保留下来的是技术设计部分，并按 2026 年的 agent 工程实践作了修正。\n\n## 目录\n\n- [问题定义](#问题定义)\n- [支柱一 · 单一变更通道](#支柱一--单一变更通道)\n- [支柱二 · Action Registry 与渐进披露](#支柱二--action-registry-与渐进披露)\n- [支柱三 · describe：语义 LOD](#支柱三--describe语义-lod)\n- [支柱四 · 约束层：结构化的失败反馈](#支柱四--约束层结构化的失败反馈)\n- [支柱五 · Headless 与确定性](#支柱五--headless-与确定性)\n- [事件表的生成方式](#事件表的生成方式)\n- [AI 介入形态](#ai-介入形态)\n- [本文范围内明确不做](#本文范围内明确不做)\n\n---\n\n## 问题定义\n\n主流路线（Unity MCP、Godot AI、Summer Engine）是**外挂式**：agent 通过桥驱动现有编辑器，建场景 → 运行 → 读错 → 自修。它们受制于一条结构性事实——\n\n> **文件是权威，而文件谁都能绕过编辑器直接写。**\n\n后果：AI 改完编辑器要重载、撤销栈丢失、人无法单独撤销 AI 的某一步、编辑器开着时改文件即冲突。\n\n本项目的差别是 **AI 通道内生**：AI 和鼠标是同一个命令层的两个前端（goals.md I1）。\n下面五根支柱是让这句话成立所需的全部基础设施，一根不多。\n\n---\n\n## 支柱一 · 单一变更通道\n\n**规则：编辑期世界状态只能通过 Action 改变。** 鼠标、AI、事件表编辑、读档全部收敛到同一入口。\n\n```\n场景 = 初始状态 + Action 序列\n```\n\n这是**语义模型**，用于 diff、回放、审计；**不是存储实现**（见[明确不做](#本文范围内明确不做)）。\n\n白送的能力：\n\n| 能力 | 为什么白送 |\n|---|---|\n| AI 的每一步都能被人单独撤销 | 和人的操作在同一个栈里 |\n| diff 的是**意图**不是**结果** | 「改了 3 个坐标」→「把这条路的半径从 8 改成 25」 |\n| 完整操作回放 / 教学录像 | 日志就是录像 |\n| AI 行为完全可审计 | 每一步留痕、带参数 |\n\n**现状**：[History](../../js/core/History.js) + 17 个 Command 已经是这根支柱的九成。\n差的是**「唯一入口」的强制**——迁移到 ECS 内核时补上，晚补一天就多一天旁路债。\n\n---\n\n## 支柱二 · Action Registry 与渐进披露\n\n每个 Action 声明自己的元信息：\n\n```js\n{\n  id: 'unit.spawn',\n  params: { /* JSON Schema，见下方子集约束 */ },\n  preconditions: [...],          // 什么情况下可用\n  affects: ['transform', 'ai'],  // 影响域\n  reversible: true,\n  describe: (params) => '在出生点生成 3 个近战单位',\n}\n```\n\n### 关键：不要一个 Action 一个 tool\n\n2026 的 agent 工程共识是**渐进披露**——预加载全量工具目录是上下文浪费的最大单一来源\n（Unity MCP 一家就 268 个工具；多个 server 并存时开场即烧数万 token）。\nAction 会随模块持续增长，全量暴露必然失控。\n\n**对模型只暴露三个稳定入口**：\n\n```js\ndescribe(scope, detail)          // 看世界（支柱三）\nlistAvailableActions(context)    // 此刻能做什么，按需返回 schema\napply(actions[])                 // 执行，返回约束校验结果（支柱四）\n```\n\n`listAvailableActions` 是**情境级自省**——不是「这个类有哪些方法」，而是\n「当前选中这个物体、处于这个模式，什么操作有意义、影响谁、能不能撤销」。\nAction 加到 500 个，上下文成本也不涨。\n\n同一份 registry 白送：命令面板（Ctrl+P）、宏录制、脚本控制台、测试夹具、快捷键系统——\n以及**任何能力过滤视图**（goals.md **I8**）：过滤是 registry 的一个视图，不是第二套代码。\n（goals.md 决策 12 的双模式已于 v17 取消，**但这个机制留着**：日后要做面向新手的裁剪界面，入口在这里。）\n\n### params 的 JSON Schema 子集约束（硬性）\n\nAction 的 params schema **必须能原样喂给模型做约束解码**。因此禁止：\n\n- 自定义类型、引擎内部类的引用\n- 深嵌套 `oneOf` / `anyOf`（一层以内）\n- 运行时求值的默认值\n- 靠文档描述、schema 里表达不出的隐含契约\n\n理由：约束解码把**语法错误压到零**，约束层的重试预算全部留给**语义错误**。\n这条不早定，17 个命令各写各的 schema，等接模型时会有一半不可用。\n\n### 三个入口就是能力降级的边界（I10）\n\n供应商适配层、能力探测、降级矩阵、设置界面**全部写在 goals.md §5.5**，本文不重复。\n这里只补一句实现上的要点：\n\n> **降级发生在这三个入口内部，不外溢。** 没有约束解码就「贴 schema + 校验 + 带结构化原因重试」，\n> 没有工具调用就把三个入口退化成单轮 JSON 协议——**上层的 Action 序列与约束层完全不受影响**。\n\n**禁止**：在提示词、协议或解析里依赖任何一家的独有字段与行为。判据是闸门 D.6。\n\n---\n\n## 支柱三 · describe：语义 LOD\n\n每个状态子系统实现两个接口：\n\n```js\nserialize()                 // 精确、稠密、给机器（已有）\ndescribe(scope, detail)     // 语义、稀疏、给 AI 和界面（缺）\n```\n\n**语义描述必须可寻址、可下钻**——先看全局摘要，锁定感兴趣区域再要细节：\n\n```js\nterrain.describe({ at: [120, 80], radius: 20 }, 'detailed')\n```\n\n这与支柱二的渐进披露是**同一个机制的两个面**（结构 vs 能力），不要做成两套 API。\n\n### describe 返回结构化数据，不返回文案\n\n反面例子是让引擎生成「西南缓坡、最陡 8%、中部有东西向走廊」这样的句子——\n那是**模型该做的事**，写进引擎就是把生成成本和语言维护搬进内核，还要乘以 i18n。\n\n引擎输出的是分区统计、极值、坡度直方图、标注区域、拓扑关系。\n[ui/outliner.js](../../js/ui/outliner.js) 与 [ui/details.js](../../js/ui/details.js) 是这件事的人类版本，\n应与 AI 版本共用同一份数据源，避免人机两套描述慢慢跑偏。\n\n**优先级：地形最先做。** 它是目前唯一让 AI 完全失明的子系统——\n`heights: Float32Array` 在 1024×1024 下是一百万个数，读不动也写不动。\n\n---\n\n## 支柱四 · 约束层：结构化的失败反馈\n\n有效状态的判据不能是「运行时崩不崩」——那个信号又慢又稀疏，而绝大多数错误根本不崩，只是不对。\n约束层把「什么是有效」变成一组可枚举、可解释的谓词。\n\n```js\n{\n  id: 'road.maxGrade',\n  severity: 'error' | 'warning',\n  check: (world) => [\n    {\n      at: { entity: 42, segment: 3 },   // 位置\n      observed: 0.11,                    // 实测值\n      limit: 0.08,                       // 约束值\n      alternatives: [                    // 可行替代 —— suggest 由它生成\n        { action: 'road.adjustProfile', params: { grade: 0.08 } },\n      ],\n      message: '这段路坡度 11%，超过卡车爬坡上限 8%',   // 只用于渲染给人看\n    },\n  ],\n}\n```\n\n### `at / observed / limit / alternatives` 四元组是硬要求\n\n修复环的实证结论一致：**给出位置 + 实测值 + 可行替代**的反馈，\n其修复收敛速度显著优于原始诊断信息；只给位置而不给替代不够。\n这决定了 AI 重试是收敛还是乱撞，而字段成本几乎为零。\n\n**第一批约束里必须有一条「皮肤包完整性」**（goals.md 决策 20）：\n当前皮肤是否覆盖了事件表用到的每个 kind 与动画状态。\n它是 I9 的执行点，也是 AI 换皮后自检的依据——缺什么，`alternatives` 里直接给出补哪个插槽。\n\n一份约束集同时喂五个消费者：\n\n1. **AI 的验证器**——生成后自动校验，失败带结构化原因回炉\n2. **AI 的搜索信号**——从二值信号升级为密集、可解释的评分\n3. **人的实时反馈**——现在 [tools/RoadTool.js](../../js/tools/RoadTool.js) 的红色禁建提示是硬编码的；抽出来后所有工具白送（goals.md §3.4「错误必须便宜」）\n4. **测试**——约束就是断言，现有 16 个套件有相当一部分可改写成约束\n5. **文档**——约束集就是「这个引擎的世界规则」的可执行说明书\n\n---\n\n## 支柱五 · Headless 与确定性\n\n两个要求：\n\n- **无渲染可跑**——已做到（数据层零 three.js 依赖，本项目最大的存量资产）\n- **确定性**——相同 Action 序列必然产生相同状态。**这是硬要求，不允许降级**（goals.md 决策 29），\n  因为 lockstep 联机以它为前提；断言范围限定在**玩法状态**，不含渲染与视听。\n  **执行点是 goals.md §7.1 的确定性沙箱**：条件与动作的 JS 实现禁触时间与随机源，\n  由内核注入 `rng` 与 `tick`，注册时静态检查（[adr-002](adr-002-eventsheet-eval.md) §8）\n\n第二条**尚未做到**：[GameClock](../../js/sim/GameClock.js) 用 `new Date()` 初始化，\n[core/project.js](../../js/core/project.js) 用 `randomUUID()`。\n非确定性一旦渗进世界状态，回放和 A/B 试算全废。改由 Action 参数传入即可。\n\n做到后解锁两件事：\n\n1. **AI 在沙箱里跑 N 个方案变体，用约束层打分，只把最好的提交给人审阅。** 从「生成一个答案」变成「搜索解空间」。\n   **这与五根支柱合起来就是 agent 的完整闭环**——感知（支柱三）· 知道能做什么（支柱二）·\n   行动（支柱一）· 知道对不对（支柱四）· 验证成果（支柱五）。goals.md 决策 40 把它写成了可分档的能力，\n   **基础设施一根都不用新加**。\n2. **脚本化试玩 + 断言**——这件事**不需要 AI**，是纯试飞台能力，\n   它是**闸门 C.3「1000 单位规模下由脚本跑完并断言」**的直接依赖。\n   同类能力已在商业平台落地（Roblox Assistant 的自动试玩，2026-04）。**早做早受益。**\n\n---\n\n## 事件表的生成方式\n\ngoals.md 决策 13 把逻辑层定为**事件表**（有序的「当……就……」规则行），\n其中一半理由就是 AI 侧的：**模型写有序列表远比写图可靠**。\n图结构生成需要空间推理与多步规划，是当前模型的公认短板（如 GVGAI-LLM 的 118 游戏 zero-shot 评测），\n而且整图直吐的失败是**整体失败**，无法定位。\n\n即便如此，**仍然不要让模型一次吐出整张表**。**改为吐 Action 序列**：\n\n```\nrule.add / rule.addCondition / rule.addEffect / rule.setParam / rule.move\n```\n\n每一步过约束、可撤销、可局部失败，**失败点能精确到第几条规则的第几行**。\n这同时让 goals.md 的 I1 与 I3 自动成立——AI 写规则和人写规则**走的是同一条路径**。\n\n**优先挑配方，再填参**：配方 = **一个行为单元 + 一组默认参数 + 一句说明**（goals.md §4.3）。\n模型的首选动作是挑一个配方、填参数，只有都不合适才逐行拼，最后才定义新的行为单元。\n展开后就是普通规则行——**AI 走的和人走的是同一条路径**。\n\n**措辞由注册方提供，不由模型即时生成**：每个条件与动作在注册时自带人话模板串\n（`当 {对象} 进入 {目标} 的范围`）。理由是 I3——\n措辞每次显示都不一样，用户就无法确认「这和我上次改的是同一个东西」，\n「同一种材料」这条就松了。代价是每个条件动作要写一句文案，这笔成本是值的。\n\n**顺带的好处**：事件表是有序行，AI 的产出可以**逐行 diff 后再呈现给用户**——\n「新增了第 4–6 行，修改了第 2 行的这个参数」。节点图给不出这种粒度的变更说明。\n\n---\n\n## AI 介入形态\n\n按信任成本从低到高，也是实现顺序：\n\n| 形态 | 评价 |\n|---|---|\n| **单步指令** | **起点。** 一句话 → 一条 Action → 预览 → 确认。作用域小、错了代价低、用户能立刻判断对错。**应在内核地基完成时就接**——验证的是通道形状，不是模型能力，早发现比晚发现便宜一个数量级 |\n| **内联建议** | 选中物体 → 详情面板给 1–2 条建议（「路口半径 8m，重卡过不去，改 25m？」）→ 点一下变成一条标准 Action |\n| **多步变更集** | N 条 Action → 视口半透明预览 + 清单 → 整体接受 / 逐条剔除 → 接受后合成一条撤销记录 |\n| **生成规则行** | 走上一节的 Action 序列路径，产出可见、可手改、可逐行 diff 的规则 |\n| **换皮 / 配皮肤** | 「换成赛博朋克风」→ 只改皮肤包映射，**不碰任何规则**（I9）。作用域极小、错了一眼看得出，是 AI 最安全的一类任务 |\n| **受监督的自主循环** | **留口**（goals.md 决策 40 档 2）。做一步 → 读约束反馈 → 决定下一步，跑 N 步。**它与「多步变更集」的差别不是规模，是控制结构**：后者一次性吐完再 review，前者边做边读。留口条件 A1–A4 见 goals.md §5.4 |\n| **AI 造零件** | **留口**（档 3）。AI 用 JS 实现新的条件与动作。**不得自动注册**：必须过确定性沙箱静态检查 + headless 断言，并在 registry 标明来源（I11） |\n| 产出黑盒结果 | **不做。** 不可寻址、不可手改、改一处要重来——与 I3 直接冲突。**注意封的是形态不是规模**：任务多大都行，产出必须始终是 Action 序列 |\n\n### AI 在 v17 之后的位置（goals.md 决策 35）\n\n原文这里是一张「简易模式 vs 专业模式」的对照表。**双模式已于 v17 取消**，\n但更重要的变化是 AI 的**分量**：\n\n> **决策 35 把门槛交给了 AI 与内置教程，于是 AI 从「产品卖点」变成「承重结构」。**\n\n| | 含义 |\n|---|---|\n| **位置** | 与直接操作并列的主要修改方式，**同时是「我不知道怎么做」的答案** |\n| **主用形态** | 单步指令、挑配方并填参（低信任成本）→ 多步变更集、逐行改规则（高） |\n| **失败时** | **必须能退回到「用模板 + 配方 + 教程手动做」**。这条从「兜底」升为硬要求——AI 挂了门槛就没人承担 |\n\n**共用的是同一套 Action 与同一份 registry。** 任何视图只改变暴露面与文案，不改变通道（I8）。\n\n### 非功能项（与功能同等对待）\n\n- **延迟**：慢到十几秒，「省下手工操作」的价值就没了\n- **失败兜底**：AI 不可用 / 超时 / 乱答时，编辑器必须完全可用\n- **可解释**：每次变更都要能说清「改了什么、为什么」\n- **离线**：没有 AI 也能用模板与条件动作库做事\n- **供应商无关**：能力探测 + 降级矩阵见上文「模型无关层」；用户可填自己的端点与模型（决策 21）\n\n---\n\n## 本文范围内明确不做\n\n| 不做 | 理由 |\n|---|---|\n| **第三种逻辑层形态** | 决策 13 已定为事件表。**注**：本文早期的「支柱六 · 声明式 when/then 规则」在形式上已被决策 13 采纳并取代——但它当年被判为「表达力上限太低、暂缓」，而事件表补上了实体选择、分组与参数化。留着两套说法只会引发争论，故删 |\n| **Action 日志的事件溯源存储** | 「初始状态 + Action 序列」是语义模型。本轮实现只需内存栈 + 存档时落盘一段 |\n| **多 agent 并发编辑的合并机制** | 没有用户之前是伪需求。`affects` 字段保留（它服务约束与影响域），但不为合并做设计 |\n| **describe 输出自然语言** | 见支柱三。文案维护 × i18n 的成本不该进内核 |\n| 一个 Action 一个 tool 的暴露方式 | 见支柱二。上下文成本随模块线性增长 |\n\n---\n\n## 相关文档\n\n- [goals.md](goals.md) — **上级文档**。方向、阶段、闸门以它为准\n- [adr-001-ecs.md](adr-001-ecs.md) — ECS 库选型\n- [adr-002-eventsheet-eval.md](adr-002-eventsheet-eval.md) — 事件表求值语义。**本文「事件表的生成方式」一节的下游约束**：条件在注册时要声明「常规 / 触发」\n- [architecture/roads.md](../architecture/roads.md) — 道路系统架构，阶段四迁移的规格书\n"}, {"id": "adr1", "title": "ADR-001 · ECS 选型", "md": "# ADR-001 · ECS 库选型\n\n| | |\n|---|---|\n| **状态** | **倾向已定，待 spike 验证**（M1 第 1 周结束时转为「已定」或「改选」） |\n| **日期** | 2026-08-08 |\n| **决策者** | 项目所有者 |\n| **上游** | [goals.md](goals.md) 决策 4（实体模型 = ECS）、§6（模块化契约）、§9（未决项） |\n\n---\n\n## 1. 背景\n\n[goals.md](goals.md) 决策 4 定了实体模型用 ECS。本 ADR 决定**用哪个实现**。\n\n选型必须服务的，是 goals.md 里已经定死的几件事，而不是「哪个 ECS 更好」这种泛问：\n\n| 约束来源 | 对 ECS 的要求 |\n|---|---|\n| §3.2 播放沙箱 | 全世界快照 + 回滚 |\n| §3.1 Action 层 | 变更可追踪、可 diff、可回放 |\n| §4.1 试飞台（Q1） | **确定性**：同一 Action 序列 → 同一序列化结果 |\n| §6.2 模块契约 | 组件类型可在运行时由模块注册 |\n| 决策 5 JS 脚本 | 脚本由**人和 AI**书写，API 出错率是一等指标 |\n| §4.2 详情面板 | 组件 schema 可自省，用于自动生成控件 |\n| 商业化可能性 | 许可证不能带传染性约束 |\n\n---\n\n## 2. 候选与数据\n\n2026-08-08 实测 npm registry 与 GitHub API：\n\n| 库 | 版本 | 最后发布 | 仓库最后提交 | 周下载 | Stars | 许可证 |\n|---|---|---|---|---|---|---|\n| **bitECS** | 0.4.0 | 2025-12-06 | 2026-04-12 | 15.7k | 1484 | **MPL-2.0** |\n| **koota** | 0.6.6 | 2026-05-09 | 2026-08-04 | 10.5k | 712 | ISC |\n| miniplex | 2.0.0 | 2023-07-16 | — | 4.5k | ~1k | MIT |\n| becsy | 0.15.5 | 2025-03-02 | — | 106 | ~300 | MIT |\n| arancini | 8.1.0 | 2025-07-01 | — | 29 | — | MIT |\n\n**首轮淘汰：**\n\n- **miniplex** — 三年未发版。12 个月冲刺不赌停更的库。\n- **becsy / arancini** — 周下载两位数，出问题只能自己啃源码，没有社区兜底。\n\n真实候选：**bitECS / koota / 自研**。\n\n---\n\n## 3. 逐项对比\n\n| 需求 | bitECS 0.4 | koota 0.6 |\n|---|---|---|\n| 快照 + 回滚 | ✅ 内置 `createSnapshotSerializer` | ❌ 无内置 |\n| 变更追踪 | ✅ Observer serializer | ✅ `Added/Removed/Changed` 修饰符 |\n| 运行时注册组件 | ✅ 组件即普通对象 | ✅ trait 即值 |\n| 组件 schema | ⚠️ 仅序列化类型标记 `f32/u8/str` | ⚠️ `trait({x:0,y:0})` 有字段名+默认值 |\n| 脚本书写体验 | ❌ `Position.x[eid] = 10` | ✅ `updateEach(([pos]) => pos.x += 1)` |\n| 关系 / 层级 | ✅ Relations + Prefabs | ✅ Relations |\n| 维护活跃度 | 中 | **高** |\n| 许可证 | ⚠️ MPL-2.0 | ✅ ISC |\n\n### 三个决定性发现\n\n**发现 1 · schema 两家都不够用，封装层无论如何要写。**\n\n详情面板自动生成与 AI 可读，需要的是字段范围、枚举、实体引用、单位、说明。\nbitECS 的 `f32/str` 只是序列化标记；koota 的默认值只能推出类型。**两家都到不了。**\n\n推论：选型**不是**不可逆的地基决策 —— 见第 4 节。\n\n**发现 2 · MPL-2.0 是真实约束。**\n\nbitECS 是文件级弱著佐权。链接使用无碍，但**被修改的每个 bitECS 源文件都必须公开**。\n而本项目几乎一定会改它（快照要接版本化信封、确定性要审计迭代顺序）。\n对可能商业化的引擎，这是要提前算的账。koota 的 ISC 无此问题。\n\n**发现 3 · 脚本书写体验的权重高于直觉。**\n\n```js\nPosition.x[eid] = 10     // bitECS：eid 写错会静默改掉别的实体\npos.x = 10               // koota：错了就是错了\n```\n\n脚本作者是**开发者和 AI**（决策 5 + §4.3）。AI 写第一种形式出错率显著更高，\n且**错误静默**——改到相邻实体不报错，只让 demo 行为诡异，排查成本极高。\n这直接打击「AI 真的好用」这个成功判据。\n\n---\n\n## 4. 决策\n\n### 4.1 用一层薄封装把 ECS 库藏起来（无条件执行）\n\n**模块代码禁止直接 import ECS 库。** 组件定义走自写的 `defineComponent()`，\n查询走自写的 `query()`，脚本只见到封装层的 API。\n\n三条理由：\n\n1. schema 层反正要写（发现 1），封装是顺带的，边际成本≈0\n2. §6.2 模块契约本来就禁止「直接读写不属于自己的组件表」，封装层是它的执行点\n3. **选型从「地基决策」降级为「可替换模块」**，§6.4 的退役条件因此才可执行\n\n有了封装，选错的代价从「重写引擎」变成「重写约 800 行适配层」。\n\n### 4.2 主选 koota，spike 后锁定\n\n理由按权重：**ISC 许可证 > 脚本书写体验 > 维护活跃度**。\n\n放弃 bitECS 内置快照的代价可控：本项目存档要的是**版本化信封 + 迁移链**\n（沿用现有 [core/serialize.js](../../js/core/serialize.js) 的范式），\nbitECS 的二进制快照是为网络复制设计的，本来也不能直接用；\n播放沙箱的回滚用结构化克隆自写，量级在几十行。\n\n### 4.3 不自研\n\n自研预计 2–4 周。它能带来的控制力，封装层已经给了；\n而 relations / prefabs / 归档查询这些白送的能力，自己补要更久。\n12 个月冲刺付不起这个价。\n\n---\n\n## 5. Spike 方案（M1 第 1 周，3 天）\n\n两个库各实现同一纵切片，跑完即决策：\n\n1. 三种组件：纯数值 / 字符串 / 对象引用（mesh 句柄）\n2. 运行时注册一个「模块」的组件集\n3. 快照 → 改 100 个实体 → 回滚，验证完全还原\n4. 10k 实体查询循环，测帧时间\n5. **确定性**：同一 Action 序列跑两遍，序列化字节完全一致\n6. 手写 30 行「游戏逻辑」，评估书写体验\n\n**第 5 条是杀手判据。** 原型式 ECS 的查询迭代顺序会随组件增删变化，\n两家文档均**未承诺**确定性——必须实测，不能信文档。\n\n---\n\n## 6. 退役条件（按 goals.md §6.4 预先写死）\n\n- spike 中任一库无法在 3 天内跑通确定性测试 → **淘汰该库**\n- 两家都跑不通 → **自研**，预算上限 3 周；超时则接受「仅编辑期确定性」，\n  并把回放功能降级为「Action 日志可读但不保证逐字节复现」\n- 封装层落地后，若 6 个月内需要换库 → **换**，代价已被封装层限制在约 800 行内\n\n---\n\n## 7. 连带影响\n\n- **组件 schema 定义方式**（goals.md §9 第 2 项）与本决策绑定，同期决定\n- **构建与依赖管理**：当前无 `package.json`、无打包器，three 走 CDN importmap。\n  引入 ECS + Rapier + glTF 后大概率绕不开构建步骤，需在 M1 第 1 周一并决定\n- 三个被淘汰的库不再复议，除非它们的维护状态发生实质变化\n\n---\n\n## 8. 信息来源\n\n- [bitECS 官网文档](https://bitecs.dev/docs/introduction)\n- [bitECS 0.4.0 Release Notes](https://github.com/NateTheGreatt/bitECS/blob/main/docs/RELEASE_NOTES_0.4.0.md)\n- [bitECS Serialization 文档](https://github.com/NateTheGreatt/bitECS/blob/main/docs/Serialization.md)\n- [koota README](https://github.com/pmndrs/koota)\n- [becsy 文档](https://lastolivegames.github.io/becsy/guide/introduction)\n- [Web Game Dev · ECS 库对比](https://www.webgamedev.com/code-architecture/ecs)\n- [awesome-entity-component-system](https://github.com/jslee02/awesome-entity-component-system)\n- npm registry API / GitHub API，2026-08-08 实测\n"}, {"id": "adr2", "title": "ADR-002 · 事件表求值语义", "md": "# ADR-002 · 事件表求值语义\n\n| | |\n|---|---|\n| **状态** | **倾向已定，待三个手工样例复核**（阶段零结束时转为「已冻结」） |\n| **日期** | 2026-08-08 |\n| **决策者** | 项目所有者 |\n| **上游** | [goals.md](goals.md) 决策 13（逻辑层 = 事件表）、决策 31（本文前置到阶段零）、§3.6.5、不变量 I11 |\n\n---\n\n## 1. 为什么这一份要单独写，而且要最早写\n\n[goals.md](goals.md) §3.6.5 的原话：\n\n> **真正需要冻结的不是渲染层，是事件表的求值语义。**\n> 改实现（换 ECS 库 / 换渲染器 / 换物理 / 换宿主）→ 作品留得下来；\n> 改求值语义 → **迁移链救不了**：作品还能打开，但跑出来的行为变了。\n\n这是全项目**唯一一处「定错了没有退路」**的地方。原计划把它排在阶段二，\n而阶段零到阶段二之间会先落地 Action 层、内核、序列化——**它们的形状全部受这份语义约束**。\n排在后面等于让最不可逆的决策去迁就已经写好的代码。\n\n**因此决策 31：本文前置到阶段零，与打包器同期定稿。**\n\n---\n\n## 2. 要回答的五个问题\n\n不是「事件表长什么样」（决策 13 已定），是**它每一帧到底怎么跑**：\n\n| # | 问题 | 定错了会怎样 |\n|---|---|---|\n| Q1 | **求值模型**：每帧全表 / 纯事件驱动 / 混合 | 规则的执行时机变，所有作品行为漂移 |\n| Q2 | **实体集传递**：规则行之间「被选中的实体」怎么流动 | 同一张表在两种语义下跑出完全不同的结果 |\n| Q3 | **空集与取反** | 最高频的一类静默错误 |\n| Q4 | **动作的可见性**：后面的条件看不看得到前面动作的结果 | 顺序敏感性不确定，用户无法预测 |\n| Q5 | **等待 / 延时的续延** | 存档与确定性同时漂 |\n\n---\n\n## 3. Q1 · 求值模型\n\n| 候选 | 优点 | 致命处 |\n|---|---|---|\n| **纯每帧全表** | 语义最简单、最可预测 | 「被点击」「碰撞发生」这类**瞬时事件**表达不了，只能靠标志位轮询，用户读不懂（破 I2） |\n| **纯事件驱动** | 性能好 | 「每帧检查血量是否 < 0」这类**持续条件**要用户自己想办法造事件，门槛陡升 |\n| **混合**（选定） | 两类条件各归其位，与用户直觉一致 | 两条路径的**交错顺序**必须写死，否则确定性没了 |\n\n### 决策\n\n> **固定步长下自上而下全表求值（常规规则）+ 触发型规则由事件即时插入（触发规则）。**\n\n这是 Construct / GDevelop 被十几年实践验证过的模型（[goals.md A.2](goals.md#a2-决策-13为什么是事件表不是节点图)），\n不另发明。**每个条件在注册时声明自己是「常规」还是「触发」**，界面上用不同图标区分。\n\n### 交错顺序（确定性的执行点）\n\n一个 tick 内严格按此顺序，**不允许并发、不允许乱序**：\n\n```\ntick 开始\n  1. 采样输入意图（I12），冻结本 tick 的输入快照\n  2. 物理步进（Rapier，固定步长）\n  3. 排空触发队列：按入队顺序 FIFO，逐个执行其规则分支\n       —— 执行中新产生的触发继续入队，本 tick 内排空\n       —— 排空深度上限 N（默认 16），超限记 warning 并丢弃，不静默死循环\n  4. 全表自上而下求值常规规则\n  5. 结算等待队列（见 Q5）\ntick 结束\n```\n\n三条硬性质：\n\n| # | 性质 | 理由 |\n|---|---|---|\n| **E1** | 触发**先于**全表求值 | 「碰到就扣血」要在「血量 < 0 就死亡」之前，否则死亡延迟一帧 |\n| **E2** | 触发在 **tick 边界对齐**，不在物理子步内立即回调 | 物理回调里改世界会破坏 Rapier 的确定性与快照一致性 |\n| **E3** | 排空有**深度上限**，超限是 warning 不是崩溃 | §3.4 封了递归与任意控制流，但触发链可以间接成环 |\n\n---\n\n## 4. Q2 · 实体集传递（picking）\n\n**这是全文最容易定错的一条**，也是同一张表在两种语义下跑出不同结果的根源。\n\n### 决策\n\n```\n每条顶层规则从「全集」开始\n  → 每个条件在当前集合上做筛选，逐个收窄（多条件 = 交集 AND）\n  → 动作对收窄后的集合「逐个」执行\n  → 子事件继承父事件收窄后的集合，继续收窄\n  → 规则结束，集合丢弃；下一条顶层规则重新从全集开始\n```\n\n三条硬性质：\n\n| # | 性质 | 反例（定错的样子） |\n|---|---|---|\n| **P1** | 收窄是**按种类**的：条件筛选「敌人」不影响「塔」的当前集合 | 若做成全局单一集合，两个种类的条件会互相污染 |\n| **P2** | **子事件只继承，不回写**：子事件里的收窄不影响兄弟子事件 | 若回写，规则的阅读顺序与执行结果脱钩，用户读不懂（破 I2） |\n| **P3** | 顶层规则之间**不传递** | 若传递，插入一条新规则会改变它下面所有规则的行为——AI 逐行 diff 的前提就没了 |\n\n**P3 是与「AI 产出可逐行 diff」（[A.2](goals.md#a2-决策-13为什么是事件表不是节点图)）直接咬合的一条**：\n只有规则之间互不干涉，「新增了第 4–6 行」才是一个安全的说法。\n\n---\n\n## 5. Q3 · 空集与取反\n\n| 情形 | 语义 | 理由 |\n|---|---|---|\n| 条件筛出**空集** | 该规则的动作与全部子事件**不执行** | 唯一符合直觉的选择。反面（空集视为「对全体执行」）是灾难 |\n| **取反条件**（「没有敌人在范围内」） | **只做布尔判定，不改变当前集合** | 取反本来就选不出实体；若让它清空集合，后续动作全部哑火 |\n| 无种类的纯布尔条件（「金钱 > 100」） | 同上，不改变集合 | 同上 |\n\n界面上取反条件必须有**视觉区分**（不同底色 + 前缀词），否则用户会以为它和普通条件一样参与筛选。\n\n---\n\n## 6. Q4 · 动作的可见性\n\n> **动作立即写世界状态；同一 tick 内后续的条件看到的是改后的状态。**\n\n即**顺序敏感**，且这正是想要的：事件表的可读性建立在「从上往下读，像读步骤」之上。\n延迟到帧末统一提交（双缓冲）虽然能消掉顺序敏感，但代价是用户读完一条规则**无法预测下一条看到什么**——\n那会直接打击 I2。\n\n代价写明：**规则顺序有意义，上下调换规则可能改变行为。** 编辑器要把「调顺序」做成一等操作（§5.3 已有）。\n\n---\n\n## 7. Q5 · 等待 / 延时的续延\n\n`等待 0.5 秒` 会把规则劈成两半。必须定死三件事：\n\n| # | 语义 |\n|---|---|\n| **W1** | 等待**挂起的是这一条规则实例的续延**，不阻塞其余规则与其余实体 |\n| **W2** | 挂起时**快照当时的实体集**；恢复时用快照，不重新求值条件 |\n| **W3** | 快照里的实体若已销毁，恢复时**跳过该实体**，不报错、不整条中止 |\n\n**W2 是存档语义的前提**：等待队列（含其实体集快照与剩余时间）**属于运行期状态，必须可序列化**\n（[goals.md §4.5](goals.md#45-两级状态--播放沙箱) 的三种状态固化）。\n漏了它，存进度再读档会丢掉所有正在等待的规则——而技能冷却、波次间隔全都是等待。\n\n---\n\n## 8. 确定性的三条附加约束\n\n本文是 [goals.md](goals.md) 决策 29 的执行点之一。求值层要守：\n\n| # | 约束 | 为什么 |\n|---|---|---|\n| **D1** | 实体迭代顺序按**稳定 id 升序**，不按 ECS 原型的内存顺序 | 原型式 ECS 的迭代顺序会随组件增删变化（[adr-001](adr-001-ecs.md) §5 第 5 条） |\n| **D2** | 事件表可用的随机数**只能**来自内核注入的带种子 rng | 见 D3 |\n| **D3** | 专业模式用 JS 实现的条件与动作，跑在**受限环境**里：禁 `Date` / `Math.random` / 网络 / 存储，注入 `rng` 与 `tick` | **这是决策 29 现存的唯一漏洞**：一个用户写的 JS 条件调一次 `Math.random()`，lockstep 与 headless 断言同时废掉 |\n\n---\n\n## 9. 三个手工样例（定稿前必须逐个走通）\n\n**判据是可判定的：三个样例各自写出规则行，按第 3–7 节的语义手工推演一遍，\n结果与「用户读这段规则会预期什么」一致。任一条不一致 → 改语义，不改样例。**\n\n### 样例一 · 塔防选目标（检验 P1 / P2 / Q3）\n\n```\n当  敌人 进入 塔的范围          ← 同时收窄「敌人」与「塔」两个种类（P1）\n    塔 冷却完毕\n就  塔 朝 距离最近的 敌人 开火   ← 「距离最近」是二次收窄，只在本条内生效\n    塔 进入冷却\n```\n\n要验证：两座塔各打各的最近目标，而不是全部打同一个；范围内无敌人时整条不执行（空集）。\n\n### 样例二 · 平台跳跃的跳跃缓冲（检验 E1 / Q4 / W1）\n\n```\n当  意图「跳跃」被按下              ← 触发型\n就  设置 变量 缓冲 = 0.15 秒\n\n每帧\n    缓冲 > 0\n    角色 在地面上\n就  角色 向上施加冲量\n    设置 缓冲 = 0\n```\n\n要验证：落地前 0.1 秒按的跳跃仍然生效（触发先于全表 → E1）；同一 tick 内先写后读（Q4）。\n\n### 样例三 · RTS 下达指令（检验 P3 / W2）\n\n```\n当  意图「确认」被按下              ← 触发型\n    存在 被选中的单位\n就  被选中的单位 移动到 光标位置\n\n当  单位 到达目标点\n就  单位 播放「待机」\n    等待 0.3 秒                     ← 挂起时快照这批单位（W2）\n    单位 朝向 默认方向\n```\n\n要验证：第二条规则不受第一条的选中集影响（P3）；等待期间有单位被摧毁不报错（W3）。\n\n---\n\n## 10. 冻结与退役条件\n\n- **冻结时机**：三个样例走通 → 本文状态改为「已冻结」，此后按 **I11** 对待，与标识符稳定性同级\n- **冻结的范围**：第 3–7 节的语义。**性能优化（脏标记、条件短路、查询缓存）不受约束**，只要可观察行为一致\n- **退役条件**：若阶段二发现某个模板的逻辑在本语义下写不出来 → **加受限原语**（同 [goals.md §7.2](goals.md#72-三条纪律) 事件表的退役条件），**不改求值语义**\n- 冻结后每加一个条件动作，要在注册时声明「常规 / 触发」——这是本文对 registry 的唯一外溢\n\n---\n\n## 11. 相关文档\n\n- [goals.md](goals.md) — **上级文档**。决策 13 定形态，决策 31 把本文前置到阶段零\n- [adr-001-ecs.md](adr-001-ecs.md) — ECS 选型；本文 D1 是它 spike 第 5 条的下游要求\n- [ai-native-engine.md](ai-native-engine.md) — 事件表的生成方式（AI 吐 Action 序列而非整张表）\n"}, {"id": "ui", "title": "编辑器 UI 约定", "md": "# 编辑器 UI 约定\n\n> 目的只有一个：**让前端迭代不产生风格漂移。**\n> 本文是约定（写代码时要遵守的规则），不是设计方案——不讨论「界面该长什么样」，\n> 只规定「颜色、间距、字号从哪来，什么不许写」。\n\n---\n\n## 1. 先分清两个视觉域（最容易搞错的一条）\n\n| | 编辑器 UI | 游戏内呈现 |\n|---|---|---|\n| 是什么 | 面板、工具栏、大纲、详情、对话框、事件表 | 玩家看到的一切：模型、材质、光照、特效、血条与计分 |\n| 谁定义 | **本文的令牌** | **皮肤包**（goals.md 决策 20） |\n| 换风格意味着 | 换编辑器主题（亮 / 暗） | 换游戏美术风格 |\n| 允许用户改吗 | 否（只有主题切换） | **是，这是产品能力** |\n\n**两者不共享令牌，不共享组件，不互相引用。**\n\n最常见的错误是把**游戏内 UI 预制件**（血条、计分、胜负画面）当成编辑器组件来做。\n它们是游戏的一部分，跟着皮肤包走——编辑器改主题不该让谁的血条变色。\n这是不变量 I9 在样式层的延伸。\n\n---\n\n## 2. 令牌是唯一来源\n\n**所有颜色、间距、字号、圆角、动效时长，只能来自 CSS 自定义属性。**\n\n现有令牌（继承自 GameHub，语义命名，**保持不变**）：\n\n| 组 | 令牌 |\n|---|---|\n| 表面 | `--surface-window` `--surface-panel` `--surface-header` `--surface-well` `--surface-ctrl` `--surface-hover` `--surface-active` `--surface-popover` |\n| 线条 | `--border` `--groove` `--line-width` `--selection-width` |\n| 文字 | `--text-strong` `--text-secondary` `--text-muted` `--text-dim` |\n| 强调 | `--accent` `--accent-hover` |\n| 间距 | `--space-1`…`--space-7`（2 / 4 / 6 / 8 / 12 / 16 / 24px） |\n| 字号 | `--font-micro` `--font-control` `--font-section` `--font-base`（10 / 11 / 12 / 13px） |\n| 圆角 | `--radius-sm` `--radius-md` `--radius-lg`（2 / 3 / 4px） |\n| 控件 | `--strip-h` `--icon-btn` `--icon-size` `--pad-x` `--indent` `--label-col` |\n| 动效 | `--transition-fast` |\n\n**命名规则：按用途命名，不按外观命名。**\n写 `--surface-panel` 不写 `--gray-24`；换主题时前者仍然成立，后者会变成谎言。\n\n### 待补的缺口（迁移时第一批要做的）\n\n现状扫描：`:root` 之外有 **30+ 处硬编码色值**，其中大多数是**状态色没有令牌**。必须补上：\n\n```\n--state-danger        危险 / 禁建 / 删除        （现被硬编码为 #c42b1c #e88a8a #6b3535）\n--state-warning       警告 / 需要注意           （现被硬编码为 #e8b87a）\n--state-success       成功 / 校验通过\n--state-info          提示\n```\n\n每个状态色需要**三档**：文字、边框、底（弱背景）。约束层的提示、AI 的变更预览、\n皮肤包完整性的缺口标记，全部要用它们——**不补齐，这三处会各自造一套颜色**。\n\n---\n\n## 3. 三条禁止\n\n| 禁止 | 为什么 |\n|---|---|\n| **组件里写死颜色值** | 漂移的头号来源。已有 30+ 处，迁移时清零 |\n| **组件里写死像素间距 / 字号** | 只能用 `--space-*` `--font-*`。需要新档位就加令牌，不要就地写 |\n| **组件私有令牌** | `--ol-*` 这类。**布局尺寸**（列宽、缩进）可以局部，**颜色与字号绝对不行** |\n\n判定标准很简单：**这个值换主题时该不该变？** 该变 → 必须是令牌。\n\n---\n\n## 4. 任何界面变体靠令牌表达，不靠第二套样式\n\n> **v17 更新**：本节原标题是「双模式靠令牌表达」，依据是 goals.md 决策 12。\n> **决策 12 已于 v17 取消**（不再有简易 / 专业双模式）。\n> **但这条约定本身没失效**——它现在的依据是**不变量 I8**：\n> 能力面是 registry 的一个视图，不是数据分叉，样式层同理。\n\n> **任何界面变体（密度档位、日后可能出现的能力面裁剪视图）\n> 只能通过令牌值与元素显隐表达，不得出现第二套组件 CSS。**\n\n密度差异由一组令牌覆盖实现：\n\n```css\n:root[data-density=\"compact\"] { --strip-h: 24px; --space-4: 6px; --font-base: 12px; }\n```\n\n**出现 `.panel--simple` 这样的类名，就是 I8 已经被破了的信号。**\n\n---\n\n## 5. 一条设计原则（唯一一条）\n\n> **编辑器要安静。唯一有颜色的东西是内容。**\n\n界面用中性灰阶，强调色只用于选中、焦点与状态；3D 视口、素材缩略图、用户自己的作品\n是画面里唯一的彩色区域。\n\n> **v17 换了理由**：原文写「理由是决策 19——目标用户是美术」，\n> 而**决策 19 已被 19′ 推翻**（目标用户改为有经验的游戏研发人员）。\n> 结论不变，新的依据是：**工具抢戏会干扰对作品本身的判断**——\n> 这对任何长时间盯着视口的人都成立，不依赖画像。Blender 与 Figma 都遵守这一条。\n\n---\n\n## 6. 图标与文案\n\n- **图标**：**Lucide 是唯一来源**，ISC 授权的浏览器包固定在 `vendor/lucide/`，\n  编辑器渲染控件时不需要联网。\n  静态插入 `<i data-lucide=\"name\" aria-hidden=\"true\"><\/i>`；\n  JS 插入用 `window.AppIcons.markup('name')` 后调 `window.AppIcons.refresh()`。\n  **先找现成的 Lucide 图标，再考虑自绘。** 纯图标按钮必须有本地化的 `title` 与 `aria-label`；\n  尺寸由外层组件决定，渲染器统一用 `currentColor`、圆角端点、`1.7` 描边。\n  动效只用来传达状态或反馈，要尊重 `prefers-reduced-motion`，且不能替代无障碍标签。\n  升级 Lucide 时，`lucide.min.js` 与 `LICENSE` 必须来自同一个官方 npm release，并记录固定版本\n- **文案**：术语一律走 goals.md §0.3 的术语对照表，由 i18n 承载。\n  **术语层就是防「文案漂移」的机制**，跟令牌防「视觉漂移」是同一件事\n- **无障碍**：本轮只要两条低成本的——**所有控件键盘可达**、**文字对比度不低于 4.5:1**。\n  图标按钮的 `title` / `aria-label` 要求见上一条。不做完整 WCAG 审计\n- **安全**：游戏内 UI overlay 插入用户文案一律 `textContent`，**禁止 `innerHTML`**\n  （goals.md §3.6.4，最现实的一处 XSS）\n\n---\n\n## 7. 防漂移的执行机制\n\n文档也会漂移，所以要有一条能自动跑的检查（对齐 goals.md「判据必须可判定」）：\n\n> **一个扫描脚本**：在 `:root` 之外发现硬编码色值、或 `--space-*` 之外的像素间距，即报错。\n> 挂进 `tests/`，和其他离线测试一起跑。\n\n允许豁免，但豁免要写在脚本的白名单里、附一行理由——**豁免必须是显式的**。\n\n---\n\n## 8. 暂不做\n\n| 不做 | 理由 |\n|---|---|\n| 完整组件目录 / 组件库文档 | 三次法则。同一个组件形态出现第三次再抽象并写下来 |\n| 多套编辑器主题 | 先做暗色一套。令牌命名已经保证了日后加亮色不用改组件 |\n| 可视化令牌编辑器 | 用户改的是**游戏**风格（皮肤包），不是编辑器风格 |\n| 设计稿工具里的镜像系统 | 单人项目，代码即唯一来源；再维护一份 Figma 变量只会两边不一致 |\n"}, {"id": "roads", "title": "道路系统架构（存量参考）", "md": "# 道路系统架构\n\n> 交互模型对齐 Cities: Skylines 2，几何方案经调研对齐 CS1/CS2 与业界实践\n> （贝塞尔路缘圆角、miter/round join、路定高程）。数据层零 three.js 依赖，可在 node 中离线测试。\n\n## 模块与数据流\n\n```\n输入                工具层                命令层                    数据层                渲染层\nInputRouter ──► RoadTool ──────► BuildRoadCommand ──────► RoadNetwork(图)  ──► RoadView\n (指针事件)    (控制点栈+吸附)    (journal, 可撤销)          Terrain(高度图)       ├─ computeSegGeometry\n                    │                  │                        │    ▲            │   (edgeGeometry)\n                    │                  ├─ computeRoadbed ───────┘    │            ├─ computeJunction\n                    │                  ├─ computeNodeDisc ───────────┘            │   (junction)\n                    │                  └─ _replaceCovered                         └─ buildRibbon\n                    └────────────── 预览复用 buildRibbon\n信号：roadsChanged(受影响节点) / heightChanged(脏矩形) → 各视图增量重建\n```\n\n| 文件 | 职责 |\n|---|---|\n| [state/roadTypes.js](../../js/state/roadTypes.js) | 参数化 0.5U–5U 道路规格 + 主题包注册表；宽度⊥主题（见下节） |\n| [state/RoadNetwork.js](../../js/state/RoadNetwork.js) | 节点+路段无向图；三次贝塞尔（存 4 控制点）；空间哈希判重；吸附查询；de Casteljau 分裂 |\n| [state/polyline.js](../../js/state/polyline.js) | 折线弧长工具：截断（超长按比例缩，永不为 null）、按弧长走点取向 |\n| [state/junction.js](../../js/state/junction.js) | 节点几何决策（见下表）；纯数学 |\n| [state/edgeGeometry.js](../../js/state/edgeGeometry.js) | 路段左右边界：裁剪后中心线 + 逐点半宽（喇叭口）+ 端部共享横断面 |\n| [commands/commands.js](../../js/commands/commands.js) | BuildRoadCommand：分裂/建段/替换/整平全部 journal 化，undo 逐采样精确还原 |\n| [commands/roadbed.js](../../js/commands/roadbed.js) | 路定高程：纵断面平滑限坡 → 走廊压平+锁定 → 节点圆盘压平（坡地防穿模） |\n| [render/RoadView.js](../../js/render/RoadView.js) | 订阅 roadsChanged 增量重建；路段带状网格 + 节点补丁；按 roadRef/主题包共享材质 |\n| [tools/RoadTool.js](../../js/tools/RoadTool.js) | CS2 交互：四模式控制点栈、右键逐点回退、六层吸附+修饰键、工程 HUD、红色禁建 |\n| [tools/DemolishTool.js](../../js/tools/DemolishTool.js) | 拆除：悬停红色高亮 → 点击删除；走廊解锁、孤点清理、路口重算（可撤销） |\n| [tools/EditTool.js](../../js/tools/EditTool.js) | 事后编辑（Move It 式）：端点/切线手柄实时拖拽重塑，松手重贴地，一条撤销 |\n\n## 标准道路 + 主题皮肤（roadTypes.js）\n\n工作流是「先画标准宽度的路网，之后整体套年代风格」。三条分离原则：\n\n**1. 几何只认 widthUnits。** 主题永远不改变路宽、最小半径或路网拓扑。\n画路时 `RoadTool._roadRef()` 只写宽度，不写主题。\n\n**2. 主题是场景级呈现，不是路段内容。**\n\n```\nseg.roadRef = { widthUnits: 2, theme: null }   // null = 跟随场景\ngame.settings.themePackId                       // 场景主题（存档里的 roadSelection）\n生效主题 = seg.roadRef.theme ?? 场景主题\n```\n\n换主题 = `SetSceneThemeCommand`：改一个字段 + dispatch `themeChanged`，\n渲染层作废材质缓存重建。**不遍历路网、不写逐段 diff**。\n需要混搭（中世纪老城 + 现代新区）时才在路段上写 `theme` 覆盖；\n`ClearThemeOverridesCommand` 负责抹平。\n\n面板交互：点主题卡片**只移动选中光标，不动场景**；点卡片上的「替换」才套用到全场\n（`ApplyThemeCommand` = 切场景主题 + 抹平覆盖，合成一条撤销记录）。\n场景当前生效的主题在卡片上标\"使用中\"，与选中态是两个独立标记。\n\n**3. 主题声明规则，不列宽度表。**\n\n| 声明 | 含义 |\n|---|---|\n| `surface: { color: {0.5: c, 2: c, 5: c}, roughness, metalness, emissive, map, repeat }` | 材质描述符；颜色是插值站点，未声明的宽度自动插值 |\n| `decorations: [{ kind, minWidthUnits, count, ... }]` | 装饰清单；`count` 可为 `widthUnits` 的函数，求值为 0 则该装饰消失 |\n\n新增宽度档位不需要改任何主题包；新增主题只写 4 行规则。\n\n**装饰扩展点**：RoadView 顶部有 `SEG_DECORATORS` / `NODE_DECORATORS` 两张\n`kind → builder` 注册表。加一种装饰 = 注册一个函数 + 在主题里加一条，\n既有主题与 `_buildSeg` 都不用动（科幻包的 `edgeGlow` 就是这么加的）。\n几何锚点（路缘路径、斑马线锚点）由 junction.js **恒输出**，铺不铺由渲染层按主题闸门——\n数据层不认识主题词汇表。\n\n内置包：`whitebox`（素路面）/ `modern`（路缘+虚线+斑马线）/ `medieval`（仅宽路石质路缘）/ `scifi`（发光边条+金属路面）。\n\n## 节点几何决策表（junction.js）\n\n| 节点情形 | kind | 几何 |\n|---|---|---|\n| 度=1（断头） | none | 无（端头盖待路缘石阶段做） |\n| 度=2 近直（>165°）同宽 | **miter** | 共享斜接横断面：两侧路面用同两个顶点，缝隙在几何上不存在 |\n| 度=2 近直 异宽 | **transition** | 共享横断面取窄侧半宽；宽侧沿弧长平滑收窄（喇叭口，edgeGeometry） |\n| 度=2 可见折弯（≤165°） | **bend** | 路面退到内交点截断线（不重叠）；补丁 = 内共享点 + 外侧半径=半宽的圆弧端帽，与路口圆角同观感 |\n| 度≥3 | **polygon** | 各臂截断线（斜接投影+圆角缓冲）在曲线真实位置 + 相邻臂间三次贝塞尔路缘圆角；≥295° 反射楔圆弧兜底 |\n\n关键不变量：\n- **切断线两侧 bit-exact**：补丁边界点与路面裁剪端出自同一段代码（walkPolyline），不靠浮点巧合。\n- **法线/接缝**：地形法线从高度图中心差分，路面横断面水平——高度用同一次采样。\n- **雕刻与道路双向贴合**：铺路时压平路基并锁定走廊；笔刷可以雕刻一切（含路下），\n  笔画结束后受影响道路自动重新贴地（重采纵断面→限坡→压平→重锁定），与笔画同属一条撤销命令。\n  节点周边用\"限坡锥面包络\"护住路口盖板（允许路面斜穿节点爬坡，只削横向鼓包）；\n  路肩外侧同理用\"路堤边坡包络\"（EMBANK=45°）：包络内的玩家雕刻原样保留，只夹回超坡高差。\n\n## 可调参数\n\n| 参数 | 位置 | 含义 |\n|---|---|---|\n| `FILLET_K = 0.8` | junction.js | 路口圆角缓冲（× 相邻臂最大半宽），越大转角越圆 |\n| `FILLET_CTRL = 0.4` | junction.js | 圆角贝塞尔控制点系数（0.55≈正圆弧） |\n| `REFLEX_ARC = 295°` | junction.js | 反射楔圆弧兜底阈值（仅度≥3 可达） |\n| `MITER_MIN = 165°` | junction.js | miter/transition（近直无缝）与 bend（圆角弯头）的分界（对应 CS1 Max Turn Angle） |\n| `ROAD_UNIT_WIDTH = 3`（= 30 × `GRID_UNIT`） | roadTypes.js / core/units.js | 1U = 1 车道基准宽度 3 米；所有道路总宽均由单位数线性计算（0.5U=1.5m ~ 5U=15m），贴近真实道路尺度 |\n| `DEFAULT_SCENE_THEME = 'whitebox'` | roadTypes.js | 路段无覆盖、场景也没设主题时的回退 |\n| `minRadius = width × 1.6` | roadTypes.js | 各宽度规格的最小弯道半径（红色禁建） |\n| `MAX_SLOPE = 0.3` | roadbed.js | 路基纵坡上限 |\n| 覆盖替换阈值 `0.9 / 0.75` | commands.js | 旧路 ≥90% 落在（半宽和×0.75）走廊内则被替换 |\n\n## 装饰层（RoadView）\n\n所有装饰与路面共用同一套横断面帧（`computeFrames`），保证对齐：\n- **`curb`**（几何，路段+路口）：沿路段两侧边界放样（顶面+外立面），路口沿盖板边界路径（junction 输出 `curbs`，切断线处留口与路段路缘续接）\n- **`centerline`**（贴地薄面，路段）：按 `count` 条车道分界铺 dash/gap 虚线；随喇叭口半宽收缩\n- **`crosswalk`**（贴地薄面，路口）：度≥3 路口各臂截断线外侧，条纹长轴沿行车方向\n- **`edgeGlow`**（贴地薄面，路段）：两侧内缩的自发光窄带（Basic 材质，无需后处理泛光）\n- 路口内部保持素路面（CS 布局）；尺寸参数全部来自主题声明，不再是 RoadView 的模块常量\n\n## 离线测试（tests/）\n\n`node tests/run-all.mjs` 跑全部 13 个套件（数据层零 three.js 依赖）。\n覆盖：图操作与撤销、斜接重合与朝向、弯头内外弧、喇叭口、宽度⊥主题（规则式主题包/场景主题与路段覆盖/材质描述符）、v1–v5 存档迁移、重画替换、裁剪对齐、装饰层数据、G1 续接。\n\n## 已知待办\n\n- 道路纹理阶段：纵向 UV 里程跨缝对齐、盖板世界空间投影、共享横断面法线平均\n- 路缘石/人行道 profile 放样（边界曲线已就绪）；断头路圆头端盖\n- 高程系统（高架/隧道）、平行模式、网格模式\n- 编辑工具进阶：多选/框选、节点合并吸附、最小半径实时校验\n"}],SVGS=[{"id": "overview", "title": "总览图 · 系统全景 / 数据模型 / 一帧发生什么 / 用户流程 / 编辑器界面 / 能力覆盖面", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" data-h=\"1848\" viewBox=\"0 0 680 1848\" role=\"img\">\n<title>Clay 总览图 · 对应 goals.md v17<\/title>\n<desc>六张图合成一份：系统全景（单一变更通道与分层）、数据模型（工程里有什么）、一帧发生什么（玩法 tick 与 xt>\n\n<text class=\"cl-tb\" x=\"52\" y=\"503\">工程<\/text>\n<line class=\"cl-l\" x1=\"58\" y1=\"509\" x2=\"58\" y2=\"692\"/>\n<line class=\"cl-l\" x1=\"58\" y1=\"521\" x2=\"70\" y2=\"521\"/><text class=\"cl-t\" x=\"76\" y=\"525\">流程<\/text><text class=\"cl-s\" x=\"126\" y=\"525\">场景顺序与切换条件<\/text>\n<line class=\"cl-l\" x1=\"58\" y1=\"540\" x2=\"70\" y2=\"540\"/><text class=\"cl-t\" x=\"76\" y=\"544\">全局状态<\/text><text class=\"cl-s\" x=\"140\" y=\"544\">跨场景保留<\/text>\n<line class=\"cl-l\" x1=\"58\" y1=\"559\" x2=\"70\" y2=\"559\"/><text class=\"cl-t\" x=\"76\" y=\"563\">场景[]<\/text><text class=\"cl-s\" x=\"126\" y=\"563\">→ 块[] → 实体[]（kind + 组件）<\/text>\n<line class=\"cl-l\" x1=\"58\" y1=\"578\" x2=\"70\" y2=\"578\"/><text class=\"cl-t\" x=\"76\" y=\"582\">事件表<\/text><text class=\"cl-s\" x=\"126\" y=\"582\">规则行[] · 行为单元 · 配方<\/text>\n<line class=\"cl-l\" x1=\"58\" y1=\"597\" x2=\"70\" y2=\"597\"/><text class=\"cl-t\" x=\"76\" y=\"601\">数据表[]<\/text><text class=\"cl-s\" x=\"140\" y=\"601\">作者编辑，静态，行 id 只增不改<\/text>\n<line class=\"cl-l\" x1=\"58\" y1=\"616\" x2=\"70\" y2=\"616\"/><text class=\"cl-t\" x=\"76\" y=\"620\">运行期集合[]<\/text><text class=\"cl-s\" x=\"167\" y=\"620\">背包 · 队列 · 卡组<\/text>\n<line class=\"cl-l\" x1=\"58\" y1=\"635\" x2=\"70\" y2=\"635\"/><text class=\"cl-t\" x=\"76\" y=\"639\">kind 注册[]<\/text><text class=\"cl-s\" x=\"158\" y=\"639\">碰撞体 · 占地 · 位移曲线<\/text>\n<line class=\"cl-l\" x1=\"58\" y1=\"654\" x2=\"70\" y2=\"654\"/><text class=\"cl-t\" x=\"76\" y=\"658\">当前皮肤包<\/text><text class=\"cl-s\" x=\"158\" y=\"658\">kind → 视觉<\/text>\n<line class=\"cl-l\" x1=\"58\" y1=\"673\" x2=\"70\" y2=\"673\"/><text class=\"cl-t\" x=\"76\" y=\"677\">输入绑定表<\/text><text class=\"cl-s\" x=\"158\" y=\"677\">意图 → 设备<\/text>\n<line class=\"cl-l\" x1=\"58\" y1=\"692\" x2=\"70\" y2=\"692\"/><text class=\"cl-t\" x=\"76\" y=\"696\">内容包依赖[]<\/text><text class=\"cl-s\" x=\"167\" y=\"696\">包 id + 版本<\/text>\n\n<g class=\"cl-b\"><rect x=\"392\" y=\"490\" width=\"248\" height=\"8 function inl(s,did){
var codes=[];
s=s.replace(/`([^`]+)`/g,function(m,c){codes.push(c);return ""+(codes.length-1)+""});
s=esc(s);
s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,function(m,t,u){
if(u.charAt(0)==="#")u="#"+did+"-"+u.slice(1).replace(/^-+/,"");
else if(u.indexOf("diagrams/architecture.svg")>=0)u="#fig-arch";
else if(u.indexOf("diagrams/user-flow.svg")>=0)u="#fig-flow";
else if(!/^https?:/.test(u))return t;
return '<a href="'+u+'">'+t+"</a>"});
s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
s=s.replace(/~~([^~]+)~~/g,"<del>$1</del>");
s=s.replace(/(\d+)/g,function(m,i){return "<code>"+esc(codes[+i])+"</code>"});
return s}
function cells(line){
return line.replace(/\\\|/g,"").replace(/^\||\|$/g,"").split("|").map(function(c){return c.replace(//g,"|").trim()})}
function md(src,did){
var L=src.replace(/\r/g,"").split("\n"),o=[],i=0,heads=[];
function bs(l){return /^(#{1,4}\s|>|\||```|---+\s*$|[-*]\s|\d+\.\s)/.test(l)}
while(i<L.length){
var l=L[i];
if(/^```/.test(l)){var b=[];i++;while(i<L.length&&!/^```/.test(L[i])){b.push(L[i]);i++}i++;
o.push("<pre><code>"+esc(b.join("\n"))+"</code></pre>");continue}
var h=l.match(/^(#{1,4})\s+(.*)$/);
if(h){var lv=h[1].length,tx=h[2],id=did+"-"+slug(tx);
heads.push({lv:lv,tx:tx.replace(/[*`~]/g,""),id:id});
o.push("<h"+lv+' id="'+id+'">'+inl(tx,did)+"</h"+lv+">");i++;continue}
if(/^---+\s*$/.test(l)){o.push("<hr>");i++;continue}
if(/^>/.test(l)){var q=[];while(i<L.length&&/^>/.test(L[i])){q.push(L[i].replace(/^>\s?/,""));i++}
o.push("<blockquote>"+q.map(function(x){return inl(x,did)}).join("<br>")+"</blockquote>");continue}
if(/^\|/.test(l)){var rows=[];
while(i<L.length&&(/^\|/.test(L[i])||(rows.length&&L[i].trim()&&!bs(L[i])))){
if(/^\|/.test(L[i]))rows.push(cells(L[i]));
else{var r=rows[rows.length-1];r[r.length-1]+=" "+L[i].trim()}i++}
var sep=rows.length>1&&rows[1].every(function(c){return /^:?-+:?$/.test(c)});
var hd=sep?rows[0]:null,bd=sep?rows.slice(2):rows,t='<div class="tw"><table>';
if(hd)t+="<thead><tr>"+hd.map(function(c){return "<th>"+inl(c,did)+"</th>"}).join("")+"</tr></thead>";
t+="<tbody>"+bd.map(function(r){return "<tr>"+r.map(function(c){return "<td>"+inl(c,did)+"</td>"}).join("")+"</tr>"}).join("")+"</tbody></table></div>";
o.push(t);continue}
var m=l.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
if(m){var ord=/\d/.test(m[2]),it=[];
while(i<L.length){var mm=L[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
if(mm){it.push(mm[3]);i++}
else if(L[i].trim()&&!bs(L[i])&&it.length){it[it.length-1]+=" "+L[i].trim();i++}
else break}
var tg=ord?"ol":"ul";
o.push("<"+tg+">"+it.map(function(x){return "<li>"+inl(x,did)+"</li>"}).join("")+"</"+tg+">");continue}
if(!l.trim()){i++;continue}
var p=[];while(i<L.length&&L[i].trim()&&!bs(L[i])){p.push(L[i].trim());i++}
if(p.length)o.push("<p>"+inl(p.join(" "),did)+"</p>")}
return {html:o.join("\n"),heads:heads}}
var main=document.getElementById("main"),nav=document.getElementById("nav"),nh="";
var fig=document.createElement("section");fig.className="doc";
var fx='<div class="dt"><b>总览图</b>六图合一：系统全景 · 数据模型 · 一帧发生什么 · 用户流程 · 编辑器界面 · 能力覆盖面。先看图再读文；内容以产品设计大纲为准，图跟着它改</div>';
SVGS.forEach(function(s){fx+='<figure id="fig-'+s.id+'">'+s.svg+"<figcaption>"+s.title+"</figcaption></figure>"});
fig.innerHTML=fx;main.appendChild(fig);
nh+='<div class="d">图</div><a href="#fig-arch">编辑器架构</a><a href="#fig-flow">用户心流</a>';
DOCS.forEach(function(d){
var r=md(d.md,d.id),sec=document.createElement("section");
sec.className="doc";sec.id="doc-"+d.id;
sec.innerHTML='<div class="dt"><b>'+d.title+"</b></div>"+r.html;
main.appendChild(sec);
nh+='<div class="d">'+d.title+"</div>";
r.heads.forEach(function(h){if(h.lv>3)return;nh+='<a class="l'+h.lv+'" href="#'+h.id+'">'+h.tx+"</a>"})});
nav.insertAdjacentHTML("beforeend",nh);
var links=[].slice.call(nav.querySelectorAll("a")),q=document.getElementById("q");
q.addEventListener("input",function(){var v=q.value.trim().toLowerCase();
links.forEach(function(a){a.style.display=!v||a.textContent.toLowerCase().indexOf(v)>=0?"":"none"});
[].forEach.call(nav.querySelectorAll(".d"),function(d){d.style.display=v?"none":""})});
if(window.IntersectionObserver){
var obs=new IntersectionObserver(function(es){es.forEach(function(e){if(!e.isIntersecting)return;
var a=null;links.forEach(function(x){if(x.getAttribute("href")==="#"+e.target.id)a=x});
if(!a)return;links.forEach(function(x){x.classList.remove("on")});a.classList.add("on");
var t=a.offsetTop-nav.clientHeight/2;if(t>0)nav.scrollTop=t})},{rootMargin:"-60px 0px -75% 0px"});
[].forEach.call(main.querySelectorAll("h1,h2,h3,figure"),function(el){if(el.id)obs.observe(el)})}
</script></body></html>
