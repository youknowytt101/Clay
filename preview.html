# 8. 信息来源\n\n- [bitECS 官网文档](https://bitecs.dev/docs/introduction)\n- [bitECS 0.4.0 Release Notes](https://github.com/NateTheGreatt/bitECS/blob/main/docs/RELEASE_NOTES_0.4.0.md)\n- [bitECS Serialization 文档](https://github.com/NateTheGreatt/bitECS/blob/main/docs/Serialization.md)\n- [koota README](https://github.com/pmndrs/koota)\n- [becsy 文档](https://lastolivegames.github.io/becsy/guide/introduction)\n- [Web Game Dev · ECS 库对比](https://www.webgamedev.com/code-architecture/ecs)\n- [awesome-entity-component-system](https://github.com/jslee02/awesome-entity-component-system)\n- npm registry API / GitHub API，2026-08-08 实测\n"}, {"id": "adr2", "title": "ADR-002 · 事件表求值语义", "md": "# ADR-002 · 事件表求值语义\n\n| | |\n|---|---|\n| **状态** | **已验证**（r2，2026-08-08）—— 见 [ADR 状态机](goals.md#07-adr-状态机v19)。转入依据：[§9](#9-三个手工样例定稿前必须逐个走通) 三个手工样例经[两轮推演](adr-002-walkthrough.md)逐条走通，六处缺口全部有定论。<br>**转「已冻结」还差**：`U-025` 跨 CPU 架构实测（不改变任何语义选择，只决定 D4 的重要程度） |\n| **日期** | 2026-08-08 |\n| **决策者** | 项目所有者 |\n| **上游** | [goals.md](goals.md) 决策 13（逻辑层 = 事件表）、决策 31（本文前置到阶段零）、§3.6.5、不变量 I11 |\n| **修订** | **r2**（2026-08-08）——[第一轮推演](adr-002-walkthrough.md)暴露 6 处语义缺口，本版补齐：<br>§3.3 触发规则初始集合（A1）· §3.4 硬性质 E4 · §4.1 关联查询原语族（B3′）· §5 「存在」形态 · §7.2 计时器 · §8 D4 事件稳定排序 |\n\n> **r2 补的六处，全部来自真推演撞出来的缺口，不是纸面通读发现的。**\n> 其中 **D4** 是确定性漏洞（不是语义歧义）：原文只规定了实体迭代顺序，漏了事件顺序。\n\n---\n\n## 1. 为什么这一份要单独写，而且要最早写\n\n[goals.md](goals.md) §3.6.5 的原话：\n\n> **真正需要冻结的不是渲染层，是事件表的求值语义。**\n> 改实现（换 ECS 库 / 换渲染器 / 换物理 / 换宿主）→ 作品留得下来；\n> 改求值语义 → **迁移链救不了**：作品还能打开，但跑出来的行为变了。\n\n这是全项目**唯一一处「定错了没有退路」**的地方。原计划把它排在阶段二，\n而阶段零到阶段二之间会先落地 Action 层、内核、序列化——**它们的形状全部受这份语义约束**。\n排在后面等于让最不可逆的决策去迁就已经写好的代码。\n\n**因此决策 31：本文前置到阶段零，与打包器同期定稿。**\n\n---\n\n## 2. 要回答的五个问题\n\n不是「事件表长什么样」（决策 13 已定），是**它每一帧到底怎么跑**：\n\n| # | 问题 | 定错了会怎样 |\n|---|---|---|\n| Q1 | **求值模型**：每帧全表 / 纯事件驱动 / 混合 | 规则的执行时机变，所有作品行为漂移 |\n| Q2 | **实体集传递**：规则行之间「被选中的实体」怎么流动 | 同一张表在两种语义下跑出完全不同的结果 |\n| Q3 | **空集与取反** | 最高频的一类静默错误 |\n| Q4 | **动作的可见性**：后面的条件看不看得到前面动作的结果 | 顺序敏感性不确定，用户无法预测 |\n| Q5 | **等待 / 延时的续延** | 存档与确定性同时漂 |\n\n---\n\n## 3. Q1 · 求值模型\n\n| 候选 | 优点 | 致命处 |\n|---|---|---|\n| **纯每帧全表** | 语义最简单、最可预测 | 「被点击」「碰撞发生」这类**瞬时事件**表达不了，只能靠标志位轮询，用户读不懂（破 I2） |\n| **纯事件驱动** | 性能好 | 「每帧检查血量是否 < 0」这类**持续条件**要用户自己想办法造事件，门槛陡升 |\n| **混合**（选定） | 两类条件各归其位，与用户直觉一致 | 两条路径的**交错顺序**必须写死，否则确定性没了 |\n\n### 决策\n\n> **固定步长下自上而下全表求值（常规规则）+ 触发型规则由事件即时插入（触发规则）。**\n\n这是 Construct / GDevelop 被十几年实践验证过的模型（[goals.md A.2](goals.md#a2-决策-13为什么是事件表不是节点图)），\n不另发明。**每个条件在注册时声明自己是「常规」还是「触发」**，界面上用不同图标区分。\n\n### 交错顺序（确定性的执行点）\n\n一个 tick 内严格按此顺序，**不允许并发、不允许乱序**：\n\n```\ntick 开始\n  1. 采样输入意图（I12），冻结本 tick 的输入快照\n  2. 物理步进（Rapier，固定步长）\n  2.5 收集本 step 产生的全部触发事件，按 D4 稳定排序后入队   ← r2 新增\n  3. 排空触发队列：按入队顺序 FIFO，逐个执行其规则分支\n       —— 执行中新产生的触发继续入队，本 tick 内排空\n       —— 排空深度上限 N（默认 16），超限记 warning 并丢弃，不静默死循环\n  4. 全表自上而下求值常规规则\n  5. 结算等待队列与计时器（见 Q5、§7.2）\ntick 结束\n```\n\n> **step 2.5 是 r2 新增的，它不是实现细节。** 没有它，\"按入队顺序 FIFO\"里的\"入队顺序\"\n> 由物理引擎内部的遍历顺序决定，**跨平台不保证一致** → 直接击穿决策 29。见 [§8 的 D4](#8-确定性的三条附加约束)。\n\n### 3.3 触发规则的初始集合（r2 新增 · A1）\n\n> **触发规则的初始集合 = 触发载荷涉及的实体。**\n> 被载荷提及的每个种类为**单元素集**；**未被载荷提及的种类仍从全集开始**（§4）。\n\n原文 §3 说触发\"逐个执行其规则分支\"，§4 说\"每条顶层规则从全集开始\"——\n**两句各自读都成立，合起来推演就撞车**：若触发规则真从全集开始，\n任意一对实体进入范围会让**所有**满足条件的实体执行动作。\n\n**输入意图类触发不携带实体载荷**（`意图「跳跃」被按下`），其规则的所有种类均从全集开始。\n要绑定到具体角色，须写显式条件（如 `角色 是本地玩家`）——\n**否则分屏 / 联机下所有角色会一起响应**。\n\n### 3.4 四条硬性质\n\n| # | 性质 | 理由 |\n|---|---|---|\n| **E1** | 触发**先于**全表求值 | 「碰到就扣血」要在「血量 < 0 就死亡」之前，否则死亡延迟一帧 |\n| **E2** | 触发在 **tick 边界对齐**，不在物理子步内立即回调 | 物理回调里改世界会破坏 Rapier 的确定性与快照一致性 |\n| **E3** | 排空有**深度上限**，超限是 warning 不是崩溃 | §3.4 封了递归与任意控制流，但触发链可以间接成环 |\n| **E4**<br>（r2） | 排空时若**载荷实体已销毁 → 跳过该事件**，不报错、不中止后续事件 | 前一个事件的动作可以销毁后一个事件的载荷（Q4 动作立即写世界）。与 **W3** 对等待队列的处理对齐 |\n\n---\n\n## 4. Q2 · 实体集传递（picking）\n\n**这是全文最容易定错的一条**，也是同一张表在两种语义下跑出不同结果的根源。\n\n### 决策\n\n```\n每条顶层规则从「全集」开始\n  → 每个条件在当前集合上做筛选，逐个收窄（多条件 = 交集 AND）\n  → 动作对收窄后的集合「逐个」执行\n  → 子事件继承父事件收窄后的集合，继续收窄\n  → 规则结束，集合丢弃；下一条顶层规则重新从全集开始\n```\n\n三条硬性质：\n\n| # | 性质 | 反例（定错的样子） |\n|---|---|---|\n| **P1** | 收窄是**按种类**的：条件筛选「敌人」不影响「塔」的当前集合 | 若做成全局单一集合，两个种类的条件会互相污染 |\n| **P2** | **子事件只继承，不回写**：子事件里的收窄不影响兄弟子事件 | 若回写，规则的阅读顺序与执行结果脱钩，用户读不懂（破 I2） |\n| **P3** | 顶层规则之间**不传递** | 若传递，插入一条新规则会改变它下面所有规则的行为——AI 逐行 diff 的前提就没了 |\n\n**P3 是与「AI 产出可逐行 diff」（[A.2](goals.md#a2-决策-13为什么是事件表不是节点图)）直接咬合的一条**：\n只有规则之间互不干涉，「新增了第 4–6 行」才是一个安全的说法。\n\n### 4.1 关联查询原语族（r2 新增 · B3′）\n\n上面的模型是**单调收窄**：集合只会变小，且各种类互不影响（P1）。\n但「**每座塔各打自己射程内最近的敌人**」需要的不是收窄，是**配对**——\n对每个塔，在与它相关的敌人子集里选一个。单调收窄模型推不出这个结果。\n\n> **求值模型中唯一允许「看到当前集合之外实体」的构造，是一族参数化的关联查询条件：**\n>\n> ```\n> <A> 的 <关系> 中 <排序> 最优的 <B>\n> ```\n>\n> - **关系**：范围内 / 拥有的 / 携带的 / 目标是 …… **可扩展注册**\n> - **排序**：最近 / 最远 / 属性最大 / 属性最小 / 角度最小 …… **可扩展注册**\n\n**语义**：对当前 A 集合的每个实例 `a`，在 `a` 的关系集合内按排序取最优的一个 `b`，\n形成配对 `(a, b)`；随后 **A 收窄为有配对的 a**，**B 收窄为被选中的 b 的并集**；\n本条规则内后续的动作按**配对**逐个执行，而不是按笛卡尔积。\n\n三条约束：\n\n| # | 约束 | 理由 |\n|---|---|---|\n| **R1** | 配对状态**只在本条顶层规则内存活**，规则结束即丢弃 | 与 **P3** 一致。否则插入一条规则会改变下面所有规则的行为，逐行 diff 的前提失效 |\n| **R2** | **不允许嵌套关联查询**（一条规则内只能有一层配对） | 两层配对的语义（作用域生命周期、回写、与 P2 的交互）**没有推演过**，不在冻结范围内 |\n| **R3** | 关系与排序都必须是**注册项**，不接受任意表达式 | 任意表达式会把求值语义变成通用查询语言，那是不可逆的扩张 |\n| **R4**<br>（r2 第二轮） | 配对在**条件阶段一次性建立**；动作按配对逐个执行时，**任一端已销毁 → 跳过该配对** | 配对是快照，而动作立即写世界（Q4）：`T1` 开火可以杀死 `T2` 那一对里的敌人。**与 E4、W3 同构** |\n\n> **R4 是同一个模式第三次出现**：W3（等待队列的实体快照）、E4（触发队列的载荷）、\n> R4（关联查询的配对）——三处都是\"**被快照的实体引用，在使用时可能已经失效**\"。\n> 三条语义完全一致：**跳过，不报错，不中止其余项**。\n> 冻结后若要统一成一条通则，属于表述重构而非语义变更。\n\n#### 为什么是原语族，不是通用作用域\n\n另一条路（**B2**）是直接改本节的模型，引入通用关联作用域：动作逐个执行时为当前实例建作用域，\n其他种类在该作用域内重新求值。**它的表达力严格更强**，两层以上的嵌套关联也能写。\n\n不选它，理由**不是**「原语更简单」——而是**证据时序**：\n\n> 关联查询到底有多少种模式，是个**经验问题**，答案要等 M2 真写 RTS 模板才有。\n> 而本文必须在 M0 冻结，**证据到不了**。\n>\n> B2 要改的是求值语义主体，**冻结后不可逆**；而作用域的生命周期、嵌套语义、能否回写父集合、\n> 与 P2/P3 如何交互——**现在一条都没推演过**。\n> **那等于拿全项目最贵的容器，去装最不确定的东西。**\n>\n> 原语族则相反：单个原语的语义可以冻结，**原语集合可以增长**——加错一个可以废弃，\n> 旧作品仍按旧原语的语义跑。**不确定的部分放进可逆的容器。**\n\n**已知代价（写出来，不藏着）**：R2 封死了两层以上的关联\n（「对每个塔，对它范围内每个敌人，再查该敌人的护盾来源」这类写不出来）。\n判断是八款目标游戏里这类需求很少，**但这是假设不是事实**——\n它的失效信号已登记为 [`U-034`](goals.md#九--未决项)：\n**M2 真写 RTS 模板时若出现两层关联需求，重开 B2 / B3′ 的比较。**\n\n---\n\n## 5. Q3 · 空集与取反\n\n| 情形 | 语义 | 理由 |\n|---|---|---|\n| 条件筛出**空集** | 该规则的动作与全部子事件**不执行** | 唯一符合直觉的选择。反面（空集视为「对全体执行」）是灾难 |\n| **取反条件**（「没有敌人在范围内」） | **只做布尔判定，不改变当前集合** | 取反本来就选不出实体；若让它清空集合，后续动作全部哑火 |\n| 无种类的纯布尔条件（「金钱 > 100」） | 同上，不改变集合 | 同上 |\n| **「存在 X」形式**（「存在 被选中的单位」）<br>（r2） | **就是普通筛选条件**，不是独立形态。其「存在」语义由上面第一行的空集规则**自动获得** | 若做成布尔判定不收窄，`被选中的单位 移动到 光标位置` 会对**全集**执行——**所有单位都移动** |\n\n界面上取反条件必须有**视觉区分**（不同底色 + 前缀词），否则用户会以为它和普通条件一样参与筛选。\n\n> **「存在 X」这条必须写明，不能靠实现者自行判断。** 它的错误形态在测试里不容易暴露：\n> 只选中一个单位时两种语义结果相同，**多选时才分叉**。\n\n---\n\n## 6. Q4 · 动作的可见性\n\n> **动作立即写世界状态；同一 tick 内后续的条件看到的是改后的状态。**\n\n即**顺序敏感**，且这正是想要的：事件表的可读性建立在「从上往下读，像读步骤」之上。\n延迟到帧末统一提交（双缓冲）虽然能消掉顺序敏感，但代价是用户读完一条规则**无法预测下一条看到什么**——\n那会直接打击 I2。\n\n代价写明：**规则顺序有意义，上下调换规则可能改变行为。** 编辑器要把「调顺序」做成一等操作（§5.3 已有）。\n\n---\n\n## 7. Q5 · 等待 / 延时的续延\n\n`等待 0.5 秒` 会把规则劈成两半。必须定死三件事：\n\n| # | 语义 |\n|---|---|\n| **W1** | 等待**挂起的是这一条规则实例的续延**，不阻塞其余规则与其余实体 |\n| **W2** | 挂起时**快照当时的实体集**；恢复时用快照，不重新求值条件 |\n| **W3** | 快照里的实体若已销毁，恢复时**跳过该实体**，不报错、不整条中止 |\n\n**W2 是存档语义的前提**：等待队列（含其实体集快照与剩余时间）**属于运行期状态，必须可序列化**\n（[goals.md §4.5](goals.md#45-两级状态--播放沙箱) 的三种状态固化）。\n漏了它，存进度再读档会丢掉所有正在等待的规则——而技能冷却、波次间隔全都是等待。\n\n### 7.2 计时器是一等概念（r2 新增）\n\n`设置 缓冲 = 0.15 秒` 这样带时间单位的变量，**由内核在 step 5 统一按 `dt` 递减，下限截断到 0**。\n\n| # | 语义 |\n|---|---|\n| **T1** | 声明为计时器的变量自动递减；不声明的数值变量不会 |\n| **T2** | 计时器与等待队列**同属运行期状态，同样必须可序列化**（W2 的理由逐字适用） |\n| **T3** | 受限 JS 环境注入 `rng` / `tick` / **`dt`**（§8 D3 原本只有前两个） |\n\n**为什么不让用户自己写 `每帧 → 缓冲 = 缓冲 - dt`**：技能冷却、波次间隔、跳跃缓冲、\n无敌帧、buff 时长——每个作品都会重新实现一遍，而**忘记把它写进存档**的概率极高，直接撞 I11。\n把它做成一等概念，序列化就是内核的责任，不是每个作者的责任。\n\n---\n\n## 8. 确定性的四条附加约束\n\n本文是 [goals.md](goals.md) 决策 29 的执行点之一。求值层要守：\n\n| # | 约束 | 为什么 |\n|---|---|---|\n| **D1** | 实体迭代顺序按**稳定 id 升序**，不按 ECS 原型的内存顺序 | 原型式 ECS 的迭代顺序会随组件增删变化（[adr-001](adr-001-ecs.md) §5 第 5 条） |\n| **D2** | 事件表可用的随机数**只能**来自内核注入的带种子 rng | 见 D3 |\n| **D3** | 用 JS 实现的条件与动作，跑在**受限环境**里：禁 `Date` / `Math.random` / 网络 / 存储，注入 `rng`、`tick` 与 **`dt`**（r2） | **这是决策 29 现存的唯一漏洞**：一个用户写的 JS 条件调一次 `Math.random()`，lockstep 与 headless 断言同时废掉 |\n| **D4**<br>（r2） | 同一 step 内产生的触发事件，**入队前按 `(事件类型 id, 主实体 id, 次实体 id)` 升序稳定排序**（tick 流程 step 2.5） | **D1 只做了实体迭代那一半，事件顺序这一半一直缺着。** Rapier 的接触事件顺序来自其内部宽相 / 窄相遍历，**不保证跨平台一致**；顺序不同 → 谁先执行不同 → 世界状态分叉 → lockstep 立即失步。[spike-001](spike-001-rapier-determinism.md) 已把「事件序列一致」加进验收 |\n\n---\n\n## 9. 三个手工样例（定稿前必须逐个走通）\n\n**判据是可判定的：三个样例各自写出规则行，按第 3–7 节的语义手工推演一遍，\n结果与「用户读这段规则会预期什么」一致。任一条不一致 → 改语义，不改样例。**\n\n### 样例一 · 塔防选目标（检验 P1 / P2 / Q3 / R1，r2 改写）\n\n```\n每帧\n    塔 冷却完毕                      ← 收窄「塔」\n    塔 的 射程内 最近 的 敌人         ← 关联查询：为每座塔配对一个敌人（§4.1）\n就  塔 朝 配对的 敌人 开火            ← 按配对逐个执行，不是笛卡尔积\n    塔 进入冷却\n```\n\n要验证：两座塔各打各的最近目标，而不是全部打同一个；范围内无敌人时整条不执行（空集）。\n\n> **r2 为什么改了这个样例的写法。**\n> §9 的原则是「结果不一致 → 改语义，不改样例」，这次**没有违反它**——\n> 样例的**意图一字未改**（两座塔各打各的最近目标），改的是**表达形式**，\n> 因为原写法与它自己声明的意图**在任何语义下都不匹配**：\n>\n> 原写法用 `当 敌人 进入 塔的范围` 这个**触发型**条件。触发是**逐事件**的，\n> 每个事件只携带一对 `(敌人, 塔)`——**载荷里根本没有第二个候选**，\n> 「最近」无从选起。三个敌人同 tick 进入，就是三个独立事件，\n> 第一个事件让塔开火并进入冷却，后两个事件撞上「冷却完毕」为空集而全部落空：\n> **塔打中的是「事件顺序里的第一个」，不是「最近的」。**\n>\n> 「在一批候选中选最优」本质上是**批量查询**，不是事件响应。它属于常规规则。\n\n**保留的触发型子样例**（检验 A1 / E4）：\n\n```\n当  敌人 进入 塔的范围          ← 触发型：载荷 (敌人, 塔)，各为单元素集（A1）\n就  塔 播放「警戒」音效\n```\n\n要验证：只有触发它的那座塔响应，不是全部塔（A1）；\n若该敌人在同 tick 被先前的事件销毁，本事件跳过而不报错（E4）。\n\n### 样例二 · 平台跳跃的跳跃缓冲（检验 E1 / Q4 / W1）\n\n```\n当  意图「跳跃」被按下              ← 触发型，无实体载荷 → 角色从全集开始（A1）\n就  设置 计时器 缓冲 = 0.15 秒      ← 计时器，由内核递减（§7.2 T1）\n\n每帧\n    缓冲 > 0\n    角色 在地面上\n就  角色 向上施加冲量\n    设置 缓冲 = 0\n```\n\n要验证：落地前 0.1 秒按的跳跃仍然生效（触发先于全表 → E1）；同一 tick 内先写后读（Q4）；\n存读档后剩余缓冲时间保持（T2）。\n\n### 样例三 · RTS 下达指令（检验 P3 / W2）\n\n```\n当  意图「确认」被按下              ← 触发型\n    存在 被选中的单位\n就  被选中的单位 移动到 光标位置\n\n当  单位 到达目标点\n就  单位 播放「待机」\n    等待 0.3 秒                     ← 挂起时快照这批单位（W2）\n    单位 朝向 默认方向\n```\n\n要验证：第二条规则不受第一条的选中集影响（P3）；等待期间有单位被摧毁不报错（W3）。\n\n---\n\n## 10. 冻结与退役条件\n\n- **冻结时机**：三个样例走通 → 本文状态改为「已冻结」，此后按 **I11** 对待，与标识符稳定性同级\n- **冻结的范围**：第 3–7 节的语义。**性能优化（脏标记、条件短路、查询缓存）不受约束**，只要可观察行为一致\n- **退役条件**：若**阶段二**（本 ADR 在阶段零定稿，退役触发在阶段二）发现某个模板的逻辑在本语义下写不出来 → **加受限原语**（同 [goals.md §7.2](goals.md#72-三条纪律) 事件表的退役条件），**不改求值语义**\n- 冻结后每加一个条件动作，要在注册时声明「常规 / 触发」——这是本文对 registry 的唯一外溢\n\n---\n\n## 11. 相关文档\n\n- [goals.md](goals.md) — **上级文档**。决策 13 定形态，决策 31 把本文前置到阶段零\n- [adr-001-ecs.md](adr-001-ecs.md) — ECS 选型；本文 D1 是它 spike 第 5 条的下游要求\n- [ai-native-engine.md](ai-native-engine.md) — 事件表的生成方式（AI 吐 Action 序列而非整张表）\n"}, {"id": "adr3", "title": "ADR-003 · 验证驱动的 AI 控制循环", "md": "# ADR-003 · 验证驱动的 AI 控制循环\n\n| | |\n|---|---|\n| **状态** | **倾向已定** —— 见 [ADR 状态机](goals.md#07-adr-状态机v19)。转「已验证」的条件：[§10](#10-三个手工样例与冻结条件) 三个手工样例逐条走通；再由最小纵切实现验证事务与错误通过率后转「已冻结」 |\n| **修订** | **r2**（2026-08-09）——[第一轮推演](adr-003-walkthrough.md)暴露 8 处缺口，本版补齐：<br>§3.1 `baseRevision` 职责分离 + `primitivesUsed` / `capabilityGap` · §3.2 `inputTrace` 分层 + `covers` · §4 计划校验含 Action 存在性 · §5 冲突的定义 · §6 约束分级 · §7 修复白名单与回归范围 |\n\n> **r2 补的八处，全部是「两节各自读都成立、合起来推不出唯一结果」的接缝。**\n> 其中 **C**（`baseRevision`）按原文字面实现会让**任何多步计划的第二步永远冲突**；\n> **E / F** 两处是「验证看起来通过了、但该验的路径没被验」——\n> 它们是 §9「错误通过率必须为 0」现在最可能被击穿的地方。\n| **日期** | 2026-08-08 |\n| **决策者** | 项目所有者 |\n| **上游** | [goals.md](goals.md) 决策 40 及 v20 修订、不变量 I1 / I2 / I3 / I7 / I10、§4.2、§5.4 |\n\n---\n\n## 1. 背景\n\nRoblox Planning Mode 已把**计划 → 执行 → 试玩 → 修复**做成编辑器内的产品闭环：计划可编辑、执行前需批准、\n会话有 checkpoint，试玩代理能读日志、截图并模拟输入，再把结果交还 Assistant 修复。\n这证明「先计划、再构建、再验证」已经是专业引擎内 AI 的竞争基线。\n\n但 Roblox 官方同时明确列出错误通过、可观测性有限、没有实时反射、50 回合上限等限制。\n所以 Clay 不把「模型说测试通过」当成验收，而把自主循环建立在已有的 Action、约束层、headless 与确定性之上。\n\n**本 ADR 决定控制协议，不决定使用哪个模型，也不引入通用 agent 框架。**\n\n| 官方依据 | 核对日期 | 失效复查 |\n|---|---|---|\n| [Roblox Planning Mode](https://devforum.roblox.com/t/announcing-planning-mode-for-roblox-assistant/4580715) | 2026-08-08 | 2026-11-08 |\n| [Roblox Playtest Agent](https://devforum.roblox.com/t/studio-beta-studio-assistant-mcp-playtest-agent/4566767/1) | 2026-08-08 | 2026-11-08 |\n| [Roblox 虚拟输入与自动试玩](https://devforum.roblox.com/t/assistant-updates-studio-built-in-mcp-server-and-playtest-automation/4474643) | 2026-08-08 | 2026-11-08 |\n| [Roblox Assistant 文档](https://create.roblox.com/docs/assistant/guide) | 2026-08-08 | 2026-11-08 |\n\n---\n\n## 2. 决策摘要\n\n> **Clay 的自主循环是「计划契约 → Action 事务 → 分层验证 → 证据提交 → 有界修复」。**\n> 模型可以提出下一步，但不能决定事务是否提交、测试是否算通过、预算是否继续，也不能修改验收标准来让自己通过。\n\n六条硬规则：\n\n1. **计划是结构化 `PlanContract`，Markdown 只是同一份数据的人类视图。**\n2. **执行以步骤为事务边界。** 每步在候选分支运行，通过后才形成 checkpoint。\n3. **硬通过只来自可执行 oracle。** 模型自评、截图描述与自然语言报告只能作为证据，不能单独判定成功。\n4. **提出修改与验证修改的上下文隔离。** 可以使用同一模型，但不能沿用执行代理的自我判断。\n5. **修复有预算、有停止条件、不得削弱测试。**\n6. **全过程形成 `EvidenceLedger`，可重放、可审计、可部分接受。**\n\n---\n\n## 3. 数据契约\n\n### 3.1 `PlanContract`\n\n```ts\ntype PlanContract = {\n  id: string;\n  version: number;\n  baseRevision: string;\n  goal: string;\n  assumptions: string[];\n  scope: {\n    entities?: string[];\n    systems?: string[];\n    allowedActionTags: string[];\n  };\n  steps: PlanStep[];\n  globalAcceptance: TestSpec[];\n  budget: RunBudget;\n};\n\ntype PlanStep = {\n  id: string;\n  dependsOn: string[];\n  intent: string;\n  allowedActions: string[];\n  primitivesUsed: string[];        // r2：打算用哪些条件/动作达成 intent\n  capabilityGap?: CapabilityGap;   // r2：用现有原语表达不出来时必填\n  expectedEffects: string[];\n  acceptance: TestSpec[];\n  risk: 'low' | 'medium' | 'high';\n};\n```\n\n首版用**有依赖边的有序列表**，不做通用节点图。`dependsOn` 只负责依赖与跳过传播；\n界面仍是可编辑列表。日后需要并行调度时，同一数据可投影成 DAG，不改计划格式。\n\n计划的每次人工或 AI 修改都增加 `version`。批准绑定具体版本；计划一旦变化，未执行步骤回到待批准状态。\n\n**计划里不出现「验证」步骤**（r2 · 缺口 A）。验证是每个步骤的 `acceptance` 与计划的\n`globalAcceptance`，不是一个可执行步骤——否则立刻产生递归：那个验证步骤自己的 `acceptance` 是什么？\n\n### 3.1.1 `baseRevision` 的职责划分（r2 · 缺口 C）\n\n**原文只说「校验 `baseRevision`，不一致则停止」，按字面实现会让任何多步计划的第二步永远冲突**：\ns1 提交后工程 revision 就已经不等于计划创建时的值了。\n\n| 字段 | 语义 | 何时校验 |\n|---|---|---|\n| `PlanContract.baseRevision` | 计划**创建 / 批准时**的工程 revision | **仅在第一个步骤执行前**校验。用于检测「批准之后、执行之前，工程被改过」 |\n| `StepReceipt.beforeRevision` | 本步骤执行前的 revision（上一步的 `candidateRevision`，首步则为 `baseRevision`） | **每步校验** |\n\n> **「冲突」的定义（r2 收窄）**：revision 的变化**不是由本 run 已提交的步骤造成的**。\n> **本 run 自己推进 revision 不算冲突。**\n\n### 3.1.2 `capabilityGap`（r2 · 缺口 H）\n\n```ts\ntype CapabilityGap = {\n  missing: string[];        // 缺哪些条件 / 动作（用自然语言描述能力，不是编造 id）\n  attemptedApproach: string;\n  whyInsufficient: string;\n};\n```\n\n`primitivesUsed` 是**计划期必填**。planner 若无法用现有原语表达 `intent`，\n**必须产出 `capabilityGap` 而不是留空或硬凑**；`capabilityGap` 非空的计划\n**直接停在 `NeedsReview`，不进入执行**。\n\n这把「承认做不到」从**模型的自觉**变成**计划结构的必填项**——\n模型仍可能填错，但**填不出来这件事本身会暴露**。\n没有这一条时，模型硬凑近似实现的兜底路径是「同一失败签名两次 → 停止」，\n用户拿到的报告是「重复失败」，而不是 [§10 S3](#s3--请求一个-registry-不具备的新玩法原语) 要求的「缺少哪个原语」。\n\n### 3.2 `TestSpec`\n\n```ts\ntype TestSpec = {\n  id: string;\n  kind: 'schema' | 'constraint' | 'state' | 'interaction' | 'visual';\n  oracle: object;\n  seed?: number;\n  inputTrace?: InputTrace;         // r2：分层，见 3.2.1\n  covers: string[];                // r2：断言了哪些实体 / 系统 / 规则组\n  timeoutTicks?: number;\n  severity: 'hard' | 'soft';\n};\n```\n\n- `schema / constraint / state / interaction` 可以是 `hard`。\n- `visual` 默认只能是 `soft`。只有人明确给出可判定 oracle 时，才允许成为 `hard`。\n- 运行中的 AI **无权新增、删除或降级已批准的 hard TestSpec**；需要改验收标准时必须回到计划审批。\n\n### 3.2.1 `inputTrace` 分两层（r2 · 缺口 E）\n\n```ts\ntype InputTrace =\n  | { layer: 'intent'; intents: InputIntent[] }    // 驱动玩法逻辑\n  | { layer: 'device'; events: DeviceEvent[] };    // 驱动输入映射与 UI 命中测试\n```\n\n**原文只有意图层，而 [I12](goals.md#02-十二条不变量) 的意图（`跳跃 / 确认 / 移动`）不含坐标**，\n只能驱动焦点模型。于是**鼠标命中测试那条路径：V2 到不了，V3 判不了硬**——\n按钮的鼠标绑定断掉时 V2 仍然全绿，而这正是 [§10 S2](#s2--修复按钮能看到但点了没反应) 要防的错误通过。\n\n> **根因是把「设备无关」用错了地方。**\n> I12 约束的是**被测对象**（事件表不得引用设备），\n> **测试轨迹不是事件表**——它完全可以在设备层驱动，只要被测逻辑本身只认意图。\n\n**`kind: 'interaction'` 的 device 层测试可以是 `hard`**（r2 明确放开）。\n理由：它的判据是**可判定的**（按钮是否被激活、菜单是否关闭），不是视觉判断。\n「`visual` 默认 soft」那条规则针对的是「截图好不好看」，**不该殃及命中测试**。\n\n### 3.2.2 `covers` 与回归范围（r2 · 缺口 F）\n\n**回归测试的范围由引擎决定，不由 AI 决定。**\n\n```\n需重跑的回归集 = { t ∈ TestSpec | t.covers ∩ 本步骤实际 affects ≠ ∅ }\n```\n\n**AI 只能建议扩大这个集合，不能缩小。**\n\n没有这一条时，存在一条**绕过全部现有停止条件的错误通过路径**：\nAI 既不删除 hard TestSpec、也不放宽它，**只是不把它列进\"必须重跑的回归测试\"**。\n§7 的停止条件里\"试图删除、放宽或跳过 hard TestSpec\"抓不到\"没跑\"这种形态。\n\n### 3.3 `StepReceipt` 与 `EvidenceLedger`\n\n```ts\ntype StepReceipt = {\n  runId: string;\n  stepId: string;\n  beforeRevision: string;\n  candidateRevision: string;\n  actions: ActionReceipt[];\n  actualEffects: string[];\n  validation: TestResult[];\n  budgetUsed: RunBudget;\n  status: 'passed' | 'failed' | 'needs-review' | 'cancelled';\n};\n```\n\n`EvidenceLedger` 按顺序保存：计划版本、provider / model、提示摘要、Action 参数、真实 diff、约束反馈、\n输入轨迹、种子、状态断言、日志、截图引用、修复假设、预算消耗和最终判定。\n它是审计记录，不是新的世界状态真源；工程状态仍以 Action 层为权威。\n\n---\n\n## 4. 引擎拥有的状态机\n\n```text\nDraft → AwaitingApproval → Executing → Verifying → Passed\n                         ↘             ↘\n                          Cancelled     Repairing → Executing\n                                         ↓\n                              NeedsReview / Failed\n```\n\n| 状态 | 谁能推进 | 条件 |\n|---|---|---|\n| `Draft` | 人 / planner | 计划结构合法：schema 通过、`dependsOn` 无环、**`allowedActions` 与 `primitivesUsed` 的 id 都在 registry 中存在**、`capabilityGap` 为空（r2 · 缺口 G / H）。**尽早失败**——引用了不存在 Action 的计划不该走到人工审批 |\n| `AwaitingApproval` | 仅人 | 批准绑定 `PlanContract.version` 与 `baseRevision` |\n| `Executing` | orchestrator | 只允许本步骤声明的 Action 与影响域 |\n| `Verifying` | verifier | 执行批准时已有的 TestSpec，不得改测试 |\n| `Repairing` | orchestrator | 失败证据、原因假设与最小修复集齐全 |\n| `Passed` | 引擎 | 所有 hard oracle 通过，事务才可提交 |\n| `NeedsReview / Failed / Cancelled` | 人 | 超范围、冲突、超预算、重复失败或人工中断 |\n\n状态、预算和中断信号都在引擎侧。模型输出只能提出状态转换请求，不能直接改状态。\n\n---\n\n## 5. Action 事务语义\n\n每个 `PlanStep` 对应一个事务：\n\n1. 校验 revision（按 [§3.1.1](#311-baserevision-的职责划分r2--缺口-c) 的分工：计划级只在首步查，步级每步查）。\n   **冲突 = revision 变化不是本 run 已提交步骤造成的**；冲突则停止并报告，不自动覆盖。\n2. `preview` 在候选分支执行 Action，主工程不变。\n3. 每条 Action 校验 schema、前置条件、权限和 `affects`；步骤内默认**全有或全无**。\n4. 生成 `StepReceipt`，进入验证。\n5. hard oracle 全部通过才 `commit`，形成命名 checkpoint。\n6. 失败或取消丢弃候选分支；允许接受的最小粒度是**已通过的步骤**，不是失败步骤中的半批 Action。\n\n协议必须支持：\n\n- `baseRevision`：乐观并发控制。\n- `idempotencyKey`：重复请求不得执行两次。\n- `preview / commit / abort`：预览与提交分离。\n- `affects`：实际影响超出计划作用域时立即停止。\n- 外部副作用：本轮 Action 不得发送消息、发布、购买或修改远端状态；以后若开放，必须单独权限与补偿协议。\n\n---\n\n## 6. 三层验证\n\n| 层 | 依据 | 作用 |\n|---|---|---|\n| **V1 结构** | JSON Schema、Action 前置条件、引用完整性、约束四元组 | 快速阻止无效工程状态。**约束分两级**，见下 |\n| **V2 行为** | 确定性 headless、固定 seed、输入意图轨迹、状态断言、回归套件 | 决定玩法是否硬通过 |\n| **V3 体验** | 真实虚拟输入、日志、截图、视觉判断 | 发现 UI、构图、可达性与体验问题 |\n\nV3 不能替代 V2。`character_navigation` 一类直接移动角色的测试只能证明目标状态可达，\n不能证明真实输入、相机、寻路或角色控制器正确；涉及这些系统时必须使用输入意图轨迹。\n\n### 6.1 约束分两级（r2 · 缺口 B）\n\n| 级别 | 例子 | 对 commit 的影响 |\n|---|---|---|\n| **阻断性** | schema 违反、引用完整性断裂、Action 前置条件不满足 | **阻止 commit**。工程不得进入这种状态 |\n| **完成性** | kind 缺皮肤映射、规则行引用了尚未创建的行为单元 | **不阻止 commit**，记入 `StepReceipt` |\n\n**原文没有这个分级，于是「增量构建」与「每个 checkpoint 都合法」直接打架**：\n「新增 kind」与「配皮肤」如果必须同时满足全局约束，就只能合成一个原子步骤，计划无法拆细；\n而若允许分开，中间 checkpoint 就是一个约束违反的状态。\n\n**因此 r2 规定**：`Passed` 只要求**阻断性**约束与 hard oracle 全通过；\n但**「部分接受」时必须显示当前未满足的完成性约束条数与清单**。\n用户仍然可以接受一个未完成的中间态，**但必须知道自己接受的是什么**——这是 [I2](goals.md#02-十二条不变量) 的可审计要求。\n\n验证上下文只接收计划、候选 diff、TestSpec 与观测结果，不接收执行代理的「我已经完成」结论。\n同一模型可以承担 planner / executor / verifier 三个角色，但上下文与权限必须隔离；\n供应商切换不得改变状态机、事务或判定语义。\n\n---\n\n## 7. 有界修复\n\n一次修复必须产生四样东西：\n\n1. 失败证据的稳定签名。\n2. 原因假设。\n3. 最小 Action 修复集及预期影响域。\n4. 受影响测试与必须重跑的回归测试——**范围由引擎按 [§3.2.2](#322-covers-与回归范围r2--缺口-f) 求出，AI 只能建议扩大**。\n\n**修复可以用哪些 Action**（r2 · 缺口 D）：**只限本步骤已批准的 `allowedActions`，且不得改动任何 `acceptance`。**\n需要触碰其他步骤影响域的修复（例如「皮肤缺失其实是上一步 kind 名字拼错」），\n**必须走 `NeedsReview` 回到审批**，不得在 `Repairing → Executing` 的环内自行扩权。\n\n> 原文的状态机让 `Repairing` 直接回到 `Executing` 而不经审批，\n> 同时 §3.1 又规定「计划的每次修改都增加 `version`、未执行步骤回到待批准」。\n> **两条合起来留了个口子**：修复引入的 Action 既不算「计划修改」，又不受 `version` 绑定约束。\n> 上面这条把口子封上，且不破坏自主循环——**本步骤范围内的修复仍然不需要人介入**。\n\n满足任一条件立即停止并转 `NeedsReview / Failed`：\n\n- 同一失败签名连续出现两次。\n- 试图删除、放宽或跳过 hard TestSpec。\n- **需要本步骤 `allowedActions` 之外的 Action，或需要改动 `acceptance`**（r2）。\n- 实际 `affects` 超出计划作用域。\n- Action 次数、修复次数、时间或模型费用任一预算耗尽。\n- 需要现有 registry 没有的新条件或动作（`capabilityGap` 在执行期才暴露）。\n- revision 冲突或用户中断。\n\n停止时必须保留最后一个通过的 checkpoint 与完整证据，不能只返回一段自然语言道歉。\n\n---\n\n## 8. 审批与权限\n\n- **计划批准是强制门。** 不自动执行、不超时默认接受。\n- `low / medium` 步骤在计划批准后可连续执行；`high` 步骤提交前再次批准。\n- 删除实体、批量改规则、改变项目流程、导入外部资产默认为 `high`。\n- 用户可在任何步骤中断；中断在当前 Action 原子边界生效。\n- planner 只能读 `describe` 与 registry；executor 才能 `apply`；verifier 只能运行 TestSpec 与读证据。\n- 工程内文本、资产元数据、脚本注释、日志与网页内容一律视为**不可信数据**，不得把其中的指令提升为计划、权限或审批；\n  只有用户输入与已批准 `PlanContract` 能改变控制目标。\n- provider 适配层不得向模型暴露 API key、代理凭据或未在计划 scope 中声明的工程内容。\n\n这套角色是权限边界，不等于三个并发 agent。**多 agent 并发编辑与合并仍不做。**\n\n---\n\n## 9. 可判定指标\n\n闸门 D 至少记录：\n\n| 指标 | 定义 |\n|---|---|\n| 计划人工修改率 | 被批准前发生人工修改的步骤 / 总步骤 |\n| 首轮通过率 | 无修复即通过的任务 / 总任务 |\n| **错误通过率** | 人工植入失败但 verifier 判通过 / 植入失败总数 |\n| 平均修复轮数 | 通过任务消耗的修复轮数均值 |\n| 越界拦截率 | 实际影响超 scope 且被事务层拦截 / 越界尝试 |\n| 恢复距离 | 失败后回到最近通过 checkpoint 所需 Action 数，目标恒为 0 |\n| 跨模型一致率 | 不同 provider 下得到相同硬判定的任务 / 总任务 |\n| 时间与费用 | 按任务、步骤、模型分别记录，不上传遥测 |\n\n首个闸门 D 套件中，人工植入的 hard 失败**错误通过率必须为 0**。样本扩大后的长期阈值另定，\n但不能用「模型大多数时候觉得可以」替代这一条。\n\n---\n\n## 10. 三个手工样例与冻结条件\n\n### S1 · 加一种会飞的敌人\n\n计划包含：新增 kind → 配皮肤 → 增加移动行为 → 生成规则行 → 加入关卡 → 验证。\n人工制造一次皮肤缺失约束，要求修复只补映射，不重写玩法。检查逐步 checkpoint、部分接受与证据完整性。\n\n### S2 · 修复「按钮能看到但点了没反应」\n\nV2 用输入意图驱动菜单，V3 用真实鼠标点击。直接调用按钮回调或传送到结果状态不得算通过。\n人工植入断开的事件绑定，verifier 必须判失败；修复后必须重跑原测试与菜单回归测试。\n\n### S3 · 请求一个 registry 不具备的新玩法原语\n\nplanner 可以识别能力缺口，但 executor 不得生成并自动注册 JS。运行必须停止在 `NeedsReview`，\n指出缺少的条件 / 动作、已完成步骤、未执行步骤和最后 checkpoint。\n\n### 转状态条件\n\n- 三个样例纸面推演无歧义 → `已验证` 的纸面条件之一。\n- 最小纵切中，事务回滚、计划版本失效、重复请求幂等、错误通过负例全部通过。\n- goals / architecture-outline / roadmap / ai-native-engine 的现行措辞全部同步。\n- 达成以上条件后才可转 `已冻结`；冻结的是协议字段与判定边界，不是 UI 布局或模型提示词。\n\n---\n\n## 11. 明确不做\n\n- 通用 agent 框架依赖。\n- 多 agent 并发编辑与自动合并。\n- 让模型自行修改 hard oracle 后继续执行。\n- 只靠截图或模型自评判定玩法通过。\n- 失败步骤的半批 Action 提交。\n- AI 自动注册新 JS 条件与动作。\n"}, {"id": "adr4", "title": "ADR-004 · 证据治理的决策发现与演化", "md": "# ADR-004 · 证据治理的决策发现与演化\n\n| | |\n|---|---|\n| **状态** | **倾向已定** —— 见 [ADR 状态机](goals.md#07-adr-状态机v19)。转「已验证」的条件：[§12](#12-三个回放样例与冻结条件) 三个回放样例全部通过；在首个真实纵切中完成一次有效挑战和一次无效挑战拦截后，才可转「已冻结」 |\n| **日期** | 2026-08-08 |\n| **决策者** | 项目所有者 |\n| **上游** | [goals.md](goals.md) 决策 42、不变量 I1–I12、§0.5、§0.7、§9；[ADR-003](adr-003-verified-agent-loop.md) |\n\n---\n\n## 1. 问题\n\nClay 的所有者不可能预先知道每个关键技术问题，也不应该靠自己逐行识别 AI 的错误与漂移。\n已有的文档治理能发现版本、链接和部分事实漂移，[ADR-003](adr-003-verified-agent-loop.md) 能约束 AI 怎样执行，\n但两者都没有回答：\n\n1. 谁负责发现**用户没有提出的隐含决策**；\n2. 如何区分事实、假设、偏好和暂定方案；\n3. 当前最优解在什么证据下可以被替换；\n4. 发现不了错误的所有者，如何在不充当技术 oracle 的情况下保留最终控制；\n5. 这套发现机制本身如何改进，而不演变成 AI 静默修改自己的约束。\n\n本 ADR 建立的是**项目研发治理协议**。它约束接手仓库、设计和实现 Clay 的 AI，也为未来产品内的设计代理提供上游规则；\n它不把运行期游戏 AI 纳入范围。\n\n---\n\n## 2. 决策摘要\n\n> **Clay 采用证据治理的滚动开发：意图与权限受保护，方案与机制可挑战；每个非平凡任务先扫描决策面，\n> 暴露假设与未知项，再通过独立质疑、可逆实验、可重放证据和 champion/challenger 比较推进。**\n\n八条硬规则：\n\n1. **用户不承担“找出所有错误”的责任。** 执行 AI 必须主动枚举隐含决策、空白和反例。\n2. **事实、假设、偏好、约束和决策分开记录。** 未经证据支持的内容不得冒充事实。\n3. **决策面不许留白。** 每个维度只能是已覆盖、不适用（有理由）、未决（有登记）或由上游覆盖（有链接）。\n4. **高风险未知只阻塞依赖它的不可逆提交，不阻塞无关工作。** 可逆工作通过适配层、候选分支、feature flag 或 shadow mode 继续。\n5. **AI 可以挑战任何当前方案，但不能静默改写。** 不变量、产品意图、hard oracle、权限和历史只能由项目所有者批准变更。\n6. **独立质疑不是投票。** 结论由可重放证据与反例裁决，不由模型数量或措辞可信度裁决。\n7. **当前最优解只是有版本的 champion。** challenger 必须在同一硬判据下不退化，并证明收益、迁移和回退，才能取代。\n8. **治理机制也用同一协议演化。** 新检查表或新流程先影子运行，通过历史漏判集与新植入反例后才能成为 champion。\n\n---\n\n## 3. 权限内核：什么能进化，什么不能自动改变\n\n| 层 | 内容 | AI 权限 | 采用权限 |\n|---|---|---|---|\n| **L0 意图内核** | 一句话定义、不变量、目标水位、项目所有者保留权 | 可提出 `DecisionChallenge`，不可直接修改 | **仅项目所有者** |\n| **L1 裁决** | 决策表、ADR 结论、hard gate、冻结语义 | 可调研、提出候选和补丁，不可宣布生效 | **项目所有者批准 + 留痕** |\n| **L2 计划** | 路线、任务契约、风险路由、实验顺序 | 可持续优化；越过已批准 scope 时必须挑战 | 低风险可按已批准契约执行，结构改动需批准 |\n| **L3 实现** | 代码、测试、提示词、适配器、检查脚本 | 可在事务、测试和权限内迭代 | 按 [ADR-003](adr-003-verified-agent-loop.md) 或仓库工作流提交 |\n| **L4 证据** | 观测、轨迹、基准结果、失败样本 | 只增不改；纠错追加新记录 | 引擎/工具生成，人和 AI 都不能改旧结果 |\n\n“AI 可以不断优化”指 L2–L3 可以按证据循环演化，L0–L1 可以被挑战但不能被绕过。\n任何声称“为了优化流程所以顺便改了目标或验收”的行为都属于越权。\n\n---\n\n## 4. 五种结构化材料\n\n### 4.1 `TaskContract`\n\n每个非平凡任务在计划或实现前必须具备：\n\n```ts\ntype TaskContract = {\n  objective: string;\n  authority: string[];\n  protectedIntent: string[];\n  knownFacts: EvidenceRef[];\n  assumptions: Assumption[];\n  scope: string[];\n  outOfScope: string[];\n  decisionCoverage: DecisionCoverage;\n  acceptance: EvidenceRequirement[];\n  stopConditions: string[];\n};\n```\n\n任务很小时可以是一段结构化 Markdown，不要求先建设数据库。`authority` 说明谁能决定什么，\n`protectedIntent` 防止 AI 把技术便利误写成产品方向，`assumptions` 必须带失效条件。\n\n### 4.2 `DecisionCoverage`\n\n```ts\ntype CoverageCell = {\n  dimension: string;\n  status: 'covered' | 'not-applicable' | 'open' | 'inherited';\n  refs: string[];\n  rationale?: string;\n};\n```\n\n空字符串不是一种状态。`open` 必须指向 §9 的 `U-NNN`；`inherited` 必须指向决策、ADR 或不变量；\n`not-applicable` 必须说明为什么。覆盖表描述“检查过什么”，不声称“没有未知的未知”。\n\n### 4.3 `UncertaintyItem`\n\n```ts\ntype UncertaintyItem = {\n  id: `U-${string}`;\n  statement: string;\n  type: 'fact' | 'semantic' | 'architecture' | 'product' | 'delivery';\n  irreversibility: 1 | 2 | 3;\n  uncertainty: 1 | 2 | 3;\n  blastRadius: 1 | 2 | 3;\n  deadline: string;\n  evidenceRequired: string;\n  status: 'open' | 'testing' | 'resolved' | 'superseded';\n};\n```\n\n风险分数为 `irreversibility × uncertainty × blastRadius`，它只用于路由，不伪装成精确概率。\n登记表的单一真源是 [goals.md §9](goals.md#九--未决项)。解决后不删行，转入“已决并移出”并链接证据。\n\n### 4.4 `DecisionChallenge`\n\n```ts\ntype DecisionChallenge = {\n  challengedRef: string;\n  trigger: string;\n  hiddenDecision: string;\n  options: Option[];\n  currentEvidence: EvidenceRef[];\n  recommendation: string;\n  reversibleProbe: string;\n  workThatMayContinue: string[];\n  authorityNeeded: string;\n};\n```\n\n挑战不是一句“这里可能有问题”。它必须说明不决定的代价、最小验证方式，以及哪些无关工作仍能继续。\n挑战可以针对用户、历史决策、其他 AI 或本协议本身。\n\n### 4.5 `EvidenceRecord` 与 `EvolutionProposal`\n\n`EvidenceRecord` 至少记录：被验证的断言、环境与版本、输入、方法、原始输出引用、判定规则、结果、限制、复现方式和作者/模型。\n自然语言总结不是原始证据，市场事实必须有来源和复查日期。\n\n`EvolutionProposal` 至少记录：champion、challenger、保持不变的 hard criteria、预期收益、反例集、比较结果、\n迁移计划、回退条件、影响范围和批准者。没有 champion 基线或没有回退的“优化”不能进入正式路径。\n\n---\n\n## 5. 强制决策面\n\n每个新能力、接口、schema、状态机或跨模块行为至少扫描下列十二面：\n\n| # | 决策面 | 必答问题 |\n|---|---|---|\n| D1 | 输入 / 输出 | 输入是否合法、输出由谁消费、空值和部分结果是什么 |\n| D2 | 身份 / 关联 | 对象如何寻址、多个对象如何配对、引用何时失效 |\n| D3 | 状态 / 生命周期 | 创建、可见、修改、销毁、恢复各发生在何时 |\n| D4 | 顺序 / 并发 | 稳定顺序是什么、同 tick 或并发冲突怎样裁决 |\n| D5 | 时间 / 随机 / 精度 | tick 舍入、随机源、数值类型、平台差异怎样处理 |\n| D6 | 失败 / 中断 / 重试 | 失败是否污染状态、何时停止、是否幂等 |\n| D7 | 撤销 / 迁移 / 兼容 | 能否回退、旧数据怎样打开、冻结边界在哪里 |\n| D8 | 权限 / 安全 / 副作用 | 谁能读写什么、外部内容是否可信、哪些副作用禁止 |\n| D9 | 可观察 / 可验证 | hard oracle 是什么、怎样复现、怎样植入负例 |\n| D10 | 性能 / 规模 / 退化 | 上限怎样测、超限时换实现还是改语义 |\n| D11 | 契约 / 依赖 | 上下游是谁、变化如何传播、适配边界在哪里 |\n| D12 | 用户控制 / 修复 | 用户看到什么、能否接手、错误恢复距离是多少 |\n\n此外必须做一次**负空间扫描**：非法输入、空集合、重复请求、乱序、并发修改、部分失败、版本不一致、\n极值、跨平台、权限不足、旧数据和恶意内容。领域 ADR 可以增加专用维度，但不能删除这十二面。\n\n---\n\n## 6. 风险路由与停止条件\n\n| 分数 | 路由 | 允许的推进方式 |\n|---|---|---|\n| **18–27 关键** | 先挑战与验证，相关语义不得提交 | 纸面推演、spike、双实现对拍、候选分支、外部专家审查 |\n| **8–17 受控** | 先写适配与回退，再实现 | feature flag、版本字段、可替换接口、shadow mode |\n| **1–7 可逆** | 采用当前最佳假设推进 | 记录假设、触发条件和回退点；证据出现时可重开 |\n\n下列信号不看分数，立即发出 `DecisionChallenge`：\n\n- 权威文档冲突，或同一需求存在两种合理且结果不同的语义；\n- 新增不可逆 schema、协议、标识符、求值顺序或外部副作用；\n- 需要改变不变量、hard oracle、scope、权限或已批准验收；\n- 任务依赖未登记的假设，或现有证据反驳 champion；\n- 新增只有一个目标游戏使用的内核原语；\n- 验收无法判定、失败无法重放，或 reviewer 与 builder 共用未经隔离的自我结论；\n- 连续失败表明缺的是决策或原语，而不只是实现错误。\n\n发出挑战后，只有相关不可逆提交暂停；`workThatMayContinue` 中的工作照常推进。\n\n---\n\n## 7. 独立质疑与证据强度\n\n独立性按风险增加，不强制多 agent，也不把多数票当真理：\n\n| 风险 | 最低质疑方式 |\n|---|---|\n| 可逆 | 执行者自己做决策面和负空间扫描，测试反驳自身结论 |\n| 受控 | 隔离上下文的 skeptic 只读目标、候选方案和证据，不接收 builder 的“已经正确”结论 |\n| 关键 | 隔离 skeptic + 至少一种异质证据：参考实现、标准/官方来源、第二实现、另一 provider 或领域专家 |\n\n质疑者必须优先寻找：隐含前提、反例、替代解释、不可逆点、评价指标被投机通过的路径。\n如果 reviewer 和 builder 给出不同结论，不合并成折中方案；回到证据不足项，设计能区分两者的实验。\n\n---\n\n## 8. 追踪链与交接证据包\n\n每条实施路径必须可追到：\n\n```text\n产品意图 / 不变量\n  → 目标场景与失败场景\n  → 决策面覆盖\n  → 决策 / ADR / U-NNN\n  → 计划步骤与实现\n  → hard / soft 验收\n  → EvidenceRecord\n  → 当前判定与剩余未知\n```\n\n自动检查至少发现：孤儿目标、无场景的决策、无验收的实现任务、无证据的“已验证”、\n无上游引用的测试，以及修改上游后没有更新的下游投影。\n\n每次 AI 交接必须提供同一份 evidence package：已完成、真实改动、测试结果、失败与限制、\n新增/关闭的 `U-NNN`、触发的挑战、剩余风险、可复现命令和下一决策截止点。\n“已完成”但没有可重放证据的任务，状态只能是“待验证”。\n\n---\n\n## 9. 方案演化：champion / challenger\n\n当前方案不是永恒真理，而是带版本和证据的 champion。AI 可以随时提出 challenger，但采用必须依次满足：\n\n1. 明确 champion 的适用范围、失败条件与基准证据；\n2. challenger 使用**同一组 hard criteria**，不得删测试、换指标或缩小样本来制造胜出；\n3. 至少补一个能区分两者的新反例或真实场景；\n4. 比较正确性、错误通过、恢复距离、成本、性能和可维护性；只优化一轴时公开其他轴变化；\n5. 关键方案先 shadow / candidate 运行，不直接覆盖主路径；\n6. 写出数据/接口迁移与一键回退条件；\n7. 证据可复现，项目所有者批准 L0–L1 变化；\n8. 采用后保留旧结论和证据，ADR 转“已取代”，不改写历史。\n\n新证据若只证明“不同”，不证明“更好”，则两者保持候选，不强行收敛。\n\n---\n\n## 10. 机制演化：让发现系统优化自己\n\n决策面、风险阈值、检查器、提示模板和交接格式都可以演化，但采用更严格：\n\n1. 建立治理基准集：历史真实漏判 + 人工植入的关键遗漏 + 无问题对照任务；\n2. 新机制作为 challenger 在 shadow mode 运行，不影响当前 champion 的裁决；\n3. 同时测**关键遗漏召回率**与**无效挑战负担**，不能靠把所有任务都拦下来获得高召回；\n4. 植入案例中，关键遗漏必须全部被发现，越权修改必须为 0；\n5. 每新增一个必填字段或检查步骤，必须指出它抓住了哪个失败模式；无收益项应删除或降级；\n6. 基准集持续加入新逃逸案例，并保留一组由独立上下文生成、执行者事先未针对调优的案例；\n7. 机制升级自身也要提交 `EvolutionProposal`，保留旧版本、迁移与回退；\n8. AI 可以生成和验证升级提案，但不能自行批准改变 L0–L1 权限边界。\n\n这使机制能学习真实失败，而不是无限增加文档和检查表。**复杂度不是进化指标，漏判更少且审阅负担可控才是。**\n\n---\n\n## 11. 指标\n\n| 指标 | 定义 |\n|---|---|\n| **关键决策逃逸率** | 依赖实现开始后才发现的关键决策 / 全部关键决策 |\n| **静默假设数** | 任务结束后才暴露、且未进入 `assumptions` 或 `U-NNN` 的假设数 |\n| **追踪断链数** | 缺少上游、验收或证据链接的活动项数 |\n| **植入遗漏召回率** | 被机制发现的人工植入关键遗漏 / 植入总数 |\n| **无效挑战负担** | 最终无新信息、无风险降低的挑战 / 挑战总数，并记录人工处理量 |\n| **证据复现率** | 独立环境得到相同 hard 判定的证据记录 / 被抽查记录 |\n| **回退距离** | challenger 失败后恢复 champion 所需的非自动步骤与数据损失 |\n| **决策重开收益** | 重开后实际减少的失败、成本或不可逆风险；没有收益的重开计为机制负担 |\n\n目标不是追求“挑战越多越好”。首轮冻结只设三条硬线：人工植入的关键遗漏召回率 100%、\n越权变更 0、被抽查证据可复现；其余阈值由 M0-d 的真实分布决定，避免纸面编造。\n\n---\n\n## 12. 三个回放样例与冻结条件\n\n### G1 · 回放 v17 / v19 文档漂移\n\n给执行者互相冲突的目标用户、模板数量和 ADR 状态投影。要求覆盖扫描发现权威冲突、\n追踪断链和静默重写风险；不得凭多数文档选择答案。输出一个 `DecisionChallenge` 和仍可继续的纯校验工作。\n\n### G2 · 回放 ADR-002 的隐含语义\n\n给出“两座塔各打最近敌人”，但不提示对象关联、相同距离、销毁可见性、OR、排序和精度问题。\n要求 D2–D5 与负空间扫描主动产生 `U-NNN` / 微案例；如果只复述用户给出的三个样例则失败。\n\n### G3 · 让协议挑战自己\n\n准备一组含关键遗漏和无问题对照的任务，让现行机制与一个减少/增加检查步骤的 challenger 影子运行。\n要求报告遗漏召回、无效挑战负担、成本和越权尝试，并完整走一次采用或拒绝及回退；\n不得因为 challenger 更复杂或来自更新模型就宣布它更优。\n\n### 转状态条件\n\n- G1–G3 由隔离上下文回放，人工植入的关键遗漏全部被发现，越权修改为 0；\n- §9 现有未决项都有 ID、风险路由、截止点和证据要求；\n- 首个真实纵切完成一次有效挑战、一次无效挑战拦截和一次证据复现；\n- goals / AGENTS / README / architecture-outline / roadmap / ai-native-engine / check-docs 投影一致；\n- 达成后转“已验证”；首个纵切复核后才转“已冻结”。冻结的是权限、记录和采用边界，\n  决策面、风险阈值、检查表和提示词继续按 §10 演化。\n\n---\n\n## 13. 明确不做\n\n- 宣称能够保证发现所有未知的未知；本协议保证的是主动暴露、追踪和从逃逸中学习。\n- 让多个模型投票替代证据，或让同一上下文自写、自审、自宣通过。\n- 因为所有者未发现问题，就把沉默视为批准。\n- 允许 AI 自行修改不变量、hard oracle、权限、历史记录或自身采用门槛。\n- 让高风险未知冻结整个项目；只暂停依赖它的不可逆提交。\n- 为了“流程完善”无限增加字段、会议、agent 或文档，而不测漏判与审阅负担。\n\n---\n\n## 14. 最小执行模板\n\n这是首版 champion。非平凡任务可以增加领域字段，但不得省略下面的语义；要修改必填项，按 §10 提交机制 `EvolutionProposal`。\n\n### 14.1 任务开始\n\n```md\n## TaskContract\n\n- Objective:\n- Authority: 谁能批准方向 / ADR / 实现 / 外部副作用\n- Protected intent: 本任务不得改变的不变量、hard gate、产品取舍\n- Facts: 断言 + EvidenceRecord / 官方来源 + 复查日期\n- Assumptions: 断言 + 为什么暂信 + 失效信号\n- Scope / out of scope:\n- Acceptance: hard / soft 分开，写明证据形态\n- Stop conditions:\n\n## DecisionCoverage\n\n| 面 | 状态 | 决策 / U-NNN / 不适用理由 / 证据 |\n|---|---|---|\n| D1 输入输出 | | |\n| D2 身份关联 | | |\n| D3 生命周期 | | |\n| D4 顺序并发 | | |\n| D5 时间随机精度 | | |\n| D6 失败重试 | | |\n| D7 撤销迁移 | | |\n| D8 权限安全 | | |\n| D9 观察验证 | | |\n| D10 性能退化 | | |\n| D11 契约依赖 | | |\n| D12 用户控制 | | |\n\n- Negative space: 空 / 非法 / 重复 / 乱序 / 并发 / 部分失败 / 旧版本 / 极值 / 跨平台 / 恶意内容\n```\n\n简单任务可以压缩成一段，但不能把“未扫描”伪装成“不适用”。\n\n### 14.2 需要挑战时\n\n```md\n## DecisionChallenge\n\n- Challenged ref:\n- Trigger / hidden decision:\n- Why it matters now:\n- Options and trade-offs:\n- Current evidence and its limits:\n- Recommendation:\n- Smallest reversible probe:\n- Work that may continue:\n- Authority needed:\n```\n\n### 14.3 交接\n\n```md\n## EvidencePackage\n\n- Completed / not completed:\n- Actual changes:\n- Verification commands and raw-result refs:\n- Failures, limitations, and negative results:\n- U-NNN opened / resolved / superseded:\n- DecisionChallenge raised / resolved:\n- Champion/challenger outcome and rollback point:\n- Remaining risk and next decision deadline:\n- Reproduction steps:\n```\n\n`EvidencePackage` 是交接索引，不复制原始日志；它引用可重放证据。没有证据引用的“通过”必须降为“待验证”。\n"}, {"id": "adr2wt", "title": "ADR-002 手工样例推演 · 第一轮", "md": "# ADR-002 手工样例推演\n\n> **第一轮**（§0–§7）对 r1 语义，暴露 6 处缺口。\n> **第二轮**（[§8](#8-第二轮推演对-r2-语义)）对 r2 语义，验证闭合情况——**5 处闭合，1 处待实测，新发现 1 处**。\n\n| | |\n|---|---|\n| **状态** | **已采纳** —— 项目所有者裁决缺口 B 取 **B3′**；六处补丁与 R4 已并入 [ADR-002](adr-002-eventsheet-eval.md) r2，该 ADR 据此转「已验证」。本文作为推演证据保留，不再修改结论 |\n| **日期** | 2026-08-08 |\n| **执行** | AI（[ADR-004](adr-004-evidence-governed-evolution.md) §3 的 L1 层：可推演、可提候选，**不可宣布冻结**） |\n| **上游** | [ADR-002](adr-002-eventsheet-eval.md) §9 三个手工样例；[goals.md](goals.md) 决策 31、闸门 O |\n\n---\n\n## 0. 结论先说\n\n> **三个样例都不能按现有 §3–§7 直接走通。** 共暴露 **6 处语义缺口**，其中\n> **A、B、D 是阻塞级**——不补就无法判定样例是否\"走通\"，因而闸门 O 无法通过。\n\n**最重要的发现是 D：同一物理步内产生的多个触发事件，入队顺序未定义。**\n它不是语义歧义，是**确定性漏洞**——两台机器同一输入可以跑出不同结果，直接威胁决策 29 与 lockstep。\nADR-002 §8 的 D1 只规定了**实体迭代顺序**，漏了**事件顺序**这另一半。\n\nD 同时改变了 Rapier spike 的验收内容：只验刚体状态逐帧哈希一致**不够**，必须同时验接触事件序列一致。\n\n---\n\n## 1. 方法\n\n对每个样例，按 [ADR-002 §3](adr-002-eventsheet-eval.md) 的 tick 流程逐步推演，\n在每一步记录**各种类的当前集合**。凡是\"按规则推不出唯一结果\"的地方即记为缺口。\n\n判据来自 ADR-002 §9 原文：**结果与「用户读这段规则会预期什么」一致；任一条不一致 → 改语义，不改样例。**\n\n---\n\n## 2. 样例一 · 塔防选目标\n\n```\n当  敌人 进入 塔的范围          ← 触发型\n    塔 冷却完毕\n就  塔 朝 距离最近的 敌人 开火\n    塔 进入冷却\n```\n\n世界：塔 `T1(0,0)`、`T2(10,0)`，射程 5；敌人 `E1`、`E2`、`E3`。\n\n### 2.1 推演：单个事件 → 撞上缺口 A\n\ntick N，`E1` 移入 `T1` 范围（距离 3）。step 2 物理步进产生进入事件，载荷 `(敌人=E1, 塔=T1)`，入队。\nstep 3 排空，执行该规则分支。**此时初始集合是什么？**\n\n| 依据 | 说法 | 推出的集合 |\n|---|---|---|\n| §4 | \"每条顶层规则从**全集**开始\" | 敌人 `{E1,E2,E3}`、塔 `{T1,T2}` |\n| §3 | \"按入队顺序 FIFO，**逐个**执行其规则分支\" | 暗示载荷参与定集，否则\"逐个\"没有意义 |\n\n**两节各自读都成立，合起来推演就撞车。** 若真从全集开始，任意一对进入范围会让**所有**冷却完毕的塔开火。\n\n> **缺口 A · 触发规则的初始集合未定义。**\n\n**候选**\n\n- **A1（推荐）**：触发规则的初始集合 = **触发载荷涉及的实体**，每个被载荷提及的种类为单元素集；\n  **未被载荷提及的种类仍从全集开始**。\n- **A2**：从全集开始，触发条件充当筛选器，选出本 tick 内发生该事件的全部实体，**一次**执行。\n\n**取 A1 的理由**：A2 会让 §3 的 FIFO\"逐个\"与排空深度上限 N 同时失去意义；\n且 ADR-002 §3 自称\"不另发明，沿用 Construct / GDevelop 被验证的模型\"，而这两家的触发条件正是 picks 触发它的实例。\n\n### 2.2 推演：两个敌人同 tick 进入 → 撞上缺口 B\n\n设 `E1`（距 T1 = 3）与 `E2`（距 T1 = 1）**同 tick** 进入 `T1` 范围。两个事件入队。\n\n按 A1 逐个执行：\n\n| 步 | 事件 | 敌人集 | 塔集 | 结果 |\n|---|---|---|---|---|\n| 1 | `(E1,T1)` | `{E1}` | `{T1}` 冷却完毕 ✓ | T1 打 **E1**，T1 进入冷却 |\n| 2 | `(E2,T1)` | `{E2}` | `{T1}` 冷却中 ✗ → **空集** | 整条不执行（Q3） |\n\n**结果：T1 打了 E1，而 E2 更近。** 与样例自己写的验证目标\"两座塔各打各的**最近**目标\"不符。\n\n根因：在 A1 下敌人集是**单元素**，动作参数 `距离最近的 敌人` 退化成恒等——它没有可选择的余地。\n要真正选到最近的，该参数必须解析为\"**当前这座塔**射程内的**全部**敌人中最近的一个\"，这需要两样 §4 没有的东西：\n\n1. 相对于当前动作执行实例（塔）的**关联作用域**；\n2. **突破当前集合**去查询更大范围的能力——而 §4 的模型是**只收窄不放宽**（单调收窄）。\n\n> **缺口 B · 选择器式动作参数（\"距离最近的 X\"）的作用域未定义，且与 §4 的单调收窄模型冲突。**\n\n**候选**\n\n| | 方案 | 评价 |\n|---|---|---|\n| B1 | 改写样例为常规规则（每帧：塔冷却完毕 + 范围内有敌人 → 打最近） | **不解决根本**：\"范围内有敌人\"仍需关联作用域 |\n| B2 | 引入通用关联作用域（**改 §4**）：动作逐个执行时为当前实例建作用域，其他种类在该作用域内重新求值 | 表达力最强，但破坏 P2/P3 的简单心智模型，且**必须在冻结前改主体语义** |\n| **B3（推荐）** | 把\"最近的 X\"做成**显式的关联收窄条件**而非动作参数：`塔 的射程内 距离最近的 敌人`，注册为一类同时收窄两个种类并建立配对的条件 | 语义**局部化**，§4 主体不动；符合 §10\"加受限原语，不改求值语义\"的精神 |\n\n**B3 的窗口现在开着**：§10 写的退役条件是\"阶段二发现写不出来 → 加受限原语\"。\n但这次是**冻结前**发现的，所以还可以选择改语义（B2）；一旦冻结，就只剩加原语（B3）一条路。\n**这是本次推演唯一真正需要你拍板的方向问题。**\n\n### 2.3 推演：击杀后的第二个事件 → 撞上缺口 C\n\n设 `E1` 同 tick 进入 `T1` 与 `T2` 的范围（两个事件），且一发即杀。\n\n- 执行 `(E1,T1)`：T1 打 E1 → **E1 销毁**（Q4：动作立即写世界）。\n- 执行 `(E1,T2)`：载荷敌人 `E1` **已不存在**。语义未定：跳过？还是对已销毁实体开火？\n\n§7 的 **W3** 给了对称先例（等待队列快照里的实体已销毁 → 跳过，不报错、不整条中止），\n但它只覆盖**等待队列**，没有覆盖**触发队列的载荷**。\n\n> **缺口 C · 排空期间触发载荷实体被销毁时的语义未定。**\n\n**候选（推荐）**：补一条 **E4**——排空时若载荷实体已销毁，**跳过该事件**，不报错、不中止后续事件。与 W3 对齐。\n\n### 2.4 推演：换一台机器 → 撞上缺口 D（最严重）\n\n回到 2.2：结果取决于 `(E1,T1)` 与 `(E2,T1)` **谁先入队**。\n\n§3 只说\"按**入队**顺序 FIFO\"，**没有规定同一物理步内产生的多个事件按什么顺序入队**。\n§8 的 **D1** 规定了实体迭代按稳定 id 升序，但那管的是**全表求值时的实体遍历**，不管**物理引擎回调的事件顺序**。\n\n而 Rapier 的接触事件顺序来自它内部的宽相 / 窄相遍历，**不保证跨平台、跨版本一致**。\n\n> **缺口 D · 同一 step 内产生的触发事件，入队顺序未定义 → 直接击穿决策 29。**\n>\n> 后果链：事件顺序不同 → 2.2 的\"T1 打 E1 还是 E2\"不同 → 世界状态分叉 → lockstep 立即失步。\n> 这不是\"可能有性能差异\"级别的问题，是**同一份作品在两台机器上跑出不同结果**。\n\n**候选（推荐）**：补 **D4**——同一 step 内产生的触发事件，入队前按\n`(事件类型 id, 主实体 id, 次实体 id)` **稳定排序**。这是 D1 在事件层的对应物；\n§8 只做了实体迭代那一半，事件那一半一直缺着。\n\n**对 Rapier spike 的影响**：M1-e 的验收必须从\"逐 tick 刚体状态哈希一致\"扩展为\n\"**逐 tick 刚体状态哈希一致 + 逐 tick 接触事件序列一致**\"。若 Rapier 的事件顺序本身不稳定，\nD4 的排序层就是必需的（而不是可选的加固）——这一点 spike 可以直接测出来。\n\n---\n\n## 3. 样例二 · 跳跃缓冲\n\n```\n当  意图「跳跃」被按下              ← 触发型\n就  设置 变量 缓冲 = 0.15 秒\n\n每帧\n    缓冲 > 0\n    角色 在地面上\n就  角色 向上施加冲量\n    设置 缓冲 = 0\n```\n\n### 3.1 通过的部分\n\ntick N（角色在空中，玩家按跳跃）→ tick N+2（落地）：\n\n| 步 | 发生什么 |\n|---|---|\n| N.1 | 采样输入，冻结快照 |\n| N.3 | 排空触发：`缓冲 = 0.15` |\n| N.4 | 全表：`缓冲 > 0` ✓，`在地面上` ✗ → 不执行 |\n| N+2.4 | 全表：`缓冲 > 0` ✓，`在地面上` ✓ → 施加冲量，`缓冲 = 0` |\n\n- **E1 验证通过**：触发（step 3）先于全表（step 4），所以\"落地前按的跳跃仍然生效\"成立 ✓\n- **Q4 验证通过**：同一条规则内先施加冲量后置零，后续规则读到 `缓冲 = 0` ✓\n\n### 3.2 缺口 E · 计时器与 `dt`\n\n样例写 `缓冲 = 0.15 秒`，带时间单位，**暗示它会自动随时间递减**。\n但 §3 的 tick 流程里**没有\"变量按秒递减\"这一步**，§7 的等待队列只处理 `等待` 动作的续延。\n\n若要求用户自己写 `每帧 → 缓冲 = 缓冲 - dt`，则：样例二**少了一条规则**，且 `dt` 从哪来也没定义——\n§8 的 D3 注入了 `rng` 与 `tick`，**没有 `dt`**。\n\n> **缺口 E · 带时间单位的变量（计时器）是不是一等概念？`dt` 是否注入？**\n\n**候选（推荐）**：计时器作为**一等概念**——声明为计时器的变量由内核在 step 5（等待队列结算）统一递减，\n与等待队列同属运行期状态、同样可序列化（W2 的理由完全适用：技能冷却、波次间隔、跳跃缓冲都是计时器）。\n理由：若交给用户手写递减，每个作品都会重新实现一遍，且**忘记存档**的概率极高，直接撞 I11。\n\n### 3.3 A1 的子情形：无实体载荷的触发\n\n`意图「跳跃」被按下` 是触发型，但**不携带实体载荷**。按 A1\"未被载荷提及的种类从全集开始\"，\n角色集 = 全集。单角色无碍，**多角色（分屏 / 联机）就会让所有角色一起跳**。\n\n→ A1 需补充一句：**输入意图类触发不携带实体载荷**，要绑定到具体角色须写显式条件（如 `角色 是本地玩家`）。\n这不是新缺口，是 A1 措辞的必要补全。\n\n---\n\n## 4. 样例三 · RTS 下达指令\n\n```\n当  意图「确认」被按下              ← 触发型\n    存在 被选中的单位\n就  被选中的单位 移动到 光标位置\n\n当  单位 到达目标点\n就  单位 播放「待机」\n    等待 0.3 秒                     ← W2 快照\n    单位 朝向 默认方向\n```\n\n### 4.1 通过的部分\n\n- **P3 验证通过**：规则 2 从全集重新开始，不受规则 1 的选中集影响 ✓\n- **W2 / W3 验证通过**：`单位 到达目标点` 是触发型，按 A1 载荷 = 到达的那个单位，\n  每个单位各自触发、各自等待；等待期间该单位被摧毁 → W3 跳过 ✓\n  （在 A1 下这条比样例设想的\"一批单位一起等待\"语义**更干净**）\n\n### 4.2 缺口 F · 「存在 X」是布尔还是筛选\n\n`存在 被选中的单位` 落在 §5 没有覆盖的中间形态：\n\n| §5 覆盖的 | 本例 |\n|---|---|\n| 取反条件（\"没有敌人在范围内\"）→ 只做布尔判定，不改集合 | ？ |\n| 纯布尔条件（\"金钱 > 100\"）→ 不改集合 | ？ |\n\n- 若判为**纯布尔不收窄** → 单位集仍是全集 → 动作 `被选中的单位 移动到 光标位置` 对**全集**执行 → **所有单位都移动**。错。\n- 若判为**筛选** → 它就是普通条件，\"存在\"两字只是措辞。\n\n> **缺口 F · 「存在 X」形式的条件是布尔判定还是筛选条件？**\n\n**候选（推荐）**：**不设独立的\"存在\"形态**——`存在 被选中的单位` 就是筛选条件 `单位.被选中 == true`，\n其\"存在\"语义由 **Q3 的空集规则自动获得**（筛出空集 → 整条不执行）。\n但这必须**写明**，否则实现者会照字面做成布尔条件，而这个错误在单元测试里不容易暴露\n（单选一个单位时两种语义结果相同，多选时才分叉）。\n\n---\n\n## 5. 汇总与建议的补丁\n\n| ID | 缺口 | 严重度 | 决策面（[ADR-004 §5](adr-004-evidence-governed-evolution.md)） | 推荐 |\n|---|---|---|---|---|\n| **A** | 触发规则的初始集合未定义（§3 与 §4 冲突） | **阻塞** | D2 身份关联 | A1 载荷起点 |\n| **B** | 选择器式动作参数的作用域未定义 | **阻塞** | D2 | **需你拍板**：B2 改语义 vs B3 加原语 |\n| C | 排空期间触发载荷被销毁 | 中 | D3 生命周期 | 补 E4，与 W3 对齐 |\n| **D** | **同 step 内触发事件入队顺序未定义 → 击穿确定性** | **关键** | D4 顺序 / D5 精度 | 补 D4 稳定排序 |\n| E | 计时器与 `dt` 是否一等概念 | 中 | D5 时间 | 计时器一等 + 可序列化 |\n| F | 「存在 X」是布尔还是筛选 | 中 | D1 输入输出 | 判为筛选，写明 |\n\n**六处全部落在 ADR-004 §5 的强制决策面内**，其中 B 正是 [ADR-004 §12](adr-004-evidence-governed-evolution.md) 的 **G2 样例**\n提前点名的那一个（\"给出'两座塔各打最近敌人'，但不提示对象关联\"）——治理机制的决策面在这里是有效的。\n\n**但这也说明治理不该前置于 ADR-002**：这六处缺口是**真推演时撞出来的**，\n不是先跑三个治理回放能凭空发现的。\n\n---\n\n## 6. 闸门 O 的当前判定\n\n> **未通过。** 三个样例中，样例一在第一行就无法推出唯一结果（缺口 A），\n> 且其声明的验证目标\"两座塔各打各的最近目标\"在现有语义下**推不出来**（缺口 B）。\n> 样例二、三的核心性质（E1 / Q4 / P3 / W2 / W3）**全部验证通过**。\n\n补齐 A、B、C、D、E、F 后需**重跑本轮推演**，而不是在本文上打补丁。\n\n---\n\n## 7. Evidence package（[ADR-004 §8](adr-004-evidence-governed-evolution.md) 第 14.3 节）\n\n- **已完成**：ADR-002 §9 三个手工样例第一轮推演\n- **未完成**：闸门 O 未通过；缺口 B 待项目所有者裁决方向后才能重跑\n- **真实改动**：新增本文；[goals.md §9](goals.md#九--未决项) 新增 `U-033`–`U-038`；\n  `tools/build-preview.py` 纳入本文。**未改动 ADR-002 任何语义**\n- **验证命令**：`python tools/check-docs.py`\n- **失败与限制**：本轮是**手工推演，非机器验证**——没有实现，因此\n  \"按语义推不出唯一结果\"是可靠结论，而\"补丁后能推出正确结果\"仍需重跑才能确认。\n  缺口 D 的严重程度**依赖\"Rapier 事件顺序跨平台不稳定\"这一假设**，该假设由 M1-e spike 实测，尚未证实\n- **新增 U-NNN**：`U-033`(A) `U-034`(B) `U-035`(C) `U-036`(D) `U-037`(E) `U-038`(F)\n- **触发的挑战**：缺口 D 对 M1-e Rapier spike 的验收内容构成变更请求（见第 2.4 节）\n- **剩余风险**：B 的选择会影响事件表表达力上限，且**冻结后不可逆**\n- **下一决策截止点**：全部六项在 **M0-a 冻结前**（闸门 O）\n- **复现方式**：按本文 §1 的方法，对照 [ADR-002](adr-002-eventsheet-eval.md) §3–§8 逐步重推\n\n---\n\n## 8. 第二轮推演（对 r2 语义）\n\n项目所有者裁决：缺口 B 取 **B3′ 参数化关联原语族**。ADR-002 据此出 **r2**。本节按 r2 重推三个样例。\n\n### 8.1 样例一 · 关联查询（缺口 B）\n\n```\n每帧\n    塔 冷却完毕\n    塔 的 射程内 最近 的 敌人\n就  塔 朝 配对的 敌人 开火\n    塔 进入冷却\n```\n\n世界：`T1(0,0)`、`T2(10,0)` 射程 5；`E1`(距 T1 = 3)、`E2`(距 T1 = 1)、`E3`(距 T2 = 2)。\n\n| 步 | 集合状态 |\n|---|---|\n| 顶层起点 | 塔 `{T1,T2}`、敌人 `{E1,E2,E3}` |\n| `塔 冷却完毕` | 塔 `{T1,T2}`；**敌人不受影响**（P1） |\n| 关联查询 | T1 射程内 `{E1,E2}` → 最近 `E2`；T2 射程内 `{E3}` → 最近 `E3`<br>配对 `(T1,E2)`、`(T2,E3)`；塔 `{T1,T2}`、敌人 `{E2,E3}` |\n| 动作 | 按配对：T1 打 **E2**，T2 打 **E3** |\n\n> **两座塔各打各的最近目标 ✓ 缺口 B 闭合。**\n> 全部敌人在射程外时无配对 → 塔集为空 → 整条不执行 ✓（Q3）\n\n### 8.2 但第二轮撞出新缺口 G\n\n接上例，改设 `E2` 同时在 T1 与 T2 的射程内且对两者都最近 → 配对 `(T1,E2)`、`(T2,E2)`。\n按 D1 稳定 id 升序，T1 先执行。设一发即杀：\n\n- T1 打 `E2` → **`E2` 销毁**（Q4：动作立即写世界）\n- 轮到 `(T2,E2)` —— **配对的另一端已经不存在了。** 语义未定。\n\n> **缺口 G · 关联查询的配对在动作阶段失效时的语义未定。**\n\n**这是同一个模式第三次出现**：\n\n| 出处 | 被快照的东西 | 语义 |\n|---|---|---|\n| **W3**（r1 已有） | 等待队列里的实体集 | 跳过该实体 |\n| **E4**（r2 新增） | 触发队列里的载荷 | 跳过该事件 |\n| **G → R4**（本轮新增） | 关联查询的配对 | ？ |\n\n前两处已经定成\"跳过、不报错、不中止其余\"，第三处没有理由不同。\n**已定为 [R4](adr-002-eventsheet-eval.md#41-关联查询原语族r2-新增--b3)：跳过。**\n\n**为什么不选\"重新查询次优目标\"**——这是决定性的一条：\n\n> 重查意味着**动作阶段还要再做一次查询**，等于承认目标不是条件阶段定好的，而是边执行边算的。\n> **那正是 B2 通用作用域的做法**，而我们刚刚因为它不可逆、语义未推演而放弃了它。\n>\n> 从这个小口子放它进来，等于**在没人注意的地方绕过了 B3′ 这个决定**。\n> R4 选\"跳过\"不只是更简单，是**保持已作出的决定不被悄悄推翻**。\n\n另两条支持理由：三处同构一套规则比三种特例好实现好测；少打一帧是 1/60 秒，\n且用户想要次优目标行为时自己加一条规则即可——引擎不该替他决定。\n\n### 8.3 样例二 · 计时器（缺口 E、A1 子情形）\n\n| tick | 步 | 状态 |\n|---|---|---|\n| N | 3 | 触发（无实体载荷 → 角色从全集开始，A1）：`计时器 缓冲 = 0.15` |\n| N | 4 | `缓冲 > 0` ✓、`在地面上` ✗ → 不执行 |\n| N | 5 | 内核递减：`缓冲 = 0.15 - dt`（T1） |\n| N+2 | 4 | `缓冲 > 0` ✓、`在地面上` ✓ → 施加冲量，`缓冲 = 0` |\n\n**E1 ✓**（触发先于全表，落地前按的跳跃生效）· **Q4 ✓**（同 tick 先写后读）·\n**T1 ✓**（内核递减）· **T2 ✓**（计时器进运行期状态，存读档保持剩余时间）。**缺口 E 闭合。**\n\n### 8.4 样例三 · 「存在」与配对无关的部分（缺口 F）\n\n- 规则 1：触发无载荷 → 单位从全集开始；`存在 被选中的单位` **作为筛选条件**收窄\n  → 动作只对被选中的单位执行 ✓ **缺口 F 闭合**\n  （若判为布尔不收窄，则全部单位都会移动——这正是 r1 的歧义）\n- 规则 2：`单位 到达目标点` 触发型，载荷 = 该单位（A1）→ 各自等待、各自快照\n- **P3 ✓**（规则 2 从全集重新开始）· **W2 / W3 ✓**\n\n### 8.5 缺口 A / C / D 的闭合情况\n\n| 缺口 | 状态 | 说明 |\n|---|---|---|\n| **A** | **闭合** | §3.3 定为载荷起点；8.4 的两条规则各自验证了带载荷与无载荷两种情形 |\n| **C** | **闭合** | E4 补齐，8.2 的同构讨论进一步确认 |\n| **D** | **语义闭合，实测未完成** | step 2.5 的稳定排序消除了对物理引擎事件顺序的依赖。**但\"Rapier 事件顺序确实不稳定\"这个前提仍未证实**——[spike-001](spike-001-rapier-determinism.md) 同机测下来事件序列是一致的，跨平台未验。**D4 是防御性的**：即使 Rapier 稳定，加了也不损失什么；若不稳定，它是唯一的救法 |\n\n### 8.6 第二轮后的闸门 O 判定\n\n> **仍未通过，但性质变了。**\n>\n> - 第一轮：**6 处缺口，其中 3 处阻塞**，样例一在第一行就推不出唯一结果\n> - 第二轮：**5 处闭合**（A/B/C/E/F）、**1 处语义闭合待实测**（D）、**1 处新增**（G，已补 R4 待确认）\n>\n> 三个样例现在**都能推出唯一且符合预期的结果**，六处缺口全部有定论。\n>\n> **纸面部分到此完成。** 唯一剩余项是 **`U-025` 的跨平台实测**——\n> 但它不改变任何语义选择（D4 是防御性的：Rapier 稳定则无损失，不稳定则它是唯一救法），\n> 只决定 D4 的重要程度。\n\n### 8.7 第二轮的 Evidence package\n\n- **已完成**：按 r2 语义重推三个样例；A/B/C/E/F 闭合验证\n- **未完成**：闸门 O 未通过（R4 待确认、D 待实测）\n- **真实改动**：[ADR-002](adr-002-eventsheet-eval.md) 出 r2（六处补丁 + R4）；\n  [`U-034`](goals.md#九--未决项) 改写为 B3′ 的**失效信号**而非待办\n- **验证命令**：`python tools/check-docs.py`\n- **失败与限制**：仍是**手工推演**。第二轮只推了三个样例覆盖到的路径，\n  **R2（禁嵌套关联）的代价没有被任何样例检验**——它的失效信号要等 M2 真写模板\n- **新增未知**：无新增 `U-NNN`；`U-034` 语义变更（从\"选哪个方案\"变成\"B3′ 何时失效\"）\n- **剩余风险**：B3′ 封死了两层关联；若 M2 出现该需求，届时 ADR-002 已冻结，\n  **只能加原语，不能改回 B2**——这是选择 B3′ 时明知的代价\n- **下一决策截止点**：R4 确认（即刻）· `U-025` 跨平台实测（闸门 A 前）\n"}, {"id": "adr3wt", "title": "ADR-003 手工样例推演 · 第一轮", "md": "# ADR-003 手工样例推演\n\n> **第一轮**（§0–§6）对 r1 协议，暴露 8 处缺口。\n> **第二轮**（[§7](#7-第二轮推演对-r2-协议)）对 r2，验证闭合情况。\n\n| | |\n|---|---|\n| **状态** | **已采纳** —— 项目所有者批准缺口 E 的 `interaction` 可作 hard，其余七处按推荐解落地；八处补丁已并入 [ADR-003](adr-003-verified-agent-loop.md) r2 |\n| **日期** | 2026-08-09 |\n| **执行** | AI（[ADR-004](adr-004-evidence-governed-evolution.md) §3 的 L1 层：可推演、可提候选，**不可宣布冻结**） |\n| **上游** | [ADR-003](adr-003-verified-agent-loop.md) §10 三个手工样例；[goals.md](goals.md) 决策 40 的 v20 修订 |\n| **方法** | 与 [ADR-002 推演](adr-002-walkthrough.md)相同：逐步走协议，记录每一步的状态与权限，凡\"按规则推不出唯一结果\"即记为缺口 |\n\n---\n\n## 0. 结论先说\n\n> **8 处缺口，其中 2 处阻塞、2 处关键。**\n\n**最重要的两处**：\n\n- **缺口 C · `baseRevision` 在多步骤中怎么推进没有定义** —— 按字面实现，**任何多步计划的第二步都会永远冲突**。\n- **缺口 E · 鼠标点击这条路径没有 hard oracle** —— 而 S2 的整个存在意义就是防止这类\"错误通过\"，\n  §9 还要求错误通过率必须为 0。\n\n这两处都落在 **M1-b（Action 事务字段）冻结前**必须解决的范围内。\n\n---\n\n## 1. S1 · 加一种会飞的敌人\n\n计划：新增 kind → 配皮肤 → 移动行为 → 生成规则行 → 加入关卡 → 验证。\n人工制造一次皮肤缺失约束。\n\n### 1.1 缺口 A · 「验证」不该是一个 PlanStep（轻）\n\n§10 把\"验证\"列为计划的一环，但 §3.1 里每个 `PlanStep` 自带 `acceptance`，\n`PlanContract` 另有 `globalAcceptance`。**验证是每步的属性，不是步骤。**\n\n若真把它做成步骤，会立刻产生递归问题：**这个验证步骤自己的 `acceptance` 是什么？**\n\n**候选（推荐）**：措辞澄清——计划里不出现\"验证\"步骤；端到端验收放 `globalAcceptance`。无需改结构。\n\n### 1.2 缺口 B · 步骤 checkpoint 可能是**约束违反**的状态（阻塞）\n\n推演 s1（新增 kind `flying_enemy`）→ s2（配皮肤映射，人工制造缺失）：\n\n| 步 | 事务 | 结果 |\n|---|---|---|\n| s1 | preview → V1 通过（kind 结构合法）→ **commit → checkpoint1** | 工程里有了 kind |\n| s2 | preview → V1 **失败**（约束层：kind 缺少皮肤映射）→ 丢弃候选分支 | 回到 checkpoint1 |\n\n**此时 checkpoint1 是一个约束违反的状态**：有 kind，没皮肤。\n\n而 §10 要求\"检查逐步 checkpoint、**部分接受**与证据完整性\"。\n**部分接受一个约束违反的状态，是什么语义？** 用户按下\"接受已完成的部分\"，\n拿到的是一个约束层会持续报错的工程。\n\n根子在于：**步骤级 `acceptance` 与全局约束的关系没有定义。**\n\n- 若要求每步都满足全局约束 → **无法增量构建**（kind 与皮肤必须原子地一起做完，计划就没法拆细）\n- 若只在 `globalAcceptance` 查全局约束 → 中间 checkpoint 可以是坏的，**\"部分接受\"变成一个危险操作**\n\n**候选**\n\n| | 方案 | 评价 |\n|---|---|---|\n| B1 | 约束分级：**阻断性**（引用完整性、schema）与**完成性**（kind 缺皮肤）。只有前者阻止 commit | 与\"增量构建\"相容；需要给约束层加一个等级字段 |\n| B2 | 引入**步骤组**，组内共享一个 checkpoint，组外才可部分接受 | 表达力强，但 `PlanContract` 要加一层结构 |\n| **B1 + C3（推荐）** | B1 分级，**且部分接受时必须显示\"当前有 N 条完成性约束未满足\"** | 用户仍可部分接受，但**知道自己接受的是什么**。契合 [I2](goals.md#02-十二条不变量) 的可审计 |\n\n### 1.3 缺口 C · `baseRevision` 在多步骤中怎么推进（**阻塞**）\n\n§3.1 的 `PlanContract` 有**一个**计划级 `baseRevision`；\n§5.1 说\"校验 `baseRevision`，不一致则停止并报告冲突\"；\n§3.3 的 `StepReceipt` 却有**每步自己的** `beforeRevision` 与 `candidateRevision`。\n\n**三者关系未定义。** 按 §5.1 的字面实现：\n\n- s1 执行前校验：工程 revision = `R0` = `PlanContract.baseRevision` ✓ → commit → 工程变成 `R1`\n- s2 执行前校验：工程 revision = `R1` ≠ `PlanContract.baseRevision`（`R0`）→ **停止，报告冲突**\n\n> **任何多步计划都会在第二步永远冲突。**\n\n**候选（推荐）**：两个字段职责分开写明——\n\n| 字段 | 语义 | 何时校验 |\n|---|---|---|\n| `PlanContract.baseRevision` | 计划**创建/批准时**的工程 revision | **仅在第一个步骤执行前**校验；用于检测\"批准后、执行前工程被改过\" |\n| `StepReceipt.beforeRevision` | 本步骤执行前的 revision（= 上一步的 `candidateRevision`，或首步的 `baseRevision`） | 每步校验，用于检测**本 run 之外**的并发修改 |\n\n关键是把\"冲突\"重新定义为：**revision 变化不是由本 run 的已提交步骤造成的**。\n本 run 自己推进 revision 不算冲突。\n\n### 1.4 缺口 D · 修复能用哪些 Action 没有定义（中）\n\n§4 的状态机里 `Repairing → Executing`，**不回到 `AwaitingApproval`**。\n§3.1 又说\"计划的每次修改都增加 `version`，未执行步骤回到待批准状态\"。\n\n于是：**修复算不算\"计划修改\"？**\n\n- 算 → 每次修复都要人重新批准 → **自主循环不成立**\n- 不算 → 修复引入的 Action **绕过了\"批准绑定 version\"这道门**\n\n而 §7 的停止条件里有\"需要现有 registry 没有的新条件或动作\"，\n**却没有\"需要本步骤 `allowedActions` 之外的 Action\"**。\n\nS1 正好能触发它：如果皮肤缺失是因为 s1 里 kind 名字拼错了，\n**最小修复是回去 rename kind——那是 s1 的影响域，不是 s2 的**。\n\n**候选（推荐）**：修复**只能使用本步骤已批准的 `allowedActions`，且不得改动任何 `acceptance`**；\n需要触碰其他步骤的影响域时，走 `NeedsReview` 回到审批。在 §7 的停止条件里补这一条。\n\n---\n\n## 2. S2 · 按钮能看到但点了没反应\n\n### 2.1 缺口 E · 鼠标点击这条路径**没有 hard oracle**（**关键**）\n\n§10 写：**\"V2 用输入意图驱动菜单，V3 用真实鼠标点击。直接调用按钮回调或传送到结果状态不得算通过。\"**\n\n按现有定义推：\n\n| 层 | 驱动方式 | severity |\n|---|---|---|\n| **V2** | `inputTrace: InputIntent[]`——而 [I12](goals.md#02-十二条不变量) 规定意图是 `跳跃 / 确认 / 移动`，**不含坐标** | 可以 `hard` |\n| **V3** | 真实鼠标点击 | §3.2：`visual` **默认只能是 `soft`** |\n\n于是\"确认\"意图只能驱动**焦点模型**（键盘式导航：下一项 / 确认），\n而**鼠标命中测试那条路径，V2 到不了、V3 判不了硬**。\n\n> **结果：按钮的鼠标绑定断了，V2 仍然全绿。**\n> 而这正是 S2 想要防的那种错误通过，也直接违反 §9 的\"错误通过率必须为 0\"。\n\n**根因是把\"设备无关\"用错了地方。** [I12](goals.md#02-十二条不变量) 管的是\n**事件表不得引用设备**——那是被测对象的约束；**测试轨迹不是事件表**，\n它完全可以在设备层驱动，只要被测逻辑本身只认意图。\n\n**候选（推荐）**：`inputTrace` **分两层**——\n\n```ts\ntype InputTrace =\n  | { layer: 'intent'; intents: InputIntent[] }      // 驱动玩法逻辑\n  | { layer: 'device'; events: DeviceEvent[] };      // 驱动输入映射与 UI 命中测试\n```\n\n并明确：**`kind: 'interaction'` 的 device 层测试可以是 `hard`**。\n理由是它的判据是**可判定的**（按钮是否被激活、菜单是否关闭），不是视觉判断——\n`visual` 默认 soft 那条规则针对的是\"截图好不好看\"，不该殃及命中测试。\n\n### 2.2 缺口 F · 回归测试范围由谁决定（**关键**）\n\n§7 要求修复产出\"受影响测试与**必须重跑的回归测试**\"，§10 要求\"重跑原测试与**菜单回归测试**\"。\n\n**\"菜单回归测试\"这个集合是谁圈定的？**\n\n- 由 **AI** 判断哪些相关 → 它可以**选择性少跑**。这**绕过了** §7\"试图删除、放宽或跳过 hard TestSpec\"\n  那条停止条件——因为它既没删也没放宽，只是**没跑**\n- 由**引擎**按影响域推导 → 需要 TestSpec ↔ 实体 / 系统的依赖索引，**ADR 里没有这个结构**\n\n> 这是\"错误通过\"的一条**隐蔽路径**：所有跑过的测试都是绿的，只是该跑的没跑。\n\n**候选（推荐）**：`TestSpec` 增加 `covers: string[]`（它断言了哪些实体 / 系统 / 规则组）；\n回归范围由**引擎**按本步骤实际 `affects` ∩ 各 TestSpec 的 `covers` 求出，**AI 只能建议扩大，不能缩小**。\n\n---\n\n## 3. S3 · 请求 registry 不具备的新原语\n\n### 3.1 缺口 G · Action 存在性检查发生在什么时候（轻）\n\n§4 里 `Draft → AwaitingApproval` 的条件是\"计划结构合法\"。\n**这是否包含\"`allowedActions` 里的 id 都在 registry 中存在\"？** 未说明。\n\n**候选（推荐）**：包含。计划校验期就查 id 存在性——**尽早失败**，\n不要让一个引用了不存在 Action 的计划走到人工审批。\n\n但要注意这**不是 S3 说的那件事**（见下）。\n\n### 3.2 缺口 H · 能力缺口没有独立的识别机制（中）\n\nS3 要的不是\"引用了不存在的 action id\"，是\"**这个需求没法用现有原语表达**\"——\n比如\"逃跑时留下燃烧的痕迹\"，registry 里没有任何动作对应\"留下持续痕迹\"。\n\n**这个判断只有模型能做，引擎无法自动检测。** 而模型最常见的失败模式恰恰是\n**硬凑一个近似实现**（用现有原语拼个不对的东西），而不是承认做不到。\n\n现有机制的兜底路径是：硬凑 → `acceptance` 不符 → 修复 → 同一失败签名两次 → 停止。\n**机制上确实会停**，但停下来时报告的是\"**重复失败**\"，\n而 §10 要求 S3 的输出是\"**指出缺少的条件 / 动作**\"——用户拿不到那个诊断。\n\n**候选（推荐）**：在 `PlanStep` 增加一个计划期必填字段\n`primitivesUsed: string[]`（本步骤打算用哪些条件 / 动作达成 `intent`），\n并要求 planner 在无法用现有原语表达时**显式产出 `capabilityGap`** 而不是留空。\n`capabilityGap` 非空 → 计划直接停在 `NeedsReview`，不进入执行。\n\n这把\"承认做不到\"从**模型的自觉**变成**计划结构的必填项**——\n模型可以填错，但**填不出来这件事本身会暴露**。\n\n---\n\n## 4. 汇总\n\n| ID | 缺口 | 严重度 | 决策面 | 推荐 |\n|---|---|---|---|---|\n| A | 「验证」不该是 PlanStep | 轻 | D1 | 措辞澄清 |\n| **B** | 步骤 checkpoint 可能违反全局约束，\"部分接受\"语义不明 | **阻塞** | D3 生命周期 | 约束分级 + 接受时显示未满足项 |\n| **C** | **`baseRevision` 多步推进未定义 → 第二步永远冲突** | **阻塞** | D4 顺序并发 | 计划级只校验首步，步级校验本 run 之外的改动 |\n| D | 修复可用的 Action 白名单未定义 | 中 | D8 权限 | 限本步 `allowedActions`，越界走审批 |\n| **E** | **鼠标路径没有 hard oracle → S2 的错误通过防不住** | **关键** | D9 可验证 | `inputTrace` 分意图层 / 设备层；interaction 可 hard |\n| **F** | **回归范围由 AI 圈定 → 可以\"少跑\"而非\"删测试\"** | **关键** | D9 | `TestSpec.covers` + 引擎按 `affects` 求交，AI 只能扩不能缩 |\n| G | Action 存在性检查时机 | 轻 | D11 契约 | 计划校验期就查 |\n| H | 能力缺口只能靠模型自述，否则退化成\"重复失败\" | 中 | D12 用户控制 | `primitivesUsed` + `capabilityGap` 必填 |\n\n**E 与 F 是同一类问题的两面**：验证看起来通过了，但**该验的路径没被验**。\n§9 把\"错误通过率必须为 0\"定为硬线，而这两处正是它现在最可能被击穿的地方。\n\n---\n\n## 5. 闸门判定\n\n> **ADR-003 的三个手工样例：未通过。**\n>\n> S1 在第二步撞上 B 与 C（C 会让任何多步计划无法执行）；\n> S2 的核心诉求（防止用 shortcut 冒充 UI 验证）在现有 `TestSpec` 定义下**做不到**；\n> S3 能停下来，但给不出它自己要求的诊断。\n>\n> **协议的骨架是对的**——状态机、事务边界、权限隔离、有界修复都站得住，\n> 缺的是**字段级的语义**。这与 ADR-002 第一轮的情况同构：大结构没问题，\n> 真推演撞出来的全是\"两节各自读都成立、合起来推不出唯一结果\"的接缝。\n\n**C、D 必须在 M1-b（Action 事务字段）冻结前定**；E、F 可以到 M3-f，\n但**越晚定，已经写好的 TestSpec 越多，改起来越贵**。\n\n---\n\n## 6. Evidence package\n\n- **已完成**：ADR-003 §10 三个手工样例第一轮推演\n- **未完成**：三个样例均未走通；ADR-003 维持「倾向已定」\n- **真实改动**：新增本文；[goals.md §9](goals.md#九--未决项) 新增 `U-040`–`U-045`；\n  `tools/build-preview.py` 纳入本文。**未改动 ADR-003 任何条文**\n- **验证命令**：`python tools/check-docs.py`\n- **失败与限制**：手工推演，非机器验证。**S2 的推演依赖\"UI 按钮的命中测试走设备层\"这一假设**——\n  若界面页最终做成纯焦点模型（`U-015` 未决），缺口 E 的形态会变，但\"鼠标路径需要 hard oracle\"的结论不变\n- **新增 U-NNN**：`U-040`(B) `U-041`(C) `U-042`(D) `U-043`(E) `U-044`(F) `U-045`(H)；\n  A、G 是措辞澄清，直接给解，不登记\n- **剩余风险**：E、F 若不解决，§9 的\"错误通过率 0\"是**不可达的**——\n  这会让闸门 D.4 变成装饰\n- **下一决策截止点**：C、D 在 M1-b 前；B 在 M3-c 前；E、F 在 M3-f 前；H 在 M3-g 前\n- **复现方式**：按本文 §0 的方法，对照 [ADR-003](adr-003-verified-agent-loop.md) §3–§8 逐步重推\n\n---\n\n## 7. 第二轮推演（对 r2 协议）\n\n### 7.1 S1 重推\n\n| 步 | r2 下的行为 |\n|---|---|\n| s1 新增 kind | revision `R0` = 计划 `baseRevision` ✓（首步才查）→ V1：阻断性约束通过，**完成性约束「缺皮肤」记入 receipt 不阻止 commit**（6.1）→ checkpoint1，工程 `R1` |\n| s2 配皮肤（人工制造缺失） | `beforeRevision` = `R1` = s1 的 `candidateRevision` ✓ **不再误判为冲突**（3.1.1）→ 约束失败 → Repairing |\n| 修复 | 补映射在 s2 的 `allowedActions` 内 → 环内修复，无需人介入 ✓ |\n| 若缺失源于 s1 拼错 kind 名 | rename 超出 s2 影响域 → **`NeedsReview`**（§7 新增停止条件）✓ |\n| 部分接受 | 显示「1 条完成性约束未满足：kind `flying_enemy` 缺皮肤映射」✓ |\n\n> **B、C、D 闭合。** C 尤其关键——r1 下这个计划**根本走不到 s2**。\n\n### 7.2 S2 重推\n\n- V2：`{ layer: 'intent' }` 驱动焦点模型 → 验键盘/手柄路径\n- V3：`{ layer: 'device' }` 真实鼠标事件 → `kind: 'interaction'`、`severity: 'hard'`（r2 放开）\n- 植入断开的鼠标绑定 → **device 层 hard 失败** ✓ **v1 下这里是全绿的**\n- 修复后回归范围 = `{ t | t.covers ∩ affects ≠ ∅ }` 由引擎求出 → 菜单回归自动纳入，**AI 无法少跑** ✓\n\n> **E、F 闭合。** 这两处是 §9「错误通过率 0」能否成立的前提。\n\n### 7.3 S3 重推\n\n- planner 读 registry，\"留下燃烧的痕迹\"无对应原语\n- `primitivesUsed` 是**必填**，填不出来 → 必须产出 `capabilityGap`\n- `capabilityGap` 非空 → **计划停在 `NeedsReview`，不进入执行** ✓\n- 报告含：缺哪些能力、尝试过什么、为何不足、已完成步骤、未执行步骤、最后 checkpoint ✓\n\n> **G、H 闭合。** r1 下的兜底路径是\"硬凑 → 两次失败 → 停止\"，\n> 报告写的是\"重复失败\"而非\"缺少原语\"；r2 让它**在计划期就暴露**。\n\n### 7.4 第二轮判定\n\n> **三个样例全部走通，八处缺口全部闭合。**\n>\n> 但 **ADR-003 仍不能转「已验证」**——它自己 §10 的转状态条件是\n> **两条**：三个样例纸面无歧义（✓ 已达成）**且**\n> 「最小纵切中，事务回滚、计划版本失效、重复请求幂等、错误通过负例全部通过」（✗ 需要 M1-b 的实现）。\n>\n> **纸面部分完成，实现验证待 M1-b。**\n\n### 7.5 第二轮 Evidence package\n\n- **已完成**：按 r2 重推三个样例，八处缺口闭合\n- **未完成**：ADR-003 维持「倾向已定」——纸面条件已满足，**实现条件未满足**\n- **真实改动**：[ADR-003](adr-003-verified-agent-loop.md) 出 r2（八处补丁）\n- **失败与限制**：仍是手工推演。**r2 新增的 `covers` 字段带来一个未验证的负担**——\n  它要求每个 TestSpec 都声明覆盖面，若声明不准，引擎求出的回归范围同样不准。\n  这只是把\"AI 可能少跑\"换成\"covers 可能填漏\"，**没有消除风险，只是把它移到了可审计的位置**\n- **剩余风险**：`covers` 的准确性、device 层 `DeviceEvent` 的具体格式（M3-f 前定）\n- **下一决策截止点**：M1-b 落地 `baseRevision` / 幂等 / 事务边界时做实现验证\n"}, {"id": "spike1", "title": "Spike-001 · Rapier 确定性（同机）", "md": "# Spike-001 · Rapier 确定性 · 第一轮（同机）\n\n| | |\n|---|---|\n| **状态** | **部分完成** —— 同机重跑通过；**跨机 / 跨平台未验**，[U-025](goals.md#九--未决项) 仍为 `testing` |\n| **日期** | 2026-08-08 |\n| **上游** | [goals.md](goals.md) 决策 29、`U-025`；[roadmap.md](roadmap.md) M1-e |\n| **脚本** | [`tools/spikes/rapier-determinism.mjs`](../../tools/spikes/rapier-determinism.mjs) |\n\n---\n\n## 0. 为什么现在跑\n\nroadmap 原本把 M1-e 排在 M1 的第一件事，理由是依赖 M0-b 打包器。**实测不依赖**：\n一个 node 脚本 + `@dimforge/rapier3d-compat` 即可，不需要打包器、three 或编辑器。\n\n它是全项目**唯一可能推翻已定决策**的一项（决策 29，不过就换物理库），\n且是纯机器工作，与 ADR-002 的语义推演互不占用注意力，因此提前到与 M0-a 并行。\n\n---\n\n## 1. 复现\n\n```bash\nnpm i @dimforge/rapier3d-compat && node tools/spikes/rapier-determinism.mjs\n```\n\n场景：地面 + 50 个盒子（5×5×2 网格，两层错位堆叠），固定步长 1/60，跑 600 步。\n刻意制造堆叠与大量接触，放大非确定性。\n\n采集两条序列，**逐 tick** 各取一个哈希：\n\n| 序列 | 内容 | 为什么要它 |\n|---|---|---|\n| **状态** | 全部刚体的 `translation` + `rotation`，**精确位模式，不量化** | 量化会掩盖真实的跨平台漂移 |\n| **事件** | `drainCollisionEvents` 交回的接触事件，**按原始顺序，不排序** | [ADR-002 推演缺口 D](adr-002-walkthrough.md#24-推演换一台机器--撞上缺口-d最严重) 新增的验收内容 |\n\n> **事件序列这一半是这次新加的。** 原验收只写\"逐帧状态一致\"，\n> 而 ADR-002 的推演表明：**事件顺序不一致同样会让作品分叉**，且它不体现在刚体状态里。\n\n---\n\n## 2. 结果\n\n```\nRapier spike · 600 steps @ 0.01667s\n平台：win32 x64 · node v24.16.0\n\n接触事件总数：156 / 156\n状态序列一致：是\n事件序列一致：是\n\n跨机器比对指纹：\n  state = 85cff7f8f866e20f\n  event = 3f0480a84fcddd29\n```\n\n### 2.1 指纹有效性（植入负例）\n\n**\"通过\"必须先证明测法能检出差异**，否则可能只是哈希没在测东西。\n给首个盒子的初始 x 加不同量级的扰动：\n\n| 扰动 | 状态 | 事件 |\n|---|---|---|\n| `1e-12` | 一致 | 一致 |\n| `1e-9` | 一致 | 一致 |\n| `1e-7` | 一致 | 一致 |\n| **`1e-6`** | **分叉**（step 0） | 一致 |\n| `1e-5` | 分叉（step 0） | 一致 |\n| `1e-3` | 分叉（step 0） | 一致 |\n\n**第一轮我用的是 `1e-12`，没被检出，一度以为指纹失效。** 实际原因是——\n\n> **Rapier 内部是 f32（单精度）。** 在 `x ≈ -2.1` 附近，f32 的 epsilon 约 `2.4e-7`，\n> 小于它的扰动在写入时就被吞掉了，世界根本没有变化。\n\n检出阈值落在 `1e-7` 与 `1e-6` 之间，与 f32 精度边界吻合。**指纹有效。**\n\n### 2.2 第二个数据点：浏览器 wasm 运行时\n\n同一场景在浏览器里重跑（`browser.html`，脚本逻辑与 node 版逐行对应）：\n\n```\nUA: Chrome/148.0.7778.280 Electron/42.7.0 (Win64 x64)\n\n接触事件总数：156 / 156\n状态序列一致：是\n事件序列一致：是\n\n  state = 85cff7f8f866e20f      ← 与 node 完全一致\n  event = 3f0480a84fcddd29      ← 与 node 完全一致\n```\n\n**两个指纹与 node v24.16 逐位相同。**\n\n**这个数据点的价值有限，必须说清楚**：node 与 Chromium **都是 V8**，\n只是版本不同（node 24 与 Chrome 148 的 V8 相差若干个大版本）。\n所以它证明的是\"**同一 CPU 上，不同 V8 版本的 wasm 编译对本负载产生相同结果**\"，\n**不是**\"不同 wasm 运行时一致\"——那需要 SpiderMonkey（Firefox）或 JavaScriptCore（Safari）。\n\n它排掉的风险类别是真实的（引擎升级导致作品行为漂移），但**离跨 CPU 架构还很远**。\n\n### 2.3 意外发现：**跨 Rapier 版本不一致**（严重）\n\nM0-b 建工程时 `package.json` 写了 `^0.19.0`，装到 0.19.3；而本 spike 首轮在无约束环境下装的是 0.20.0。\n同一脚本、同一场景、同一台机器，两版跑出来：\n\n| Rapier | state 指纹 | event 指纹 | 接触事件总数 |\n|---|---|---|---|\n| **0.20.0** | `85cff7f8f866e20f` | `3f0480a84fcddd29` | **156** |\n| **0.19.3** | `423ad71a6a8944ef` | `cde8f9ff8cf61410` | **693** |\n\n**事件总数差 4.4 倍——这不是浮点噪声，是行为变更**（很可能是接触事件的生成或去重语义改过）。\n**根因未查**：无论是 API 语义变更还是回归，结论都一样。\n\n> **这直接撞不变量 I11**（已发布的作品必须永远能打开，且**跑出来的行为不变**）。\n>\n> **它比跨平台差异更紧迫**：跨 CPU 架构的差异**可能**存在；\n> 而依赖升级是**必然发生**的——一次 `npm update` 就够了。\n\n**已采取的措施**：`package.json` 的物理与渲染依赖全部改为**精确版本**（不用 `^` 范围），\n并在文件里写明理由。**但锁版本只解决\"我们自己不漂\"，不解决\"将来必须升级时老作品怎么办\"**——\n后者需要在快照里记录物理引擎版本，属于 I11 迁移链的一部分，已登记为 [`U-039`](goals.md#九--未决项)。\n\n---\n\n## 3. 这一轮证明了什么、没证明什么\n\n| | |\n|---|---|\n| **已证明** | 同一进程内两个独立 world，同一输入 → 状态与事件序列**逐 tick 完全一致**；采集方法对 ≥ f32 精度的差异敏感 |\n| **已证明** | 同一 CPU 上，**node 与浏览器（两个不同版本的 V8）结果逐位相同** |\n| **未证明** | **跨机器、跨 OS、跨 CPU 架构（尤其 x64 ↔ ARM）是否一致** —— 这才是决策 29 与 lockstep 真正需要的 |\n| **已证伪** | **跨 Rapier 版本不一致**——0.19.3 与 0.20.0 行为不同（见上文第 2.3 节）。版本必须锁死并进快照 |\n| **未证明** | 非 V8 的 wasm 运行时（SpiderMonkey / JavaScriptCore）是否一致 |\n\n**同机一致是最低门槛，不是验收。** 它若不过，项目当场就要换物理库；它过了，只说明可以继续验下一层。\n\n**`U-025` 因此从 `open` 进入 `testing`，不能关闭。**\n\n---\n\n## 4. 一个额外发现：f32 对确定性的双面影响\n\nRapier 是 f32 这件事，goals.md 与 adr-001 都没写过。它有两面：\n\n- **有利**：f32 精度低，意味着**小于 `2.4e-7` 的差异会被直接吸收**，不会被放大成分叉。\n  这给跨平台一致留了一点缓冲。\n- **不利**：f32 的中间运算更容易受**指令集差异**影响（FMA 融合乘加、SIMD 宽度、\n  x87 与 SSE 的舍入差异）。而这些差异**大于** f32 epsilon，会被放大。\n\n结论：**这一轮的通过完全不能外推到跨平台。** 反而说明跨平台那一轮必须真的在\n不同架构上跑，不能靠\"同机通过所以应该没问题\"推断。\n\n---\n\n## 5. 下一步\n\n1. **在第二台机器 / 另一 OS / ARM 上跑同一脚本**，比对 §2 的两个指纹。\n   脚本已支持 `--emit` 写出 `fingerprint.json` 供比对\n2. 若跨平台不一致 → 按决策 29**换物理库，不放宽判据**；\n   若只是事件顺序不一致而状态一致 → [ADR-002 缺口 D](adr-002-walkthrough.md) 的稳定排序层可以救，属于可修复\n3. 补测：Rapier 版本升级前后、浏览器 wasm vs node wasm\n\n---\n\n## 6. Evidence package\n\n- **已完成**：同机双 world 一致性 + 指纹有效性负例扫描\n- **未完成**：跨机 / 跨平台 / 跨版本 / 跨运行时，全部未验\n- **真实改动**：新增本文与 `tools/spikes/rapier-determinism.mjs`；[goals.md §9](goals.md#九--未决项) 的 `U-025` 证据栏更新\n- **复现命令**：`npm i @dimforge/rapier3d-compat && node tools/spikes/rapier-determinism.mjs`\n- **原始输出**：见 §2（本机 win32 x64 / node v24.16.0）\n- **失败与限制**：**只有一台机器**，最关键的跨平台一致性无法在本轮验证；\n  第一轮负例（`1e-12`）因 f32 精度被吞而误判为\"指纹失效\"，已通过量级扫描定位并修正\n- **剩余风险**：决策 29 的最大技术风险（[风险 15](goals.md#十--风险)）**未解除**\n- **下一决策截止点**：闸门 A 前（`U-025`）\n"}, {"id": "spike2", "title": "Spike-002 · ECS 选型验证", "md": "# Spike-002 · ECS 选型验证（ADR-001 §5）\n\n| | |\n|---|---|\n| **状态** | **完成** —— 六条全部跑通，**koota 锁定**；[`U-001`](goals.md#九--未决项) 可关闭 |\n| **日期** | 2026-08-09 |\n| **上游** | [ADR-001](adr-001-ecs.md) §5 Spike 方案、§6 退役条件；[goals.md](goals.md) 决策 5、决策 29 |\n| **脚本** | [`tools/spikes/ecs-determinism.mjs`](../../tools/spikes/ecs-determinism.mjs) |\n\n---\n\n## 1. 复现\n\n```bash\nnpm i -D koota bitecs && node tools/spikes/ecs-determinism.mjs\n```\n\n实测版本：**koota 0.6.6** · **bitecs 0.4.0** · node v24.16.0 / win32 x64。\n\n---\n\n## 2. 结果\n\n| # | ADR-001 §5 的判据 | 结果 |\n|---|---|---|\n| 1 | 三种组件：数值 / 字符串 / 对象引用 | **通过** |\n| 2 | 运行时注册一个模块的组件集 | **通过** |\n| 3 | 快照 → 改 100 个实体 → 回滚 | **通过**（自写，约 6 行——ADR §4.2 估的\"几十行\"偏保守） |\n| 4 | 10k 实体查询循环 | **1.11 ms/帧**（预算 16.6 ms，余量 15 倍） |\n| **5** | **确定性：迭代顺序** | **见下** |\n| 6 | 书写体验 | `world.query(P, V).updateEach(([p, v]) => p.x += v.x)` |\n\n### 2.1 第 5 条（杀手判据）分两档测\n\n**温和档**——只增删组件、且对称恢复：\n\n| 场景 | 结果 |\n|---|---|\n| 同一逻辑终态、两条不同操作历史 | 顺序**一致** |\n| 增删组件后再恢复 | 顺序**一致** |\n| 顺序恰为 spawn 顺序 | **是** |\n\n**这一档全过，但它太温和，不足以下结论。**\n原型式 ECS 真正会露馅的地方是**实体销毁后 id 被复用**，以及**同一查询命中多个不同原型**。\n（Rapier spike 的教训：不植入负例，\"通过\"可能只是测试没在测东西。）\n\n**严格档**——销毁一半实体 + 补建新实体触发 id 复用 + 1/3 实体多带一个 Tag 形成混合原型：\n\n| 场景 | 结果 |\n|---|---|\n| 同一操作序列重放两次 | 顺序**一致** ✅ |\n| 顺序是否天然升序 | **否** ⚠️ |\n\n### 2.2 怎么读这个结果\n\n两个结论，必须分开看：\n\n> **① 重放确定性成立。** 同一操作序列跑两次，迭代顺序完全一致。\n> **这是决策 29 的底线，koota 守住了。**\n>\n> **② 但顺序不是稳定 id 升序。** id 复用后，复用出来的实体排在了它 id 应有位置之外。\n\n**② 不是失败**，它正是 [ADR-001 §6](adr-001-ecs.md#6-退役条件按-goalsmd-72-预先写死) 预写的升级路径第 ① 步所针对的情形：\n\n```\n库自身不能保证稳定的查询迭代顺序\n  → ① 封装层统一按稳定实体 id 排序后再交给系统   ← 落在这里\n```\n\n§6 原文说\"① 应该覆盖绝大多数情况\"——**实测确认了这个判断**。\n\n**因此这条不是选型问题，是封装层的一项必需职责**：\n`query()` 必须在交给系统之前按稳定 id 升序排序。\n这同时也是 [ADR-002 §8 的 D1](adr-002-eventsheet-eval.md#8-确定性的四条附加约束)\n（\"实体迭代顺序按稳定 id 升序，不按 ECS 原型的内存顺序\"）的执行点——\n**两份 ADR 在这里对上了，且是实测对上的，不是纸面推的。**\n\n---\n\n## 3. bitECS 对照\n\n只做了**局部**对照（顺序 + 书写体验），**没有跑完整六条**——\n理由是 ADR-001 §4.2 的权重是 **ISC 许可证 > 书写体验 > 活跃度**，\nkoota 六条全过时，bitECS 的完整 spike 不影响结论。**这是本轮的一处范围限制，写出来。**\n\n| | koota | bitECS |\n|---|---|---|\n| 同终态 / 不同历史顺序一致 | 通过 | 通过 |\n| 书写体验 | `p.x += v.x` | `Position.x[eid] = 10`——**eid 写错会静默改到别的实体** |\n| 许可证 | **ISC** | **MPL-2.0**（文件级弱著佐权，改动过的源文件须公开） |\n\n若日后 koota 出问题，bitECS 仍是候选，但要先算 MPL-2.0 那笔账\n（本项目几乎一定会改 ECS 源码：快照要接版本化信封、确定性要审计迭代顺序）。\n\n---\n\n## 4. 对 ADR-001 与下游的影响\n\n1. **ADR-001 转「已验证」**，`4.2 主选 koota` 锁定。\n2. **封装层新增一项硬职责**：`query()` 按稳定 id 升序排序。\n   这不是优化，是 [决策 29](goals.md#二--决策表) 与 [ADR-002 D1](adr-002-eventsheet-eval.md) 的执行点，\n   **M1-a 必须带着它落地**，不能等到发现回放对不上再补。\n3. **`U-001` 关闭**（ECS 库选型）。\n4. **`U-002` 不变**（组件 schema 定义方式）——spike 反而确认了 ADR §3 的\"发现 1\"：\n   koota 的 `trait({x:0})` 只能推出类型，推不出范围、枚举、实体引用、单位、说明。\n   **详情面板自动生成与 AI 可读所需的 schema，封装层无论如何要自己写。**\n\n---\n\n## 5. Evidence package\n\n- **已完成**：ADR-001 §5 六条判据，koota 全过；严格档确定性场景\n- **未完成**：bitECS 的完整六条（有意跳过，理由见 §3）\n- **真实改动**：新增本文与 `tools/spikes/ecs-determinism.mjs`；\n  [ADR-001](adr-001-ecs.md) 转「已验证」；`U-001` 关闭\n- **复现命令**：`node tools/spikes/ecs-determinism.mjs`\n- **失败与限制**：**单机、单版本、单一 node 运行时**。\n  迭代顺序在浏览器 wasm/JIT 下是否一致未测——但 koota 是纯 JS，\n  且封装层排序会把这个风险抹平，优先级低于 Rapier 的跨架构问题\n- **剩余风险**：低。选型代价已被封装层限制在约 800 行内（ADR §4.1）\n- **下一决策截止点**：`U-002` 组件 schema 定义方式，M1-a 内\n"}, {"id": "ui", "title": "编辑器 UI 约定", "md": "# 编辑器 UI 约定\n\n> 目的只有一个：**让前端迭代不产生风格漂移。**\n> 本文是约定（写代码时要遵守的规则），不是设计方案——不讨论「界面该长什么样」，\n> 只规定「颜色、间距、字号从哪来，什么不许写」。\n\n---\n\n## 1. 先分清两个视觉域（最容易搞错的一条）\n\n| | 编辑器 UI | 游戏内呈现 |\n|---|---|---|\n| 是什么 | 面板、工具栏、大纲、详情、对话框、事件表 | 玩家看到的一切：模型、材质、光照、特效、血条与计分 |\n| 谁定义 | **本文的令牌** | **皮肤包**（goals.md 决策 20） |\n| 换风格意味着 | 换编辑器主题（亮 / 暗） | 换游戏美术风格 |\n| 允许用户改吗 | 否（只有主题切换） | **是，这是产品能力** |\n\n**两者不共享令牌，不共享组件，不互相引用。**\n\n最常见的错误是把**游戏内 UI 预制件**（血条、计分、胜负画面）当成编辑器组件来做。\n它们是游戏的一部分，跟着皮肤包走——编辑器改主题不该让谁的血条变色。\n这是不变量 I9 在样式层的延伸。\n\n---\n\n## 2. 令牌是唯一来源\n\n**所有颜色、间距、字号、圆角、动效时长，只能来自 CSS 自定义属性。**\n\n现有令牌（继承自 GameHub，语义命名，**保持不变**）：\n\n| 组 | 令牌 |\n|---|---|\n| 表面 | `--surface-window` `--surface-panel` `--surface-header` `--surface-well` `--surface-ctrl` `--surface-hover` `--surface-active` `--surface-popover` |\n| 线条 | `--border` `--groove` `--line-width` `--selection-width` |\n| 文字 | `--text-strong` `--text-secondary` `--text-muted` `--text-dim` |\n| 强调 | `--accent` `--accent-hover` |\n| 间距 | `--space-1`…`--space-7`（2 / 4 / 6 / 8 / 12 / 16 / 24px） |\n| 字号 | `--font-micro` `--font-control` `--font-section` `--font-base`（10 / 11 / 12 / 13px） |\n| 圆角 | `--radius-sm` `--radius-md` `--radius-lg`（2 / 3 / 4px） |\n| 控件 | `--strip-h` `--icon-btn` `--icon-size` `--pad-x` `--indent` `--label-col` |\n| 动效 | `--transition-fast` |\n\n**命名规则：按用途命名，不按外观命名。**\n写 `--surface-panel` 不写 `--gray-24`；换主题时前者仍然成立，后者会变成谎言。\n\n### 待补的缺口（迁移时第一批要做的）\n\n现状扫描：`:root` 之外有 **30+ 处硬编码色值**，其中大多数是**状态色没有令牌**。必须补上：\n\n```\n--state-danger        危险 / 禁建 / 删除        （现被硬编码为 #c42b1c #e88a8a #6b3535）\n--state-warning       警告 / 需要注意           （现被硬编码为 #e8b87a）\n--state-success       成功 / 校验通过\n--state-info          提示\n```\n\n每个状态色需要**三档**：文字、边框、底（弱背景）。约束层的提示、AI 的变更预览、\n皮肤包完整性的缺口标记，全部要用它们——**不补齐，这三处会各自造一套颜色**。\n\n---\n\n## 3. 三条禁止\n\n| 禁止 | 为什么 |\n|---|---|\n| **组件里写死颜色值** | 漂移的头号来源。已有 30+ 处，迁移时清零 |\n| **组件里写死像素间距 / 字号** | 只能用 `--space-*` `--font-*`。需要新档位就加令牌，不要就地写 |\n| **组件私有令牌** | `--ol-*` 这类。**布局尺寸**（列宽、缩进）可以局部，**颜色与字号绝对不行** |\n\n判定标准很简单：**这个值换主题时该不该变？** 该变 → 必须是令牌。\n\n---\n\n## 4. 任何界面变体靠令牌表达，不靠第二套样式\n\n> **v17 更新**：本节原标题是「双模式靠令牌表达」，依据是 goals.md 决策 12。\n> **决策 12 已于 v17 取消**（不再有简易 / 专业双模式）。\n> **但这条约定本身没失效**——它现在的依据是**不变量 I8**：\n> 能力面是 registry 的一个视图，不是数据分叉，样式层同理。\n\n> **任何界面变体（密度档位、日后可能出现的能力面裁剪视图）\n> 只能通过令牌值与元素显隐表达，不得出现第二套组件 CSS。**\n\n密度差异由一组令牌覆盖实现：\n\n```css\n:root[data-density=\"compact\"] { --strip-h: 24px; --space-4: 6px; --font-base: 12px; }\n```\n\n**出现 `.panel--simple` 这样的类名，就是 I8 已经被破了的信号。**\n\n---\n\n## 5. 一条设计原则（唯一一条）\n\n> **编辑器要安静。唯一有颜色的东西是内容。**\n\n界面用中性灰阶，强调色只用于选中、焦点与状态；3D 视口、素材缩略图、用户自己的作品\n是画面里唯一的彩色区域。\n\n> **v17 换了理由**：原文写「理由是决策 19——目标用户是美术」，\n> 而**决策 19 已被 19′ 推翻**（目标用户改为有经验的游戏研发人员）。\n> 结论不变，新的依据是：**工具抢戏会干扰对作品本身的判断**——\n> 这对任何长时间盯着视口的人都成立，不依赖画像。Blender 与 Figma 都遵守这一条。\n\n---\n\n## 6. 图标与文案\n\n- **图标**：**Lucide 是唯一来源**，ISC 授权的浏览器包固定在 `vendor/lucide/`，\n  编辑器渲染控件时不需要联网。\n  静态插入 `<i data-lucide=\"name\" aria-hidden=\"true\"><\/i>`；\n  JS 插入用 `window.AppIcons.markup('name')` 后调 `window.AppIcons.refresh()`。\n  **先找现成的 Lucide 图标，再考虑自绘。** 纯图标按钮必须有本地化的 `title` 与 `aria-label`；\n  尺寸由外层组件决定，渲染器统一用 `currentColor`、圆角端点、`1.7` 描边。\n  动效只用来传达状态或反馈，要尊重 `prefers-reduced-motion`，且不能替代无障碍标签。\n  升级 Lucide 时，`lucide.min.js` 与 `LICENSE` 必须来自同一个官方 npm release，并记录固定版本\n- **文案**：界面直接用工程术语（goals.md §0.3），i18n 只做语言翻译。\n  **措辞模板串就是防「文案漂移」的机制**，跟令牌防「视觉漂移」是同一件事\n  （**v19**：原文写「术语层」，那套机制已随决策 12 取消；防漂移的载体现在是条件动作注册时自带的人话模板串）\n- **无障碍**：本轮只要两条低成本的——**所有控件键盘可达**、**文字对比度不低于 4.5:1**。\n  图标按钮的 `title` / `aria-label` 要求见上一条。不做完整 WCAG 审计\n- **安全**：游戏内 UI overlay 插入用户文案一律 `textContent`，**禁止 `innerHTML`**\n  （goals.md §3.6.4，最现实的一处 XSS）\n\n---\n\n## 7. 防漂移的执行机制\n\n文档也会漂移，所以要有一条能自动跑的检查（对齐 goals.md「判据必须可判定」）：\n\n> **一个扫描脚本**：在 `:root` 之外发现硬编码色值、或 `--space-*` 之外的像素间距，即报错。\n> 挂进 `tests/`，和其他离线测试一起跑。\n\n允许豁免，但豁免要写在脚本的白名单里、附一行理由——**豁免必须是显式的**。\n\n---\n\n## 8. 暂不做\n\n| 不做 | 理由 |\n|---|---|\n| 完整组件目录 / 组件库文档 | 三次法则。同一个组件形态出现第三次再抽象并写下来 |\n| 多套编辑器主题 | 先做暗色一套。令牌命名已经保证了日后加亮色不用改组件 |\n| 可视化令牌编辑器 | 用户改的是**游戏**风格（皮肤包），不是编辑器风格 |\n| 设计稿工具里的镜像系统 | 单人项目，代码即唯一来源；再维护一份 Figma 变量只会两边不一致 |\n"}, {"id": "roads", "title": "道路系统架构（存量参考）", "md": "# 道路系统架构\n\n> 交互模型对齐 Cities: Skylines 2，几何方案经调研对齐 CS1/CS2 与业界实践\n> （贝塞尔路缘圆角、miter/round join、路定高程）。数据层零 three.js 依赖，可在 node 中离线测试。\n\n## 模块与数据流\n\n```\n输入                工具层                命令层                    数据层                渲染层\nInputRouter ──► RoadTool ──────► BuildRoadCommand ──────► RoadNetwork(图)  ──► RoadView\n (指针事件)    (控制点栈+吸附)    (journal, 可撤销)          Terrain(高度图)       ├─ computeSegGeometry\n                    │                  │                        │    ▲            │   (edgeGeometry)\n                    │                  ├─ computeRoadbed ───────┘    │            ├─ computeJunction\n                    │                  ├─ computeNodeDisc ───────────┘            │   (junction)\n                    │                  └─ _replaceCovered                         └─ buildRibbon\n                    └────────────── 预览复用 buildRibbon\n信号：roadsChanged(受影响节点) / heightChanged(脏矩形) → 各视图增量重建\n```\n\n| 文件 | 职责 |\n|---|---|\n| [state/roadTypes.js](../../js/state/roadTypes.js) | 参数化 0.5U–5U 道路规格 + 主题包注册表；宽度⊥主题（见下节） |\n| [state/RoadNetwork.js](../../js/state/RoadNetwork.js) | 节点+路段无向图；三次贝塞尔（存 4 控制点）；空间哈希判重；吸附查询；de Casteljau 分裂 |\n| [state/polyline.js](../../js/state/polyline.js) | 折线弧长工具：截断（超长按比例缩，永不为 null）、按弧长走点取向 |\n| [state/junction.js](../../js/state/junction.js) | 节点几何决策（见下表）；纯数学 |\n| [state/edgeGeometry.js](../../js/state/edgeGeometry.js) | 路段左右边界：裁剪后中心线 + 逐点半宽（喇叭口）+ 端部共享横断面 |\n| [commands/commands.js](../../js/commands/commands.js) | BuildRoadCommand：分裂/建段/替换/整平全部 journal 化，undo 逐采样精确还原 |\n| [commands/roadbed.js](../../js/commands/roadbed.js) | 路定高程：纵断面平滑限坡 → 走廊压平+锁定 → 节点圆盘压平（坡地防穿模） |\n| [render/RoadView.js](../../js/render/RoadView.js) | 订阅 roadsChanged 增量重建；路段带状网格 + 节点补丁；按 roadRef/主题包共享材质 |\n| [tools/RoadTool.js](../../js/tools/RoadTool.js) | CS2 交互：四模式控制点栈、右键逐点回退、六层吸附+修饰键、工程 HUD、红色禁建 |\n| [tools/DemolishTool.js](../../js/tools/DemolishTool.js) | 拆除：悬停红色高亮 → 点击删除；走廊解锁、孤点清理、路口重算（可撤销） |\n| [tools/EditTool.js](../../js/tools/EditTool.js) | 事后编辑（Move It 式）：端点/切线手柄实时拖拽重塑，松手重贴地，一条撤销 |\n\n## 标准道路 + 主题皮肤（roadTypes.js）\n\n工作流是「先画标准宽度的路网，之后整体套年代风格」。三条分离原则：\n\n**1. 几何只认 widthUnits。** 主题永远不改变路宽、最小半径或路网拓扑。\n画路时 `RoadTool._roadRef()` 只写宽度，不写主题。\n\n**2. 主题是场景级呈现，不是路段内容。**\n\n```\nseg.roadRef = { widthUnits: 2, theme: null }   // null = 跟随场景\ngame.settings.themePackId                       // 场景主题（存档里的 roadSelection）\n生效主题 = seg.roadRef.theme ?? 场景主题\n```\n\n换主题 = `SetSceneThemeCommand`：改一个字段 + dispatch `themeChanged`，\n渲染层作废材质缓存重建。**不遍历路网、不写逐段 diff**。\n需要混搭（中世纪老城 + 现代新区）时才在路段上写 `theme` 覆盖；\n`ClearThemeOverridesCommand` 负责抹平。\n\n面板交互：点主题卡片**只移动选中光标，不动场景**；点卡片上的「替换」才套用到全场\n（`ApplyThemeCommand` = 切场景主题 + 抹平覆盖，合成一条撤销记录）。\n场景当前生效的主题在卡片上标\"使用中\"，与选中态是两个独立标记。\n\n**3. 主题声明规则，不列宽度表。**\n\n| 声明 | 含义 |\n|---|---|\n| `surface: { color: {0.5: c, 2: c, 5: c}, roughness, metalness, emissive, map, repeat }` | 材质描述符；颜色是插值站点，未声明的宽度自动插值 |\n| `decorations: [{ kind, minWidthUnits, count, ... }]` | 装饰清单；`count` 可为 `widthUnits` 的函数，求值为 0 则该装饰消失 |\n\n新增宽度档位不需要改任何主题包；新增主题只写 4 行规则。\n\n**装饰扩展点**：RoadView 顶部有 `SEG_DECORATORS` / `NODE_DECORATORS` 两张\n`kind → builder` 注册表。加一种装饰 = 注册一个函数 + 在主题里加一条，\n既有主题与 `_buildSeg` 都不用动（科幻包的 `edgeGlow` 就是这么加的）。\n几何锚点（路缘路径、斑马线锚点）由 junction.js **恒输出**，铺不铺由渲染层按主题闸门——\n数据层不认识主题词汇表。\n\n内置包：`whitebox`（素路面）/ `modern`（路缘+虚线+斑马线）/ `medieval`（仅宽路石质路缘）/ `scifi`（发光边条+金属路面）。\n\n## 节点几何决策表（junction.js）\n\n| 节点情形 | kind | 几何 |\n|---|---|---|\n| 度=1（断头） | none | 无（端头盖待路缘石阶段做） |\n| 度=2 近直（>165°）同宽 | **miter** | 共享斜接横断面：两侧路面用同两个顶点，缝隙在几何上不存在 |\n| 度=2 近直 异宽 | **transition** | 共享横断面取窄侧半宽；宽侧沿弧长平滑收窄（喇叭口，edgeGeometry） |\n| 度=2 可见折弯（≤165°） | **bend** | 路面退到内交点截断线（不重叠）；补丁 = 内共享点 + 外侧半径=半宽的圆弧端帽，与路口圆角同观感 |\n| 度≥3 | **polygon** | 各臂截断线（斜接投影+圆角缓冲）在曲线真实位置 + 相邻臂间三次贝塞尔路缘圆角；≥295° 反射楔圆弧兜底 |\n\n关键不变量：\n- **切断线两侧 bit-exact**：补丁边界点与路面裁剪端出自同一段代码（walkPolyline），不靠浮点巧合。\n- **法线/接缝**：地形法线从高度图中心差分，路面横断面水平——高度用同一次采样。\n- **雕刻与道路双向贴合**：铺路时压平路基并锁定走廊；笔刷可以雕刻一切（含路下），\n  笔画结束后受影响道路自动重新贴地（重采纵断面→限坡→压平→重锁定），与笔画同属一条撤销命令。\n  节点周边用\"限坡锥面包络\"护住路口盖板（允许路面斜穿节点爬坡，只削横向鼓包）；\n  路肩外侧同理用\"路堤边坡包络\"（EMBANK=45°）：包络内的玩家雕刻原样保留，只夹回超坡高差。\n\n## 可调参数\n\n| 参数 | 位置 | 含义 |\n|---|---|---|\n| `FILLET_K = 0.8` | junction.js | 路口圆角缓冲（× 相邻臂最大半宽），越大转角越圆 |\n| `FILLET_CTRL = 0.4` | junction.js | 圆角贝塞尔控制点系数（0.55≈正圆弧） |\n| `REFLEX_ARC = 295°` | junction.js | 反射楔圆弧兜底阈值（仅度≥3 可达） |\n| `MITER_MIN = 165°` | junction.js | miter/transition（近直无缝）与 bend（圆角弯头）的分界（对应 CS1 Max Turn Angle） |\n| `ROAD_UNIT_WIDTH = 3`（= 30 × `GRID_UNIT`） | roadTypes.js / core/units.js | 1U = 1 车道基准宽度 3 米；所有道路总宽均由单位数线性计算（0.5U=1.5m ~ 5U=15m），贴近真实道路尺度 |\n| `DEFAULT_SCENE_THEME = 'whitebox'` | roadTypes.js | 路段无覆盖、场景也没设主题时的回退 |\n| `minRadius = width × 1.6` | roadTypes.js | 各宽度规格的最小弯道半径（红色禁建） |\n| `MAX_SLOPE = 0.3` | roadbed.js | 路基纵坡上限 |\n| 覆盖替换阈值 `0.9 / 0.75` | commands.js | 旧路 ≥90% 落在（半宽和×0.75）走廊内则被替换 |\n\n## 装饰层（RoadView）\n\n所有装饰与路面共用同一套横断面帧（`computeFrames`），保证对齐：\n- **`curb`**（几何，路段+路口）：沿路段两侧边界放样（顶面+外立面），路口沿盖板边界路径（junction 输出 `curbs`，切断线处留口与路段路缘续接）\n- **`centerline`**（贴地薄面，路段）：按 `count` 条车道分界铺 dash/gap 虚线；随喇叭口半宽收缩\n- **`crosswalk`**（贴地薄面，路口）：度≥3 路口各臂截断线外侧，条纹长轴沿行车方向\n- **`edgeGlow`**（贴地薄面，路段）：两侧内缩的自发光窄带（Basic 材质，无需后处理泛光）\n- 路口内部保持素路面（CS 布局）；尺寸参数全部来自主题声明，不再是 RoadView 的模块常量\n\n## 离线测试（tests/）\n\n`node tests/run-all.mjs` 跑全部 13 个套件（数据层零 three.js 依赖）。\n覆盖：图操作与撤销、斜接重合与朝向、弯头内外弧、喇叭口、宽度⊥主题（规则式主题包/场景主题与路段覆盖/材质描述符）、v1–v5 存档迁移、重画替换、裁剪对齐、装饰层数据、G1 续接。\n\n## 已知待办\n\n- 道路纹理阶段：纵向 UV 里程跨缝对齐、盖板世界空间投影、共享横断面法线平均\n- 路缘石/人行道 profile 放样（边界曲线已就绪）；断头路圆头端盖\n- 高程系统（高架/隧道）、平行模式、网格模式\n- 编辑工具进阶：多选/框选、节点合并吸附、最小半径实时校验\n"}],SVGS=[{"id": "overview", "title": "总览图 · 系统全景 / 数据模型 / 一帧发生什么 / 用户流程 / 编辑器界面 / 能力覆盖面", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" data-h=\"1848\" viewBox=\"0 0 680 1848\" role=\"img\">\n<title>Clay 总览图 · 对应 goals.md v21<\/title>\n<desc>六张图合成一份：系统全景（决策挑战、单一变更通道、步骤事务与验证控制循环）、数据模型（工程里有什么）、一帧发生什么（玩法 tick 与渲染帧分离）、用户流程（八步与主循环）、编辑器界面分区、能力覆盖面（三道闸与八款目标游戏的灰盒判定）。<\/desc>\n<style>\nsvg{font-family:system-ui,-apple-system,\"Segoe UI\",\"Microsoft YaHei\",sans-serif;background:transparent}\n.cl-h{font-size:15px;font-weight:500;fill:#1a1a1a}\n.cl-n{font-size:11px;font-weight:500;fill:#8a8a8a;letter-spacing:.08em}\n.cl-t{font-size:13px;fill:#1a1a1a}\n.cl-tb{font-size:13px;font-weight:500;fill:#1a1a1a}\n.cl-s{font-size:10.5px;fill:#6a6a6a}\n.cl-b rect,rect.cl-b{fill:#fbfbfb;stroke:#c9c9c9;stroke-width:.5}\n.cl-blue rect,rect.cl-blue{fill:#e4edfa;stroke:#7ba3d9;stroke-width:.5}\n.cl-teal rect,rect.cl-teal{fill:#e0f0ee;stroke:#6fb3aa;stroke-width:.5}\n.cl-warn rect,rect.cl-warn{fill:#faf0e0;stroke:#d3a55f;stroke-width:.5}\n.cl-off rect,rect.cl-off{fill:#f4f4f4;stroke:#d8d8d8;stroke-width:.5;stroke-dasharray:4 3}\n.cl-a{stroke:#8a8a8a;stroke-width:1.4;fill:none}\n.cl-d{
