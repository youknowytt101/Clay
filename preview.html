据源比破例更干净** | |\n| **35** | **门槛的承担者** | **门槛由内置 AI + 内置教程承担**，不靠削能力、不靠做浅底层、不靠裁剪界面。**画像因此不再是设计约束**——不要用「用户是谁」去反推该做什么 | 用画像反推能力边界（原决 2、12、18 的推导方式）；也不做「因为专业所以不管上手」的反向偷懒 |\n| **36** | **动画栈档位** | **做到档 2：状态机 + 混合 + root motion**。八款里四款是第三人称动作（塞尔达 / 艾尔登 / 刺客信条 / TPS） | 停在 crossfade（档 1 做不出艾尔登的位移与硬直）；也**不做档 3**（IK / 动作匹配 / 上下半身分层）——那对另外四款 RTS/MOBA 零贡献，且是无底洞 |\n| **37** | **运行期动态集合** | **可增删的有序集合与键值表进内核**（§4.7 第五个概念）：背包、容器、生产队列、卡组、队伍。**可声明持久化** | 用全局变量堆出背包——Dota 物品栏、艾尔登背包、RTS 生产队列三处同时需要，且格式一旦进存档就撞 I11 |\n| **38** | **寻路与视野提回内核** | **群体寻路 + 局部避让**、**视野与战争迷雾**从模块**提回内核** | 维持「寻路进塔防模块、迷雾进 RTS 模块」——那是旧模板集下的判定，新判据源下五款以上要它们 |\n| **39** | **范围纪律的判据源** | 判据从「**至少两个模板**都需要」改为「**至少两款目标游戏需要，且分属不同簇**」（俯视指令簇 / 第三人称动作簇） | 继续用模板数量做判据——本轮只有两个模板，「两个都要」等于「全都要」，**纪律会静默失效** |\n| **40** | **AI 自主组装** | **分三档**（§5.4）：档 1 多步变更集 + 自己试玩（**本轮做**）；档 2 **受监督的自主循环**（留口）；档 3 **AI 造零件**（留口）。**封顶对象是形态不是规模**——产出必须始终是 Action 序列 | 把「一句话生成整个游戏」当成方向性封顶——那封的是**规模**。真正该封的是**黑盒形态**：产出不可寻址、不可手改、改一处要重来 |\n| ↳ | | **v20 修订**：档 2 从「留口」改为**本轮做**，并升级为**验证驱动的控制循环**：结构化 `PlanContract` 经人工批准后，按步骤在 Action 候选事务中执行；结构 / 行为 / 体验三层验证产生 `EvidenceLedger`，hard oracle 全部通过才提交 checkpoint；失败进入有预算、不可削弱测试的修复环。planner / executor / verifier 是隔离的权限与上下文，不要求多模型或多 agent。见 [ADR-003](adr-003-verified-agent-loop.md) | 只复制竞品的 Plan-Build-Test：让自然语言计划成为真源、让同一模型自写自验、让截图或自评决定通过。那会得到一个会循环但不可证明正确的代理，与 I1 / I2 / I7 的现有优势相冲突 |\n| **41** | **第八款目标游戏具名** | 泛化的「第三人称射击」换成具名的**《战争机器》**（掩体射击）。**八款目标游戏全部具名**，决策 39 的判据源因此可判定 | 让一个泛化玩法类型参与判据——不同 TPS 对动画、网络、AI、掩体、移动的要求差异极大，「TPS 需要吗」这个问题**没有唯一答案**，范围纪律会失效 |\n| **42** | **决策发现与证据演化** | 每个非平凡任务先过 `TaskContract` + 十二面 `DecisionCoverage` + 负空间扫描；未知项按不可逆性 × 不确定性 × 影响面路由，必要时发 `DecisionChallenge`。当前方案和治理机制都是可被证据取代的 champion，但 AI 不得静默修改意图、不变量、hard oracle、权限或历史。见 [ADR-004](adr-004-evidence-governed-evolution.md) | 让项目所有者充当最终技术 oracle；或让 AI 以“自我进化”为由自行改目标、验收与规则。前者抓不住未知的未知，后者会把漂移合法化 |\n\n---\n\n## 三 · 范围\n\n### 3.1 目标水位与成功判据（决策 25）\n\n> **一个通用内核 + 若干领域模块 + 事件表逻辑层 + AI 作者接口 + 分享 remix 闭环，\n> 合起来让一个人不写代码就能做出一款完整作品，并且做完有人玩。**\n\n**目标水位 = 完整作品，不是 AAA。**\n\n| | 要达到 | 明确不对标 |\n|---|---|---|\n| 参照 | **内容规模**上是《星露谷》《空洞骑士》这一档：一个人能做完、有头有尾、能上架 | 塞尔达 / CS / Dota 的**成品**——那是 300 人 × 5 年，或竞技网络与运营，不是编辑器功能问题 |\n\n> **v17 提醒**：上面三款参照全是 2D，它们参照的是**内容规模**，不是技术形态。\n> 「一个人能做完」这个水位是从 2D 案例借来的，**3D 的实际成本还没被参照过**——\n> 这一点写在这里备查，见 [A.11](#a11-决策-4只做-3d-的依据补于-v16) 记下的代价。\n>\n> **注意区分**：本节说的「不对标塞尔达」指的是**成品**。\n> 而 [A.9](#a9-主流玩法压力测试) 判定塞尔达的**核心玩法循环**可做——那是两种不同的判定，\n> 且八款目标游戏用的是后者。\n\n#### 唯一的总判据\n\n> **一个人用这个编辑器，做出一款能发到 itch.io 上的完整作品：**\n> 标题画面 → **至少 3 个关卡** → **能存进度** → **有技能或道具系统** → 有胜负结算 →\n> 有音画 → **30 分钟以上内容**。\n>\n> **v17 三处修订**：删掉「不写一行代码」（目标用户会写代码，且专业模式本来就允许用 JS 实现条件动作——\n> 真正要守的是**逻辑必须是数据**，那由闸门 F 的「没有一行专门为它写的硬编码 JS」管着，见 §6）；\n> 删掉「手机能玩」（移动端出局）；**验收人 = 项目所有者**（决策 25 的 v17 修订）。\n\n这条替代了原来的「能改出一个和模板明显不同的关卡」——那是**验证判据**，不是产品判据。\n\n#### 分项判据\n\n| 判据 | 要达到 | 明确**不**追求 |\n|---|---|---|\n| 世界会自己运转 | 单位、波次、经济、技能、状态能跑通 | 大世界模拟 |\n| **游戏有长度** | **多关卡 + 存进度 + 流程**（§4.7） | 云存档、多存档槽管理 |\n| **玩法有深度** | **技能 / 道具 / buff 靠可复用行为单元表达**（§4.7） | 图灵完备脚本 |\n| AI 真的好用 | 一句话生成 / 修改关卡与逻辑，可预览可撤销 | 一句话生成整个游戏 |\n| **上手成本可控**（v17 换掉「普通人能上手」） | **每个概念都有教程条目或配方**；一个懂引擎但没用过本编辑器的人，能靠内置教程 + AI 走通主循环 | 零基础可用；也不追求「不看任何东西就会」 |\n| 玩法与美术可分开迭代 | 换一套皮肤，一行规则不改，断言结果一致 | 皮肤市场、节点式材质编辑器 |\n| 作品拿得出手 | 有声音、**动画有状态机与 root motion**、有特效 | 3A 视觉、影视级效果、IK 与动作匹配 |\n| ~~做完有人玩~~ | **v17 推后**：本轮的等价物是「导出的工程文件能在另一台机器打开并继续改」 | 社区、账号、排行、货币化 |\n\n### 3.2 范围纪律（判据源于 v17 更换 —— 决策 39）\n\n> **任何功能进内核之前必须回答：至少两款目标游戏需要，且分属不同簇吗？\n> 只有一款、或都在同一簇 → 进模块。都不需要 → 不做。**\n\n**为什么换判据源**：原判据是「至少两个模板都需要」。而 v17 之后**只剩两个模板**，\n「两个都要」就等于「全都要」——**纪律会静默失效**，且失效时没有任何信号。\n\n新的判据源是**八款目标游戏 + 两个簇**：\n\n| 簇 | 游戏 |\n|---|---|\n| **俯视指令簇** | 红警、星际争霸、魔兽争霸、Dota 2 |\n| **第三人称动作簇** | 塞尔达、艾尔登法环、刺客信条、第三人称射击 |\n\n**「分属不同簇」这半句是关键**：四款 RTS 共同需要的东西（比如生产队列的具体形态）\n只证明了 RTS 需要它，不证明它该进内核。**跨簇才算通用。**\n\n内核每多一个领域概念，模块的可替换性就低一分。**膨胀的内核不是「做得多」，是做错了。**\n\n这条纪律是**双向**的：v4 把物理请回内核、把寻路砍进塔防模块；\n**v17 又按新判据把寻路与视野请回了内核**（决策 38）——判定随事实改判，两次都是。见 [§5.2](#52-内核归属论证)。\n\n### 3.3 成品感下限（决策 23）\n\n> **引擎必须保证：用户不写一行代码，也能做出「看起来、听起来像成品」的东西。**\n\n理由不是审美洁癖，是两条已定决策的直接推论：\n\n**v17 换了理由，结论不变**（分发链推后后，原来两条依据都失效了）：\n\n- **八款目标游戏里四款是第三人称动作**。动画过渡、判定盒特效、打击音效**不是修饰，是玩法反馈的一部分**——艾尔登的硬直、塞尔达的元素反应，缺了视听就无从判断游戏在发生什么\n- **决策 25 的水位没变**：一款能上架的完整作品，视听下限是它的一部分\n\n原来的两条依据（作品要发给别人玩、用户有美术底子）随决策 14 推后与画像更换一并失效，**但它们支撑的结论被新依据接住了**。\n\n因此原来那张扁平的「不做」清单被拆成两张：**范围可以砍，质量下限不能砍。**\n\n### 3.4 能力与边界\n\n每一项只有三种状态，**读表时先看第三列**：\n\n| 状态 | 含义 |\n|---|---|\n| **本轮做** | 现在实现，括号内是封顶 |\n| **留口** | 本轮不做，但架构不堵死——后加不用重写、不破 I11 |\n| **封顶** | 引擎永远不提供。要做就得先推翻对应决策 |\n\n> **决策 26：防膨胀靠「架构留口 + 分批实现」，不靠砍能力。**\n> 砍能力是把上限永久钉死，推后实现只是排期。**v11 之前这两件事被混为一谈。**\n\n#### 视听与呈现\n\n| 能力 | 本轮做到 | 状态 |\n|---|---|---|\n| 音频 | 音效 / 背景音乐、音量、循环、停止，都是事件表动作 | 本轮做。空间音频与混音 **留口**；自研音频引擎 **封顶** |\n| 动画 | glTF clip + 交叉淡化 + **状态机 + 混合 + root motion**（决策 36 档 2）+ 事件表与皮肤包驱动状态切换 + **动画事件**（clip 时间点） | 本轮做。**IK / 动作匹配 / 上下半身分层（档 3）封顶**——对四款 RTS/MOBA 零贡献，且是无底洞 |\n| 材质与光照 | 参数面板 + 环境与光照预设 | 本轮做。更多预设 **留口**；节点式材质编辑器、烘焙管线 **封顶** |\n| 后处理 | 预设档位（关 / 柔和 / 强烈） | 本轮做。自定义链 **留口** |\n| 特效 | 预制粒子（命中 / 爆炸 / 拾取 / 尘土 / 拖尾），事件表可触发 | 本轮做。粒子编辑器 **留口** |\n| 皮肤包 | 编辑器内创建与编辑：映射表 UI、另存为自己的皮肤 | 本轮做。皮肤市场 **留口**（属生态层） |\n| 相机 | 四档（受限俯视 / 跟随 / 第一人称 / 自由飞行）+ **肩后跟随**（第三人称动作簇要）+ 平滑 + 震动 + **锁定目标** | 本轮做。**v17：默认档不再是受限俯视**（决策 16 的「受限默认」是为零基础用户设的）。轨道与过场编辑器 **留口** |\n| 游戏内 UI | DOM overlay + 实体锚点 + HUD 预制件 + 界面页（标题 / 暂停 / 背包 / 对话 / 结算） | 本轮做。更多控件 **留口**；引擎内 3D UI 控件系统 **封顶** |\n\n#### 逻辑 · 内容 · 生态\n\n| 能力 | 本轮做到 | 状态 |\n|---|---|---|\n| 事件表 | 条件 / 动作 / 分组 / 变量 / 等待 / 重复 + 多层子事件 + 参数位算术 | 本轮做。更强表达式 **留口**；**任意控制流与递归 封顶** |\n| 行为单元 | 带参数、有 schema 的可复用规则组；**配方 = 它的预设**（§4.3） | 本轮做（决策 25） |\n| **数据表** | 具名表 + 有 schema 的列 + 按行 id 取值；事件表与行为单元可引用（§4.7） | 本轮做数据模型 + 最小实现（决策 32）。公式列、外部表格同步 **留口** |\n| **运行期动态集合** | 可增删的有序集合 + 键值表；增删查改四个动作；可声明持久化（§4.7、决策 37） | 本轮做。排序 / 过滤 / 嵌套查询 **留口** |\n| 内容包 | 模板 / 皮肤 / 配方 / 素材 / 模块统一为内容包（§3.5） | 本轮做数据模型 |\n| 资产 / 插件 / 皮肤 / 配方市场 | — | **留口**（决策 27）。留口条件 = 内容包 |\n| 社区层：评论 / 评分 / 排行 / 关注 / 推荐流 | — | **留口**。快照已有内容哈希与作者字段 |\n| 货币化 / 交易 / 分成 | — | **留口**。账号本轮就做，交易层日后叠加 |\n| AI 模型接入 | 供应商适配层 + 能力降级 + 设置界面（决策 21） | 本轮做。模型路由 / RAG / 微调 **留口** |\n\n#### 世界 · 运行 · 平台\n\n| 能力 | 本轮做到 | 状态 |\n|---|---|---|\n| 场景与流程 | 多场景 + 关卡切换 + 流程数据（§4.7） | 本轮做 |\n| 运行期状态 | 存进度 / 读进度，事件表动作（§4.7） | 本轮做。云存档、多存档槽管理界面 **留口** |\n| 物理 | 刚体 + 碰撞 + 空间查询 + **固定与铰链关节**（决策 33） | 本轮做。**其余关节 / 马达 / 布娃娃 / 软体 留口** |\n| 世界规模 | 同屏**完整模拟**实体 ≤ **1000**（v17 上调）；**场景总量不设上限**，按块加载卸载（决策 30） | 本轮做。**模拟细节分级** / LOD / impostor / 地形简化 **留口** |\n| **寻路** | **群体寻路 + 局部避让**（决策 38，v17 从塔防模块提回） | 本轮做。分层寻路、动态障碍重规划 **留口** |\n| **视野与战争迷雾** | 视野计算 + 迷雾状态 + 按阵营查询（决策 38，v17 从 RTS 模块提回） | 本轮做。视野遮挡的精细化（高度差、掩体）**留口** |\n| 确定性 | 逐帧严格确定性，**硬要求**（决策 29） | 本轮做，不允许降级 |\n| 联机 | — | **留口，但方向已定**：**lockstep 指令同步**，服务八款里的五款。**服务器权威 / 客户端预测 封顶**（竞技 FPS 那条岔路已明确避开，[A.9](#a9-主流玩法压力测试)） |\n| 移动端 | — | **v17 出局，留口**。触屏输入、自适应画布、竖屏适配全部推后；输入意图映射（I12）保证日后加设备不用改作品 |\n| **网格世界 / 可破坏建造** | — | **留口**。RTS 的建筑是实体不是网格，摧毁 = 销毁实体，本轮够用 |\n| **体素 / 瓦片世界**（v17 补） | — | **留口**。八款目标游戏无人需要，但它是**唯一一类既没被封顶、也没被留口覆盖的主流玩法**（我的世界 / 泰拉瑞亚 / 僵尸毁灭工程），不写下来就会变成隐性缺口。**留口条件见下** |\n| **载具物理 / 样条路网** | — | **留口**。八款里无人需要；道路存量回到「可选迁移」 |\n| 导出独立包 / 端游手游打包 | — | **留口**。条件 = 决策 24 的 P1–P3（§3.6.5） |\n| 云工程（服务端存编辑中的工程） | — | **留口**。工程存档本来就自包含 |\n| 协同编辑 / 多 agent 合并 | — | **留口**。Action 的 `affects` 影响域已保留，但不为合并做设计 |\n| Action 日志的事件溯源存储 | 内存栈 + 存档时落盘 | **留口**。语义模型不变，换存储实现即可 |\n\n#### 体素 / 瓦片世界的留口条件（v17 补）\n\n**留口不是「以后大概能加」，是「加的时候不用重写、不破 I11」。** 这一项要守住三条：\n\n| # | 条件 | 为什么 |\n|---|---|---|\n| **V1** | **块（决策 30）的边界与实体无关**——块是空间分区，不是「一组实体」。日后体素数据按块存取，与实体按块存取走同一套序列化 | 若块被实现成「实体集合」，体素数据无处安放，要重做分块与流式两套机制 |\n| **V2** | **kind 注册表不假设「一个 kind 一个实体」**——允许一个 kind 描述一类**格子内容**（材质、通行性、耐久） | 体素世界里「石头」不是实体，是几百万个格子的一种取值。kind 若与实体一对一绑死，皮肤包机制无法覆盖体素 |\n| **V3** | **空间查询接口不假设查询对象是刚体**——射线与范围查询留一层抽象，体素地形是它的另一种实现 | 否则事件表里所有「碰到 / 在范围内」的条件都要为体素再写一遍 |\n\n**满足这三条即可**。本轮**不做**：体素存储、贪心网格化、光照传播、地形生成、破坏与放置的编辑工具。\n\n**为什么留口而不封顶**：封顶的含义是「要做就得先推翻决策」，\n而这一项没有任何决策否定过它——它只是**没被任何一款目标游戏需要**。\n排期问题不该写成方向问题（决策 26）。\n\n#### 方向性封顶\n\n这些不是排期问题。要做就得先推翻对应决策。\n\n| 封顶 | 依据 |\n|---|---|\n| 2D 一等公民（Sprite 管线） | 决策 4。2D 用正交相机应付，图标用 billboard |\n| 让写 JS 成为编排逻辑的主路径 | 决策 6。**v17 澄清**：目标用户会写代码，JS 实现条件与动作是**正常路径**不是高级门；但**编排必须是数据**——那是 I1 与 I3 的前提，不是能力问题 |\n| 图灵完备的事件表：任意控制流、递归 | 决策 18 + I2。**v17 换理由**：原理由是「保住普通人读得懂」，现在是**保住可校验、可逐行 diff、可局部重试**——AI 通道的三个前提 |\n| **动画档 3**：IK / 动作匹配 / 上下半身分层 | 决策 36。对四款 RTS/MOBA 零贡献，且是无底洞。**代价写明：刺客信条只到「潜入 + 战斗 + 沿预设点攀爬」，没有丝滑跑酷** |\n| **竞技 FPS 路线**：服务器权威 + 客户端预测 + 延迟补偿 + 反作弊 | A.9。与 lockstep 亲和性相反，会让网络模型裂成两套，成本大一个数量级 |\n| 用削表达力换易懂 | 决策 18。**v17 加强**：门槛由 AI 与教程承担（决策 35），表达力的封顶**只由技术理由决定** |\n| 节点图作控制流 / 画布 / 连线 / 布线算法 | 决策 13。节点图只用于数据流 |\n| 自研物理 / 自研文生 3D / 自研音频引擎 | 集成 Rapier；文生 3D 接 provider；音频用浏览器原生能力 |\n| 风格过强的成套素材（儿童卡通风等） | **v17 换理由**：原理由是画像。现在是**决策 20** —— 内置素材要能被任意皮肤包覆盖，风格太强的素材会让「换皮」失去意义 |\n| **产出不可寻址、不可手改的黑盒结果** | I3。**v18 改写**：原文写的是「聊天框一句话生成整个游戏」——**那把规模当成了封顶对象，而该封顶的是形态**。任务多大都可以（决策 40），只要产出仍是 Action 序列、仍落成能看见能手改的规则行与物体 |\n| 用用户的 key 做用户没要求的事 | 决策 21 |\n| **界面能力面的数据分叉** | I8（决策 12 取消后仍生效）。日后要做裁剪视图，它必须是 registry 的一个视图，不能是第二套数据或第二套 UI 代码 |\n| 开场向导 / **创作路径上的注册墙** | 决策 22 + 28。**v17：全流程零账号** |\n| describe 输出自然语言 | 引擎输出结构化数据，组织语言是模型的事 |\n| 道路系统新功能 | 决策 10。冻结见 [§8](#八--存量资产处置) |\n\n**能力项都过了范围纪律**：至少两个模板都要（见 [§5.2](#52-内核归属论证)）。只有一个模板要的，进模块。\n\n### 3.5 内容包（决策 27）\n\n模板、皮肤、配方、素材、模块**最终都要能被别人拿去用**。本轮不做交易与上架，\n但**从现在起它们必须是同一种东西**：\n\n```\n内容包 = { 稳定 id, 语义化版本, 作者, 许可, 依赖(包 id + 版本), 内容哈希, 载荷 }\n```\n\n- 模板 / 皮肤包 / 配方 / 素材集 / 领域模块，**都是内容包的一种形态**，不是五套机制\n- 作品记录**它依赖了哪些包与版本**；remix 时按此解析\n- 包的 id 与版本遵守 **I11**：只增不改，否则市场上线后所有引用同时失效\n- 本轮**不做**：上架、支付、审核、分成\n\n**账号的边界**（决策 22 + 28）：**创作路径永远不需要账号**——打开、试玩、改、换皮、用 AI，\n七步全程不问；**账号只出现在第 8 步「发布」**。理由是作品归属：匿名发布的作品，\n日后做市场时认领不回来。\n\n\n### 3.6 工程底线\n\n四条与功能无关、但**漏了就要返工**的约束。它们不是「做不做」的选择题，是**边界条件**。\n\n#### 3.6.1 性能预算\n\n**v17 起这几个数字服务的是闸门 C.3（1000 单位不掉帧）与闸门 F**，不再是「手机上打开就能玩」。\n没有数字，判据不可判定。**超了就砍功能，不放宽数字。**\n\n| 指标 | 上限 |\n|---|---|\n| 播放期首包（不含用户素材） | **≤ 8 MB** gzip（v17 放宽：移动端出局，4G 冷启动不再是约束） |\n| 桌面冷启动到可玩 | **≤ 5 秒** |\n| 目标帧率 | 桌面 **60fps**（v17：手机 30fps 一档移除） |\n| 同屏**完整模拟**实体 | **1000** 不掉帧（场景总量不设上限，按块加载——决策 30） |\n| 单块加载耗时 | **≤ 1 帧预算**，不得造成可见卡顿 |\n\n**v17 的改动与它的代价**：移动端出局后这几个数字全部松了，\n但 **P1「播放期与编辑器分包」不能跟着松**——它现在的理由从「3MB 首包」换成\n**决策 24 的移植退路**（§3.6.5）。**这是全表唯一一处不允许放宽的**：\n首包大小可以谈，分包不能谈，否则日后套壳要把整个编辑器打进去。\n\n**这条会倒推架构**：3 MB 的播放期首包，意味着**播放期与编辑器必须分包**——\n渲染桥 + 事件表运行时不得依赖任何编辑器 UI（这一条 §3.5 的分享专条已经要求过，\n这里给了它一个可测量的理由）。\n\n#### 3.6.2 发布即产生外部契约（不变量 I11）\n\n**一旦有人发布了链接，引擎的数据格式就有了外部使用者。**\n\n- **标识符只增不改**：`kind` / 条件动作 / 配方 / 皮肤插槽 / 内容包的 id **发布后即冻结**；\n  要改就新增一个，旧的标 deprecated 并保留迁移\n- **可判定的判据**：半年前发布的链接，今天必须还能打开；迁移链每加一版，回归测试补一条\n\n代价很具体：第一次重构条件动作命名，**所有已发布作品同时变砖**。\n三种存档各自的版本与权威见 [§4.5](#45-两级状态--播放沙箱)。\n\n#### 3.6.3 本地数据是脆弱的\n\n决策 14 说「工程的权威副本始终在用户本地」。网页端的「本地」是 IndexedDB——\n**用户清一次浏览器缓存，作品全部消失，而他只会怪你。**\n\n| 必须有 | 说明 |\n|---|---|\n| **自动保存** | 不做 Ctrl+S 文化。**IndexedDB 没有「文件在磁盘上」这个心智模型**，忘存的代价是全丢，和用户是谁无关 |\n| **导出工程文件** | 一个自包含的工程文件，用户能自己收着、能发给别人 |\n| **明确告知** | 第一次保存时说清作品存在哪、清缓存会怎样 |\n\n桌面外壳没有这个问题，网页版有——**而网页是主形态**。\n\n#### 3.6.4 用户内容的安全面\n\nremix 意味着**在自己的域下执行别人的数据**。事件表不图灵完备降低了逻辑风险，但没解决这三条：\n\n| 面 | 对策 |\n|---|---|\n| **游戏内 UI 是 DOM overlay，而用户会往里写文案** | 一律 `textContent`，**禁止 `innerHTML`**。这是最现实的一处 XSS |\n| 导入与快照解析（glTF、贴图、快照本身） | 体积与资源数上限；解析失败要**优雅失败**，不能崩掉整个编辑器 |\n| 快照体积炸弹 | 上限见 §9，超限直接拒绝发布 |\n\n**这一条必须在做分享之前落地**，不是分享做完再补。\n\n#### 3.6.5 移植退路（决策 24）\n\n**本轮不做导出**（§3.5 未变）。但「日后能不能低成本变成端游 / 手游」取决于现在的三个约束，\n**漏了就要改用户已经做好的作品**——那是最贵的一种返工。\n\n先说清楚这条路的实际成本，免得日后高估或低估：\n\n| 目标 | 技术成本 | 真正的成本 |\n|---|---|---|\n| **PC 端游** | 几乎为零：播放期 + 快照塞进 Tauri / Electron 壳 | 代码签名与公证、安装包体积、自动更新 |\n| **手游 · 加到主屏（PWA）** | 零 | 上不了商店，无内购 |\n| **手游 · 套壳上架** | 低，几天量级 | **性能与合规**：中低端安卓 WebView 上的 3D + WASM；iOS 的 WebGPU 进度与音频手势限制；商店对 UGC 的额外审核 |\n| 原生重写 | 高 | 只在前三条都不够时才考虑 |\n\n**保住它的三条约束：**\n\n| # | 约束 | 漏了会怎样 |\n|---|---|---|\n| **P1** | **播放期与编辑器分包**（§3.6.1 已因性能预算成为硬要求） | 套壳时要把整个编辑器打进去 |\n| **P2** | **输入意图映射**（I12）：事件表写「当**跳跃**被按下」，不写「当**空格**被按下」。设备绑定是一张**可换的映射表**——和皮肤包同一个模式（决策 20） | 移植到手柄 / 触屏时，**用户要回去改自己的规则** |\n| **P3** | **宿主能力抽象**：全屏、指针锁定、URL、存储、文件读写各留一层薄接口，浏览器是其中一种实现 | 运行时和浏览器焊死，套壳时到处改 |\n\n**「回炉重造」能到什么程度**——取决于改的是实现还是语义：\n\n- 改**实现**（换 ECS 库 / 换渲染器 / 换物理 / 换宿主平台）→ 作品留得下来。\n  因为作品是**数据**（事件表 + 组件表 + 皮肤映射 + 输入绑定），换的是解释器\n- 改**事件表的求值语义**（求值模型、规则行之间实体集的传递规则）→ **迁移链救不了**：\n  作品还能打开，但跑出来的行为变了\n\n> **所以真正需要冻结的不是渲染层，是事件表的求值语义。**\n> 它现在还在 §9 未决项里；**阶段二一旦定下，即按 I11 的标准冻结**，与标识符稳定性同级。\n> 这是全项目唯一一处「定错了没有退路」的地方。\n\n### 3.7 硬事实登记表（v21）\n\n> **这一节是 `check-docs.py` 的解析目标，格式勿改。**\n> 下游文档（architecture-outline / roadmap / README）出现同名键时，值必须与此处一致。\n>\n> **它不是第二个真源**——它就在 goals.md 里，是把散落在正文各处的硬数字**集中登记一次**，\n> 好让机器能查。正文仍然是这些数字的解释所在。\n\n| 键 | 值 |\n|---|---|\n| 当前版本 | v21 |\n| 目标游戏数 | 8 |\n| 目标游戏簇数 | 2 |\n| 同屏完整模拟实体 | 1000 |\n| 桌面目标帧率 | 60fps |\n| 桌面冷启动到可玩 | 5 秒 |\n| 内核例外额度 | 3 |\n| 决策条数 | 42 |\n| 不变量条数 | 12 |\n| 风险条数 | 18 |\n\n**播放期首包上限暂不登记**——见 [§9 未决项](#九--未决项)：\n当前的 8 MB 相对引擎运行时（量级约 1.3 MB gzip）有约六倍余量，\n**已不构成约束**，而 §3.6.1 写着「超了就砍功能」。这条要重估后再登记。\n\n\n---\n\n## 四 · 架构\n\n> **一图版**：[overview.svg](../diagrams/overview.svg) 第 1 图 · 系统全景（另见第 2 图数据模型、第 3 图一帧发生什么）\n\n> **贯穿全篇的一个模式：可替换的东西都是一张映射表。**\n> `kind -> 视觉`（皮肤包）、`动画语义状态 -> clip`、`输入意图 -> 设备`、`包 id + 版本 -> 内容`——\n> 四处用的是同一招：**把易变的东西挪出玩法层，用一张能整体替换的表隔开**。\n> 后面各处只引用这个模式，不再重复解释。\n\n### 4.1 分层\n\n```\n                   ┌──────────────────────────────────┐\n   模板库  ───────►│  编辑器 UI（简易 / 专业双模式）   │◄────── AI 作者接口\n                   └────────────────┬─────────────────┘\n                                    ▼\n                   ┌──────────────────────────────────┐\n                   │  Action 层（唯一编辑期变更入口）  │\n                   └────────────────┬─────────────────┘\n                                    ▼\n                   ┌──────────────────────────────────┐\n                   │  ECS 封装层（自写）               │\n                   │  defineComponent / query / schema │\n                   └────────────────┬─────────────────┘\n                                    ▼\n                   ┌──────────────────────────────────┐\n                   │  第三方 ECS 库（koota，可替换）   │\n                   └──────┬───────────┬───────────┬───┘\n                          ▼           ▼           ▼\n                ┌──────────────┐ ┌─────────┐ ┌────────────────┐\n                │ 事件表运行时 │ │ 系统(JS)│ │ 渲染桥          │\n                │ 播放期逐行   │ │ 播放期  │ │ 组件+皮肤→three │\n                └──────────────┘ └─────────┘ └────────────────┘\n                          ▲\n                ┌─────────┴──────────┐\n                │ 领域模块            │  RTS/MOBA · 第三人称动作\n                │ = 组件 + 系统 +     │  各自注册组件、Action、\n                │   条件动作 + kinds  │  条件动作、约束、面板、\n                │   + 约束 + 皮肤 +   │  皮肤包、模板\n                │   模板              │\n                └─────────────────────┘\n```\n\n**封装层是硬约束**（见 [adr-001-ecs.md](adr-001-ecs.md) §4.1）：模块与系统代码**一律不得直接 import 第三方 ECS 库**。它承担三件事——组件 schema（库不提供）、模块契约的执行点、把库选型从地基决策降级为可替换模块。\n\n### 4.2 Action 层：唯一变更通道\n\n编辑期世界状态只能通过 Action 改变。鼠标、AI、事件表编辑、读档全部收敛到同一入口。\n\n```\n场景 = 初始状态 + Action 序列\n```\n\n这是**语义模型**（用于 diff、回放、审计），不是存储实现。\n\n**现状**：[History](../../js/core/History.js) + 17 个 Command 已是这根支柱的九成，差的是「唯一入口」的强制。\n\n**v20 增加步骤事务语义**（[ADR-003](adr-003-verified-agent-loop.md)）：复杂任务的每个计划步骤绑定\n`baseRevision`，先在候选分支 `preview`，通过已批准的 hard oracle 后才 `commit` 并形成 checkpoint；\n失败或取消 `abort`，不得把半批 Action 留在主工程。`idempotencyKey` 防重复执行，实际 `affects`\n超出计划作用域立即停止。Action 层仍是唯一状态真源，计划与证据不是第二套世界状态。\n\n### 4.3 逻辑是数据：事件表 + 配方\n\n```\n当  敌人 进入 塔的范围\n    塔 冷却完毕\n就  塔 朝 敌人 开火\n    等待 0.5 秒\n```\n\n一条规则 = 若干**条件行** + 若干**动作行**，可分组、**可嵌套子事件**。没有画布、连线、坐标。\n\n**表达力档位**（决策 18，v8 放宽）：条件 / 动作 / 分组 / 全局与对象变量 / 等待 / 重复 N 次\n/ **多层子事件** / 参数位的**简单算术与比较**（伤害公式这类东西没有它写不出来）。\n\n#### 配方 = 行为单元的预设（v15 合并）\n\nv11 加了「行为单元」之后，配方与它的约束几乎重复（R1 与 B1 说的是同一件事）。\n**现在只有一种机制**：\n\n> **配方 = 一个行为单元 + 一组默认参数 + 一句人话说明。**\n\n于是学习路径是连续的，四步走的是同一样东西：\n\n```\n用配方  ->  改它的参数  ->  展开看里面的规则行  ->  自己定义一个行为单元\n```\n\n三条硬性质（原 R1-R4 与 B1-B3 合并后的结果，见 §4.7）：\n\n| # | 性质 | 为什么 |\n|---|---|---|\n| **R1** | 展开后是**普通规则行**，不是黑盒 | 破了就违反 I3 与 M3 |\n| **R2** | **可以只改一半**，改完还是好的 | 「一边学一边改」的字面要求；展开成内联规则后天然成立 |\n| **R3** | 带一句人话说明 | 学习发生在阅读那一刻，不在文档里 |\n\n**AI 也走同一条路**：优先挑配方、填参数，只有配方都不合适才逐行拼（原 R4）。\n\n**JS 没有消失，它下沉了**：用 JS **实现新的条件与动作**是正常路径（v17：目标用户会写代码，这不再是「高级门」）。\n但**条件动作的实现是代码，它们的编排是数据——两者不混**。\n\n> **这条边界是 I1 与 I3 的前提，不是能力问题。** 编排一旦变成代码，\n> AI 就无法走 Action 层、无法逐行 diff、无法局部重试、无法被单独撤销。\n> **判断一段 JS 该不该存在的判据**：它能不能被另一个模板复用（闸门 F 用的也是这一条）。\n> 实现受**确定性沙箱**约束（§7.1 J1–J3）。\n\n### 4.4 呈现与玩法分离：皮肤包（决策 20）\n\n> **玩法量属于逻辑，呈现量属于皮肤包，皮肤包不得改变玩法量。**\n\n```\n实体   = { kind: \"enemy.walker\", 位置, 玩法组件… }\n皮肤包 = kind → { 模型, 材质, 缩放, 动画状态映射, 图标 }\n```\n\n| 机制 | 内容 |\n|---|---|\n| 间接层 | 实体持有语义种类，不持有模型。渲染桥在皮肤包上解析。**换风格 = 换一张表** |\n| 玩法量归逻辑 | **碰撞体与占地由 kind 定义**；模型按插槽适配到该尺寸，视觉可溢出但**不参与碰撞** |\n| 语义名（I9） | 写 `播放「跑」` 不写 clip 名；写 `生成 敌人.走路兵` 不写模型路径。缺失回退到「站立」+ warning，不崩 |\n| 契约 + 约束 | 契约声明 `kinds` / `skins`；约束「皮肤包完整性」检查当前皮肤是否覆盖用到的每个 kind 与动画状态 |\n\n#### root motion 撞上了这一节的两条规则（v17 新增）\n\n决策 36 把 root motion 放进本轮，而它**同时撞上两条已有的硬规则**。两条都有解，但必须写死：\n\n| 冲突 | 解法 |\n|---|---|\n| **① root motion 违反「视听层只读」**——它的字面意思就是动画驱动位移，即渲染层写玩法状态 | **导入时把 root 曲线烘焙成位移曲线，作为玩法数据。** 运行期玩法层读烘焙结果（确定性、可序列化、可断言），渲染层仍然只读。不这么做，闸门 A 的逐字节断言会随机失败 |\n| **② 位移曲线若归皮肤包，换皮就改变玩法**——不同皮肤的攻击动画前冲距离不同，闸门 C.5 当场破功（违反 I9） | **位移曲线归 kind，不归皮肤包。** 这完全套用本节已有的模式：「碰撞体与占地由 kind 定义，模型按插槽适配到该尺寸」——现在多一句：**kind 声明每个动画状态的位移曲线，皮肤包提供的 clip 必须适配到这条曲线，而不是反过来** |\n\n**一句话**：**root motion 的位移是玩法量，动画只是它的表现。** 和碰撞体是同一个道理。\n\n**运行期的对应规则：视听层是只读消费者。**\n\n> **动画、粒子、音频、后处理不得写入任何玩法组件——单向数据流。**\n> 且所有「逐字节一致」的断言，**范围限定在玩法状态**，不含渲染与视听状态。\n>\n> **动画状态机（决策 36）也受这条管**：状态机的**当前状态是玩法数据**（事件表能读能写），\n> 而 clip 选择、混合权重、过渡时长是**呈现**，归皮肤包。换皮不得改变状态机的状态转移。\n\nI9 管的是编辑期（事件表不引用美术资源），这条管的是播放期。\n少了它，闸门 A / C.3 / C.5 的断言会随机失败，而且极难排查——\n你会以为是皮肤包设计错了，其实是断言范围没定义清楚。\n\n**判据（闸门 C.5）**：换一套皮肤包，一行规则不用改，headless 同输入下**玩法状态**逐字节一致。\n不一致 = 有美术量泄漏进玩法，**且能精确指出泄漏在哪**。\n\n### 4.5 两级状态 + 播放沙箱\n\n| | 编辑期 | 播放期 |\n|---|---|---|\n| 谁是权威 | **Action 层** | 事件表运行时 / 系统 |\n| 允许直接写状态 | 否 | 是 |\n| 撤销栈 / 变更日志 | 有 | 无 |\n| 约束校验 | 实时 | 不校验 |\n| AI 可介入 | **是** | **只可经试飞台驱动输入并读取观测，不得直接写玩法状态** |\n\n进入播放 = 打快照；退出播放 = 整体回滚。**播放期的改动不污染工程。**\n\n因为玩法是数据而不是任意 JS，播放期也能做成确定性的（固定步长 + 可注入种子 + 可脚本化输入序列），于是拿到\n**脚本化试玩 + 断言**。v20 起它不再只是「AI 自己试玩并报告」，而是 [ADR-003](adr-003-verified-agent-loop.md)\n的 V2 行为 oracle：同一输入轨迹与 seed 可重放，hard 失败不能被截图描述或模型自评覆盖。\n**v14 起，逐帧严格确定性是硬要求，不再允许降级为统计式**（决策 29）。\n依据见**决策 29 的 v17 修订行**（§2）：八款目标游戏里五款是联机游戏，且全部走 lockstep。\n\n> **v18 记录**：此处原本链接到「附录 A.10 · 决策 28 / 29 / 30 的依据」，\n> 而**那一节从未写出来**（v15 沿革声称新增了它，实际没有）。\n> 不补写——决策 29 的依据已在 v17 被换掉，A.10 即使补出来也是过期论证。\n\n#### 三种「状态固化」\n\n引擎里有三处把状态写下来，**它们是同一个模式的三种作用域**：\n\n| | 工程存档 | 发布快照 | 运行时存档（存进度） |\n|---|---|---|---|\n| 存什么 | 编辑期世界状态 + 流程 + 事件表 | 工程的只读固化 | 游戏自己声明的持久化状态 |\n| 谁定义格式 | 引擎（版本化信封 + 迁移链） | 同左 + 内容哈希 + 作者 id | **游戏自己声明存什么** |\n| 权威 | Action 层 | 发布那一刻的工程 | 事件表运行时 |\n| 带版本 | 是 | 是（**I11**：永远能打开） | 是 |\n| 上传 | 否（本地，可导出） | 是 | 否 |\n\n**v11 改判**：运行时存档原来写「不做」。那条在技术上成立、在产品上说不通——\n不提供存进度，用户只能做几分钟的小品，与决策 25 冲突。\n\n### 4.6 为什么 ECS（用户不可见的选择）\n\n不是性能理由，是**可寻址性**：\n\n- 世界状态 = 扁平数据表 → AI 能查询\n- 结构扁平同构 → schema 好写（schema 不是 ECS 白送的，由封装层实现）\n- 无层级嵌套 → diff 干净、序列化稳定、约束谓词好写\n- 系统是纯函数式表变换 → 确定性容易保证，headless 试算容易\n\n节点树在这四条上全部更差。**性能是附赠的，不是理由。**\n\n---\n\n### 4.7 完整作品需要的五个概念（决策 25、32、37）\n\n塔防和平台跳跃这两个模板**恰好都不需要**下面几样东西——所以 v11 之前的架构漏掉了它们。\n**用一局几分钟的模板去倒推架构，倒推不出完整游戏需要的东西。**\n\n它们的共同点：**现在不设计，以后加就要改数据模型或废掉已发布的作品（撞 I11）。**\n所以**数据模型现在就定，实现可以分批**（决策 26）。\n\n#### 1 · 场景与流程\n\n```\n工程 = 若干场景 + 一张流程（哪个场景先来、什么条件切到下一个）\n     + 全局状态（金钱、解锁、当前关卡…）\n```\n\n- **场景**是可独立编辑、独立试玩的单位；一个工程不再只有一个场景\n- **流程**本身是数据（不是代码），因此也走 Action 层、也能被 AI 读写\n- **界面页**（标题 / 暂停 / 背包 / 对话 / 结算）是流程里的节点，用 DOM overlay 实现\n- 切换场景时，**全局状态保留、场景内状态重置**——这条语义要写死，否则存档语义会跟着漂\n\n**场景与块的关系**（决策 30 引入「块」，这里定死两者边界）：\n\n> **场景是流程与存档的单位；块是场景内部的分区。**\n> 一个场景 = 若干块；切场景 = 卸载全部块，再加载新场景的块。\n\n这条不写死，阶段一会同时撞上「按块序列化」和「场景切换」两套语义。定死之后：\n存档按场景组织、加载按块组织，互不干涉。\n\n#### 2 · 可复用的带参行为单元\n\n> **只要游戏里有「技能 / 道具 / buff / 敌人行为」这类概念，重复就是必然的。**\n\n本轮做**带参数的可复用规则组**；**配方就是它的预设**（§4.3），不是第二套机制：\n\n```\n定义：技能「火球」(伤害, 冷却, 特效)\n使用：施放 火球(30, 2秒, 爆炸)\n```\n\n三条约束，用来守住 I2 和 I3：\n\n| # | 约束 |\n|---|---|\n| **B1** | 定义体**就是普通规则行**，能展开看、能改——不是黑盒 |\n| **B2** | **不允许递归、不允许任意控制流**（§3.4 真封顶），保住可校验与可被 AI 读懂 |\n| **B3** | 参数是**有 schema 的**，因此 AI 能填、约束层能校验、详情面板能自动生成控件 |\n\n敌人 AI 用同一套东西表达（「巡逻」「追击」「远程攻击」都是行为单元），**不另起一套行为树**。\n\n#### 3 · 运行期状态存取（存进度）\n\n§3.5 原来写着「运行时存档不做，格式由游戏自己定义」。**那条在技术上成立，在产品上说不通**——\n任何超过十分钟的游戏都要存进度，不提供就等于用户只能做几分钟的小品。\n\n本轮提供的是**两个事件表动作 + 一条规则**：\n\n```\n存进度(槽位)    读进度(槽位)\n```\n\n- 存什么由游戏自己声明：勾选要持久化的全局变量与实体状态\n- **实体 id 必须稳定**，否则读档会错位——与 I11 的标识符稳定性同源\n- 封顶：不做云存档、不做多存档槽的管理界面（§3.4）\n\n#### 4 · 数据表（决策 32，v16 新增）\n\n> **行为单元解决了「结构」的重复，没解决「数值」的重复。**\n\n§9 一直挂着「数值表达力够不够」，但那问的是**表达式**（伤害公式写不写得出来）。\n真正缺的是**结构**：单位属性表、升级曲线、装备词条、掉落权重——\n**几十上百行数值该放在哪、怎么编辑、怎么被规则引用。**\n\n现在的答案只能是「堆全局变量」，而那在三个地方立刻破功：编辑（没有表格视图）、\nAI（`describe` 出来是一堆无关联的变量名）、约束层（校验不了「每个兵种都要有攻速」）。\n\n```\n数据表「兵种」\n  行 id     血量   攻击   攻速   造价\n  步兵      100     8     1.0     50\n  坦克      600    40     0.6    300\n\n事件表里：生成 单位(兵种.坦克)   →   血量取自 兵种[坦克].血量\n```\n\n三条约束：\n\n| # | 约束 | 为什么 |\n|---|---|---|\n| **T1** | 表是**内容包的一种形态**（决策 27），带 id 与版本 | 模板与模块要能各带自己的表；remix 时按依赖解析 |\n| **T2** | 列**有 schema**，与组件 schema 同一套机制 | 详情面板自动生成、AI 能填、约束层能校验 |\n| **T3** | 行 id **只增不改**（I11） | 事件表按行 id 引用；改一次 id，所有引用它的已发布作品变砖 |\n\n**为什么现在就要定**：表的引用形式一旦进了快照，事后再改就撞 I11。\n**实现可以分批**（决策 26）——本轮只做「具名表 + 定长列 + 按行 id 取值」，\n公式列与外部表格同步留口。\n\n#### 5 · 运行期动态集合（决策 37，v17 新增）\n\n> **数据表是作者写的，静态；这一样是游戏跑起来之后自己增删的。**\n\n数据表（概念 4）解决了「数值放在哪」，但它是**内容**——行 id 只增不改、随内容包分发。\n而游戏运行时需要**可增删的集合**，现在无处安放：\n\n| 集合 | 出现在 |\n|---|---|\n| 背包 / 容器 | 塞尔达、艾尔登、TPS |\n| 物品栏与信使栏 | **Dota 2** |\n| 生产队列、编队、选中组 | 红警、星际、魔兽 |\n| 任务列表、已解锁清单 | 全部 |\n\n**三款以上、且跨两个簇都需要**（决策 39 的判据），所以进内核。\n\n现在手里的三样都不够：数据表是静态内容；全局变量是标量；事件表的选中集**每条规则用完即弃**（[adr-002](adr-002-eventsheet-eval.md) P3）。\n\n本轮做两种形态 + 四个动作：\n\n```\n有序集合：背包 = [剑, 药水, 药水]      加入 / 移除 / 取第 N 个 / 计数\n键值表：  已解锁 = {神庙A: true, ...}   设置 / 删除 / 取值 / 是否存在\n```\n\n三条约束：\n\n| # | 约束 | 为什么 |\n|---|---|---|\n| **C1** | 元素是**标量或实体引用**，不允许任意嵌套结构 | 保住可序列化、可 diff、可被约束层校验（同 B2 的理由） |\n| **C2** | **可声明持久化**，与概念 3 的存进度共用同一套声明机制 | 背包不能存 = 存档没意义 |\n| **C3** | 集合的**迭代顺序是稳定的**（插入序） | 确定性（决策 29、[adr-002](adr-002-eventsheet-eval.md) D1）；顺序不稳定则 lockstep 立刻不同步 |\n\n**封顶**：不做排序、过滤、嵌套查询——那会把它变成一门查询语言，撞 §3.4 的「任意控制流」封顶。\n\n**为什么现在就要定**：它要进存档（概念 3），格式一旦落盘就撞 I11——**和数据表是同一个理由**。\n\n---\n\n## 五 · 功能大纲\n\n> **能力清单的读者友好版**：[architecture-outline.md](architecture-outline.md) §四 —— 按九个子系统分组，每项写清做到哪儿\n\n### 5.1 内核\n\n**世界** — 实体 / 组件表 / 原型查询 / 组件 schema 注册；系统注册与调度（固定步长 + 帧步长）；序列化（确定性、版本化、可 diff）；快照与回滚。\n\n**变更** — Action Registry（id / JSON Schema 参数 / 前置条件 / 影响域 / 可逆性 / describe）；撤销栈 + 变更日志；`listAvailableActions(context)` 情境级自省。\n\n**事件表** — 数据模型 `规则[] = { 条件行[], 动作行[], 分组, 启用 }`，有序，全部是普通组件数据；条件 / 动作注册表（带 schema、**人话模板串**、**常规 / 触发标记**）；播放期按 [adr-002](adr-002-eventsheet-eval.md) 的语义求值（**全表自上而下 + 触发即时插入**，实体集按种类逐条收窄、子事件只继承不回写、顶层规则之间不传递）；全部编辑动作 Action 化；**多层子事件 + 参数位简单算术**（§3.4）；**配方库 + 用户可把自己的规则组存成配方**；第一批条件动作（碰到 / 进入范围 / 被点击 / **输入意图被按下**（I12）/ 定时 / 开局 / 数值比较 / 概率；移动 / 跳跃 / 朝向 / 生成 / 销毁 / 改属性 / **播动画** / **播音效** / **放特效** / 计分 / 等待 / UI 提示）。\n\n**呈现** — kind 注册表（声明碰撞体、占地尺寸、可用动画状态）；皮肤包（一个工程一个当前皮肤，可覆盖到单个实体）；模型按插槽适配；动画状态缺失回退 + warning；约束「皮肤包完整性」。\n\n**空间与物理** — Transform 层级（是组件，不是场景图）；空间索引（网格哈希 / BVH）；射线拾取、框选；**Rapier 刚体 + 碰撞 + 空间查询 + 固定与铰链关节**（决策 33；不做其余关节、马达、布娃娃、软体）。事件表要有「连接 / 断开」两个动作——**举起放下、磁力吸附、可组装机关全靠它**。\n\n**分块与流式加载**（决策 30）— 场景内按**块**组织；实体随块**加载与卸载**；序列化**按块存取**（工程存档与快照都是）。\n三条纪律，缺一条流式就会和确定性打架：\n\n| # | 纪律 |\n|---|---|\n| **S1** | **加载顺序不得影响模拟结果**——块的加载是呈现层的事件，不是玩法事件 |\n| **S2** | 玩法需要的**最小状态常驻**（例如远处敌人的存活与计时），只有**表现**随块进出 |\n| **S3** | 卸载与重载后，**同一段输入必须得到同一结果**（闸门 A 的断言范围覆盖它） |\n\n**本轮做**：分块 + 按需加载卸载 + 按块序列化。**留口后加**：LOD 层级、impostor、地形分块 mesh 简化。\n\n**播放期的选择与指令**（附录 A.9）— 游戏内点选、框选、编队、对选中集下达指令（移动 / 攻击 / 跟随 / 停止），全部是条件与动作。\n**这与编辑期的框选是两套东西**：那套服务编辑，这套是玩法能力。MOBA、RTS、战棋、任何「指挥一群单位」的玩法都要。\n\n**播放期的放置与建造** — 玩家在游戏里放下一个东西：位置合法性校验、消耗资源、放置预览、可撤销。\n**红警 / 星际 / 魔兽的建造与塔防的放塔是同一件事**（v17：判据源换成目标游戏后，它从「塔防要」变成「三款 RTS + 塔防都要」）。\n\n**动画事件** — 在 clip 的时间点上打标记，触发事件表（开 / 关攻击判定盒、可取消后摇、脚步、特效点）。\n没有它，动作与魂类的战斗手感无从谈起。标记随**皮肤包**走（语义状态 → clip → 时间标记），不进玩法层（I9）。\n\n**场景与流程**（§4.7）— 多场景（各自可编辑可试玩）；流程数据（场景顺序与切换条件）；全局状态与场景内状态的分界；界面页（标题 / 暂停 / 背包 / 对话 / 结算）。\n\n**行为单元**（§4.7）— 带参数、有 schema 的可复用规则组；定义体即普通规则行；不允许递归与任意控制流；技能 / 道具 / buff / 敌人 AI 全部用它表达。\n\n**运行期状态**（§4.7）— `存进度(槽位)` / `读进度(槽位)` 两个事件表动作；游戏自己声明要持久化什么；实体 id 稳定性由内核保证。**等待队列（含实体集快照与剩余时间）属于运行期状态，必须可序列化**（[adr-002](adr-002-eventsheet-eval.md) W2）——技能冷却与波次间隔全是等待，漏了它读档就丢。\n\n**数据表**（§4.7、决策 32）— 具名表 + 有 schema 的列 + 按行 id 取值；表是内容包的一种形态；行 id 只增不改（I11）；事件表与行为单元可引用；详情面板按列 schema 自动生成表格视图。\n\n**运行期动态集合**（§4.7、决策 37）— 有序集合与键值表；加入 / 移除 / 取值 / 计数四类动作；元素限标量与实体引用；插入序稳定（确定性）；可声明持久化，与存进度共用同一套声明。\n\n**寻路**（决策 38）— 群体寻路 + 局部避让；查询接口与实现分离（退役条件：500 单位下掉帧且优化无果 → 换流场，**接口不变**）。**必须是确定性的**——寻路结果进玩法状态，走 [adr-002](adr-002-eventsheet-eval.md) D1 的稳定迭代顺序。\n\n**视野与战争迷雾**（决策 38）— 按阵营的视野计算与迷雾状态；事件表可查询「X 是否可见」。**迷雾是玩法状态不是渲染效果**——它决定 AI 能不能看到你，因此进玩法层、参与断言。\n\n**动画**（决策 36 档 2）— 状态机（状态是玩法数据，转移由事件表驱动）+ 混合 + **root motion**（位移曲线烘焙成玩法量、归 kind，见 §4.4）+ 交叉淡化 + 动画事件。**不做 IK / 动作匹配 / 上下半身分层**。\n\n**技能目标选择** — 点地 / 点单位 / 方向 / 范围指示器，是行为单元的参数形态（B3 的 schema 扩展）。Dota 的技能、艾尔登的锁定、RTS 的指令共用同一套。\n\n**输入**（I12、决策 24）— **输入意图**注册表（跳跃 / 移动 / 确认 / 取消…，由内核与模块注册）+ **设备绑定表**（键鼠 / 触屏 / 手柄，一张可换的映射表，和皮肤包同一个模式）。事件表只认意图，不认设备。\n\n**宿主能力抽象**（决策 24 P3）— 全屏、指针锁定、URL、存储、文件读写各一层薄接口；浏览器是其中一种实现，套壳时换实现即可。\n\n**渲染桥** — 组件 + 当前皮肤包 → three.js 增量同步；**相机档位**（受限俯视 / **肩后跟随** / 第一人称 / 自由飞行，v17 起默认不再是受限俯视）+ 跟随平滑 + 震动 + 锁定目标；帧循环、可见性剔除。（触屏与自适应画布随移动端一并推后。）\n\n**视听**（决策 23，封顶见 §3.4）—\n动画：glTF clip + **交叉淡化过渡**，状态由事件表与皮肤包驱动；\n材质与光照：参数面板 + 若干套环境与光照预设；\n后处理：几个预设档位；\n特效：一组预制粒子（命中 / 爆炸 / 拾取 / 尘土 / 拖尾），事件表可触发；\n音频：音效与背景音乐的播放 / 音量 / 循环 / 停止，全部是事件表动作。\n\n**游戏内 UI** — DOM overlay：跟随实体的屏幕锚点 + 生命周期 + **一组预制件**（血条 / 计分 / 计时 / 提示 / 胜负画面）。不做控件系统。\n\n**素材** — 内置风格中性、可互相搭配的素材库（随编辑器分发）；glTF 导入同等优先；文生 3D 作为可插拔 provider。\n\n**分享与账号** — 发布（工程 → 只读快照 → **注册 / 登录** → 上传 → 换回链接，决策 28）；玩（打开链接只加载播放期，**不需要账号**）；remix（拉回本地新建工程，**不需要账号**）。\n后端只存**已发布快照 + 最小账号信息**，不存正在编辑的工程。快照带内容哈希、引擎版本号与**作者 id**（I11）。\n账号形态：**优先 OAuth，不自建密码体系**；作品可归属、可删除；一个举报入口 + 管理员下架能力。\n**不做**：个人主页、关注、私信、自动审核。\n\n**数据安全底线**（§3.6.3 / 3.6.4）— 自动保存；导出自包含工程文件；overlay 一律 `textContent`；导入与快照解析设上限并优雅失败。\n\n**试飞台** — headless runner（加载 → 执行 Action 序列 → 断言 → 报告）；确定性（清除 `new Date()` / 随机数对世界状态的渗透）。\n\n**AI 基础设施** — `describe(scope, detail)` 语义 LOD（组件与事件表都要实现）；约束层（谓词 + 结构化失败反馈 + 修复建议）。详见 [ai-native-engine.md](ai-native-engine.md)。\n\n### 5.2 内核归属论证\n\n范围纪律的实际应用（决策 39 的判据源）。**每加一个内核成员或换一次目标游戏清单，都要重跑这张表。**\n\n**判据**：至少两款需要，**且分属不同簇**。同簇内四款都要，只证明那个簇要，不证明该进内核。\n\n| 项 | 红警 | 星际 | 魔兽 | Dota | 塞尔达 | 艾尔登 | 刺客 | TPS | 判定 |\n|---|---|---|---|---|---|---|---|---|---|\n| 物理（刚体 / 碰撞 / 查询） | 要 | 要 | 要 | 要 | 要 | 要 | 要 | 要 | **进内核**（v4） |\n| **群体寻路 + 局部避让** | 要 | 要 | 要 | 要 | 要 | 要 | 要 | 要 | **进内核**（决 38，v17 从模块提回） |\n| **视野 / 战争迷雾** | 要 | 要 | 要 | 要 | 不要 | 不要 | 要（警戒） | 要（警戒） | **进内核**（决 38，v17 从模块提回）。原判「只有一类玩法要」已被推翻 |\n| 播放期选择与指令 | 要 | 要 | 要 | 要 | 不要 | 不要 | 不要 | 不要 | ⚠️ **同簇独占**——但保留在内核，见下方说明 |\n| 播放期放置与建造 | 要 | 要 | 要 | 不要 | 要（临时平台） | 不要 | 不要 | 不要 | **进内核**（跨簇） |\n| **技能目标选择** | 要 | 要 | 要 | **核心** | 要 | 要 | 不要 | 要 | **进内核**（跨簇） |\n| **数据表**（决 32） | 要 | 要 | 要 | 要 | 要 | 要 | 要 | 要 | **进内核**（v16） |\n| **运行期动态集合**（决 37） | 要（生产队列） | 要 | 要 | **要（物品栏）** | 要（背包） | 要（背包） | 要 | 要 | **进内核**（v17，跨簇） |\n| 动画事件（clip 时间点） | 要（出手帧） | 要 | 要 | 要 | 要 | **核心** | 要 | 要 | **进内核**（跨簇，v17 起可倒推） |\n| **动画状态机 + 混合 + root motion** | 不要 | 不要 | 部分 | 部分 | 要 | **核心** | **核心** | **核心** | **进内核**（决 36 档 2）。⚠️ 主要由动作簇驱动，见下 |\n| 固定与铰链关节（决 33） | 不要 | 不要 | 不要 | 不要 | **核心** | 不要 | 部分（机关） | 不要 | ⚠️ **近乎单款独占**，见下 |\n| 皮肤包机制 + 编辑 | 要 | 要 | 要 | 要 | 要 | 要 | 要 | 要 | **进内核**（决 20） |\n| 音频 / 粒子 / 材质光照 / 后处理 | 要 | 要 | 要 | 要 | 要 | 要 | 要 | 要 | **进内核**（v8） |\n| 游戏内 UI overlay | 要 | 要 | 要 | 要 | 要 | 要 | 要 | 要 | **进内核** |\n| 大世界分块流式 | 不要 | 不要 | 不要 | 不要 | 要 | 要 | 要 | 部分 | ⚠️ **同簇独占**，但决 30 已定，保留 |\n| 网格世界 / 可破坏建造 | 不要 | 不要 | 不要 | 不要 | 不要 | 不要 | 不要 | 不要 | **留口**（v17 撤回） |\n| 载具物理 / 样条路网 | 不要 | 不要 | 不要 | 不要 | 不要 | 不要 | 不要 | 不要 | **留口**（v17 撤回） |\n| 模拟细节分级 | 不要 | 不要 | 不要 | 不要 | 不要 | 不要 | 不要 | 不要 | **留口**（1000 实体够 RTS） |\n\n#### 三项没过新判据、但保留在内核的（v17 必须写明）\n\n新判据比旧判据严，**有三项没干净地过关**。不藏着，写出来并给出理由与复查点：\n\n| 项 | 问题 | 处置 |\n|---|---|---|\n| **播放期选择与指令** | 四款 RTS/MOBA 要，动作簇一款不要——**同簇独占** | **保留**。理由是它与「技能目标选择」共用同一套目标拾取机制，而后者跨簇。**复查点**：若实现时发现两者可以拆开，选择与指令应下沉为 RTS 模块 |\n| **动画状态机 + root motion** | 主要由动作簇四款驱动，RTS 簇只有魔兽/Dota 部分需要 | **保留**。魔兽的英雄、Dota 的技能动作确实需要状态切换与硬直，**跨簇成立但强度不对称**。决策 36 明确只做档 2，档 3 封顶，就是这条不对称的应答 |\n| **固定与铰链关节** | 只有塞尔达是核心，刺客信条的机关是次要 | **保留，但这是最弱的一项**。它是 v16 用「例外 #3」塞进来的，v17 换判据后它勉强跨簇。**复查点**：若第三人称动作模板做完发现只有塞尔达式解谜用得上，它应下沉为模块 |\n\n**决策 34 的例外栏因此清空**：换判据源之后，原来三条例外全部变成可倒推的（或如上明确标注）。\n**额度回到 3/3 可用**——但上面三条「不干净」的项**已经用掉了信任余额**，下一次要往内核加东西，先看它们能不能出局。\n\n**改判史**：v4 把物理请回内核、把寻路砍出去；**v17 又按新判据把寻路与视野请了回来**。\n两次都是同一条纪律在随事实改判——**这说明纪律是活的，也说明判据源选错会系统性地漏能力**（A.9 的第二条教训）。\n\n### 5.3 编辑器\n\n> **一图版**：[overview.svg](../diagrams/overview.svg) 第 5 图 · 编辑器界面\n\n- **模板库**：打开即见，**选一个先直接试玩**，再进编辑（§1.3 第 1–2 步）\n- **项目门厅**：回访时的入口——我的作品 + 最近编辑 + 模板库（§1.3 C）\n- **事件表编辑器**：一个可拖拽的列表控件——加规则行、挑条件动作、改参数、调顺序、分组；播放时高亮命中的行。**没有画布、连线、布线、缩放平移**\n- **皮肤切换**：一个下拉换整套风格；缺插槽当场列出，点一下去补\n- 大纲：实体树 + 用户文件夹（现有 [ui/outliner.js](../../js/ui/outliner.js) 改造复用）\n- 详情：按 schema 自动生成控件，**可写**\n- 变换 gizmo；多选、框选、复制粘贴、成组、对齐吸附\n- 资产库：内置素材库 + glTF 导入 + 预制体，**按插槽组织**\n- 播放控制：播放 / 暂停 / 单步 / 停止\n- **数据表编辑器**：按列 schema 生成的表格视图（决策 32）\n- **动画状态机编辑器**：状态 + 转移条件的列表视图（决策 36）。**转移条件复用事件表的条件注册表**，不另起一套\n- **教程系统**（决策 35）：按能力组织、可交互、**就在编辑器里**；每个概念一条，跟着能力一起交付（§1.4）\n- **导出**：一个按钮生成自包含工程文件（v17 替代原「分享链接」）\n- 停靠系统、i18n、项目门厅、存档（现有实现基本可直接留用）\n- ~~术语层与模式开关~~ —— **v17 删除**（决策 12 取消）。省下的三样东西：registry 白名单过滤、详情面板字段可见性、术语映射表\n\n### 5.4 AI 作者接口\n\n| 顺序 | 能力 | 说明 |\n|---|---|---|\n| 1 | **单步指令** | 一句话 → 一条 Action，预览后确认 |\n| 2 | **换皮 / 配皮肤** | 只改皮肤包映射，不碰任何规则（I9）。作用域最小、错了一眼看得出 |\n| 3 | **多步变更集** | N 条 Action → 半透明预览 + 清单 → 整体接受 / 逐条剔除 → 合成一条撤销 |\n| 4 | **生成规则行** | 产出 Action 序列（挑配方 + 填参优先），可见、可手改、可逐行 diff |\n| 5 | **内联建议** | 选中物体 → 1–2 条可点击的建议 |\n\n#### AI 参与度的三档（决策 40，v20 修订）\n\n> **五根支柱本来就是 agent 的闭环**：`describe` 感知 · `listAvailableActions` 知道能做什么 ·\n> `apply` 行动 · 约束层给结构反馈 · headless 提供可重复的行为 oracle。\n> v20 补上的不是更多模型能力，而是**引擎拥有的控制协议**：谁批准、谁提交、谁判定通过、何时必须停止。\n\n| 档 | 能力 | 状态 |\n|---|---|---|\n| **档 1** | 上表五种形态；一次生成 Action 变更集，预览后由人接受；可运行已给定的 TestSpec 并报告证据 | **本轮做**（阶段一接单步，阶段三补齐） |\n| **档 2** | **验证驱动的自主循环**：批准 `PlanContract` 后，按步骤执行 Action 事务；结构 / 行为 / 体验三层验证；失败进入有界修复；全过程可见、可停、可回到任一通过 checkpoint、可只接受已通过的前半段 | **本轮做**（阶段三，见 [ADR-003](adr-003-verified-agent-loop.md)） |\n| **档 3** | **AI 造零件**：AI 用 JS 实现新的条件与动作，扩展编辑器自身的能力面 | **留口** |\n\n**档 1 与档 2 的差别不是规模，是控制权**：档 1 是一次性 batch（吐 N 条 → 一次 review）；\n档 2 是持久运行（计划 → 执行一步 → 验证 → 修复或提交）。长任务不能靠 50 条 Action 的复选框管理，\n也不能让模型在同一上下文里自写、自验、自称成功。\n\n**档 2 的七项硬协议**（字段与状态机见 [ADR-003](adr-003-verified-agent-loop.md)）：\n\n| # | 协议 | 硬边界 |\n|---|---|---|\n| **P1 计划契约** | `PlanContract` 声明 `baseRevision`、作用域、步骤依赖、允许的 Action、预期影响、TestSpec 与预算；Markdown 只是视图 | 计划变更后旧批准立即失效；复杂任务未经批准不得执行 |\n| **P2 步骤事务** | 每步在候选分支 `preview`，hard oracle 全过才 `commit` checkpoint，失败 `abort` | 步骤内全有或全无；不得提交失败步骤的半批 Action |\n| **P3 分层验证** | V1 schema / 前置条件 / 约束；V2 确定性 headless / 输入轨迹 / 状态断言；V3 日志 / 截图 / 体验观察 | V3 与模型自评不能覆盖 V1 / V2 的 hard 失败 |\n| **P4 角色隔离** | planner / executor / verifier 使用隔离的上下文与权限；可由同一模型承担 | verifier 不能继承 executor 的「已经完成」结论，也不能改 hard TestSpec |\n| **P5 证据账本** | `StepReceipt` + `EvidenceLedger` 记录真实 diff、测试、输入、seed、日志、截图、provider、成本与判定 | 自然语言总结不能替代可重放证据 |\n| **P6 有界修复** | 每轮先写失败签名、原因假设、最小修复集与回归范围 | 重复失败、越界、削弱测试、缺少原语、冲突或超预算立即停 |\n| **P7 引擎控制** | 状态机、审批、权限、步数 / 时间 / 费用预算与中断信号都在引擎侧 | 模型只能请求状态转换，不能自行提交、批准或延长预算 |\n\n三个稳定入口仍保持**无状态、可多轮调用**；运行状态属于独立的 `Run`，不能藏进 provider 会话。\n多 agent 并发编辑与合并仍不做；角色隔离是权限边界，不是并发要求。\n\n**档 3 的一条硬约束现在就写死**：\n\n> **AI 写的 JS 条件动作不得自动注册。**\n> 必须过 §7.1 的确定性沙箱静态检查（J1–J3）+ 一次 headless 断言，且在 registry 里**标明来源**。\n> 理由是 **I11**：一个条件动作的 id 一旦被作品引用就冻结了——**AI 随手造一个，就等于永久多了一份迁移负担**。\n\n**这是能力天花板的真实位置**：档 1、档 2 下 **AI 能组装，不能造零件**；\n超出现有条件动作库的需求，得由人先写零件。\n\n**必须一等对待的非功能项**：延迟与费用预算、失败兜底（AI 不可用时编辑器完全可用）、\n错误通过率（hard 负例不得被判通过）、可解释（说清改了什么、为什么）、可恢复（失败退回最近通过 checkpoint 的距离恒为 0）、\n离线（没有 AI 也能用模板与配方做事）。\n\n> **v17 加重**：决策 35 把门槛交给了 AI 与教程，**AI 的可用性因此从「产品卖点」变成「承重结构」**。\n> 上面四条非功能项现在与功能同级——尤其「失败兜底」：AI 挂掉时，教程与配方必须能独立扛住门槛。\n\n### 5.5 模型接入（决策 21）\n\n> **用户能填自己的模型，而且填起来不难。**\n> 内置 AI 开箱即用；但从第一天就假设「用户会换成自己的」。\n\n#### 供应商适配层\n\n一个 provider 只需实现三件事：**发一次请求、拿回文本或 JSON、报告自己的能力**。\n\n| 形态 | 说明 |\n|---|---|\n| **OpenAI 兼容端点**（base URL + key + 模型名） | **这一条覆盖绝大多数场景**：各家云服务、聚合网关、自建代理，都是它 |\n| Anthropic / Gemini 原生协议 | 各写一个适配器，因为请求格式不同 |\n| **本地模型**（Ollama / LM Studio 等） | 也是 OpenAI 兼容端点，零成本、数据不出机器 |\n\n**新增一家 = 加一个适配器**，其余全部不动（I5 的一次应用）。\n\n#### 能力契约与降级（I10 的执行点）\n\n引擎声明**它需要什么**，provider 声明**它有什么**，缺的部分自动降级：\n\n| 能力 | 有的时候 | 没有的时候（降级） |\n|---|---|---|\n| 结构化输出 / 约束解码 | 直接按 Action 的 JSON Schema 出参，语法错误为零 | prompt 里贴 schema + 输出后校验 + 失败重试（最多 N 次） |\n| 工具调用 | 三个入口做成 tool（`describe` / `listAvailableActions` / `apply`） | 退化为单轮 JSON 协议：一次给上下文，一次要结果 |\n| 长上下文 | 一次给更多 describe 结果 | **渐进披露本来就按需取**，影响很小（见[附录 A.7](#a7-决策-21为什么接各种模型是可行的)） |\n| 流式输出 | 边生成边显示预览 | 转圈等待，功能不减 |\n\n**底线**：只要模型能「读一段文字、按要求吐一段 JSON」，编辑器的 AI 功能就应该可用——**只是慢一点、重试多一点**。\n\n#### 设置界面\n\n**v17：目标用户配得来 base URL 和 key**，所以这一节的门槛论证不再必要。\n但下面几条**全部保留**——它们对专业用户同样成立，只是理由从「不写代码的人也要能配好」\n换成「**配置成本应该低到不值得抱怨**」：\n\n- **预设列表** + 一个「自定义端点」——不必知道什么是 base URL 也能开始\n- 填完有一个**「测试连接」**按钮：报告能否连通、探测到哪些能力、大概多快\n- **每类任务可以选不同模型**（够用的两档就好：快 / 强）。换皮、单步指令用快的；生成规则行用强的\n- **用量与花费可见**：BYOK 是用户自己付钱，看不到花费就不敢用\n- **隐私说明写在设置页上**，不藏进文档：说清哪些内容会被发出去（`describe` 的结果、当前选中的东西、事件表片段），以及**本地模型可以让这一切不出机器**\n\n#### 密钥与安全\n\n- 桌面外壳：密钥存在本地\n- 网页版：**走内置代理**，不在浏览器里明文存 key\n- 引擎**不用用户的 key 做用户没要求的事**（不做后台预热、不做遥测调用）\n\n#### 边界（防膨胀）\n\n不做模型路由 / 自动选模、不做 RAG 与向量库、不做微调、不做多模型投票、**不引入通用 agent 框架作依赖**。\n**适配层就是「一个函数 + 一张能力表」**，本轮不许长成子系统。\n\n> **v18 澄清**：最后一条说的是**不把 LangChain 一类通用框架变成依赖**，\n> **不是禁止自主循环**。决策 40 的档 2 由引擎状态机编排三个稳定入口，与本节边界不冲突——\n> 恰恰相反，**渐进披露与三入口就是为了让循环的上下文成本不随 Action 数量增长**（[A.7](#a7-决策-21为什么接各种模型是可行的)）。\n\n### 5.6 领域模块与模板集\n\n模块 = 「组件 + 系统 + 条件动作 + kinds + 皮肤包 + Action + 约束 + 面板 + 模板」的注册包。\n\n**v17 重立**（修订决策 15）。八款目标游戏塌缩成**两个模板**：\n\n| 模板 | 覆盖 | 主要检验 | 模块内容 |\n|---|---|---|---|\n| **RTS / MOBA**（先做） | 红警、星际、魔兽、Dota 2、**塔防（是它的子集）** | 群体寻路、视野迷雾、选择与指令、播放期建造、资源经济、技能目标选择、数值表、生产队列 | 单位群、波次与 AI、建筑与生产、资源、胜负、迷雾呈现 |\n| **第三人称动作** | 塞尔达、艾尔登、刺客信条、TPS | **动画状态机 + root motion**、动画事件与判定盒、关节与物理解谜、背包、大世界流式、锁定目标、**关卡串 + 存进度 + 技能道具** | 角色控制器、战斗与判定、锁定、背包与装备、关卡流程 |\n\n**它同时是决策 25 的验收载体**——§4.7 的五个概念全部由第三人称动作模板倒推，闸门 F 也由它判定\n（原「完整作品模板 · 小型 roguelite」并入此处，不再单列）。\n\n**降级与出局**：\n\n| 原模板 | 处置 |\n|---|---|\n| 塔防 | **并入 RTS 模板**——寻路、单位群、波次、经济、胜负全是 RTS 的子集，单独立项是重复投资 |\n| 平台跳跃 | **降为内部脚手架**，不作交付模板。它仍是最快拿到「可玩闭环」的路径，**工程上先做它**，但它不承担通用性证明 |\n| 完整作品 roguelite | 并入第三人称动作模板 |\n| 收集竞速 | **出局**（八款里无人需要） |\n| 城市建造 | 保持可选，**优先级再降**（载具与样条已撤回为留口） |\n\n**差异轴**（两个模板，但轴拉得比原来四个更满）：\n\n| 轴 | RTS / MOBA | 第三人称动作 |\n|---|---|---|\n| 相机 | 受限俯视 | 肩后跟随 + 锁定 |\n| 控制 | **指挥一群** | **操控一个** |\n| 节奏 | 秒级 | **帧级** |\n| 空间 | 平面 + 路径 | 垂直几何 + 大世界流式 |\n| 结束条件 | 摧毁 / 占领 | 关卡 / Boss |\n| 联机 | **lockstep 是核心** | 单人为主 |\n| 动画栈 | 几乎不用 | **档 2 全用** |\n\n**RTS 排第一**（修订原「平台跳跃排第一」）：它离现有架构最近、与联机方向一致、**一个模板覆盖四款目标游戏**，\n且塔防白送。**条件动作库的广度从它倒推**，因为它逻辑最复杂。\n\n**第三人称动作排第二**：它要新建整个动画栈（决策 36），是本轮最大的单项工程，\n但也是闸门 F 的载体——**不能推到最后，否则闸门 F 会挤在末尾**。\n\n---\n\n## 六 · 路线与闸门\n\n> 阶段之间是硬依赖。**不含工期承诺。**\n>\n> **v17 的总顺序：先自用 → 再验证 → 再开放。**\n> 第一个里程碑不是「别人能用」，是**你能用它做出你想做的游戏**。\n> 分享、账号、后端、面向新手的一切**整体推到阶段四「开放」**。\n>\n> **数据模型先行**：§4.7 五个概念的数据模型**阶段二就定死**，实现分批。\n> 先定数据模型是为了不撞 I11——这五样一旦发布后再改，已有作品会全废。\n>\n> **比它更先的只有一样**：事件表的**求值语义**，阶段零定稿（决策 31、[adr-002](adr-002-eventsheet-eval.md)）。\n> 数据模型改错还有迁移链，求值语义改错**迁移链救不了**（§3.6.5）。\n\n### 阶段零 · 工程地基 + 三份协议推演\n\n引入 package.json + 打包器；现有 three CDN importmap 迁进构建。\n它挡着 ECS / Rapier / glTF 三件事，不先做，阶段一第一天就会撞上。\n\n**并行做完一件纸面工作：事件表求值语义定稿**（决策 31、[adr-002](adr-002-eventsheet-eval.md)）。\n它不写代码、不依赖打包器，但**阶段一的 Action 层、序列化、试飞台断言全部受它约束**。\n\n**另行走通 [ADR-003](adr-003-verified-agent-loop.md) 的三个控制协议样例。** 它不像求值语义那样不可迁移，\n所以不并入闸门 O；但 `baseRevision`、步骤事务、TestSpec 与 checkpoint 字段必须在阶段一 Action / 快照格式落地前定形，\n否则阶段三会反过来重写撤销、序列化与试飞台。\n\n**同时走通 [ADR-004](adr-004-evidence-governed-evolution.md) 的三个治理回放。** 它先于所有后续 AI 指挥任务：\n回放 v17/v19 漂移、ADR-002 隐含语义和协议自我挑战；建立治理基准集，验证 AI 能主动发现用户没有指出的关键决策，\n并能拒绝无收益的流程膨胀。它不冻结具体检查表，只冻结权限、证据与采用边界。\n\n- **闸门 O（纸面）**：ADR-002 的三个手工样例（塔防选目标 / 跳跃缓冲 / RTS 指令）逐条推演，\n  结果与「读这段规则会预期什么」一致。**过了就按 I11 冻结**，此后只许改实现不许改语义\n- **治理准入 G0（纸面）**：ADR-004 的 G1–G3 全部发现植入的关键遗漏、越权修改为 0；\n  在这之前可以做打包器和人工 spike，但 AI 不得把新的不可逆方案写成已定结论\n\n### 阶段一 · 内核地基\n\nECS 内核 + 封装层 + **按块序列化** + 快照；Action Registry + 撤销 + 日志 +\n**步骤事务底座**（`baseRevision` / `idempotencyKey` / preview / commit / abort / checkpoint / `StepReceipt`）；\n**试飞台（headless runner + 确定性 + TestSpec）**；渲染桥 + Transform + 拾取 + 空间索引 +\n**分块与流式加载**（决策 30）；编辑器改造（大纲 / 详情 / gizmo / 多选，全部对 ECS 通用）；\n**阶段末接最小 AI（单步指令）**——验证通道形状和事务回执，不是模型能力。\n\n- **闸门 A**（四条）：\n  1. 手写一段 Action 序列（JSON），headless 执行后与 GUI 手动操作得到的状态**逐字节一致**；存读档、撤销、重放全部通过\n  2. **块卸载再重载后，同一段输入得到同一结果**（决策 30 的 S3）\n  3. **Rapier 的确定性 spike 通过**——同一输入在两台不同机器上逐帧一致。\n     **不通过就换物理库，不放宽决策 29**\n  4. **Action 步骤事务负例通过**：过期 `baseRevision` 不覆盖、同一 `idempotencyKey` 不重复执行、\n     步骤中途失败不污染主工程、回到最近通过 checkpoint 不需要补偿 Action\n- **闸门 B（纸面）**：城市迁移演练——不写代码，逐项验证路 / 地形的数据结构与命令能否用内核概念表达。**过不了就改内核**\n\n### 阶段二 · 事件表 + RTS 模板\n\n事件表数据模型 + 列表编辑器 + 按 [adr-002](adr-002-eventsheet-eval.md) 求值；第一批条件动作库（**广度由 RTS 倒推**）；配方库；\n**§4.7 五个概念的数据模型定死**（场景与流程结构、行为单元 schema、可持久化状态声明、数据表的表与列 schema、**动态集合的两种形态**），\n**实现只做最小**：两个场景能切换、一个带参行为单元能定义与调用、存读进度能跑通、一张数据表能被规则引用、**一个背包能增删并存档**；\n播放模式 = 快照沙箱；物理 + 关节 + glTF 导入 + 内置素材库；皮肤包机制 + 编辑面板 + 两套皮肤；\n**群体寻路 + 视野迷雾**（决策 38）；**播放期选择与指令 + 建造**；**技能目标选择**；\n**视听下限一套**（音频、预制粒子、材质与光照预设、后处理档位——决策 23）；游戏内 UI overlay 与预制件；\n**约束层的机制**（谓词注册 + 结构化失败反馈 + 面板显示）——闸门 C.5 的皮肤包完整性、§1.3 主循环的当场提示都依赖它，**不能等到阶段三**；\n**平台跳跃脚手架**（最快拿到可玩闭环，不作交付模板），随后 **RTS 模板**；\n**导出自包含工程文件**；**脚本化试玩 + TestSpec + 输入意图轨迹 + 状态断言 + 证据片段**；\nV3 首批观测接口（日志、截图引用、真实键鼠 / 输入意图，不允许用直接传送替代被测输入链）；\n**教程系统的机制 + 已交付能力的教程条目**（决策 35）。\n\n- **闸门 C**（五条，v17 从七条改来）：\n  1. **RTS 模板可玩通一局**（采集 → 造兵 → 交战 → 分胜负），**全部逻辑由事件表与行为单元表达，没有一行专为它写的硬编码 JS**\n  2. 平台跳跃脚手架同样成立，且两者复用同一内核与同一套条件动作库的公共部分\n  3. 同一局能在 headless 里由脚本驱动跑完并断言结果，**含 1000 单位规模下不掉帧**\n  4. **导出的工程文件能在另一台机器上打开并继续改**（v17 替代原「发链接给陌生人」）\n  5. **换皮不变**：换一套皮肤包，**一行规则不改**，headless 同输入下**玩法状态**逐字节一致\n- **原第 5 条「配方可用性」与第 7 条「成品感 / 手机可玩」的处置**：\n  前者改为**教程可用性**，并入阶段三的闸门 D；后者随移动端一并推后，\n  **但决策 23 的视听下限本身不砍**（§3.4 各项照做，只是不再有「手机上打开」这个判据）\n\n### 阶段三 · AI 作者接口 + 验证驱动控制循环\n\ndescribe 层；**约束层接到 AI 上**（机制阶段二已建，这里加的是「作为验证器与修复信号」那一半）；\n单步 → 换皮 → 多步 → 生成规则行 →（内联建议）；**供应商适配层 + 能力探测与降级 + 设置界面**（决策 21）；\n并按 [ADR-003](adr-003-verified-agent-loop.md) 落地 `PlanContract` 编辑器、Action 步骤事务、\norchestrator 状态机、三层 verifier、`EvidenceLedger` 与有界 repair policy。\n\n- **闸门 D**（六条；D.4 含五个不可拆的子判据）：\n  1. 一句话生成一个可玩的关卡**及其逻辑**；复杂任务先生成可编辑 `PlanContract`，批准前零变更；简单任务仍可直接预览 Action 变更集\n  2. **生成的规则行能被手动继续修改**（I3 的验收点）\n  3. 端到端时间、Action 数、修复次数与模型费用有明确预算；超时、超支、越界与冲突都有可恢复兜底\n  4. **验证驱动自主循环通过完整负例套件**：\n     - **D.4a 计划与审批**：计划可编辑、可重排、可删除步骤；批准绑定版本，计划变化后旧批准失效\n     - **D.4b 事务与恢复**：每步失败不污染主工程；可停止、恢复到任一通过 checkpoint、只接受已通过的前半段；重复请求不重复执行\n     - **D.4c 独立验证**：V1 结构 + V2 确定性行为决定 hard 通过，V3 提供体验证据；人工植入的 hard 失败错误通过率为 0\n     - **D.4d 有界修复**：修复不得删改 hard TestSpec；同一失败重复、缺少原语、越界或超预算时必停并交还证据\n     - **D.4e 证据可重放**：每步 diff、约束、输入轨迹、seed、状态断言、日志、截图、provider 与预算形成 `EvidenceLedger`，另一进程可重放得到同一 hard 判定\n  5. **教程可用性**（v17 换掉原「简易模式下全程可完成」）：一个懂引擎、但没用过本编辑器的人，\n     **只靠内置教程与 AI**，能走通主循环并改出一个与模板明显不同的关卡。**这是决策 35 的验收点**\n  6. **换一家模型仍可用**：把默认模型换成另一家（含一个**无结构化输出、无工具调用**的模型\n     与一个**本地模型**），D.1–D.5 仍然通过；只允许更慢、重试更多，事务、权限与 hard 判定不得变化（I10 与决策 21 的验收点）\n\n### 阶段三 ½ · 第三人称动作模板（决策 25 的验收载体）\n\n**动画栈档 2**（决策 36：状态机 + 混合 + root motion，含 §4.4 的两条冲突解法）；\n§4.7 五个概念补齐到可用；**第三人称动作模板**（关卡串 + 战斗与判定盒 + 技能道具 + 背包 + 存进度 + 锁定）；\n菜单 / 背包 / 对话 / 结算四个界面页；配套配方与教程条目。\n\n- **闸门 F**（决策 25 的总判据，全项目最硬的一条）：\n  **做出一款能发到 itch.io 的完整作品**——标题画面、**至少 3 个关卡**、\n  **能存进度**、**有技能或道具系统**、有胜负结算、有音画、**30 分钟以上内容**。\n  且全部逻辑由事件表与行为单元表达，**没有一行专门为它写的硬编码 JS**\n  （用 JS 实现**通用的**条件与动作不算——那是决策 6 的正常路径；\n  **算不算的判据是：这段 JS 能不能被另一个模板复用**）。\n  **验收人 = 项目所有者**（决策 25 的 v17 修订）。\n\n### 阶段四 · 开放（v17 重立，原「第三个模板」出局）\n\n**这一阶段是「先自用 → 再验证 → 再开放」的第三步**，前面每一阶段都不依赖它：\n\n分享（极简后端 + 只读链接 + remix，决 14）；账号（OAuth，决 28）；\n移动端播放（触屏 + 自适应，决 23 的推后部分）；面向新手的 registry 裁剪视图（I8 的留口兑现）；\n城市模块迁移**仍然可选**。\n\n- **闸门 E**（两条，v17 修订）：\n  1. **两个模板跑在同一个内核上**，每个模块契约校验通过——无一处直接 import 内核以外的东西，无一处绕过 Action 层写编辑期状态\n  2. 加入**第三个模板**（任选一个八款之外的玩法）时，内核**没有新增领域概念**（[§5.2](#52-内核归属论证) 表格不新增行）。\n     **这条是通用性的真正判据**——只有两个模板时，「两个都要」等于「全都要」（决策 39）\n- **闸门 G**（开放的判据）：把链接发给一个不认识这个项目的人，他能玩，并能一键 remix\n\n### 阶段五 · 联机（决策 29 的兑现）\n\n**先做 lockstep**（服务八款里的五款）：指令同步 + 确定性模拟 + 断线重连 + 观战。\n本轮不做，但**确定性纪律从阶段一起就按硬指标守**，否则这一阶段无法开工。\n**服务器权威 / 客户端预测路线已封顶**（§3.4），不做 FPS 竞技那条岔路（[A.9](#a9-主流玩法压力测试)）。\n\n### 闸门不过怎么办\n\n**砍范围，不放宽判据。** 一旦允许「先放过，下阶段补」，闸门就退化成装饰。\n\n| 阶段 | 预定砍单顺序（不要临场决定） |\n|---|---|\n| 阶段一 | 1. gizmo / 多选 → 2. 空间索引的 BVH（先只做网格哈希） → **绝不砍试飞台** |\n| 阶段二 | 1. 视野迷雾的精细化（先做最粗的圆形视野） → 2. 内置素材库规模 → 3. 后处理与部分预制粒子 → **绝不砍导出，也绝不砍寻路与确定性** |\n| 阶段三 ½ | 1. 界面页的数量（先做标题 + 结算） → 2. 关卡数量（先做 1 关跑通全流程） → **绝不砍动画栈档 2**——它是这一阶段的全部意义 |\n\n---\n\n## 七 · 模块契约与迭代纪律\n\n> 目标：让**单个模块的改动代价低到可以频繁失败**。\n> 可迁移的只有两条：**接口冻结、内部自由演进**；**敢整块丢掉**。\n> 不可迁移的是「提前为所有模块设计插件接口」——接口该长什么样，要造完第一个才知道。\n\n**好消息**：ECS + Action + 事件表本身就是模块化底座，不需要另起炉灶。\n\n| 已选架构 | 天然给出的边界 |\n|---|---|\n| ECS | 模块 = 一组组件 + 一组系统，系统之间只通过组件通信 |\n| Action 层 | 模块的对外能力 = 它注册的 Action，可枚举、带影响域 |\n| 条件动作库 | 模块给用户的能力，同样可枚举、可 describe |\n| 皮肤包 | 模块的呈现层，可整套替换 |\n| 约束层 | 模块的正确性契约，可独立验证 |\n\n### 7.1 模块契约\n\n每个模块一个声明文件，启动时校验，越界即报错：\n\n```\ncomponents:   组件类型 + schema\nactions:      注册的 Action\nrules:        注册的条件与动作\nkinds:        语义种类 + 玩法量（碰撞体、占地、可用动画状态）\nskins:        提供的皮肤包 + 要求的视觉插槽清单\nconstraints:  声明的约束\nsystems:      挂载的系统 + 调度阶段\npanels:       注入的编辑器面板\ntemplates:    提供的模板\ndepends:      依赖的其他模块（DAG，禁止循环）\n```\n\n**禁止**：直接 import 另一个模块的内部实现、直接读写不属于自己的组件表、绕过 Action 层改编辑期状态、直接 import 第三方 ECS 库、**在事件表或玩法组件里引用具体美术资源**（I9）、**在条件与动作的实现里触碰时间与随机源**（见下）。\n\n#### 确定性沙箱（决策 29 的执行点，v16 补）\n\n决策 29 把逐帧确定性升为硬要求，但**一直缺一个执行点**：决策 6 允许用 JS 实现条件与动作，\n而 `Math.random()` 或 `Date.now()` 只要出现一次，lockstep 与 headless 断言**同时废掉**——\n且失败是随机的、极难排查。\n\n| # | 约束 |\n|---|---|\n| **J1** | 条件与动作的 JS 实现跑在**受限环境**：禁 `Date` / `Math.random` / `performance` / 网络 / 存储 / DOM |\n| **J2** | 内核注入 `rng`（带种子）与 `tick`；要随机、要时间，只能从这里拿 |\n| **J3** | 违反在**注册时**就报错，不等到运行期——静态扫一遍实现体即可 |\n\n同一条纪律也适用于内核自己：[GameClock](../../js/sim/GameClock.js) 的 `new Date()` 与\n[core/project.js](../../js/core/project.js) 的 `randomUUID()` 是存量里已知的两处渗透（ai-native-engine.md 支柱五）。\n\n### 7.2 三条纪律\n\n| 机制 | 内容 |\n|---|---|\n| **变化轴声明** | 每个模块回答「我预期未来在哪几个方向上变」。价值是反向的——它同时说明哪些地方**不打算变**，因此现在**不要**为它做抽象 |\n| **退役条件** | 每个模块写明「什么情况下该整个丢掉」。大多数项目死于舍不得丢 |\n| **三次法则** | 不要在第二个用例出现之前抽象。第一次写死，第二次复制，第三次才抽象 |\n\n**已写下的退役条件**：\n\n- 寻路：500 单位下掉帧且优化无果 → 换流场，**查询接口不变**\n- 物理：Rapier 体积或确定性不达标 → 换库，**空间查询接口不变**\n- 事件表：若模板逻辑写不出来必须硬编码 JS → **加受限原语，不退回节点图**\n- 城市模块：迁移工作量超预算 → 放弃（已降为可选）\n- ECS 库：spike 的确定性测试不过 → 换库或自研；**封装层保证换库代价限制在约 800 行内**\n\n**项目级的退役条件**（同一条纪律，也该对项目自己生效）——**v17 反转**：\n\n> 原文是「若普通人改不出关卡 → 转向面向有经验创作者」。\n> **v17 之后那已经是起点，不是退路**，所以这条要换一个方向写。\n\n新的两条：\n\n| # | 触发条件 | 执行什么 |\n|---|---|---|\n| **P-1** | 闸门 F 通过后，**开放阶段（阶段四）迟迟无法开工，或开工后无人使用** | **承认它是个人引擎**，停止在分享 / 账号 / 新手视图上继续投入，把资源转回引擎能力本身。这不是失败，是把「三者都想要」收敛成「先自用」那一项——它本来就是第一优先 |\n| **P-2** | 闸门 D.5（教程可用性）连续两轮不过 | 说明**决策 35「门槛交给 AI 与教程」不成立**。此时要回头重估决策 12 的取消——面向新手的裁剪视图（I8 的留口）可能得兑现，而不是继续加教程 |\n\n**风险 6′ 的对应**：「先自用」的代价是架构可能长成只服务一个人的形状。\nP-1 不是为了预防它，是为了**在它发生时不自欺**。\n\n提前写下来，到时候是执行判断，不是情感决策。\n\n### 7.3 迭代速度来自试飞台，不是模块划分\n\nheadless runner（不开界面跑完整场景）+ 确定性（失败可复现）+ 约束层（不用人看就知道对不对）。\n\n判据：**改完内核，几秒内就能知道所有模板有没有被搞坏。**\n\n### 7.4 决策发现与证据演化（决策 42）\n\n研发 AI 的入口不是直接写计划，而是先按 [ADR-004](adr-004-evidence-governed-evolution.md) 建立：\n\n```text\nTaskContract\n  → 十二面 DecisionCoverage + 负空间扫描\n  → 未知进入 §9 / 高风险触发 DecisionChallenge\n  → 可逆实验与独立质疑\n  → 证据支持的 PlanContract / 实现\n  → evidence package\n  → champion 保持或被 challenger 取代\n```\n\n| 层 | 不允许 AI 静默改变 | 允许怎样进化 |\n|---|---|---|\n| **意图与裁决** | 一句话定义、不变量、hard gate、权限、历史 | AI 可挑战并提交证据，项目所有者批准后走决策修订 |\n| **计划与实现** | 已批准 scope、hard oracle、冻结语义 | 在适配层、候选分支、feature flag 或 shadow mode 中比较 challenger |\n| **治理机制** | L0–L1 的人类保留权、证据只增不改 | 在历史漏判集 + 新植入案例上影子运行；漏判下降且审阅负担可控才升级 |\n\n**高风险未知只阻塞依赖它的不可逆提交，不阻塞整个项目。** 当前最佳假设仍可用于可逆工作，\n但必须写明失效条件、证据要求和回退点。方案采用看证据，不看模型数量，也不要求项目所有者先识别技术错误。\n\n---\n\n## 八 · 存量资产处置\n\n**冻结的含义**：路 / 地形不再加新功能；严重 bug 仍修；[roads.md](../architecture/roads.md) 保持有效，是迁移的规格书。\n\n**要上提为引擎机制的**：[state/roadTypes.js](../../js/state/roadTypes.js) 的**主题包**是决策 20 的原型——它已做到「几何只认 widthUnits，主题永远不改变路宽、最小半径与路网拓扑」。阶段二实现内核皮肤包时照它的形状做；阶段四若迁移，道路主题**直接归并**，不保留两套机制。\n\n**直接留用的**（本来就通用）：停靠系统、i18n（**v17 起只做语言翻译，不再兼任术语层**）、项目门厅、存档信封与迁移链、无边框窗口外壳、图标系统、大纲与详情的交互框架。\n\n**要留用但必须重新设计的**：\n\n| 现有实现 | 为什么 |\n|---|---|\n| [CameraRig](../../js/render/CameraRig.js) | **v17 改判**：原文说「飞行相机是零基础用户的第一个劝退点」——画像换了，这条理由没了。现在只需**扩档**：飞行档位保留且可作默认，另加受限俯视（RTS 簇）与**肩后跟随 + 锁定**（动作簇） |\n| 工具栏与快捷键体系 | **v17 改判**：原文说「现在是专业软件密度，要按概念预算重排」——目标用户就是专业用户，**密度不再是问题**。只需按新的能力面重组，不必稀释 |\n\n**迁移基准**：保留冻结的旧实现作为 oracle 做新旧对拍（同一组输入喂给新旧两边，比较输出几何）。旧代码不删，只在测试里加载。\n\n---\n\n## 九 · 未决项\n\n> **本表是 [ADR-004](adr-004-evidence-governed-evolution.md) 的 `UncertaintyItem` 单一真源。**\n> `I/U/B` = 不可逆性 / 不确定性 / 影响面，均为 1–3；分数是三者乘积，只负责路由：\n> **18–27 关键、8–17 受控、1–7 可逆**。本表只列 `open / testing`；解决后保留 ID，移入表下并链接证据。\n\n| ID | 未知断言 | 类型 | I/U/B=分数 | 决策截止点 · 所需证据 |\n|---|---|---|---|---|\n| **U-003** | **数值表达力**能否覆盖伤害、经验、后坐力与装备叠加 | 语义 | 2/2/3=12 | M2-4 · 在 RTS 模板真写一遍伤害公式；不够才抬表达力 |\n| **U-004** | 数据表引用语法与作用域：工程/内容包、跨包引用、行 id 与 `kind` 命名空间 | 语义 | 3/2/3=18 | M2-2 数据模型冻结前 · 三种跨包样例 + 迁移推演 |\n| **U-005** | 动态集合的持久化粒度及其与状态声明的关系 | 语义 | 3/2/3=18 | M2-2 数据模型冻结前 · 背包、生产队列、存档迁移微案例 |\n| **U-006** | 动画状态机宿主形态：组件、事件表分组或第三种数据 | 架构 | 2/2/2=8 | M3.5 前 · 同一状态机用候选形态表达并比较 diff、复用与回放 |\n| **U-007** | root motion 位移曲线在导入期还是首次播放时烘焙 | 架构 | 2/2/2=8 | M3.5 前 · 确定性、冷启动、首包和缓存失效对拍 |\n| **U-008** | 寻路实现选型：navmesh / 流场 / 网格 A* | 架构 | 1/2/2=4 | M2-3 · 1000 单位基准；不过退役到流场，查询接口不变 |\n| **U-009** | 视野迷雾粒度及高度/掩体遮挡 | 产品 | 1/2/2=4 | M2-3 · RTS/MOBA 灰盒的正确性与性能对照 |\n| **U-010** | 第一批输入意图及内核/模块边界，手柄是否进入本轮 | 架构 | 2/2/3=12 | M2-3 · 两簇模板输入覆盖矩阵 + 设备替换测试 |\n| **U-011** | 条件动作的注册者与 JS 沙箱注册方式 | 架构 | 2/2/3=12 | M2-3 · J1–J3 负例、模块扩展和确定性回放 |\n| **U-012** | 教程形态及如何随能力交付而不腐烂 | 产品 | 1/3/2=6 | M2 首批能力 · 分步引导/教学工程小样 + D.5 真人观察 |\n| **U-013** | 场景切换时全局与场景内状态的精确边界 | 语义 | 3/2/3=18 | M2-2 数据模型冻结前 · 切换、返回、失败重载和旧存档轨迹 |\n| **U-014** | 可持久化状态按变量、组件还是实体声明 | 语义 | 3/2/3=18 | M2-2 数据模型冻结前 · 三类作品存读档 + schema 迁移对拍 |\n| **U-015** | 界面页是 DOM overlay 页栈还是场景的一种 | 架构 | 1/2/2=4 | M3.5 前 · 标题/暂停/背包的输入、存档和导出纵切 |\n| **U-016** | 音效与粒子贴图随内置库还是独立内容包 | 交付 | 1/2/1=2 | M2-4 · 包体、缓存、替换和许可比较 |\n| **U-017** | three.js / Rapier / ECS / 素材 / 字体的许可清单 | 事实 | 2/1/3=6 | M2 导出前 · 官方许可证与再分发条件核对 |\n| **U-018** | 快照体积与资源数上限 | 交付 | 1/2/2=4 | M4 前 · 代表工程体积分布与加载/存储预算 |\n| **U-019** | 不上传遥测时怎样观察真人卡点 | 产品 | 1/2/2=4 | D.5 前 · 本地事件记录与现场观察能否定位失败 |\n| **U-020** | 每个模板需要哪些配方与教程条目 | 产品 | 1/2/1=2 | M2 内容生产 · 从模板任务和失败点反推覆盖表 |\n| **U-021** | 视觉插槽是一 kind 一插槽还是允许多变体 | 语义 | 2/2/2=8 | 第二套皮肤前 · 换皮完整性、随机变体与稳定回放案例 |\n| **U-022** | 内容包最小字段：id、版本、作者、许可、依赖、哈希 | 语义 | 3/2/3=18 | M2-4 导出格式冻结前 · 依赖解析、缺包、升级和回退推演 |\n| **U-023** | 后端最小形态、OAuth、清理与删除请求 | 架构 | 2/2/2=8 | M4 前 · 发布/删除/举报纵切与合规核对 |\n| **U-024** | 块大小、加载触发、预加载圈和卸载延迟 | 架构 | 2/2/3=12 | M1-g · RTS/动作两类场景的确定性、内存和卡顿基准 |\n| **U-025** | Rapier 能否跨平台逐帧确定 | 事实 | 2/3/3=18 | 闸门 A 前 · 两台机器固定输入逐 tick **状态哈希 + 接触事件序列**；不通过换库。**同机已通过**，见 [spike-001](spike-001-rapier-determinism.md)；跨平台未验 |\n| **U-026** | 1000 个完整模拟实体是否可达 | 事实 | 1/2/3=6 | M2 RTS 模板 · 真实玩法负载与帧时间剖析 |\n| **U-027** | provider 能力探测靠声明、请求还是组合 | 架构 | 1/2/2=4 | M3-a · 三类 provider 的误报/漏报与降级纵切 |\n| **U-028** | 弱模型降级重试次数与超时上限 | 交付 | 1/2/2=4 | D.6 · 成功率、时间、费用和停止质量分布 |\n| **U-029** | 内置 AI 成本由免费额度、限速还是 BYOK 承担 | 产品 | 1/3/2=6 | M3 上线前 · 真实任务费用与转化实验 |\n| **U-030** | AI 输出可达的网络、存储、循环与外部副作用边界 | 语义 | 2/2/3=12 | M3 执行前 · 权限矩阵、提示注入和越权 Action 负例 |\n| **U-031** | 路网等非 ECS 形状的数据如何在 ECS 中安身 | 架构 | 2/2/2=8 | 闸门 B · 城市迁移纸面演练与查询接口原型 |\n| **U-032** | 治理机制的无效挑战负担与采用阈值 | 交付 | 1/3/3=9 | M0-d · ADR-004 G1–G3 的 shadow 基准分布；不在纸面编造阈值 |\n| **U-033** | 触发规则的初始实体集：载荷起点还是全集起点（ADR-002 §3 与 §4 冲突） | 语义 | 3/2/3=18 | M0-a 冻结前 · [推演](adr-002-walkthrough.md) 第 2.1 节，三个样例重跑 |\n| **U-034** | **两层以上的嵌套关联查询**是否为八款目标游戏所需（r2 on` 只在首步执行前校验；之后每步的 `beforeRevision` 必须等于本 run 上一步提交的 revision；\n本 run 自己推进 revision 不算冲突，任何绕过本 run 的世界修改稳定转 `needs-review`，不得自动覆盖；\n**U-042 修复 Action 白名单与越界路由**——2026-08-09 由 [M1-b 验收](../../tests/actions.test.mjs)关闭：\nrepair 只能使用本步骤已批准的 `allowedActions` 与稳定语义影响域，超出任一者稳定转 `needs-review`；\n不得在 `Repairing → Executing` 环内自行扩权；\n构建与依赖管理（阶段零）；**事件表的求值模型与实体集传递语义**——v16 移出，前置到阶段零定稿，见 [adr-002](adr-002-eventsheet-eval.md)（决策 31）；\nBYOK 密钥存放（桌面外壳 + 网页代理）；事件表表达力边界（决策 18）；模型接入的抽象层形态（决策 21）；\n**事件表要不要真函数**——v11 结案：**要做**，形式是「带参数的可复用行为单元」（§4.7）。\n原来的触发条件「三处重复才做」被推翻，理由是**只要游戏里有技能 / 道具 / buff / 敌人 AI，重复就是必然的**，\n而那覆盖几乎所有完整作品。\n\n---\n\n## 十 · 风险\n\n> **现表 18 条。** v17 重做了这张表（删 5 · 降级 4 · 加重 2 · 新增 2），v18 追加风险 20，v20 加重并补执行点，v21 追加风险 21。\n> **删掉的 5 条全是「为普通人和为分发链付的税」**（1b 概念预算 · 7 3D 门槛 · 8 双模式退化 ·\n> 13 注册墙 · 14 数据责任），随决策 2 / 12 / 19 / 14 / 23 / 28 的推翻与推后一起消失。\n> **真正要盯的是加粗那 8 条**，其余是记录在案、暂不投入的。\n\n| # | 风险 | 缓解 |\n|---|---|---|\n| **1** | **内核膨胀**（最可能的死法） | §3.2 范围纪律 + **决策 39 换了判据源**（两款目标游戏且分属不同簇）+ 决策 26（留口而非砍能力）。**v17 的新执行点**：§5.2 明确标出三项「没干净过关但保留」的成员，下次要加东西先看它们能不能出局 |\n| 2 | 模板太像，通用性没证明 | **v17 降级**：两个模板的差异轴（相机 / 控制 / 节奏 / 联机 / 动画栈）比原来四个小模板拉得更满。**但风险换了形态**——只剩两个模板时纪律会失效，这由决策 39 与闸门 E.2（加第三个模板不新增内核概念）接管 |\n| **3** | **基础设施不产生乐趣**（v17 加重） | **原解药是「阶段二能发链接给别人」，而分享已推到阶段四**。新解药只能是：**阶段二末就要有一局能玩通的 RTS**，且平台跳跃脚手架更早给出可玩闭环。**这是本轮最现实的死法**——一个人做三个阶段的基础设施，中途没有正反馈 |\n| **4** | **AI 的延迟与失败击穿产品定位**（v17 加重） | 四条非功能项与功能同等对待；闸门 D 含延迟上限。**加重的理由**：决策 35 把门槛交给了 AI，**AI 从卖点变成承重结构**。失败兜底因此必须做实——AI 挂掉时教程与配方要能独立扛住 |\n| 4b | 接的模型太弱，体验崩掉却怪编辑器 | **v17 降级**：目标用户会自己配模型、看得懂能力差异。仍保留能力探测与「当场说清能做什么」 |\n| **5** | **事件表表达力不够，做不出八款目标游戏** | **v17 重定向**：原问题是「太简单，普通人够用但做不出游戏」，现在是「**RTS + 完整作品够不够强**」。决策 18 的封顶理由已换（技术理由而非可读性），**任意控制流与递归的封顶可以在阶段二实测后重估**。退役条件不变：写不出来就**加受限原语，不退回节点图** |\n| **6′** | **只有你能用**（原风险 6 的反面，v17 新增） | 「先自用」的代价是架构长成只服务一个人的形状，**开放阶段可能永远到不了**。缓解：**I8 的 registry 视图机制现在就留着**（不实现）；**项目级退役条件 P-1** 用来在它发生时不自欺 |\n| 9 | **美术量泄漏进玩法**，换皮就崩 | I9 + 皮肤包完整性约束 + 闸门 C.5。**v17 新增两个泄漏面**：root motion 的位移曲线、动画状态机的转移——两者的解法都在 §4.4，**都是「玩法量归 kind，呈现量归皮肤包」的再一次应用** |\n| 10 | **竞品已在场上且跑在前面** | 见下。**v20 再换基线**：Unity / Roblox / GDevelop 都已让 AI 直接改工程，I1 + I3 仍是不变量但不再单独构成差异。Clay 要用**确定性 Action 事务 + hard oracle + 逐步证据 + 供应商无关**把同一原则做成更可信的执行结果 |\n| 11 | **模板与皮肤是内容生产，不是引擎开发** | **v17 降级但没消失**：模板从四个减到两个，移动端与分享的内容工作量出局。**但闸门 F 仍要 30 分钟内容**，那仍是关卡设计 + 美术 + 调平衡的活。砍范围时**优先砍内容的量，不砍引擎能力** |\n| 12 | 性能预算超标 | **v17 降级**：移动端出局后数字全部放宽（8MB / 桌面 60fps）。**但 P1 播放期与编辑器分包不许跟着松**——它的理由已换成决策 24 的移植退路 |\n| **15** | **物理确定性守不住**（决策 29 的最大技术风险） | 阶段一 spike 就验；**不通过换物理库，不放宽决策 29**。**v17 加重了它的分量**——决策 29 现在服务八款里的五款，不再是为遥远的阶段五预付 |\n| 16 | 流式加载与确定性打架（决策 30） | S1–S3 三条纪律；闸门 A 增加「卸载重载后结果一致」的断言 |\n| **17** | **JS 条件动作击穿确定性**（v17 加重） | §7.1 确定性沙箱 J1–J3。**加重的理由**：目标用户会写代码，**写 JS 条件动作的人变多了**。这条从「补丁」升为**核心机制**，要在阶段一落地而不是阶段二 |\n| 18 | 对覆盖面的过度承诺 | **v17 降级**：A.9 的玩法契合度表 + 决策 36 明确写死「刺客信条只到潜入 + 战斗 + 沿预设点攀爬」+ §3.4 把动画档 3 与竞技 FPS 列入**方向性封顶** |\n| **19** | **动画栈档 2 是本轮最大的单项工程**（v17 新增） | 状态机 + 混合 + root motion，是原文档明确留口的东西，理由是「对单人项目是无底洞」。**现在打开了，但只到档 2，档 3 封顶**。§4.4 的两条冲突解法必须先落地，否则它会污染玩法层与皮肤包两处。**预定砍单**：阶段三 ½ 宁可砍关卡数量与界面页，不砍它 |\n| **20** | **自主循环跑飞或错误通过**（v20 加重，决策 40 档 2） | 本轮正式承担。按 [ADR-003](adr-003-verified-agent-loop.md) 把状态、权限、事务、预算与停止条件放在引擎侧；步骤候选分支通过 hard oracle 才提交；executor 与 verifier 隔离；重复失败、越界、削弱测试、缺少原语或超预算立即停止。闸门 D.4 用人工植入负例测**错误通过率**，不能只测“能否跑完” |\n| **21** | **关键决策在用户和 AI 的共同盲区中逃逸**（v21 新增） | 按 [ADR-004](adr-004-evidence-governed-evolution.md) 强制决策面、负空间、`U-NNN`、独立质疑与追踪链；高风险项只暂停相关不可逆提交。治理基准集持续吸收真实逃逸案例，机制用 champion/challenger 影子比较演化；项目所有者守意图与取舍，不充当技术正确性 oracle |\n\n**v17 删掉的五条**（连同它们的缓解措施一起消失）：\n1b 概念预算被吃掉（决策 35 换了承担者）、7 3D 是门槛（画像换了）、\n8 两种模式退化成两个编辑器（决策 12 取消）、13 注册墙转化（推后）、14 数据责任（推后）。\n\n**关于护城河（风险 10 的展开）**\n\n不是「又一个通用引擎」——那条路拼不过 Godot。**v17 之后的位置是：AI 与人共用同一条编辑通道的 3D 引擎。**\n\n- **与世界模型**（Genie 一类）的边界：它们交付**生成的体验**（一次性、不可寻址、改不了），本项目交付**可持续编辑的工程**\n- **与 Nilo / Astrocade 的边界**：两家都在同一处让位——**产出用户改不动**（前者生成代码，后者黑盒）\n- **与 Unity MCP / Godot AI 的边界**（v17 起这是最重要的一条）：它们是**外挂式**——\n  文件是权威，AI 改完编辑器要重载、撤销栈丢失、人无法单独撤销 AI 的某一步。\n  **本项目的 AI 通道是内生的**（[ai-native-engine.md](ai-native-engine.md) 问题定义）\n\n**I1 + I3 仍是设计原则，但不再单独宣称市场独有。** Unity、Roblox 与 GDevelop 都已让 AI 直接改工程；\nClay 的差异化落在这两条原则的**可验证执行**：确定性 Action 事务、逐步证据、hard oracle、恒定恢复成本与供应商无关。\n\n> **v17 换了押注（原文是 I2 + I3）。** 换的原因不是 I2 变得不重要——\n> **恰恰相反：I2「逻辑是数据」现在是 I1 的前提**。逻辑一旦变成代码，\n> AI 的产出就无法走 Action 层、无法逐行 diff、无法局部重试、无法单独撤销。\n> 变的只是**理由**：从「普通人要读得懂」换成「**AI 通道要成立**」。\n>\n> 这也让决策 13（事件表而非节点图）站得更稳了——\n> 原来那条论证的一半依赖「用户实际读不读得懂」这个未经验证的假设（风险 5），\n> 现在它依赖的是「模型写有序行比写图可靠」与「逐行 diff」（[A.2](#a2-决策-13为什么是事件表不是节点图)），\n> **两条都不依赖画像。**\n>\n> **v20 补充**：市场已经追上「AI 在编辑器里做事」这个表层。I1 + I3 的价值不减，\n> 但护城河必须由 [ADR-003](adr-003-verified-agent-loop.md) 的控制协议兑现，而不是靠一句定位声明。\n\n---\n\n## 附录 A · 关键决策的依据\n\n只保留能防止反复讨论的证据，正文不再重复。\n\n### A.1 竞品格局（2026-08-08 核对，2026-11-08 前复查）\n\n| 产品 | 当前领先能力 | 对 Clay 的边界与启示 |\n|---|---|---|\n| **Unity AI** | 已有项目上下文、编辑器操作、验证、撤销、权限控制、AI Gateway 与 MCP | 「AI 内生于编辑器」不再独有；Clay 必须证明 Action 事务、hard oracle 与跨 provider 的结果更可信 |\n| **Roblox Assistant** | Planning Mode 已交付可编辑计划、批准门、checkpoint、构建、虚拟输入、日志 / 截图试玩与自动修复 | 产品控制结构可直接借鉴；官方同时承认错误通过、有限观测与无实时反射，Clay 的切入点是**可重复判定与证据** |\n| **GDevelop AI** | 2D / 3D；AI 直接读写场景、对象、变量、行为与事件表，步骤可见、可停、可恢复 | 与 Clay 最接近，证明「AI + 事件表」已是现有品类；差异不能再建立在“有事件表 AI”上 |\n| **Rosebud / Astrocade** | 从想法到可玩结果快；Rosebud 还暴露可编辑 JavaScript，Astrocade 把 remix 做成核心循环 | 适合需求验证与传播；稳定工程、逐 Action 审计和确定性不是其主要交付 |\n| **Genie 3 / World Labs** | 生成式交互世界，视觉与探索反馈快 | 交付的是生成世界而非可维护工程，与 Clay 边界明确，但会抬高用户对即时反馈的预期 |\n| **PlayCanvas / Babylon.js** | 成熟浏览器 3D、WebGPU、资产与编辑基础设施 | 自建 three.js 编辑栈必须用 ADR 单独证明；与 AI 控制协议无直接冲突 |\n| **Nilo** | 当前重点是 Roblox 3D 资产生产工具 | 不再视为同定位引擎竞品，只作为资产生成工作流参考 |\n| **Godot** | 开源、概念少、headless 快 | 概念全给程序员；节点式可视化脚本使用率低并已移除，继续支持事件表而非节点图的判断 |\n\n**v20 直接证据**：\n[Roblox Planning Mode](https://devforum.roblox.com/t/announcing-planning-mode-for-roblox-assistant/4580715) ·\n[Playtest Agent](https://devforum.roblox.com/t/studio-beta-studio-assistant-mcp-playtest-agent/4566767/1) ·\n[虚拟输入与自动试玩](https://devforum.roblox.com/t/assistant-updates-studio-built-in-mcp-server-and-playtest-automation/4474643) ·\n[Roblox Assistant 文档](https://create.roblox.com/docs/assistant/guide)。\n其余产品事实在下次复查时逐项补官方来源；到期前不得继续把本表当作现状依据。\n\n### A.2 决策 13：为什么是事件表，不是节点图\n\n| 证据 | 说明 |\n|---|---|\n| Godot 删掉了节点式可视化脚本 | 5000 人调研中**仅 0.5%** 以它为主力。官方复盘：「一开始的路子就不对」 |\n| Godot 的文档理由同样适用于 AI | 每个例子都要截图、维护不动——**AI 也得看图或看一堆坐标** |\n| 非程序员做出成品靠事件表 | Construct / GDevelop 的条件-动作行；社区共识是它比 Blueprint 好懂得多 |\n| Blueprint 的成功不可迁移 | 它证明「可视化能替代代码」，不证明「可视化能让普通人编程」——用户本质上是程序员 |\n\n**AI 侧的增益（决定性的一条）**：\n\n| | 节点图 | 事件表 |\n|---|---|---|\n| 形状 | 图（节点 + 连线 + **布局坐标**） | **有序的行** |\n| 模型生成 | 图结构 + 空间推理，模型公认短板 | 写列表，模型最擅长 |\n| diff | 图同构比较 | **逐行 diff** |\n| 出错定位 | 「某条连线错了」 | 「第 7 行的条件不成立」 |\n\n**成本收益**：不再需要画布、连线交互、自动布线、布局算法、缩放平移。\n\n### A.3 决策 14：为什么分享不能再推\n\n- **Astrocade** 8 个月 2000 万活跃、7.5 万游戏，核心机制就是分享与 remix\n- **Rosebud** 编辑能力更强，规模小两个数量级\n\n而对本项目它几乎免费：决策 7 已是「同一应用切播放模式」，分享 = 一个 URL + 只读播放。\n**且 remix 与决策 9 是同一件事**——模板就是别人的作品。做了分享，模板库会自己长。\n\n**v14 的补充（决策 28）**：发布这一步改为需要注册。\n它不再「几乎免费」了——后端要担用户数据的责任，发布转化也会掉一截（§10 风险 13）。\n换来的是**作品归属**：匿名发布的作品，日后做市场时认领不回来，而决策 27 说市场是长期目标。\n\n### A.4 决策 15：城市迁移为什么降级\n\n3200 行迁移 + 新旧对拍是巨大沉没成本；而它要证明的（内核能承载不同领域）用 3–4 个小模板证明更强也更便宜；顺带修掉「两个模板太像」。**闸门 B 的纸面演练保留**——它便宜，且是内核设计的真实压力测试。\n\n### A.5 决策 18：为什么不是「表达力做到哪一档」\n\n那个问法本身是错的。削表达力换易懂，结果一定是塔防写不出来、被迫硬编码 JS（违反闸门 C）。\n正确做法是**表达力保持中等，门槛靠配方降**——不够用的人往下拆配方，学不会的人直接用配方，**两拨人用的是同一份材料**。\n\n**v8 的补充**：同一个错误在别处又犯了一次——「嵌套只许一层、不许参数位算术」也是削表达力。\n没有多层子事件，规则会横向铺开成一大片；没有参数位算术，伤害公式这类东西根本写不出来。\n两者都已放开，封顶改设在**任意控制流、递归、完整表达式语言**（§3.4）。\n\n**v11 的再次补充**：同一个错误犯了第三次——「不做真函数」也是削表达力。\n四款 AAA 的压力测试里，Dota 精确地打在这一点上：**只要游戏里有技能，重复就是必然的**。\n现已改为做**带参数的可复用行为单元**（§4.7），封顶只留递归与任意控制流。\n\n### A.6 决策 20：原型来自自己的代码\n\n[state/roadTypes.js](../../js/state/roadTypes.js) 开头的三条注释就是完整雏形：几何只认 widthUnits；主题是场景级呈现，换主题是一次设置变更；主题声明规则而非宽度表。v5 只是把它从模块私有实现上提为引擎级机制。\n\n判据几乎不额外花钱——I7 的 headless runner 与确定性本来就在计划里，**v5 只是把它认领为「美术隔离」的强制执行点**。\n\n### A.7 决策 21：为什么「接各种模型」是可行的\n\n这件事在别的引擎里很难，在本项目里便宜，原因是**架构已经把对模型的要求压到了很低**：\n\n| 已有的设计 | 对模型要求的影响 |\n|---|---|\n| 只暴露三个入口（`describe` / `listAvailableActions` / `apply`） | 不需要「一次塞几百个工具」，弱模型也不会被工具目录淹没 |\n| **渐进披露**：按需返回 schema | 上下文需求小，**不需要长上下文模型** |\n| Action params 是**可直接喂给模型的 JSON Schema 子集** | 有约束解码就用，没有就贴 schema + 校验重试，行为一致 |\n| 产出是 **Action 序列**而不是整张图 / 整段代码 | 每步独立可校验，**弱模型的错误是局部的、可重试的**，不是整体失败 |\n| **约束层**给结构化失败反馈 | 重试是收敛的，不是乱撞——这正是弱模型最需要的 |\n| 优先**挑配方 + 填参** | 把「创作」降级为「选择 + 填空」，弱模型也能做对 |\n\n**结论**：`I10` 不是额外负担，它是前面几条设计的**自然推论**。\n真正要守的只有一条——**不要在任何地方偷偷依赖某一家的独有能力**。\n\n---\n\n### A.8 决策 23：为什么「不做」清单需要拆成两张\n\n原来那张扁平的清单把两件不同的事混在一起：\n\n| | 砍掉它影响什么 | 处理方式 |\n|---|---|---|\n| **引擎范围** | 影响引擎能长多大 | 可以砍，砍了不影响用户作品质量 |\n| **作品质量** | 影响用户能做出什么水平的东西 | **不能砍，只能封顶** |\n\n音频、动画过渡、特效、材质与光照、移动端可玩全部属于第二类，却被写进了第一类。\n后果是自相矛盾：**决策 14 要求作品发给别人玩，而一个没声音、手机打不开的链接根本发不出去。**\n\n正确的做法不是「做 / 不做」，是**「做到哪儿为止」**——每一项给一个明确的封顶。\n封顶才是防膨胀该管的地方；一刀砍掉不叫克制，叫把问题推给用户。\n\n### A.9 主流玩法压力测试\n\n**先分清两种判定，它们的结论完全不同：**\n\n| 判定标准 | 问的是什么 | 结论 |\n|---|---|---|\n| **成品判定** | 能不能做出那款游戏本身 | **都做不到**——但那是 300 人 × 5 年、竞技网络与运营的问题，不是编辑器功能问题 |\n| **灰盒 MVP 判定** | **核心玩法循环**能不能跑通，几何体代替美术 | **六个里五个可做**，缺四项通用能力 |\n\n第二个才是对编辑器功能的有效判据。\n\n#### 灰盒 MVP 逐款结论（v12）\n\n| 游戏 | 判定 | 卡在哪 |\n|---|---|---|\n| **Dota 2** | ✅ 可做（单人对 AI） | 选择与指令、视野迷雾 |\n| **星际 / 红警** | ✅ 可做（小规模） | 选择与指令、播放期建造、迷雾；500 实体上限偏紧 |\n| **艾尔登法环** | ✅ 可做（Boss 房） | 动画事件 |\n| **塞尔达** | ✅ 可做（神庙式解谜 + 小区域） | 元素交互矩阵只能小规模；大地图靠缩小绕开 |\n| **CS** | ⚠️ 只有单人打 bot | **竞技本体做不到**，见下 |\n\n#### v16 的三款复核\n\nv12 的判定过于乐观了两处，也漏测了一整类玩法。**复核结论写在这里，不改 v12 的原表**：\n\n| 游戏 | v12 | v16 复核 | 差在哪 |\n|---|---|---|---|\n| **红警 / RTS** | ✅ | ✅ **判定成立，是三者中最契合的一类** | 但有两个未归属的卡点，见下 |\n| **塞尔达** | ✅ | ⚠️ **原判偏乐观** | 磁力抓取、举起放下、组装机关全要**关节**，而关节原本整个划在留口——**没有关节，物理只是「会掉下去」，不是「物理即玩法」**。已由决策 33 补上最小集 |\n| **刺客信条**（v12 未测） | — | ❌ **只到潜入原型** | 见下 |\n\n**红警的两个卡点**（都不是能力缺失，是无归属）：\n\n1. **寻路被砍进塔防模块**（§5.2）。塔防要的是固定路径，RTS 要的是**几十个单位的群体寻路 + 局部避让**，\n   难度不是一个量级。MVP 用小地图 + 流场够，但**要单独排，现在无规格**\n2. **500 同屏实体**：50 单位/方 + 建筑 + 投射物 + 特效，勉强够。文档原文「偏紧」是准的\n\n**刺客信条为什么只到潜入原型**：能做的是一座小据点、几个带视野锥的守卫、蹲伏、暗杀触发、\n沿预设点爬墙——**做不到的是这款游戏真正的产品：移动手感本身**。\n\n| 需要什么 | 现状 |\n|---|---|\n| 跑酷 / 攀爬 / 边缘抓取 | 动画状态机、混合树、IK **全部留口**，本轮只有 clip + 交叉淡化 |\n| 根运动（root motion） | **全文未提及** |\n| 城市人群 | 500 实体上限 + LOD / impostor 留口 |\n| 城市尺度 NPC 寻路 | 寻路在模块，navmesh 无归属 |\n| 视野锥 / 警戒状态 | ✅ 射线查询 + 行为单元够用 |\n\n**这不是缺陷，是取舍**：动画状态机 + IK + root motion 对单人项目是个无底洞，\n而它对核心假设（I2 事件表可读、I3 同一种材料）零贡献。**但要写出来**——见下一节。\n\n#### v17 的八款定案（本节现在是判据源 —— 决策 39）\n\n**v17 起，A.9 不再是「压力测试」，它是范围纪律的判据源本身**（§3.2、§5.2）。\n八款按簇排列，**判定用的是灰盒 MVP 标准**（核心玩法循环，几何体代替美术）：\n\n| 簇 | 游戏 | 判定 | 关键依赖 |\n|---|---|---|---|\n| **俯视指令** | 红警 | ✅ | 群体寻路、视野迷雾、建造、数据表、lockstep |\n| | 星际争霸 | ✅ 小规模 | 同上 + **1000 实体预算**（决 30 上调的直接原因） |\n| | 魔兽争霸 | ✅ | 同上 + 英雄技能（技能目标选择 + 行为单元） |\n| | Dota 2 | ✅ 单人对 AI | 技能目标选择（**核心**）、**物品栏（动态集合）**、视野 |\n| **第三人称动作** | 塞尔达 | ✅ 神庙式 + 小区域 | **关节**（决 33）、动画状态机、背包、大世界流式 |\n| | 艾尔登法环 | ✅ Boss 房 + 小区域 | **动画事件 + root motion**（决 36 的主要驱动者）、锁定、背包 |\n| | 刺客信条 | ⚠️ **明确降级** | **潜入 + 战斗 + 沿预设点攀爬。没有丝滑跑酷**——那要动画档 3，已封顶（§3.4） |\n| | **战争机器** | ✅ 单人 / 合作 | 动画档 2、射线命中、掩体。**不做竞技 FPS**（网络模型会裂成两套） |\n\n**三条从这份清单读出来的结论**：\n\n1. **八款里五款是联机游戏，且全部走 lockstep** → 决策 29 从「预付」变成「被证成」，网络模型不分裂\n2. **没有一款需要网格世界、模拟分级、载具物理、样条路网** → v17 把这四项撤回为留口\n3. **刺客信条是唯一一款要降级的** → 它的核心是移动手感，而那是动画档 3。**降级写死在决策 36，不再每轮回来一次**\n\n#### 玩法契合度（v16 新增，风险 18 的应答）\n\n**MVP 覆盖面与玩法的「节奏 + 相机」强相关**，因为整套架构的每一处选择都在往同一个方向使劲：\n\n| 轴 | 玩法 | 为什么 |\n|---|---|---|\n| **强项** | RTS、MOBA、塔防、战棋、roguelite、经营 | 俯视 / 秒级 / 指令驱动。受限相机是默认（决 16）、确定性 + Action 日志天然是 lockstep 底座（A.9）、选择与指令在内核 |\n| **中等** | 魂类 Boss 房、塞尔达神庙、平台跳跃 | 第三人称 / 房间尺度 / 帧级战斗。动画事件托住攻击判定，关节托住物理解谜；缺的是状态机 |\n| **弱项** | 刺客信条类跑酷、character action | **移动本身即玩法**。整个动画栈封顶在 crossfade，这一类拿不下来 |\n\n**这张表的用处是防止隐性判据**：闸门 F 只要求「一款能上架的完整作品」，\n而「通用引擎」四个字会让人默认覆盖全部类型。**弱轴写出来，就不会在阶段三半路去补一个动画状态机。**\n\n**v11 补的三个概念恰好托住了最硬的部分**——技能系统、buff、背包菜单、篝火存档、回合流程，\n全部落在行为单元与流程上。**没有 v11 那轮，这五款一个都做不成。**\n\n#### 补进内核的四项（v12）\n\n| 能力 | 谁需要 | 归属 |\n|---|---|---|\n| 播放期**选择与指令** | Dota / 星际 / 红警 / 战棋 | 内核 |\n| 播放期**放置与建造** | **塔防（本来就要）** / RTS / 城建 | 内核 |\n| **动画事件**（clip 时间点） | 魂类 / 动作 / 任何有攻击判定的 | 内核 |\n| **战争迷雾 / 视野** | 只有 RTS 类 | **模块** |\n\n第四项**数值表达力**（伤害公式、成长曲线）列入未决项，触发条件是「实测写一遍公式」。\n\n#### CS 为什么连 MVP 也拿不下\n\n不是功能缺失，是三件结构上不做的事：**竞技网络**（服务器权威 + 客户端预测 + 延迟补偿，\n与本项目的 lockstep 亲和性正好相反）、**手感精度**（亚帧命中、稳定高帧率，而预算是手机 30fps）、\n**反作弊**。能做的只有「单人打 bot 的射击原型」，而 **CS 的体验核心是对枪**。\n\n同样的道理对星际的天梯成立——但**星际的单人战役、Dota 的单人对 AI 都是完整体验，\n只有 CS 的单人模式不构成一个游戏。**\n\n#### 这次压测暴露的三条通用教训\n\n| 发现 | 处理 |\n|---|---|\n| **拦住完整游戏的不是天花板，是三个架构缺口**（场景与流程、行为单元、运行期状态） | 全部补进 §4.7，数据模型阶段二定死 |\n| **模板集选错会漏能力**——塔防与平台跳跃恰好都不需要那三样，所以架构漏掉了它们 | 加「完整作品模板」，决策 15 修订 |\n| **确定性 + Action 日志 = lockstep 网络的天然底座** | 日后做联机**先做 RTS / MOBA 类**（指令同步），不要先做 FPS 类（服务器权威 + 客户端预测，代价大一个数量级）。回放是白送的 |\n\n**还有一条 v12 才发现的**：现在的模板集（塔防 + 平台跳跃 + 完整作品）**仍然倒推不出\n「选择与指令」和「动画事件」**——所以这两项是**按共性能力直接写进内核清单的，不是由模板倒推的**。\n这是三次法则的一次例外，理由写在这里备查：**当五个主流玩法里有三个以上需要同一样东西时，\n不必等模板出现。**\n\n### A.11 决策 4（只做 3D）的依据（补于 v16）\n\n**这一条一直没有依据条目，而它是全文成本最高的决策之一**——3D 把美术量、动画栈、\n相机设计、性能预算全部乘上一个系数，**且对核心假设（I2 事件表可读、I3 同一种材料）零贡献**。\n补写在这里，是为了让它和其他决策一样可被推翻。\n\n**支持它的三条**：\n\n| 依据 | 说明 |\n|---|---|\n| **差异化位置**（风险 10） | 2D 事件表引擎这一格**已经被 Construct / GDevelop 占满且做得很好**（A.1）。再做一个只能拼质量，拼不过十几年积累。「普通人能用的 **3D** AI 原生网页引擎」这一格才是空的 |\n| **用户画像**（决策 19） | 会 Blender、理解变换与材质的人，**手里的资产和肌肉记忆都是 3D 的**。给他们 2D 反而要重学 |\n| **决策 16 已应答了成本** | 「3D 是门槛」（风险 7）的答案是**受限 3D**：默认地面平面 + 固定相机档位。它把 3D 最劝退的部分（自由飞行相机）降级为一个档位 |\n\n**要诚实记下的代价**：\n\n- **视听下限（决策 23）在 3D 下贵得多**：一套 2D 的「像成品」只要美术风格统一；\n  3D 的还要光照、材质、后处理、动画过渡各一套——**§3.4 视听表里六项本轮做，全部是 3D 带来的**\n- **风险 11（内容生产量）大部分由这条决策产生**：素材库、皮肤包、模板关卡，3D 的工作量是 2D 的数倍\n- **A.9 的弱轴也源于此**：2D 里「移动手感」是几张 sprite，3D 里是一整套动画状态机\n\n**推翻它的条件**：若闸门 C 的真人实测显示，用户卡在**3D 空间操作**（摆放、对齐、相机）\n而不是卡在事件表，则决策 16 的受限 3D 已经不够，**此时该重估决策 4，而不是继续给 3D 加辅助工具**。\n\n> **v17 补充**：这一条的第二、三行依据（用户画像、决策 16 的受限 3D）**随画像一起失效了**。\n> 但结论**更稳**——目标用户本来就在 3D 里工作，八款目标游戏全是 3D。\n> **真正剩下的代价只有一条**：§3.1 的三款参照（星露谷 / 空洞骑士 / 吸血鬼幸存者）全是 2D，\n> **「一个人能做完」这个水位在 3D 下没有被参照过**。这条挂在这里，等闸门 F 给答案。\n\n---\n\n### A.12 决策 35：为什么门槛可以交给 AI 与教程\n\n原文档用画像反推了四条约束——**双模式、术语层、削表达力、概念数量上限**。\n它们的共同前提是「用户是不写代码的普通人」，而那是全文**最容易变、也确实变了**的一条假设。\n\n**v17 的做法不是把门槛取消，是换一个承担者。** 三条理由：\n\n| 依据 | 说明 |\n|---|---|\n| **架构已经把 AI 的门槛压得很低**（[A.7](#a7-决策-21为什么接各种模型是可行的)） | 三个入口、渐进披露、Action 序列而非整图、约束层给结构化反馈、优先挑配方填参——**这些设计本来就是为了让弱模型也能干活**。让 AI 承担「我不知道怎么做」，是这套架构的自然推论，不是新负担 |\n| **教程比裁剪界面便宜，而且不损失能力** | 裁剪界面要维护两套暴露面、两套默认值、一套术语映射，且**永久钉死了简易侧的上限**（M3）。教程是内容，**加了不影响能力，删了不影响架构** |\n| **教程能跟着能力一起交付** | §1.4 的新原则「每个概念自带入口」把它变成可判定的：**加一个概念就要交一条教程**。这比「概念总数有上限」更可执行，也不需要知道用户是谁 |\n\n**代价必须写明**：\n\n- **AI 从卖点变成承重结构**（风险 4 加重）。AI 挂了，门槛就没人承担——所以「失败兜底」这条非功能项从此与功能同级，教程与配方必须能独立扛住\n- **教程是内容生产**，会撞上风险 11。**但它比模板与皮肤便宜得多**，且不做的后果更贵\n- **这条决策有一个可判定的失败信号**：闸门 D.5「教程可用性」。连续两轮不过 → 走项目级退役条件 **P-2**，回头重估决策 12 的取消\n\n**一句话**：**画像会变，AI 与教程这两个承担者不会因为画像变而失效。**\n这正是「不要被画像限制」的可操作含义——**不是无视用户，是不把用户画像刻进架构。**\n\n---\n\n## 相关文档\n\n- [ai-native-engine.md](ai-native-engine.md) — AI 基础设施规格（五根支柱）。**下级文档**，方向与阶段以本文为准\n- [adr-001-ecs.md](adr-001-ecs.md) — ECS 库选型决策记录\n- [adr-002-eventsheet-eval.md](adr-002-eventsheet-eval.md) — **事件表求值语义**。全项目唯一不可逆的一项，阶段零定稿后按 I11 冻结\n- [adr-003-verified-agent-loop.md](adr-003-verified-agent-loop.md) — 计划、Action 事务、分层验证、证据与有界修复\n- [adr-004-evidence-governed-evolution.md](adr-004-evidence-governed-evolution.md) — 决策发现、未知路由、挑战、追踪与方案/机制演化\n- [architecture/roads.md](../architecture/roads.md) — 道路系统架构，迁移时的规格书\n"}, {"id": "ai", "title": "AI 基础设施规格", "md": "# AI 基础设施规格 · 五根支柱 + 验证 / 演化协议\n\n> **定位**：本文是 [goals.md](goals.md) §5.1「AI 基础设施」与 §5.3「AI 作者接口」的详细规格，\n> **不是独立纲领**。方向裁决一律以 goals.md 为准，阶段与闸门见 goals.md §6，本文不再另立路线。\n>\n> 早期版本曾以「垂直引擎护城河」立论，该论点已被 goals.md 推翻（通用引擎 + 领域模块）。\n> 保留下来的是技术设计部分，并按 2026 年的 agent 工程实践作了修正。\n\n## 目录\n\n- [问题定义](#问题定义)\n- [支柱一 · 单一变更通道](#支柱一--单一变更通道)\n- [支柱二 · Action Registry 与渐进披露](#支柱二--action-registry-与渐进披露)\n- [支柱三 · describe：语义 LOD](#支柱三--describe语义-lod)\n- [支柱四 · 约束层：结构化的失败反馈](#支柱四--约束层结构化的失败反馈)\n- [支柱五 · Headless 与确定性](#支柱五--headless-与确定性)\n- [控制协议 · Plan-Build-Verify-Repair](#控制协议--plan-build-verify-repair)\n- [研发治理 · Discover-Challenge-Evolve](#研发治理--discover-challenge-evolve)\n- [事件表的生成方式](#事件表的生成方式)\n- [AI 介入形态](#ai-介入形态)\n- [本文范围内明确不做](#本文范围内明确不做)\n\n---\n\n## 问题定义\n\n2026 年的基线已经不是「聊天框生成代码」。Unity AI、Roblox Assistant 与 GDevelop AI 都能读取项目并直接修改编辑器状态；\nRoblox 还交付了可编辑计划、批准门、checkpoint、虚拟输入试玩与自动修复。\n\n因此 **AI 通道内生**仍是 Clay 的必要结构，但不再足以单独构成差异。真正的问题变成：\n\n> **模型改了什么能否逐步证明，错误判通过时谁能拦住，失败后能否无污染地回到最后一个已知正确状态。**\n\n下面五根支柱提供感知、能力、行动、结构反馈与确定性运行；v20 的验证控制协议负责把它们组成\n可批准、可提交、可判定、可停止的产品闭环；v21 的证据演化协议负责在计划之前发现隐含决策，\n并让当前方案在不改变产品意图的前提下被更强证据取代。\n\n---\n\n## 支柱一 · 单一变更通道\n\n**规则：编辑期世界状态只能通过 Action 改变。** 鼠标、AI、事件表编辑、读档全部收敛到同一入口。\n\n```\n场景 = 初始状态 + Action 序列\n```\n\n这是**语义模型**，用于 diff、回放、审计；**不是存储实现**（见[明确不做](#本文范围内明确不做)）。\n\n白送的能力：\n\n| 能力 | 为什么白送 |\n|---|---|\n| AI 的每一步都能被人单独撤销 | 和人的操作在同一个栈里 |\n| diff 的是**意图**不是**结果** | 「改了 3 个坐标」→「把这条路的半径从 8 改成 25」 |\n| 完整操作回放 / 教学录像 | 日志就是录像 |\n| AI 行为完全可审计 | 每一步留痕、带参数 |\n\n**现状**：[History](../../js/core/History.js) + 17 个 Command 已经是这根支柱的九成。\n差的是**「唯一入口」的强制**——迁移到 ECS 内核时补上，晚补一天就多一天旁路债。\n\n---\n\n## 支柱二 · Action Registry 与渐进披露\n\n每个 Action 声明自己的元信息：\n\n```js\n{\n  id: 'unit.spawn',\n  params: { /* JSON Schema，见下方子集约束 */ },\n  preconditions: [...],          // 什么情况下可用\n  affects: ['transform', 'ai'],  // 影响域\n  reversible: true,\n  describe: (params) => '在出生点生成 3 个近战单位',\n}\n```\n\n### 关键：不要一个 Action 一个 tool\n\n2026 的 agent 工程共识是**渐进披露**——预加载全量工具目录是上下文浪费的最大单一来源\n（Unity MCP 一家就 268 个工具；多个 server 并存时开场即烧数万 token）。\nAction 会随模块持续增长，全量暴露必然失控。\n\n**对模型只暴露三个稳定入口**：\n\n```js\ndescribe(scope, detail)          // 看世界（支柱三）\nlistAvailableActions(context)    // 此刻能做什么，按需返回 schema\napply(actions[])                 // 执行，返回约束校验结果（支柱四）\n```\n\n`listAvailableActions` 是**情境级自省**——不是「这个类有哪些方法」，而是\n「当前选中这个物体、处于这个模式，什么操作有意义、影响谁、能不能撤销」。\nAction 加到 500 个，上下文成本也不涨。\n\n同一份 registry 白送：命令面板（Ctrl+P）、宏录制、脚本控制台、测试夹具、快捷键系统——\n以及**任何能力过滤视图**（goals.md **I8**）：过滤是 registry 的一个视图，不是第二套代码。\n（goals.md 决策 12 的双模式已于 v17 取消，**但这个机制留着**：日后要做面向新手的裁剪界面，入口在这里。）\n\n### params 的 JSON Schema 子集约束（硬性）\n\nAction 的 params schema **必须能原样喂给模型做约束解码**。因此禁止：\n\n- 自定义类型、引擎内部类的引用\n- 深嵌套 `oneOf` / `anyOf`（一层以内）\n- 运行时求值的默认值\n- 靠文档描述、schema 里表达不出的隐含契约\n\n理由：约束解码把**语法错误压到零**，约束层的重试预算全部留给**语义错误**。\n这条不早定，17 个命令各写各的 schema，等接模型时会有一半不可用。\n\n### 三个入口就是能力降级的边界（I10）\n\n供应商适配层、能力探测、降级矩阵、设置界面**全部写在 goals.md §5.5**，本文不重复。\n这里只补一句实现上的要点：\n\n> **降级发生在这三个入口内部，不外溢。** 没有约束解码就「贴 schema + 校验 + 带结构化原因重试」，\n> 没有工具调用就把三个入口退化成单轮 JSON 协议——**上层的 Action 序列与约束层完全不受影响**。\n\n**禁止**：在提示词、协议或解析里依赖任何一家的独有字段与行为。判据是闸门 D.6。\n\n---\n\n## 支柱三 · describe：语义 LOD\n\n每个状态子系统实现两个接口：\n\n```js\nserialize()                 // 精确、稠密、给机器（已有）\ndescribe(scope, detail)     // 语义、稀疏、给 AI 和界面（缺）\n```\n\n**语义描述必须可寻址、可下钻**——先看全局摘要，锁定感兴趣区域再要细节：\n\n```js\nterrain.describe({ at: [120, 80], radius: 20 }, 'detailed')\n```\n\n这与支柱二的渐进披露是**同一个机制的两个面**（结构 vs 能力），不要做成两套 API。\n\n### describe 返回结构化数据，不返回文案\n\n反面例子是让引擎生成「西南缓坡、最陡 8%、中部有东西向走廊」这样的句子——\n那是**模型该做的事**，写进引擎就是把生成成本和语言维护搬进内核，还要乘以 i18n。\n\n引擎输出的是分区统计、极值、坡度直方图、标注区域、拓扑关系。\n[ui/outliner.js](../../js/ui/outliner.js) 与 [ui/details.js](../../js/ui/details.js) 是这件事的人类版本，\n应与 AI 版本共用同一份数据源，避免人机两套描述慢慢跑偏。\n\n**优先级：地形最先做。** 它是目前唯一让 AI 完全失明的子系统——\n`heights: Float32Array` 在 1024×1024 下是一百万个数，读不动也写不动。\n\n---\n\n## 支柱四 · 约束层：结构化的失败反馈\n\n有效状态的判据不能是「运行时崩不崩」——那个信号又慢又稀疏，而绝大多数错误根本不崩，只是不对。\n约束层把「什么是有效」变成一组可枚举、可解释的谓词。\n\n```js\n{\n  id: 'road.maxGrade',\n  severity: 'error' | 'warning',\n  check: (world) => [\n    {\n      at: { entity: 42, segment: 3 },   // 位置\n      observed: 0.11,                    // 实测值\n      limit: 0.08,                       // 约束值\n      alternatives: [                    // 可行替代 —— suggest 由它生成\n        { action: 'road.adjustProfile', params: { grade: 0.08 } },\n      ],\n      message: '这段路坡度 11%，超过卡车爬坡上限 8%',   // 只用于渲染给人看\n    },\n  ],\n}\n```\n\n### `at / observed / limit / alternatives` 四元组是硬要求\n\n修复环的实证结论一致：**给出位置 + 实测值 + 可行替代**的反馈，\n其修复收敛速度显著优于原始诊断信息；只给位置而不给替代不够。\n这决定了 AI 重试是收敛还是乱撞，而字段成本几乎为零。\n\n**第一批约束里必须有一条「皮肤包完整性」**（goals.md 决策 20）：\n当前皮肤是否覆盖了事件表用到的每个 kind 与动画状态。\n它是 I9 的执行点，也是 AI 换皮后自检的依据——缺什么，`alternatives` 里直接给出补哪个插槽。\n\n一份约束集同时喂五个消费者：\n\n1. **AI 的验证器**——生成后自动校验，失败带结构化原因回炉\n2. **AI 的搜索信号**——从二值信号升级为密集、可解释的评分\n3. **人的实时反馈**——现在 [tools/RoadTool.js](../../js/tools/RoadTool.js) 的红色禁建提示是硬编码的；抽出来后所有工具白送（goals.md §3.4「错误必须便宜」）\n4. **测试**——约束就是断言，现有 16 个套件有相当一部分可改写成约束\n5. **文档**——约束集就是「这个引擎的世界规则」的可执行说明书\n\n---\n\n## 支柱五 · Headless 与确定性\n\n两个要求：\n\n- **无渲染可跑**——已做到（数据层零 three.js 依赖，本项目最大的存量资产）\n- **确定性**——相同 Action 序列必然产生相同状态。**这是硬要求，不允许降级**（goals.md 决策 29），\n  因为 lockstep 联机以它为前提；断言范围限定在**玩法状态**，不含渲染与视听。\n  **执行点是 goals.md §7.1 的确定性沙箱**：条件与动作的 JS 实现禁触时间与随机源，\n  由内核注入 `rng`、`tick` 与 `dt`，注册时静态检查（[adr-002](adr-002-eventsheet-eval.md) §8）\n- **事件顺序也是确定性的一部分**（r2 新增 D4）——同一物理步内产生的触发事件，\n  入队前按 `(类型, 主实体 id, 次实体 id)` 稳定排序。物理引擎交回的原始顺序**不保证跨平台一致**，\n  而顺序不同就足以让世界状态分叉。**这一条是[真推演](adr-002-walkthrough.md)撞出来的，纸面通读四个版本都没发现**\n\n第二条**尚未做到**：[GameClock](../../js/sim/GameClock.js) 用 `new Date()` 初始化，\n[core/project.js](../../js/core/project.js) 用 `randomUUID()`。\n非确定性一旦渗进世界状态，回放和 A/B 试算全废。改由 Action 参数传入即可。\n\n做到后解锁两件事：\n\n1. **AI 在沙箱里跑 N 个方案变体，用约束层打分，只把最好的提交给人审阅。** 从「生成一个答案」变成「搜索解空间」。\n   **这与五根支柱合起来就是 agent 的完整闭环**——感知（支柱三）· 知道能做什么（支柱二）·\n   行动（支柱一）· 获得结构反馈（支柱四）· 重放成果（支柱五）。goals.md 决策 40 把它写成了可分档的能力。\n   **五根支柱不用重做，但必须补计划、事务、oracle、证据与停止语义。**\n2. **脚本化试玩 + 断言**——这件事**不需要 AI**，是纯试飞台能力，\n   它是**闸门 C.3「1000 单位规模下由脚本跑完并断言」**的直接依赖。\n   同类能力已在商业平台落地（Roblox Assistant 的自动试玩，2026-04）。**早做早受益。**\n\n---\n\n## 控制协议 · Plan-Build-Verify-Repair\n\n完整字段与状态语义以 [ADR-003](adr-003-verified-agent-loop.md) 为准。这里说明它怎样接到五根支柱上：\n\n```text\n用户意图\n  → planner 生成 PlanContract（describe + listAvailableActions）\n  → 人批准具体 plan version 与 baseRevision\n  → orchestrator 在候选事务执行一步（apply）\n  → verifier 跑 V1 结构 / V2 行为 / V3 体验证据\n  → hard oracle 全过：commit checkpoint\n  → 未通过：带失败签名进入有界 repair，或停止交还用户\n```\n\n| 控制对象 | 引擎负责 | 模型负责 |\n|---|---|---|\n| 计划 | schema、版本、作用域、审批失效 | 目标拆解、假设、步骤与 TestSpec 建议 |\n| 执行 | `baseRevision`、事务、幂等、权限、真实 `affects` | 提议符合本步白名单的 Action |\n| 验证 | 运行 TestSpec、hard / soft 边界、最终判定 | 解释观测、提出体验问题 |\n| 修复 | 预算、重复失败检测、禁止改 hard 测试、停止 | 原因假设与最小修复 Action |\n| 证据 | `StepReceipt`、`EvidenceLedger`、重放 | 给人看的摘要 |\n\n### 三层验证不是三票表决\n\n- **V1 结构**：schema、前置条件、引用完整性与约束层。失败即失败。\n- **V2 行为**：固定 seed、输入意图轨迹、状态断言与回归测试。hard oracle 的主要来源。\n- **V3 体验**：日志、截图、真实键鼠和视觉判断。默认是 soft 证据，不能覆盖 V1 / V2。\n\n直接传送角色只能验证某个目标状态可达，不能验证真实输入、相机、导航或角色控制器。\n测试这些系统时，TestSpec 必须声明输入意图轨迹，禁止用更短的旁路让测试“通过”。\n\n### 隔离的是权限与上下文，不强制多模型\n\nplanner 只读，executor 才能提出 `apply`，verifier 只能运行已批准的 TestSpec 与读取候选 diff。\n三者可以由同一个 provider / model 顺序承担，但上下文必须隔离；verifier 不接收 executor 的自我结论。\n运行状态属于引擎的 `Run`，三个入口继续无状态，provider 会话不是恢复依据。\n\n### 修复必须收敛或停止\n\n每轮修复先提交失败签名、原因假设、最小 Action 集和回归范围。同一失败连续两次、影响域越界、\n试图削弱 hard TestSpec、缺少 registry 原语、revision 冲突或任一预算耗尽，立即停止到 `NeedsReview`。\n停止时交付最后通过的 checkpoint 与完整证据，而不是继续碰运气。\n\n---\n\n## 研发治理 · Discover-Challenge-Evolve\n\n完整协议以 [ADR-004](adr-004-evidence-governed-evolution.md) 为准。它位于 `PlanContract` 之前，\n约束的是开发 Clay 的 AI 以及未来设计代理，不是运行期游戏 AI：\n\n```text\n用户意图 / goals 不变量\n  → TaskContract（事实、假设、scope、权限）\n  → 十二面 DecisionCoverage + 负空间扫描\n  → U-NNN / DecisionChallenge / 可逆实验\n  → 证据足够后生成 PlanContract\n  → ADR-003 执行与验证\n  → evidence package 更新 champion 或保留现状\n```\n\n| 控制对象 | 系统负责 | AI 负责 |\n|---|---|---|\n| 决策覆盖 | 十二面状态不可留空，`open` 必须链接 `U-NNN` | 主动寻找用户未提出的语义、边界和反例 |\n| 风险路由 | 按不可逆性 × 不确定性 × 影响面限制提交范围 | 提议最小可逆 probe 和仍可继续的工作 |\n| 决策挑战 | 保护意图、hard oracle、权限与历史；要求明确批准 | 给出隐含决策、选项、证据和推荐，不替用户做产品取舍 |\n| 方案演化 | 保留 champion、同一 hard criteria、shadow、迁移与回退 | 生成 challenger，解释收益和退化轴 |\n| 机制演化 | 历史漏判集 + 新植入案例；测遗漏召回和无效挑战负担 | 提议增删检查项，但必须指出捕获的失败模式 |\n\n**同一模型可以参与多个环节，裁决不能复用同一上下文的自我结论。** 关键未知至少需要隔离 skeptic\n和一种异质证据（参考实现、官方来源、第二实现、另一 provider 或领域专家）。多个模型同意不是证据。\n\n---\n\n## 事件表的生成方式\n\ngoals.md 决策 13 把逻辑层定为**事件表**（有序的「当……就……」规则行），\n其中一半理由就是 AI 侧的：**模型写有序列表远比写图可靠**。\n图结构生成需要空间推理与多步规划，是当前模型的公认短板（如 GVGAI-LLM 的 118 游戏 zero-shot 评测），\n而且整图直吐的失败是**整体失败**，无法定位。\n\n即便如此，**仍然不要让模型一次吐出整张表**。**改为吐 Action 序列**：\n\n```\nrule.add / rule.addCondition / rule.addEffect / rule.setParam / rule.move\n```\n\n每一步过约束、可撤销、可局部失败，**失败点能精确到第几条规则的第几行**。\n这同时让 goals.md 的 I1 与 I3 自动成立——AI 写规则和人写规则**走的是同一条路径**。\n\n**优先挑配方，再填参**：配方 = **一个行为单元 + 一组默认参数 + 一句说明**（goals.md §4.3）。\n模型的首选动作是挑一个配方、填参数，只有都不合适才逐行拼，最后才定义新的行为单元。\n展开后就是普通规则行——**AI 走的和人走的是同一条路径**。\n\n**措辞由注册方提供，不由模型即时生成**：每个条件与动作在注册时自带人话模板串\n（`当 {对象} 进入 {目标} 的范围`）。理由是 I3——\n措辞每次显示都不一样，用户就无法确认「这和我上次改的是同一个东西」，\n「同一种材料」这条就松了。代价是每个条件动作要写一句文案，这笔成本是值的。\n\n**顺带的好处**：事件表是有序行，AI 的产出可以**逐行 diff 后再呈现给用户**——\n「新增了第 4–6 行，修改了第 2 行的这个参数」。节点图给不出这种粒度的变更说明。\n\n---\n\n## AI 介入形态\n\n按信任成本从低到高，也是实现顺序：\n\n| 形态 | 评价 |\n|---|---|\n| **决策挑战** | 计划前发现未决语义、越权或证据冲突时，生成结构化 `DecisionChallenge`；只暂停相关不可逆提交，无关工作继续 |\n| **单步指令** | **起点。** 一句话 → 一条 Action → 预览 → 确认。作用域小、错了代价低、用户能立刻判断对错。**应在内核地基完成时就接**——验证的是通道形状，不是模型能力，早发现比晚发现便宜一个数量级 |\n| **内联建议** | 选中物体 → 详情面板给 1–2 条建议（「路口半径 8m，重卡过不去，改 25m？」）→ 点一下变成一条标准 Action |\n| **多步变更集** | N 条 Action → 视口半透明预览 + 清单 → 整体接受 / 逐条剔除 → 接受后合成一条撤销记录 |\n| **生成规则行** | 走上一节的 Action 序列路径，产出可见、可手改、可逐行 diff 的规则 |\n| **换皮 / 配皮肤** | 「换成赛博朋克风」→ 只改皮肤包映射，**不碰任何规则**（I9）。作用域极小、错了一眼看得出，是 AI 最安全的一类任务 |\n| **验证驱动的自主循环** | **本轮做**（goals.md 决策 40 的 v20 修订）。`PlanContract` 经批准后逐步执行 Action 事务，每步经三层验证；通过才提交 checkpoint，失败进入有界修复并写入 `EvidenceLedger`。与一次性多步变更集的差别是**控制权与持久运行状态**，不是任务规模 |\n| **AI 造零件** | **留口**（档 3）。AI 用 JS 实现新的条件与动作。**不得自动注册**：必须过确定性沙箱静态检查 + headless 断言，并在 registry 标明来源（I11） |\n| 产出黑盒结果 | **不做。** 不可寻址、不可手改、改一处要重来——与 I3 直接冲突。**注意封的是形态不是规模**：任务多大都行，产出必须始终是 Action 序列 |\n\n### AI 在 v17 之后的位置（goals.md 决策 35）\n\n原文这里是一张「简易模式 vs 专业模式」的对照表。**双模式已于 v17 取消**，\n但更重要的变化是 AI 的**分量**：\n\n> **决策 35 把门槛交给了 AI 与内置教程，于是 AI 从「产品卖点」变成「承重结构」。**\n\n| | 含义 |\n|---|---|\n| **位置** | 与直接操作并列的主要修改方式，**同时是「我不知道怎么做」的答案** |\n| **主用形态** | 单步指令、挑配方并填参（低信任成本）→ 多步变更集、逐行改规则（高） |\n| **失败时** | **必须能退回到「用模板 + 配方 + 教程手动做」**。这条从「兜底」升为硬要求——AI 挂了门槛就没人承担 |\n\n**共用的是同一套 Action 与同一份 registry。** 任何视图只改变暴露面与文案，不改变通道（I8）。\n\n### 非功能项（与功能同等对待）\n\n- **延迟**：慢到十几秒，「省下手工操作」的价值就没了\n- **预算**：按任务记录时间、Action 数、修复轮数与费用；模型不能自行延长\n- **错误通过率**：闸门 D 的人工植入 hard 负例必须 0 错误通过\n- **失败兜底**：AI 不可用 / 超时 / 乱答时，编辑器必须完全可用\n- **可解释**：每次变更都要能说清「改了什么、为什么」\n- **可恢复**：失败步骤不污染主工程，回到最近通过 checkpoint 的 Action 距离恒为 0\n- **离线**：没有 AI 也能用模板与条件动作库做事\n- **供应商无关**：能力探测 + 降级矩阵见上文「模型无关层」；用户可填自己的端点与模型（决策 21）\n\n---\n\n## 本文范围内明确不做\n\n| 不做 | 理由 |\n|---|---|\n| **第三种逻辑层形态** | 决策 13 已定为事件表。**注**：本文早期的「支柱六 · 声明式 when/then 规则」在形式上已被决策 13 采纳并取代——但它当年被判为「表达力上限太低、暂缓」，而事件表补上了实体选择、分组与参数化。留着两套说法只会引发争论，故删 |\n| **Action 日志的事件溯源存储** | 「初始状态 + Action 序列」是语义模型。本轮实现只需内存栈 + 存档时落盘一段 |\n| **多 agent 并发编辑的合并机制** | 没有用户之前是伪需求。`affects` 字段保留（它服务约束与影响域），但不为合并做设计 |\n| **describe 输出自然语言** | 见支柱三。文案维护 × i18n 的成本不该进内核 |\n| 一个 Action 一个 tool 的暴露方式 | 见支柱二。上下文成本随模块线性增长 |\n\n---\n\n## 相关文档\n\n- [goals.md](goals.md) — **上级文档**。方向、阶段、闸门以它为准\n- [adr-001-ecs.md](adr-001-ecs.md) — ECS 库选型\n- [adr-002-eventsheet-eval.md](adr-002-eventsheet-eval.md) — 事件表求值语义。**本文「事件表的生成方式」一节的下游约束**：条件在注册时要声明「常规 / 触发」\n- [adr-003-verified-agent-loop.md](adr-003-verified-agent-loop.md) — `PlanContract`、Action 事务、三层验证、证据账本与有界修复的权威协议\n- [architecture/roads.md](../architecture/roads.md) — 道路系统架构，阶段四迁移的规格书\n"}, {"id": "adr1", "title": "ADR-001 · ECS 选型", "md": "# ADR-001 · ECS 库选型\n\n| | |\n|---|---|\n| **状态** | **已验证**（2026-08-09）—— 见 [ADR 状态机](goals.md#07-adr-状态机v19)。[§5](#5-spike-方案) 六条判据由 [spike-002](spike-002-ecs.md) 全部跑通，**koota 锁定**。<br>**实测补充**：koota 的重放确定性成立，但**迭代顺序不是稳定 id 升序**（id 复用后错位）→ 触发 [§6](#6-退役条件按-goalsmd-72-预先写死) 升级路径 ①，**封装层必须排序**。这是 M1-a 的硬职责，不是优化 |\n| **日期** | 2026-08-08 |\n| **决策者** | 项目所有者 |\n| **上游** | [goals.md](goals.md) **决策 5**（实体模型 = ECS）、**§7.1**（模块契约）、**§9**（未决项）、**决策 29**（确定性是硬要求） |\n\n---\n\n## 1. 背景\n\n[goals.md](goals.md) **决策 5** 定了实体模型用 ECS。本 ADR 决定**用哪个实现**。\n\n选型必须服务的，是 goals.md 里已经定死的几件事，而不是「哪个 ECS 更好」这种泛问：\n\n> **v19 修正**：下表的节号与决策号原本全部指向旧版 goals.md 的坐标系，\n> 十几版重构后**六处无一对得上**（例如「决策 4」当时是 ECS，现在是「只做 3D」）。\n> 已按 v19 的编号重新对齐。**裸引用不是 markdown 链接，校验器查不出来**——\n> 这是 v19 给 `check-docs.py` 加裸引用校验的直接原因。\n\n| 约束来源 | 对 ECS 的要求 |\n|---|---|\n| **§4.5** 两级状态与播放沙箱 | 全世界快照 + 回滚 |\n| **§4.2** Action 层 | 变更可追踪、可 diff、可回放 |\n| **§7.3 + 决策 29** 试飞台与确定性 | **确定性**：同一 Action 序列 → 同一序列化结果，**硬要求** |\n| **§7.1** 模块契约 | 组件类型可在运行时由模块注册 |\n| **决策 6** JS 实现条件与动作 | 由**人和 AI**书写，API 出错率是一等指标 |\n| **§5.3** 详情面板 | 组件 schema 可自省，用于自动生成控件 |\n| 商业化可能性 | 许可证不能带传染性约束 |\n\n---\n\n## 2. 候选与数据\n\n2026-08-08 实测 npm registry 与 GitHub API：\n\n| 库 | 版本 | 最后发布 | 仓库最后提交 | 周下载 | Stars | 许可证 |\n|---|---|---|---|---|---|---|\n| **bitECS** | 0.4.0 | 2025-12-06 | 2026-04-12 | 15.7k | 1484 | **MPL-2.0** |\n| **koota** | 0.6.6 | 2026-05-09 | 2026-08-04 | 10.5k | 712 | ISC |\n| miniplex | 2.0.0 | 2023-07-16 | — | 4.5k | ~1k | MIT |\n| becsy | 0.15.5 | 2025-03-02 | — | 106 | ~300 | MIT |\n| arancini | 8.1.0 | 2025-07-01 | — | 29 | — | MIT |\n\n**首轮淘汰：**\n\n- **miniplex** — 三年未发版。不赌停更的库。\n- **becsy / arancini** — 周下载两位数，出问题只能自己啃源码，没有社区兜底。\n\n真实候选：**bitECS / koota / 自研**。\n\n---\n\n## 3. 逐项对比\n\n| 需求 | bitECS 0.4 | koota 0.6 |\n|---|---|---|\n| 快照 + 回滚 | ✅ 内置 `createSnapshotSerializer` | ❌ 无内置 |\n| 变更追踪 | ✅ Observer serializer | ✅ `Added/Removed/Changed` 修饰符 |\n| 运行时注册组件 | ✅ 组件即普通对象 | ✅ trait 即值 |\n| 组件 schema | ⚠️ 仅序列化类型标记 `f32/u8/str` | ⚠️ `trait({x:0,y:0})` 有字段名+默认值 |\n| 脚本书写体验 | ❌ `Position.x[eid] = 10` | ✅ `updateEach(([pos]) => pos.x += 1)` |\n| 关系 / 层级 | ✅ Relations + Prefabs | ✅ Relations |\n| 维护活跃度 | 中 | **高** |\n| 许可证 | ⚠️ MPL-2.0 | ✅ ISC |\n\n### 三个决定性发现\n\n**发现 1 · schema 两家都不够用，封装层无论如何要写。**\n\n详情面板自动生成与 AI 可读，需要的是字段范围、枚举、实体引用、单位、说明。\nbitECS 的 `f32/str` 只是序列化标记；koota 的默认值只能推出类型。**两家都到不了。**\n\n推论：选型**不是**不可逆的地基决策 —— 见第 4 节。\n\n**发现 2 · MPL-2.0 是真实约束。**\n\nbitECS 是文件级弱著佐权。链接使用无碍，但**被修改的每个 bitECS 源文件都必须公开**。\n而本项目几乎一定会改它（快照要接版本化信封、确定性要审计迭代顺序）。\n对可能商业化的引擎，这是要提前算的账。koota 的 ISC 无此问题。\n\n**发现 3 · 脚本书写体验的权重高于直觉。**\n\n```js\nPosition.x[eid] = 10     // bitECS：eid 写错会静默改掉别的实体\npos.x = 10               // koota：错了就是错了\n```\n\n脚本作者是**开发者和 AI**（**决策 6 + §4.3**）。AI 写第一种形式出错率显著更高，\n且**错误静默**——改到相邻实体不报错，只让 demo 行为诡异，排查成本极高。\n这直接打击「AI 真的好用」这个成功判据。\n\n---\n\n## 4. 决策\n\n### 4.1 用一层薄封装把 ECS 库藏起来（无条件执行）\n\n**模块代码禁止直接 import ECS 库。** 组件定义走自写的 `defineComponent()`，\n查询走自写的 `query()`，脚本只见到封装层的 API。\n\n三条理由：\n\n1. schema 层反正要写（发现 1），封装是顺带的，边际成本≈0\n2. **§7.1** 模块契约本来就禁止「直接读写不属于自己的组件表」，封装层是它的执行点\n3. **选型从「地基决策」降级为「可替换模块」**，**§7.2** 的退役条件因此才可执行\n\n有了封装，选错的代价从「重写引擎」变成「重写约 800 行适配层」。\n\n### 4.2 主选 koota，spike 后锁定\n\n理由按权重：**ISC 许可证 > 脚本书写体验 > 维护活跃度**。\n\n放弃 bitECS 内置快照的代价可控：本项目存档要的是**版本化信封 + 迁移链**\n（沿用现有 [core/serialize.js](../../js/core/serialize.js) 的范式），\nbitECS 的二进制快照是为网络复制设计的，本来也不能直接用；\n播放沙箱的回滚用结构化克隆自写，量级在几十行。\n\n### 4.3 不自研\n\n自研的控制力，封装层已经给了；而 relations / prefabs / 归档查询这些白送的能力，自己补要更久。\n**注**：若 spike 全部失败，自研仍是 [§6](#6-退役条件按-goalsmd-72-预先写死) 升级路径的第 ② 步，只是不作为首选。\n\n---\n\n## 5. Spike 方案\n\n> **技术止损时间盒：3 天**（goals.md §0.5 第 1 条允许——它是实验的退出条件，不是交付承诺）。\n\n两个库各实现同一纵切片，跑完即决策：\n\n1. 三种组件：纯数值 / 字符串 / 对象引用（mesh 句柄）\n2. 运行时注册一个「模块」的组件集\n3. 快照 → 改 100 个实体 → 回滚，验证完全还原\n4. 10k 实体查询循环，测帧时间\n5. **确定性**：同一 Action 序列跑两遍，序列化字节完全一致\n6. 手写 30 行「游戏逻辑」，评估书写体验\n\n**第 5 条是杀手判据。** 原型式 ECS 的查询迭代顺序会随组件增删变化，\n两家文档均**未承诺**确定性——必须实测，不能信文档。\n\n---\n\n## 6. 退役条件（按 goals.md §7.2 预先写死）\n\n> **v19 重写。** 原文的最后一条是「超时则接受**仅编辑期确定性**，并把回放降级为\n> 『Action 日志可读但不保证逐字节复现』」——**它与 goals.md 决策 29 正面冲突**。\n> 决策 29（v14 确立，v17 被八款目标游戏证成）写明**逐帧确定性是硬要求、不允许降级**。\n> 本 ADR 写于决策 29 之前，那条逃生路线是历史残留。\n> **一份 ADR 不能给出与最高裁决依据相反的失败处理策略**——工程师会从两处读到两套做法。\n\n**换库的退役条件**：\n\n- spike 中任一库在**止损时间盒（3 天）**内跑不通确定性测试 → **淘汰该库**\n- 封装层落地后，若日后需要换库 → **换**，代价已被封装层限制在约 800 行内\n\n**确定性守不住时的升级路径**（**唯一路径，不允许静默降级**）：\n\n```\n库自身不能保证稳定的查询迭代顺序\n  → ① 封装层统一按稳定实体 id 排序后再交给系统\n  → ② 仍不满足则实现最小确定性 ECS（只做 goals.md §5.1「世界」那一节要求的部分）\n  → ③ 仍不可行则停止实施，显式重审 goals.md 决策 29\n  → 不允许「接受仅编辑期确定性」这类静默降级\n```\n\n第 ③ 步的含义是**把问题交回产品层**：要么接受重新定义联机路线（决策 29、阶段五一并重估），\n要么接受更长的自研投入。**这是一次公开的决策，不是一次实现层的妥协。**\n\n`①` 应该覆盖绝大多数情况——[§5](#5-spike-方案) 的第 5 条测的正是这个，\n而排序在封装层做，两个候选库都不需要改。\n\n---\n\n## 7. 连带影响\n\n- **组件 schema 定义方式**（goals.md §9 第 2 项）与本决策绑定，同期决定\n- **构建与依赖管理**：当前无 `package.json`、无打包器，three 走 CDN importmap。\n  引入 ECS + Rapier + glTF 后大概率绕不开构建步骤。**已提前到阶段零**（goals.md §6）\n- 三个被淘汰的库不再复议，除非它们的维护状态发生实质变化\n\n---\n\n#
